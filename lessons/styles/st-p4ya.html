<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>درس — محمد مبارك</title><link rel="icon" type="image/svg+xml" href="../assets/brand/emblem.svg">
<!-- Lesson style st-p4ya (plum + rose, Fredoka/Lexend, 3-way language, elegant teen look). A lesson body (plain JS) replaces the LESSON marker in the last script. Guide: st-p4ya.md -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lexend:wght@400;500;600;700&family=Amiri:wght@400;700&family=Cairo:wght@600;700&display=swap">
<style>:root{box-sizing:border-box;--c1:#E8559B;--c1d:#B02F72;--c1s:#FFE3F0;--c2:#2A9DD8;--c2d:#1B6F9C;--c2s:#DDF1FC;--sun:#FFC83D;--sun-s:#FFF4CF;--gr:#35A26A;--gr-d:#1F7A4B;--gr-s:#DDF4E7;--ink:#1D2F47;--muted:#68788C;--line:#EBD6E1;--night:#1A1230;--bad:#D2493C;--paper:#fff;--bg1:#FFF1F7;
--f-h:"Fredoka","Lexend",system-ui,sans-serif;--f-b:"Lexend",system-ui,sans-serif;--f-ar:"Amiri","Noto Naskh Arabic",serif;--f-note:"Cairo",Tahoma,sans-serif}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--f-b);overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:4px solid var(--c2);outline-offset:3px}
#app{position:absolute;inset:0;display:flex;flex-direction:column;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#viewport{flex:1;position:relative;overflow:hidden;min-height:0}
#stage{position:absolute;width:1600px;height:900px;left:50%;top:50%;transform-origin:center;transform:translate(-50%,-50%) scale(.5);background:var(--paper);border-radius:28px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.4)}
#fx{position:absolute;inset:0;pointer-events:none;z-index:50;width:100%;height:100%}
#pen{position:absolute;inset:0;z-index:45;width:1600px;height:900px;pointer-events:none;touch-action:none}
#pen.on{pointer-events:auto;cursor:crosshair}
#penbar{position:absolute;right:14px;top:14px;z-index:70;display:flex;gap:8px;background:rgba(26,18,48,.92);padding:8px 10px;border-radius:16px}
#penbar button{width:44px;height:44px;border-radius:50%;border:3px solid #fff3;color:#fff;background:#333;font-size:20px}
#penbar button.sel{border-color:#fff}
.slide{position:absolute;inset:0;display:none;background:linear-gradient(180deg,var(--bg1) 0%,#FFFFFF 58%)}
.slide.active{display:block;animation:pop .45s ease}
@keyframes pop{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
.ar{font-family:var(--f-ar);direction:rtl;unicode-bidi:isolate}
.bi .a{font-family:var(--f-note);direction:rtl;unicode-bidi:isolate}
.m-ar .bi .e{display:none}.m-ar .bi .a{display:inline}
.m-en .bi .a{display:none}.m-en .bi .e{display:inline}
.m-both .bi .e{display:inline}.m-both .bi .a{display:block;font-size:.68em;opacity:.85;line-height:1.35;font-weight:600}
.m-ar #stage{direction:rtl}
.top{position:absolute;top:0;left:0;right:0;height:118px;display:flex;align-items:center;gap:22px;padding:0 60px}
.top .n{width:74px;height:74px;border-radius:22px;background:var(--c1);color:#fff;display:grid;place-items:center;font:700 38px/1 var(--f-h);flex:none}
.top h2{margin:0;font:700 48px/1.1 var(--f-h);color:var(--ink)}
.top .tag{margin-inline-start:auto;font:600 20px/1.2 var(--f-b);background:var(--c2s);color:var(--c2d);border:2px solid #B9DDF2;border-radius:30px;padding:8px 18px}
.body{position:absolute;top:126px;left:60px;right:60px;bottom:30px;display:flex;flex-direction:column;gap:16px;overflow:hidden}
.say{font:500 29px/1.45 var(--f-b);color:var(--ink);margin:0;text-align:center}
.say b{color:var(--c1d)}
.btn{border:0;border-radius:22px;padding:12px 26px;font:700 27px/1.2 var(--f-h);background:var(--c1);color:#fff;box-shadow:0 6px 0 var(--c1d);transition:transform .1s;min-height:56px}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--c1d)}
.btn.sky{background:var(--c2);box-shadow:0 6px 0 var(--c2d)}
.btn.gr{background:var(--gr);box-shadow:0 6px 0 var(--gr-d)}
.btn.ghost{background:#fff;color:var(--ink);border:3px solid var(--line);box-shadow:0 6px 0 var(--line)}
.row{display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap}
.fb{font:700 28px/1.4 var(--f-h);border-radius:22px;padding:10px 24px;text-align:center}
.fb.ok{background:var(--gr-s);color:var(--gr-d)}
.shake{animation:shake .45s}@keyframes shake{25%{transform:translateX(-10px)}50%{transform:translateX(10px)}75%{transform:translateX(-6px)}}
.bounce{animation:bounce .5s}@keyframes bounce{40%{transform:scale(1.08)}70%{transform:scale(.97)}}
.right{border-color:var(--gr)!important;background:var(--gr-s)!important}
.wrong{border-color:var(--bad)!important;background:#FBE3DF!important}
.rule{background:var(--sun-s);border:3px solid #F3DC8F;border-radius:22px;padding:12px 22px;font:600 27px/1.45 var(--f-b);color:#6d5200;text-align:center}
.rule b{color:var(--c1d)}
.card{background:#fff;border:4px solid var(--line);border-radius:28px;padding:18px 22px}
.hook{position:absolute;inset:0;background:linear-gradient(160deg,var(--h1) 0%,var(--h2) 100%);color:#fff;overflow:hidden}
.hook .lv{position:absolute;left:70px;top:44px;max-width:640px;font:600 22px/1 var(--f-b);background:rgba(0,0,0,.25);border-radius:30px;padding:12px 22px}
.hook .l{position:absolute;left:70px;top:130px;width:660px}
.hook h1{margin:0 0 18px;font:700 80px/1.05 var(--f-h)}
.hook p{margin:0;font:500 30px/1.5 var(--f-b);color:#fff}
.hook .r{position:absolute;right:56px;top:80px;width:760px;height:740px;background:#fff;color:var(--ink);border-radius:36px;box-shadow:0 20px 60px rgba(0,0,0,.3);padding:30px 34px;display:flex;flex-direction:column;gap:18px}
.step{display:none;flex-direction:column;gap:18px;flex:1;justify-content:center;min-height:0}
.step.on{display:flex}
.q{font:700 36px/1.3 var(--f-h);color:var(--c1d);text-align:center}
.opts{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.opt{border:4px solid var(--line);background:#fff;border-radius:22px;padding:12px 24px;font:600 28px/1.3 var(--f-b);color:var(--ink);min-height:60px}
.opt .ar{font-size:64px;line-height:1.5;display:block}
.opt.big{min-width:210px}
.dots{display:flex;gap:12px;justify-content:center;min-height:30px}
.dots i{width:26px;height:26px;border-radius:50%;background:#e6d5df;display:block;transition:all .15s}
.dots i.lit{background:var(--c1);transform:scale(1.25)}
.stp{display:flex;flex-direction:column;gap:12px;align-items:center}
.stp .lab{font:700 38px/1.3 var(--f-h);color:var(--c1d);text-align:center}
.tabs{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.tab{border:4px solid var(--line);background:#fff;border-radius:22px;padding:8px 22px;font:700 54px/1.4 var(--f-ar);color:var(--ink);min-width:130px}
.tab.on{background:var(--c1);color:#fff;border-color:var(--c1)}
.tab.done::after{content:" ✓";font-size:.5em}
.bigL{font:700 210px/1.4 var(--f-ar);direction:rtl;color:var(--ink);text-align:center}
.bigW{font:700 150px/1.5 var(--f-ar);direction:rtl;color:var(--ink);text-align:center}
.sayc{display:flex;align-items:center;justify-content:center;flex:1;min-height:0;overflow:hidden}
.spk{width:76px;height:76px;border-radius:50%;border:0;background:var(--c2);color:#fff;font-size:34px;box-shadow:0 5px 0 var(--c2d);flex:none}
.spk.sm{width:56px;height:56px;font-size:26px}
.bins{display:grid;gap:18px;flex:1;min-height:0}
.bin{border:5px dashed var(--line);border-radius:28px;background:#fff;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:flex-start;padding:14px;min-height:0}
.bin h3{margin:0;font:700 34px/1.2 var(--f-h);color:var(--c1d);text-align:center}
.bin.hot{background:var(--c1s);border-color:var(--c1)}
.bin .got{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chip{border:4px solid var(--c1);background:var(--c1s);border-radius:22px;padding:4px 20px;font:700 66px/1.5 var(--f-ar);direction:rtl;color:var(--ink);touch-action:none;cursor:grab;min-width:120px;text-align:center}
.chip.sm{font-size:50px;padding:2px 16px}
.chip.done{background:var(--gr-s);border-color:var(--gr);cursor:default}
.pool{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.lift{opacity:.35}
.dragg{position:absolute;z-index:40;pointer-events:none;transform:scale(1.1) rotate(-3deg);box-shadow:0 14px 30px rgba(0,0,0,.3)}
.aya{display:flex;align-items:center;gap:16px;background:#fff;border:4px solid var(--line);border-radius:26px;padding:10px 22px}
.aya .t{flex:1;font:700 52px/1.8 var(--f-ar);direction:rtl;text-align:right}
.aya .n{font:700 26px/1 var(--f-h);color:var(--c1d);background:var(--c1s);border-radius:50%;width:48px;height:48px;display:grid;place-items:center;flex:none}
.aya.cur{border-color:var(--c1);background:var(--c1s)}
.aya.mini .t{font-size:40px;line-height:1.7}
.mean{font:500 25px/1.4 var(--f-b);color:var(--muted)}
.meter{height:26px;border-radius:14px;background:#fff;border:3px solid var(--line);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--gr);transition:width .2s}
.beats{display:flex;gap:16px;justify-content:center}
.beats i{width:64px;height:64px;border-radius:50%;border:5px solid var(--c1);display:grid;place-items:center;font:700 32px/1 var(--f-h);color:var(--c1d);font-style:normal;background:#fff}
.beats i.lit{background:var(--c1);color:#fff;transform:scale(1.15)}
.holdb{width:340px;height:340px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,var(--c1),var(--c1d));color:#fff;font:700 40px/1.2 var(--f-h);box-shadow:0 12px 0 var(--c1d);touch-action:none}
.holdb.down{transform:translateY(8px);box-shadow:0 4px 0 var(--c1d)}
.mem{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);gap:16px;flex:1;min-height:0}
.mc{perspective:900px;position:relative;border:0;background:none;padding:0}
.mc .in{position:absolute;inset:0;transition:transform .5s;transform-style:preserve-3d}
.mc.f .in{transform:rotateY(180deg)}
.mc .fa{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px;text-align:center}
.mc .bk{background:var(--c1);color:#fff;font:700 100px/1 var(--f-h);box-shadow:0 8px 0 var(--c1d)}
.mc .fr{background:#fff;border:5px solid var(--line);transform:rotateY(180deg);color:var(--ink);font:700 44px/1.5 var(--f-ar);direction:rtl}
.mc .fr.en{font:600 27px/1.35 var(--f-b);direction:ltr}
.mc.m .fr{background:var(--gr-s);border-color:var(--gr)}
.sp-q{font:700 46px/1.3 var(--f-h);text-align:center;background:var(--sun-s);border-radius:26px;padding:14px;min-height:120px;display:flex;align-items:center;justify-content:center;gap:20px}
.tbar{flex:1;height:26px;border-radius:14px;background:#fff;border:3px solid var(--line);overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:var(--c2);transition:width .25s linear}
.scn{font:700 42px/1 var(--f-h);color:var(--c1d);min-width:200px;text-align:right}
.drawwrap{position:relative;flex:1;min-height:0;border:4px solid var(--line);border-radius:28px;overflow:hidden;background:#fff}
.drawwrap svg,.drawwrap canvas{position:absolute;inset:0;width:100%;height:100%}
.palette{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
.palette button{width:54px;height:54px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 3px var(--line)}
.palette button.sel{box-shadow:0 0 0 5px var(--ink)}
.cert{position:relative;border-radius:30px;overflow:hidden;border:5px solid var(--c1);background:var(--sun-s)}
.cert svg{width:100%;height:100%;display:block}
.finish{align-items:center;display:grid;grid-template-columns:1.1fr 1fr;gap:28px;flex:1;min-height:0}
.home{background:#fff;border:4px solid var(--line);border-radius:30px;padding:22px;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.home h3{margin:0;font:700 36px/1.2 var(--f-h);color:var(--c1d)}
.home li{font:500 26px/1.45 var(--f-b);margin-bottom:8px}
#bar{flex:none;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:#0E0A1E;color:#D6E4F2;font:600 15px/1 var(--f-b)}
#bar button{background:#2a2147;color:#EAF3FB;border:1px solid #4a3d78;border-radius:12px;padding:9px 13px;font:600 15px/1.1 var(--f-b);min-height:44px}
#bar button .bi .a{font-size:.8em}
#bar button.nav{background:var(--c1);color:#fff;border-color:var(--c1);padding:9px 20px;font-weight:700;font-size:17px;min-height:48px}
.lang3{display:flex;border-radius:12px;overflow:hidden;border:1px solid #4a3d78}
.lang3 button{border:0!important;border-radius:0!important;min-width:56px}
.lang3 button.on{background:var(--c2)!important;color:#fff}
#prog{flex:1;min-width:80px;height:8px;background:#2a2147;border-radius:6px;overflow:hidden}
#prog i{display:block;height:100%;width:0;background:var(--c1);transition:width .3s}
#count,#clock{font-variant-numeric:tabular-nums;color:#fff}
#stars{background:#2a2147;border:1px solid #4a3d78;border-radius:12px;padding:8px 12px;color:var(--sun);font:700 18px/1 var(--f-h)}
#clock{background:#2a2147;border:1px solid #4a3d78;border-radius:12px;padding:9px 10px}
#notes{position:absolute;left:16px;right:16px;bottom:10px;max-width:1100px;max-height:46%;overflow:auto;margin:0 auto;background:rgba(14,10,30,.97);color:#EAF3FB;border:2px solid var(--c1);border-radius:16px;padding:14px 18px;font:600 16px/1.85 var(--f-note);z-index:60}
#notes.rtl{direction:rtl}
#notes b{color:var(--sun)}
#notes .sy{direction:ltr;text-align:left;font:500 16px/1.6 var(--f-b);background:#2a2147;border-radius:10px;padding:8px 12px;margin-top:8px;color:#fff}
#notes .sy:before{content:"Say: ";color:var(--sun);font-weight:700}
@media (max-width:1150px){#bar{gap:6px;padding-left:8px;padding-right:8px}#bar button{padding:8px 9px;font-size:13px}#bar button.nav{padding:8px 12px;font-size:14px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.m-ar .c-en{display:none}.m-both .c-ar,.m-en .c-ar{display:none}

:root{--c1:#8E3B7C;--c1d:#62265A;--c1s:#F6E4F1;--c2:#D9577A;--c2d:#A93A5A;--c2s:#FBE3EA;--h1:#6E2C66;--h2:#D9577A;--bg1:#FBF1F7}</style>
<div id="app">
 <div id="viewport"><div id="stage"></div><canvas id="fx"></canvas><div id="penbar" hidden><button data-t="pen" data-c="#E8559B" class="sel" style="background:#E8559B"></button><button data-t="pen" data-c="#2A9DD8" style="background:#2A9DD8"></button><button data-t="pen" data-c="#222" style="background:#222"></button><button data-t="hl" data-c="#FFD400" style="background:#FFD400"></button><button data-t="eraser">⌫</button><button data-t="clear">🗑</button></div><div id="cue" hidden></div><div id="notes" hidden></div></div>

<style>.sayc{gap:30px}
#cue{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:65;background:rgba(26,18,48,.94);color:#FFF6FA;border:2px solid var(--c1);border-radius:30px;padding:10px 22px;font:600 20px/1.4 var(--f-b);box-shadow:0 8px 24px rgba(0,0,0,.25);white-space:nowrap}#cue b{color:var(--sun);font-family:var(--f-ar);font-size:30px;font-weight:700}
</style>
<script>(function(){
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}},lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const T=(en,ar)=>`<span class="bi"><span class="e">${en}</span><span class="a">${ar}</span></span>`;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
window.T=T;window.shuffle=shuffle;window.$=$;window.$$=$$;
const stage=$('#stage'),fx=$('#fx');
/* ---------- mode ---------- */
let MODE=lsGet('lm3')||'both';if(!['ar','both','en'].includes(MODE))MODE='both';
function setMode(m){MODE=m;lsSet('lm3',m);document.body.classList.remove('m-ar','m-both','m-en');document.body.classList.add('m-'+m);$$('.lang3 button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));document.documentElement.lang=m==='ar'?'ar':'en';renderNotes();fit();}
/* ---------- sound ---------- */
let soundOn=true,AC=null,cur=null;
function ac(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}return AC}
function tone(k){if(!soundOn)return;const c=ac();if(!c)return;const t=c.currentTime;const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);
 const f={ok:[660,880],bad:[220,180],tap:[520],win:[523,659,784,1047]}[k]||[500];f.forEach((fr,i)=>{o.frequency.setValueAtTime(fr,t+i*.09)});o.type=k==='bad'?'sawtooth':'sine';g.gain.setValueAtTime(.08,t);g.gain.exponentialRampToValueAtTime(.001,t+.09*f.length+.1);o.start(t);o.stop(t+.09*f.length+.12)}
const AUD={};
/* play(key): 'q' + surah(3) + ayah(3) (e.g. 'q100001') = Husary Muallim from everyayah (fallback Husary 128).
   Any other key is a word/sound the TEACHER says: a "Teacher says" bubble shows it. No recorded or machine voice. */
const QURL=(k,alt)=>`https://everyayah.com/data/${alt?'Husary_128kbps':'Husary_Muallim_128kbps'}/${k.slice(1)}.mp3`;
let cueT=null;function cue(txt){const c=$('#cue');if(!c||!txt)return;c.innerHTML=T('🗣 Teacher says: ','🗣 المعلم يقول: ')+'<b>'+txt+'</b>';c.hidden=false;clearTimeout(cueT);cueT=setTimeout(()=>c.hidden=true,2800)}
function play(key,cb){if(!key)return null;key=String(key);try{if(cur){cur.pause()}}catch(e){}
 if(!/^q\d{6}$/.test(key)){cue((window.SAY&&SAY[key])||key);if(cb)setTimeout(cb,1700);return {cue:1}}
 if(!soundOn)return null;let a=AUD[key]||(AUD[key]=new Audio(QURL(key)));a.currentTime=0;cur=a;a.onended=cb||null;
 a.onerror=()=>{if(a.dataset&&a.dataset.alt)return;const b=new Audio(QURL(key,1));b.dataset.alt=1;AUD[key]=b;cur=b;b.onended=cb||null;b.onerror=()=>{cb&&cb()};const p=b.play();if(p&&p.catch)p.catch(()=>{})};
 const p=a.play();if(p&&p.catch)p.catch(()=>{});return a}
function playAll(keys,onEach,done){let i=0;(function nxt(){if(i>=keys.length){done&&done();return}const k=keys[i];onEach&&onEach(i);const a=play(k,()=>{i++;setTimeout(nxt,350)});if(!a){i++;setTimeout(nxt,100)}})()}
window.play=play;window.playAll=playAll;window.tone=tone;
function speakEn(t){cue(t)}
window.cue=cue;
window.speakEn=speakEn;

    setTimeout(()=>{r++;if(r>=R.length){r=0;m.innerHTML=T('All clouds cleared! ☀️','كل السحب راحت! ☀️');d.innerHTML=R.map(()=>'<i class="lit"></i>').join('');setTimeout(draw,2200);return}draw()},2300)}
   else{bad(b);hh.textContent=right;hh.style.fontSize='1em';play(qk(su,ay));setTimeout(draw,2600)}});fitSlide()}
 draw();s.__cl=()=>{r=0;draw()}})-1;onEnter(n,el=>el.__cl&&el.__cl())};

 sun:(x,y,r)=>`<circle class="fillable" cx="${x}" cy="${y}" r="${r}" fill="#fff" stroke="#1D2F47" stroke-width="5"/>`+[0,1,2,3,4,5,6,7].map(k=>`<line x1="${x+Math.cos(k*Math.PI/4)*(r+20)}" y1="${y+Math.sin(k*Math.PI/4)*(r+20)}" x2="${x+Math.cos(k*Math.PI/4)*(r+55)}" y2="${y+Math.sin(k*Math.PI/4)*(r+55)}" stroke="#1D2F47" stroke-width="6" stroke-linecap="round"/>`).join(''),
 moon:(x,y,r)=>`<path class="fillable" d="M${x} ${y-r} A${r} ${r} 0 1 0 ${x} ${y+r} A${r*.75} ${r*.75} 0 1 1 ${x} ${y-r}Z" fill="#fff" stroke="#1D2F47" stroke-width="5"/>`,
 star:(x,y,r)=>`<path class="fillable" d="${Array.from({length:10},(_,k)=>{const a=-Math.PI/2+k*Math.PI/5,R=k%2?r*.45:r;return (k?'L':'M')+(x+Math.cos(a)*R).toFixed(1)+' '+(y+Math.sin(a)*R).toFixed(1)}).join('')}Z" fill="#fff" stroke="#1D2F47" stroke-width="4" stroke-linejoin="round"/>`,
 hill:(x,w,h,base)=>`<path class="fillable" d="M${x} ${base||520} Q${x+w*.5} ${(base||520)-h} ${x+w} ${base||520} Z" fill="#fff" stroke="#1D2F47" stroke-width="5"/>`,

 horse:(x,y,sc)=>`<g transform="translate(${x},${y}) scale(${sc})" stroke="#1D2F47" stroke-width="5" stroke-linejoin="round"><path class="fillable" d="M-90 -10 Q-80 -60 0 -55 Q70 -55 85 -20 Q95 10 70 20 Q0 30 -70 20 Q-95 15 -90 -10Z" fill="#fff"/><path class="fillable" d="M60 -40 L95 -105 Q105 -125 125 -115 L150 -95 Q160 -80 145 -75 L120 -80 L100 -30Z" fill="#fff"/><path class="fillable" d="M95 -105 Q70 -95 62 -60 L80 -50 Q85 -85 100 -95Z" fill="#fff"/><path class="fillable" d="M-90 -10 Q-130 -20 -150 20 Q-125 0 -95 10Z" fill="#fff"/><rect class="fillable" x="-70" y="15" width="16" height="70" rx="7" fill="#fff" transform="rotate(25 -62 15)"/><rect class="fillable" x="-40" y="18" width="16" height="70" rx="7" fill="#fff" transform="rotate(-20 -32 18)"/><rect class="fillable" x="35" y="15" width="16" height="70" rx="7" fill="#fff" transform="rotate(30 43 15)"/><rect class="fillable" x="60" y="12" width="16" height="70" rx="7" fill="#fff" transform="rotate(-25 68 12)"/><circle cx="130" cy="-100" r="5" fill="#1D2F47"/></g>`};
window.colour=o=>add(`<section class="slide">${head(o,'🎨',['Draw and colour','ارسمي ولوّني'],['Tap to colour · draw with the pen','اضغطي للتلوين · ارسمي بالقلم'])}<div class="body"><div class="palette" data-pal></div>

s=>{const COL=o.colours||window.PALETTE||['#E8559B','#F59BC6','#2A9DD8','#8FD3F2','#FFC83D','#FF8A5B','#35A26A','#8B5A2B'];const svg=$('[data-svg]',s),pal=$('[data-pal]',s),cv=$('[data-cv]',s),cx=cv.getContext('2d');let col=COL[0],mode='fill';

 let d=false,l=null;const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
