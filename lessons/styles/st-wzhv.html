<!doctype html><html lang="ar" class="m-ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>درس — محمد مبارك</title><link rel="icon" type="image/svg+xml" href="../assets/brand/emblem.svg"></head><body>
<!-- Lesson style st-wzhv (sky & sun, Arabic with English switch, Islamic studies for kids). A lesson body replaces the LESSON marker inside the main script. Guide: st-wzhv.md -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lexend:wght@400;500;600;700&family=Amiri:wght@400;700&family=Cairo:wght@600;700&display=swap">
<style>
:root{--sky:#2F9BE0;--sky-d:#1B6EA8;--sky-s:#E2F3FD;--gr:#2E9E5B;--gr-d:#1C7040;--gr-s:#DFF5E7;--sun:#FFC83D;--sun-s:#FFF3CC;--sun-d:#8A6200;--sand:#F4E3BE;--ink:#1B2F47;--muted:#5F7288;--line:#CFE6F5;--paper:#FFFFFF;--night:#0E2236;--bad:#D2493C;--or:#F08A24;--or-d:#B85F08;
--f-h:"Fredoka","Cairo",system-ui,sans-serif;--f-b:"Lexend","Cairo",system-ui,sans-serif;--f-ar:"Amiri","Noto Naskh Arabic",serif;--f-ui:"Cairo","Lexend",sans-serif;color-scheme:light}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--f-ui);overflow:hidden;overscroll-behavior:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
#app{position:absolute;inset:0;display:flex;flex-direction:column;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#viewport{flex:1;position:relative;overflow:hidden;min-height:0}
#stage{position:absolute;width:1600px;height:900px;left:50%;top:50%;transform-origin:center;transform:translate(-50%,-50%) scale(.5);background:var(--paper);border-radius:28px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.4)}
#fx{position:absolute;inset:0;pointer-events:none;z-index:50}
.slide{position:absolute;inset:0;display:none;background:linear-gradient(180deg,#E2F3FD 0%,#FFFFFF 55%)}
.slide.active{display:block;animation:pop .45s ease}
@keyframes pop{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
.ar{font-family:var(--f-ar);direction:rtl;unicode-bidi:isolate}
/* three-way language switch (ar / both / en) */
.bi{display:inline}
html.m-ar .bi .e{display:none}
html.m-en .bi .a{display:none}
.bi .a{direction:rtl;unicode-bidi:isolate;font-family:var(--f-ui)}
html.m-both .bi{display:inline-block;vertical-align:top;text-align:center}
html.m-both .bi .e,html.m-both .bi .a{display:block}
html.m-both .bi .a{font-size:.78em;line-height:1.35;opacity:.92;margin-top:2px}
html.m-ar .bi .a,html.m-en .bi .e{font-weight:inherit}
.top{position:absolute;top:0;left:0;right:0;height:118px;display:flex;align-items:center;gap:22px;padding:0 60px;direction:ltr}
.top .n{width:74px;height:74px;border-radius:22px;background:var(--sky);color:#fff;display:grid;place-items:center;font:700 38px/1 var(--f-h);flex:none}
.top h2{margin:0;font:700 50px/1.15 var(--f-h);color:var(--ink)}
.top .tag{margin-left:auto;font:600 22px/1.2 var(--f-ui);background:var(--gr-s);color:var(--gr-d);border:2px solid #B8E3C9;border-radius:30px;padding:8px 20px}
.body{position:absolute;top:128px;left:60px;right:60px;bottom:34px;display:flex;flex-direction:column;gap:16px}
.say{font:600 30px/1.5 var(--f-ui);color:var(--ink);margin:0;text-align:center}
.say b{color:var(--or-d)}
.btn{border:0;border-radius:22px;padding:12px 26px;font:700 28px/1.25 var(--f-ui);background:var(--sky);color:#fff;box-shadow:0 6px 0 var(--sky-d);transition:transform .1s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--sky-d)}
.btn.gr{background:var(--gr);box-shadow:0 6px 0 var(--gr-d)}
.btn.sun{background:var(--sun);color:#4A3500;box-shadow:0 6px 0 #C79A12}
.btn.ghost{background:#fff;color:var(--ink);border:3px solid var(--line);box-shadow:0 6px 0 var(--line)}
.pl{width:66px;height:66px;border-radius:50%;border:0;background:var(--sun);font-size:32px;box-shadow:0 5px 0 #C79A12;flex:none;display:inline-grid;place-items:center;padding:0}
.pl:active{transform:translateY(3px);box-shadow:0 2px 0 #C79A12}
.row{display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap}
.shake{animation:shake .45s}@keyframes shake{25%{transform:translateX(-10px)}50%{transform:translateX(10px)}75%{transform:translateX(-6px)}}
.bounce{animation:bounce .5s}@keyframes bounce{40%{transform:scale(1.08)}70%{transform:scale(.97)}}
.right{border-color:var(--gr)!important;background:var(--gr-s)!important}
.wrong{border-color:var(--bad)!important;background:#FBE3DF!important}
.card{background:#fff;border:5px solid var(--line);border-radius:30px}
.verse{background:var(--sun-s);border:5px solid #F3DC8F;border-radius:30px;padding:16px 28px;text-align:center}
.verse .q{font:700 64px/1.8 var(--f-ar);direction:rtl;color:#1C5D3A}
.verse .ref{font:600 22px/1.3 var(--f-ui);color:var(--sun-d)}
.stp{display:flex;flex-direction:column;gap:10px;align-items:center}
.stp .lab{font:700 36px/1.3 var(--f-ui);color:var(--or-d);min-height:50px}
.dots{display:flex;gap:12px;justify-content:center;min-height:26px}
.dots i{width:24px;height:24px;border-radius:50%;background:#C8DCEA;display:block;transition:background .15s,transform .15s}
.dots i.lit{background:var(--gr);transform:scale(1.25)}
.dragg{position:absolute;z-index:40;pointer-events:none;transform:scale(1.1) rotate(-4deg);box-shadow:0 14px 30px rgba(0,0,0,.3)}
.lift{opacity:.35}
/* 1 hook */
.s-hook{background:linear-gradient(160deg,#FFD66B 0%,#7CC8F2 70%,#2F9BE0 130%)}
.hk-l{position:absolute;left:60px;top:70px;width:640px;color:#13324D;direction:ltr}
.hk-l .lv{display:inline-block;font:600 22px/1 var(--f-ui);background:rgba(255,255,255,.55);border-radius:30px;padding:10px 20px;margin-bottom:26px}
.hk-l h1{margin:0 0 18px;font:700 80px/1.1 var(--f-h)}
.hk-l p{margin:0;font:600 34px/1.55 var(--f-ui)}
.hk-reveal{margin-top:34px;display:none;flex-direction:column;gap:16px;align-items:flex-start}
.hk-reveal.on{display:flex}
.hk-ans{display:none;background:#fff;border-radius:28px;padding:16px 30px;font:700 92px/1.5 var(--f-ar);direction:rtl;color:var(--gr-d);box-shadow:0 10px 30px rgba(0,0,0,.2);align-items:center;gap:20px}
.hk-ans.on{display:flex}
#scene1{position:absolute;right:50px;top:60px;width:820px;height:770px;border-radius:36px;overflow:hidden;background:linear-gradient(180deg,#9AD8FA 0%,#D7F0FF 62%);box-shadow:0 20px 60px rgba(0,0,0,.3);touch-action:none}
#scene1 .sun{position:absolute;right:50px;top:30px;font-size:110px;line-height:1}
#scene1 .soil{position:absolute;left:0;right:0;bottom:0;height:250px;background:linear-gradient(180deg,#B9854F,#7C5028)}
#scene1 .grass{position:absolute;left:0;right:0;bottom:240px;height:34px;background:#5DB85F;border-radius:30px 30px 0 0}
#sprout{position:absolute;left:50%;bottom:262px;transform:translateX(-50%);font-size:70px;line-height:1;transform-origin:bottom center;transition:font-size .4s}
#cloud{position:absolute;left:40px;top:60px;width:300px;height:170px;cursor:grab;touch-action:none;font-size:170px;line-height:1;filter:drop-shadow(0 8px 6px rgba(0,0,0,.18));z-index:3}
.drop{position:absolute;width:10px;height:26px;border-radius:6px;background:#2F9BE0;opacity:.85;animation:fall .9s linear forwards;z-index:2}
@keyframes fall{from{transform:translateY(0)}to{transform:translateY(420px);opacity:.2}}
#gbar{position:absolute;left:50%;transform:translateX(-50%);bottom:30px;width:420px;height:26px;border-radius:14px;background:rgba(255,255,255,.7);border:3px solid #fff;overflow:hidden}
#gbar i{display:block;height:100%;width:0;background:var(--gr);transition:width .2s}
.hint{position:absolute;left:50%;top:330px;transform:translateX(-50%);font:700 30px/1.3 var(--f-ui);background:rgba(255,255,255,.85);border-radius:20px;padding:8px 22px;color:var(--ink);white-space:nowrap}
/* 2 review */
.fcards{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;height:340px}
.fc{perspective:1000px;position:relative;border:0;background:none;padding:0}
.fc .in{position:absolute;inset:0;transition:transform .5s;transform-style:preserve-3d}
.fc.f .in{transform:rotateY(180deg)}
.fc .fa{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;text-align:center}
.fc .fr{background:var(--sky);color:#fff;box-shadow:0 8px 0 var(--sky-d)}
.fc .fr .em{font-size:110px;line-height:1}
.fc .fr .qq{font:700 36px/1.4 var(--f-ui)}
.fc .bk{background:#fff;border:5px solid var(--gr);transform:rotateY(180deg);color:var(--ink)}
.fc .bk .ar{font:700 52px/1.7 var(--f-ar);color:var(--gr-d)}
/* 3 photos */
.pcards{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;height:330px}
.pc{position:relative;border:5px solid var(--line);border-radius:28px;overflow:hidden;background:#fff;padding:0;display:flex;flex-direction:column}
.pc img{width:100%;flex:1;min-height:0;object-fit:cover;display:block}
.pc .cap{height:84px;display:flex;align-items:center;justify-content:center;font:700 38px/1.3 var(--f-ar);direction:rtl;color:var(--gr-d);background:#fff;padding:0 10px}
.pc .cap.q{font:700 30px/1.3 var(--f-ui);color:var(--muted)}
.pc.on{border-color:var(--gr)}
.vslot{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;border:5px dashed var(--line);border-radius:30px;min-height:0}
.vslot.open{border:0}
/* 4 chain */
.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;height:250px;direction:rtl}
.sl{border:6px dashed #A9D0EA;border-radius:28px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:8px;position:relative}
.sl .no{font:700 44px/1 var(--f-h);color:var(--sky-d);background:var(--sky-s);width:62px;height:62px;border-radius:50%;display:grid;place-items:center}
.sl.hot{background:var(--sun-s);border-color:var(--sun)}
.sl.right{border-style:solid}
.sl .ph{font:600 22px/1.3 var(--f-ui);color:var(--muted);margin-top:30px;text-align:center}
.tray{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;flex:1;min-height:0;direction:rtl}
.ch{border:5px solid var(--sky);background:var(--sky-s);border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--ink);touch-action:none;cursor:grab;padding:6px}
.ch .em{font-size:84px;line-height:1}
.ch .ar{font:700 36px/1.4 var(--f-ar);color:var(--ink)}
.ch.done{visibility:hidden}
.sl .ch{position:absolute;inset:60px 6px 6px 6px;visibility:visible;cursor:default;border-color:var(--gr);background:var(--gr-s)}
.sl .ch .em{font-size:76px}
/* 5 slider */
.cmp{display:grid;grid-template-columns:1020px 1fr;gap:26px;flex:1;min-height:0}
.sld{position:relative;border-radius:30px;overflow:hidden;border:5px solid var(--line);touch-action:none;background:#000}
.sld img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#gimg{clip-path:inset(0 100% 0 0)}
.hdl{position:absolute;top:0;bottom:0;width:10px;background:#fff;left:0;transform:translateX(-50%);box-shadow:0 0 12px rgba(0,0,0,.5)}
.hdl b{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:90px;height:90px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:48px;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.sld .lbl{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.92);border-radius:22px;padding:8px 26px;font:700 36px/1.2 var(--f-ui);white-space:nowrap}
.rt{display:flex;flex-direction:column;gap:14px;justify-content:center}
.qbox{background:var(--sky-s);border:4px solid #B9DDF2;border-radius:26px;padding:16px 22px;font:700 34px/1.5 var(--f-ar);direction:rtl;text-align:center}
/* 6 falling words */
.rainf{position:relative;flex:1;min-height:0;border-radius:30px;background:linear-gradient(180deg,#8FD0F5 0%,#E2F3FD 80%);overflow:hidden;border:5px solid var(--line);touch-action:none}
.fw{position:absolute;padding:6px 26px;border-radius:30px;background:#fff;border:5px solid var(--sky);font:700 62px/1.5 var(--f-ar);direction:rtl;color:var(--ink);cursor:pointer;touch-action:none;box-shadow:0 8px 16px rgba(0,0,0,.18);white-space:nowrap}
.fw.glow{border-color:var(--sun);box-shadow:0 0 0 8px rgba(255,200,61,.55)}
.sentline{height:130px;border-radius:26px;background:var(--sun-s);border:5px dashed #E8C95E;display:flex;align-items:center;justify-content:center;gap:16px;direction:rtl;padding:0 20px;font:700 66px/1.5 var(--f-ar);color:#1C5D3A}
/* 7 senses */
.sn{display:grid;grid-template-columns:520px 1fr;gap:26px;flex:1;min-height:0}
.kid{position:relative;border-radius:30px;background:linear-gradient(180deg,#FFF3CC,#fff);border:5px solid var(--line)}
.kid svg{width:100%;height:100%}
.hs{position:absolute;border:0;border-radius:50%;background:rgba(255,200,61,.0);animation:pulse 1.6s infinite;padding:0;cursor:pointer}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,200,61,.9)}60%{box-shadow:0 0 0 22px rgba(255,200,61,0)}}
.hs.on{animation:none;box-shadow:0 0 0 8px var(--gr);background:rgba(46,158,91,.25)}
.snr{display:flex;flex-direction:column;gap:14px;min-height:0}
.ph2{display:grid;grid-template-columns:1fr 1fr;gap:20px;height:230px}
.pb{position:relative;border:5px solid var(--line);border-radius:26px;overflow:hidden;padding:0;background:#fff}
.pb img{width:100%;height:100%;object-fit:cover;display:block}
.pb.on{border-color:var(--gr)}
.pb .tg{position:absolute;left:0;right:0;bottom:0;background:rgba(255,255,255,.92);font:700 34px/1.5 var(--f-ar);direction:rtl;text-align:center;color:var(--gr-d);display:none}
.pb.on .tg{display:block}
.slist{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.tick{width:56px;height:56px;border-radius:16px;border:4px solid #B9DDF2;background:#fff;display:grid;place-items:center;font-size:30px}
.tick.on{background:var(--gr);border-color:var(--gr);color:#fff}
.shk{background:var(--sun-s);border:4px solid #F3DC8F;border-radius:26px;padding:8px 18px;text-align:center;display:none;flex-direction:column;gap:6px;align-items:center}
.shk.on{display:flex}
.shk .ar{font:700 38px/1.5 var(--f-ar);color:#1C5D3A}
/* 8 vanishing */
.vw{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;direction:rtl;min-height:130px;align-items:center}
.wd{border:5px solid var(--sky);background:#fff;border-radius:22px;padding:4px 22px;font:700 66px/1.6 var(--f-ar);direction:rtl;color:var(--ink);min-width:70px;text-align:center}
.wd.chip{background:var(--sky-s);cursor:pointer;touch-action:manipulation}
.wd.gone{opacity:.0;background:#EEF4F8;border-style:dashed;border-color:#B9CBDA;color:transparent}
.wd.gone.peek{opacity:1;color:#8A9BAA}
.stars3{display:flex;gap:10px;justify-content:center;font-size:56px}
.stars3 i{font-style:normal;opacity:.25}.stars3 i.on{opacity:1}
/* 9 fruit */
.fr9{display:grid;grid-template-columns:620px 1fr;gap:26px;flex:1;min-height:0}
.fruit{position:relative;border:5px solid var(--line);border-radius:30px;overflow:hidden;background:#fff}
.fruit img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.fh{position:absolute;border:0;border-radius:50%;background:rgba(255,255,255,0);padding:0;animation:pulse 1.8s infinite;cursor:pointer}
.fh.on{animation:none;box-shadow:0 0 0 6px var(--gr);background:rgba(46,158,91,.28)}
.fpop{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:var(--gr);color:#fff;border-radius:22px;padding:6px 26px;font:700 46px/1.4 var(--f-ar);direction:rtl;display:none;z-index:2}
.cnt{font:700 34px/1.4 var(--f-ui);text-align:center;color:var(--gr-d)}
.trw{position:relative;flex:1;min-height:0;border:5px solid var(--line);border-radius:30px;background:#fff;overflow:hidden}
.trw canvas{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none}
.meter{height:26px;border-radius:14px;background:#fff;border:3px solid #B9DDF2;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--gr);transition:width .3s}
/* 10 wheel */
.whl{display:grid;grid-template-columns:600px 1fr;gap:30px;flex:1;min-height:0}
.wbox{position:relative;display:flex;align-items:center;justify-content:center}
#wheel{width:560px;height:560px;transition:transform 3.2s cubic-bezier(.12,.7,.15,1)}
.ptr{position:absolute;top:2px;left:50%;transform:translateX(-50%);font-size:70px;line-height:1;filter:drop-shadow(0 4px 4px rgba(0,0,0,.3));z-index:2}
.spin{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:150px;height:150px;border-radius:50%;border:8px solid #fff;background:var(--or);color:#fff;font:700 30px/1.1 var(--f-ui);box-shadow:0 8px 20px rgba(0,0,0,.3);z-index:3}
.wr2{display:flex;flex-direction:column;gap:16px;justify-content:center}
.sit{background:var(--sun-s);border:5px solid #F3DC8F;border-radius:28px;padding:16px 24px;display:flex;align-items:center;gap:20px;min-height:150px}
.sit .em{font-size:90px;line-height:1}
.sit .ar{font:700 54px/1.5 var(--f-ar);color:#1C5D3A}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{border:5px solid var(--line);background:#fff;border-radius:24px;padding:8px 22px;font:700 44px/1.5 var(--f-ar);direction:rtl;color:var(--ink);display:flex;align-items:center;justify-content:space-between;gap:16px}
.tpr{font:700 32px/1.4 var(--f-ui);color:var(--or-d);text-align:center;min-height:50px}
/* 11 balloons */
.bl{position:relative;flex:1;min-height:0;border-radius:30px;background:linear-gradient(180deg,#BFE5FA,#F2FAFF);overflow:hidden;border:5px solid var(--line);touch-action:none}
.bln{position:absolute;min-width:220px;height:250px;padding:0 26px;border-radius:50% 50% 48% 48%;display:flex;align-items:center;justify-content:center;font:700 56px/1.3 var(--f-ar);direction:rtl;color:#fff;cursor:pointer;touch-action:none;box-shadow:inset -14px -14px 0 rgba(0,0,0,.12);text-align:center}
.bln::after{content:"";position:absolute;left:50%;bottom:-40px;width:3px;height:44px;background:#6b7a8a}
.bln.pop{animation:popb .35s forwards}
@keyframes popb{to{transform:scale(1.7);opacity:0}}
.qrow{display:flex;align-items:center;gap:18px;justify-content:center;background:var(--sun-s);border:4px solid #F3DC8F;border-radius:26px;padding:10px 20px}
.qrow .ar{font:700 50px/1.5 var(--f-ar);color:var(--ink)}
.qd{display:flex;gap:10px}.qd i{width:26px;height:26px;border-radius:50%;background:#C8DCEA;display:block}.qd i.on{background:var(--gr)}
/* 12 finish */
.finish{display:grid;grid-template-columns:1.15fr 1fr;gap:30px;flex:1}
.cert{border-radius:30px;border:8px double #C79A12;background:linear-gradient(160deg,#FFF9E3,#FFFFFF);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;text-align:center;position:relative}
.cert .t1{font:700 34px/1.3 var(--f-ui);color:var(--sun-d)}
.cert .nm{font:700 88px/1.3 var(--f-h);color:var(--sky-d)}
.cert .tp{font:700 40px/1.4 var(--f-ar);color:#1C5D3A;direction:rtl}
.cert .st{font-size:56px}
.cert .stars{position:absolute;bottom:14px;left:16px;background:#fff;border-radius:20px;padding:8px 16px;font:700 36px/1 var(--f-h);color:var(--or-d);box-shadow:0 4px 12px rgba(0,0,0,.15)}
.home{background:#fff;border:4px solid var(--line);border-radius:30px;padding:20px;display:flex;flex-direction:column;gap:10px}
.home h3{margin:0;font:700 38px/1.2 var(--f-ui);color:var(--or-d)}
.task{display:flex;align-items:center;gap:14px;border:3px solid var(--line);border-radius:20px;padding:8px 14px;font:600 26px/1.4 var(--f-ui);background:#fff;text-align:start;color:var(--ink)}
.task i{flex:none;width:44px;height:44px;border-radius:12px;border:4px solid var(--sky);display:grid;place-items:center;font-style:normal;font-size:26px;color:#fff}
.task.on i{background:var(--sky)}

<div id="app">
 <div id="viewport"><div id="stage"></div><canvas id="fx"></canvas><div id="cue" hidden></div><div id="notes" hidden></div></div>
 <div id="bar">
  <button class="nav" id="prevB"><span class="bi"><span class="a">→ السابق</span><span class="e">← Back</span></span></button>
  <button class="nav" id="nextB"><span class="bi"><span class="a">التالي ←</span><span class="e">Next →</span></span></button>
  <span id="count">1 / 12</span>
  <div id="prog"><i></i></div>
  <span id="stars">★ 0</span>
  <span id="clock" title="Lesson time">00:00</span>
  <div class="lang3" role="group" aria-label="Language / اللغة"><button data-m="ar" title="عربي فقط">ع</button><button data-m="both" title="English + عربي">ع+EN</button><button data-m="en" title="English only">EN</button></div>
  <button id="notesB"><span class="bi"><span class="a">ملاحظات المعلم</span><span class="e">Teacher notes</span></span></button>
  <button id="soundB" class="hide-s"><span class="bi"><span class="a">الصوت: يعمل</span><span class="e">Sound: on</span></span></button>
  <button id="fsB"><span class="bi"><span class="a">ملء الشاشة</span><span class="e">Full screen</span></span></button>
 </div>

<script>
(function(){
const S=[];const add=(html,notes,init,leave)=>S.push({html,notes,init,leave});
const t=(a,e)=>`<span class="bi"><span class="a">${a}</span><span class="e">${e}</span></span>`;
const tE=e=>`<span class="bi"><span class="e">${e}</span></span>`;
const A=(s,c='')=>`<span class="ar ${c}">${s}</span>`;
const top=(n,a,e,ta,te)=>`<div class="top"><div class="n">${n}</div><h2>${t(a,e)}</h2><span class="tag">${t(ta,te)}</span></div>`;
const PL=k=>`<button class="pl" data-au="${k}" aria-label="play">🔊</button>`;
const NT=(min,ar,en,say)=>({min,ar:`<b>${min}</b> ${ar}`,en:`<b>${min}</b> ${en}`,say:say||[]});
const STEPS=[t('١ · اسْمَعْ بِتَرْكِيزٍ 👂','1 · Listen carefully 👂'),t('٢ · كَرِّرْ بَعْدِي 🗣️','2 · Repeat after me 🗣️'),t('٣ · اقْرَأْ وَحْدَكَ 📖','3 · Now read alone 📖')];
function stepper(box,au,cb){let s=0;box.innerHTML=`<div class="stp"><div class="lab">${STEPS[0]}</div><div class="dots"><i class="lit"></i><i></i><i></i></div><div class="row"><button class="btn ghost" data-ls>🔊 ${t('اسْتَمِعْ','Listen')}</button><button class="btn gr" data-dn>✔ ${t('تَمَّ','Done')}</button></div></div>`;
 const lab=box.querySelector('.lab'),dots=[...box.querySelectorAll('.dots i')],dn=box.querySelector('[data-dn]');
 box.querySelector('[data-ls]').onclick=()=>playAu(au);
 dn.onclick=()=>{s++;if(s>=3){dots.forEach(d=>d.classList.add('lit'));lab.innerHTML=t('أَحْسَنْتَ! ✅','Well done! ✅');dn.hidden=true;tone('ok');if(cb)cb();return}dots.forEach((d,i)=>d.classList.toggle('lit',i<=s));lab.innerHTML=STEPS[s];tone('tap')}}
function dragify(el,drop){el.style.touchAction='none';el.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button>0)return;e.preventDefault();try{el.setPointerCapture(e.pointerId)}catch(_){}
  const r=el.getBoundingClientRect(),sr=stage.getBoundingClientRect(),sc=sr.width/1600;const g=el.cloneNode(true);g.classList.add('dragg');g.style.width=r.width/sc+'px';g.style.height=r.height/sc+'px';g.style.margin='0';g.style.visibility='visible';stage.appendChild(g);
  const ox=e.clientX-r.left,oy=e.clientY-r.top;const mv=ev=>{g.style.left=(ev.clientX-ox-sr.left)/sc+'px';g.style.top=(ev.clientY-oy-sr.top)/sc+'px'};mv(e);el.classList.add('lift');
  const up=ev=>{el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);el.removeEventListener('pointercancel',up);g.remove();el.classList.remove('lift');drop(ev.clientX,ev.clientY,el,ev.type==='pointercancel')};
  el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up)})}
const inside=(el,x,y)=>{const r=el.getBoundingClientRect();return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
const rafs=new Set();

/* ===================== style st-wzhv: builders (one call = one slide) ===================== */
const KEY='st-wzhv',LOGO='../assets/brand/emblem.svg';
const B=x=>Array.isArray(x)?t(x[0],x[1]||''):(x||'');                 /* ['عربي','English'] -> both (language switch) */
const NN=o=>{const n=o.notes||[];return NT(n[0]||'',n[1]||'',n[2]||'',n[3]||[])}; /* notes:['٣ دقائق','ملاحظة','English note',['Say…']] */
const TOP=o=>top(o.icon||'⭐',(o.title||['',''])[0],(o.title||['',''])[1],(o.tag||['',''])[0],(o.tag||['',''])[1]);
const HUS=['Husary_Muallim_128kbps','Husary_128kbps'],pad3=n=>String(n).padStart(3,'0');
/* playAu('51:58') = Husary; any other text = "المعلم يقول" bubble (no recorded or machine voice) */
let cueT=0;function cue(x){const c=document.getElementById('cue');if(!c)return;c.innerHTML='🗣 '+t('الْمُعَلِّمُ يَقُولُ:','Teacher says:')+' <b class="ar">'+x+'</b>';c.hidden=false;clearTimeout(cueT);cueT=setTimeout(()=>c.hidden=true,2800)}
function playAu(k,cb){if(!k){cb&&cb();return null}const m=/^(\d+):(\d+)$/.exec(k);
 if(m){if(muted){cb&&cb();return null}try{if(curAud)curAud.pause()}catch(e){}const u=i=>`https://everyayah.com/data/${HUS[i]}/${pad3(m[1])}${pad3(m[2])}.mp3`;const a=new Audio(u(0));curAud=a;let d=false;const fin=()=>{if(d)return;d=true;cb&&cb()};
  a.onerror=()=>{if(a._fb){fin();return}a._fb=1;a.src=u(1);a.play().catch(fin)};a.onended=fin;const p=a.play();if(p&&p.catch)p.catch(()=>{});return a}
 cue(k);if(cb)setTimeout(cb,1500);return null}
window.playAu=playAu;
const verseHtml=v=>`<div class="verse" style="width:100%"><div class="q">${v.text}</div><div class="row"><span class="ref">${B(v.ref)}${v.en?' · '+tE(v.en):''}</span>${v.key?PL(v.key):''}</div></div>`;

/* hook: the thirsty seed (drag the cloud) — or any "grow" story; then a question and a tap-to-reveal answer */
function seedHook(o){
 const st=o.stages||['🌰','🌱','🌿','🌻'];
 add(`<section class="slide s-hook">
 <div class="hk-l"><img class="hlogo" src="${LOGO}" alt=""><span class="lv">${B(o.label)}</span><h1>${B(o.title)}</h1><p>${B(o.sub)}</p>
 <div class="hk-reveal" data-r><p>${B(o.ask)}</p><button class="btn sun" data-b>${t('اضْغَطْ وَاعْرِفْ! 👀','Tap to find out! 👀')}</button><div class="hk-ans" data-a><span>${o.answer}</span>${o.answerKey?PL(o.answerKey):''}</div></div></div>
 <div id="scene1"><div class="sun">☀️</div><div class="soil"></div><div class="grass"></div><div id="sprout">${st[0]}</div><div id="cloud">${o.cloud||'☁️'}</div><div class="hint" data-h>${B(o.hint||['اسْحَبْ ☁️ فَوْقَ الْبَذْرَةِ','Drag ☁️ over the seed'])}</div><div id="gbar"><i></i></div></div></section>`,NN(o),
 s=>{const sc=s.querySelector('#scene1'),cl=s.querySelector('#cloud'),sp=s.querySelector('#sprout'),gb=s.querySelector('#gbar i'),hint=s.querySelector('[data-h]');let g=0,done=false;
  function setG(v){g=Math.min(100,v);gb.style.width=g+'%';const k=g>=100?3:g>=60?2:g>=20?1:0;sp.textContent=st[k];sp.style.fontSize=(70+k*45)+'px';if(g>=100&&!done){done=true;win(true);hint.style.display='none';s.querySelector('[data-r]').classList.add('on')}}
  function over(){const c=cl.getBoundingClientRect(),p=sp.getBoundingClientRect();return Math.abs((c.left+c.width/2)-(p.left+p.width/2))<c.width*.5}
  setInterval(()=>{if(!s.classList.contains('active')||done||!over())return;const d=document.createElement('div');d.className='drop';d.style.left=(cl.offsetLeft+50+Math.random()*190)+'px';d.style.top=(cl.offsetTop+120)+'px';sc.appendChild(d);setTimeout(()=>d.remove(),950);setG(g+2.4);if(Math.random()<.3)tone('tap')},110);
  cl.addEventListener('pointerdown',e=>{e.preventDefault();try{cl.setPointerCapture(e.pointerId)}catch(_){}const r=sc.getBoundingClientRect(),f=r.width/sc.offsetWidth,ox=(e.clientX-r.left)/f-cl.offsetLeft,oy=(e.clientY-r.top)/f-cl.offsetTop;
   const mv=ev=>{cl.style.left=Math.max(0,Math.min(sc.offsetWidth-cl.offsetWidth,(ev.clientX-r.left)/f-ox))+'px';cl.style.top=Math.max(0,Math.min(sc.offsetHeight*.45,(ev.clientY-r.top)/f-oy))+'px';cl.style.right='auto'};
   const up=()=>{cl.removeEventListener('pointermove',mv);cl.removeEventListener('pointerup',up)};cl.addEventListener('pointermove',mv);cl.addEventListener('pointerup',up)});
  s.querySelector('[data-b]').onclick=()=>{s.querySelector('[data-a]').classList.add('on');if(o.answerKey)playAu(o.answerKey);win()}});
}
/* flip cards (question -> answer) + an optional verse that unlocks after all flips */
function flipCards(o){
 add(`<section class="slide">${TOP(o)}<div class="body"><p class="say">${B(o.say||['اقْلِبِ الْبِطَاقَةَ، ثُمَّ قُلِ الْجَوَابَ بِصَوْتٍ عَالٍ!','Flip each card, then say the answer out loud!'])}</p>
 <div class="fcards">${o.cards.map((c,i)=>`<div class="fc" role="button" tabindex="0" data-i="${i}"><div class="in"><div class="fa fr"><div class="em">${c.e||''}</div><div class="qq">${B(c.q)}</div></div><div class="fa bk"><span class="ar">${c.a}</span>${PL(c.key||c.a)}</div></div></div>`).join('')}</div>
 ${o.verse?`<div data-v style="opacity:.35">${verseHtml(o.verse)}</div>`:''}</div></section>`,NN(o),
 s=>{let n=0;s.querySelectorAll('.fc').forEach(b=>b.onclick=e=>{if(e.target.closest('.pl')||b.classList.contains('f'))return;b.classList.add('f');tone('ok');n++;addStar();if(n===o.cards.length){const v=s.querySelector('[data-v]');if(v){v.style.opacity=1;v.classList.add('bounce')}confetti()}})});
}
/* picture cards: tap each -> the sentence; after all, the verse appears with the 3 steps */
function picCards(o){
 add(`<section class="slide">${TOP(o)}<div class="body"><div class="pcards">${o.items.map((p,i)=>`<button class="pc" data-i="${i}"><span class="pe">${p.e}</span><div class="cap q">${B(o.ask||['اضْغَطْ: مَنْ يَرْزُقُهُ؟','Tap: who provides for it?'])}</div></button>`).join('')}</div>
 ${o.verse?`<div class="vslot" data-vs><div class="say">🔒 ${t('افْتَحِ الصُّوَرَ لِتَظْهَرَ الْآيَةُ','Open all the pictures to reveal the verse')}</div></div>`:''}</div></section>`,NN(o),
 s=>{let n=0;s.querySelectorAll('.pc').forEach(b=>b.onclick=()=>{if(b.classList.contains('on'))return;b.classList.add('on','bounce');const p=o.items[+b.dataset.i];const cap=b.querySelector('.cap');cap.className='cap';cap.innerHTML=`<span>${p.ans}</span>`;playAu(p.key||p.ans);tone('ok');n++;addStar();
  if(n===o.items.length&&o.verse){const v=s.querySelector('[data-vs]');v.classList.add('open');v.innerHTML=verseHtml(o.verse)+'<div data-stp style="width:100%"></div>';stepper(v.querySelector('[data-stp]'),o.verse.key);confetti()}})});
}
/* chain: drag cards into numbered slots in the right order */
function chain(o){
 const CH=o.items;
 add(`<section class="slide">${TOP(o)}<div class="body"><p class="say">${B(o.say)}</p>
 <div class="slots">${CH.map((c,i)=>`<div class="sl" data-i="${i}"><div class="no">${i+1}</div><div class="ph">${t('ضَعْ هُنَا','drop here')}</div></div>`).join('')}</div>
 <div class="tray">${shuffle(CH.map((c,i)=>i)).map(i=>`<div class="ch" data-i="${i}"><div class="em">${CH[i].e}</div><span class="ar">${CH[i].ar}</span></div>`).join('')}</div></div></section>`,NN(o),
 s=>{let n=0;const slots=[...s.querySelectorAll('.sl')];
  s.querySelectorAll('.ch').forEach(c=>dragify(c,(x,y,el,cancel)=>{if(cancel)return;const i=+el.dataset.i;const tgt=slots.find(sl=>inside(sl,x,y));if(!tgt)return;
   if(+tgt.dataset.i===i&&!tgt.classList.contains('right')){tgt.classList.add('right');tgt.querySelector('.ph').remove();const cl=el.cloneNode(true);cl.classList.remove('lift');tgt.appendChild(cl);el.classList.add('done');tone('ok');addStar();n++;if(n===CH.length){confetti();if(o.endKey)setTimeout(()=>playAu(o.endKey),900)}}
   else{tone('bad');tgt.classList.add('shake');setTimeout(()=>tgt.classList.remove('shake'),500)}}))});
}
/* before / after slider (two coloured panes with a big emoji) + a dhikr/verse that appears at the end */
function slider(o){
 add(`<section class="slide">${TOP(o)}<div class="body"><div class="cmp">
 <div class="sld" data-sd><div class="pane p0" style="background:${o.from.bg||'#E8D2A0'}">${o.from.e}</div><div class="pane p1" data-g style="background:${o.to.bg||'#9ED79A'}">${o.to.e}</div><div class="hdl" data-hd><b>↔️</b></div><div class="lbl" data-lb>${B(o.from.l)}</div></div>
 <div class="rt"><div class="qbox">${o.q}</div><button class="btn sun" data-go>${B(o.btn||['🌧️ أَنْزِلِ الْمَطَرَ','🌧️ Make it rain'])}</button>
 <div data-dk style="display:none">${o.reveal}</div></div></div></div></section>`,NN(o),
 s=>{const sd=s.querySelector('[data-sd]'),g=s.querySelector('[data-g]'),h=s.querySelector('[data-hd]'),lb=s.querySelector('[data-lb]');let p=0,shown=false,timer=null;
  function set(v){p=Math.max(0,Math.min(100,v));g.style.clipPath=`inset(0 ${100-p}% 0 0)`;h.style.left=p+'%';lb.innerHTML=p>50?B(o.to.l):B(o.from.l);if(p>=96&&!shown){shown=true;const d=s.querySelector('[data-dk]');d.style.display='block';d.classList.add('bounce');win(true);if(o.revealKey)playAu(o.revealKey)}}
  function fromX(cx){const r=sd.getBoundingClientRect();set((cx-r.left)/r.width*100)}
  sd.addEventListener('pointerdown',e=>{clearInterval(timer);e.preventDefault();try{sd.setPointerCapture(e.pointerId)}catch(_){}fromX(e.clientX);const mv=ev=>fromX(ev.clientX);const up=()=>{sd.removeEventListener('pointermove',mv);sd.removeEventListener('pointerup',up)};sd.addEventListener('pointermove',mv);sd.addEventListener('pointerup',up)});
  s.querySelector('[data-go]').onclick=()=>{clearInterval(timer);tone('tap');timer=setInterval(()=>{set(p+2);if(p>=100)clearInterval(timer)},40)};set(0)});
}
/* falling words: tap the words of a dhikr / verse in order, then the 3 steps */
function fallingWords(o){
 const DK=o.words;
 add(`<section class="slide">${TOP(o)}<div class="body"><div class="row"><span class="say">${B(o.say||['اضْغَطِ الْكَلِمَاتِ بِالتَّرْتِيبِ:','Tap the falling words in order:'])}</span>${o.key?PL(o.key):''}</div>
 <div class="rainf" data-rf></div><div class="sentline" data-sl><span style="font-size:30px;color:#9a8a4a;font-family:var(--f-ui)">${t('هُنَا يَظْهَرُ الذِّكْرُ','The words appear here')}</span></div><div data-stp style="min-height:0"></div></div></section>`,NN(o),
 s=>{const rf=s.querySelector('[data-rf]'),line=s.querySelector('[data-sl]');let next=0,wrong=0,run=true;const W=[];
  DK.forEach((w,i)=>{const e=document.createElement('div');e.className='fw';e.textContent=w;rf.appendChild(e);const ob={e,i,x:0,y:0,v:0};W.push(ob);
   ob.place=first=>{const rw=rf.clientWidth||1400;ob.x=80+Math.random()*(rw-380);ob.y=first?-60-i*100:-90;ob.v=1.5+Math.random()*.7;e.style.left=ob.x+'px'};ob.place(true);
   e.addEventListener('pointerdown',ev=>{ev.preventDefault();if(ob.done)return;if(i===next){ob.done=true;e.remove();const sp=document.createElement('span');sp.textContent=w;if(next===0)line.innerHTML='';line.appendChild(sp);next++;tone('ok');addStar();wrong=0;
     if(next===DK.length){run=false;win(true);stepper(s.querySelector('[data-stp]'),o.key||DK.join(' '))}}
    else{wrong++;tone('bad');e.classList.add('shake');setTimeout(()=>e.classList.remove('shake'),450);if(wrong>=2&&W[next])W[next].e.classList.add('glow')}})});
  const H=()=>rf.clientHeight||420;(function loop(){if(!s.isConnected)return;if(run&&s.classList.contains('active'))W.forEach(ob=>{if(ob.done)return;ob.y+=ob.v;if(ob.y>H()-90)ob.place(false);ob.e.style.top=ob.y+'px'});requestAnimationFrame(loop)})()});
}

#board .bt{position:absolute;top:18px;left:50%;transform:translateX(-50%);font:700 18px/1 "Cairo","Lexend",sans-serif;color:#86662A;background:#FBF3E1;border:1px solid #EBDDBB;border-radius:20px;padding:8px 16px}
#tools{position:absolute;left:10px;top:50%;transform:translateY(-50%);z-index:70;display:flex;flex-direction:column;gap:5px;background:rgba(7,23,33,.95);border:1px solid #C9A35A;border-radius:16px;padding:7px;box-shadow:0 10px 30px rgba(0,0,0,.35);max-height:calc(100% - 16px);overflow-y:auto;gap:4px}
#tools button{width:36px;height:36px;flex:none;border-radius:10px;border:1px solid #24485A;background:#12303F;color:#E8F1F5;display:grid;place-items:center;padding:0;cursor:pointer}
#tools button svg{width:20px;height:20px}
#tools button.on{background:#C9A35A;color:#0B2431;border-color:#C9A35A}
#tools .sw i{width:20px;height:20px;border-radius:50%;display:block;border:2px solid rgba(255,255,255,.6)}
#tools .sw.on{background:#24485A;border-color:#C9A35A}
#tools .sz i{display:block;border-radius:50%;background:#E8F1F5}
#tools .sep{height:1px;background:#2A5266;margin:2px 0}
#tools[hidden]{display:none!important}
@media (max-height:820px) and (min-height:641px){#tools{display:grid;grid-template-columns:36px 36px;align-content:start}#tools .sep{grid-column:1/-1;width:auto;height:1px}}

@media (max-height:640px){#tools{flex-direction:row;flex-wrap:wrap;top:auto;bottom:8px;transform:none;max-width:calc(100% - 20px)}#tools .sep{width:1px;height:auto;margin:0 2px}}
</style>
<script>
(function(){
const stage=document.getElementById('stage'),vp=document.getElementById('viewport'),bar=document.getElementById('bar');
if(!stage||!vp)return;
const W=1600,H=900,DPR=2;
const board=document.createElement('div');board.id='board';board.hidden=true;board.innerHTML='<span class="bt">سبورة بيضاء · Whiteboard</span>';stage.appendChild(board);
const cv=document.createElement('canvas');cv.id='ink';cv.width=W*DPR;cv.height=H*DPR;stage.appendChild(cv);
const lz=document.createElement('canvas');lz.id='laser';lz.width=W;lz.height=H;stage.appendChild(lz);
const ctx=cv.getContext('2d'),lctx=lz.getContext('2d');
ctx.scale(DPR,DPR);

const SV=p=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const IC={
 hand:SV('<path d="M7 11V5a1.5 1.5 0 0 1 3 0v5M10 10V3.5a1.5 1.5 0 0 1 3 0V10M13 10V4.5a1.5 1.5 0 0 1 3 0V12M16 9.5a1.5 1.5 0 0 1 3 0V15a7 7 0 0 1-7 7h-1a6 6 0 0 1-5-3l-2.5-4.5a1.5 1.5 0 0 1 2.6-1.5L7 15"/>'),
 pen:SV('<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>'),
 hl:SV('<path d="M9 11l-6 6v3h9l3-3"/><path d="M22 12l-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/>'),
 erase:SV('<path d="M20 20H8l-5-5a2 2 0 0 1 0-2.8L12.2 3a2 2 0 0 1 2.8 0l6 6a2 2 0 0 1 0 2.8L13 20"/><path d="M6 11l7 7"/>'),
 laser:SV('<circle cx="12" cy="12" r="3" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/>'),
 undo:SV('<path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/>'),
 clear:SV('<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>'),
 board:SV('<rect x="3" y="4" width="18" height="13" rx="1"/><path d="M8 21l4-4 4 4"/>'),
 close:SV('<path d="M6 6l12 12M18 6L6 18"/>')
};
const COLORS=['#C2453A','#14374A','#2E8B5A','#2F6FB3','#C9A35A','#FFFFFF'];
const SIZES=[2.5,5,9];
const tb=document.createElement('div');tb.id='tools';tb.hidden=true;
tb.innerHTML=`
 <button data-t="none" title="تحكم في الشريحة (V / Esc)">${IC.hand}</button>
 <button data-t="pen" title="قلم (P)">${IC.pen}</button>
 <button data-t="hl" title="هايلايتر لتظليل الكلمات (H)">${IC.hl}</button>
 <button data-t="erase" title="ممحاة (E)">${IC.erase}</button>
 <button data-t="laser" title="مؤشر ليزر (L)">${IC.laser}</button>
 <div class="sep"></div>
 ${COLORS.map((c,i)=>`<button class="sw" data-c="${c}" title="لون"><i style="background:${c}"></i></button>`).join('')}
 <div class="sep"></div>
 ${SIZES.map((s,i)=>`<button class="sz" data-s="${i}" title="سُمك"><i style="width:${6+i*6}px;height:${6+i*6}px"></i></button>`).join('')}
 <div class="sep"></div>
 <button data-a="undo" title="تراجع (Ctrl+Z)">${IC.undo}</button>
 <button data-a="clear" title="امسح كتابة هذه الشريحة">${IC.clear}</button>
 <button data-a="board" title="سبورة بيضاء (W)">${IC.board}</button>
 <button data-a="close" title="إغلاق أدوات الكتابة (D)">${IC.close}</button>`;
vp.appendChild(tb);

let tool='none',color=COLORS[0],sizeI=1;
const store={},backup={};
const slides=()=>[...stage.querySelectorAll('.slide')];
const idx=()=>slides().findIndex(s=>s.classList.contains('active'));
const key=()=>idx()+(board.hidden?'':'-wb');
const list=()=>store[key()]||(store[key()]=[]);

function lw(s,pr){return s.t==='hl'?s.w*5:s.w*(0.45+1.1*(pr==null?.5:pr))}
function drawStroke(c,s){const p=s.pts;if(!p.length)return;c.save();c.lineCap='round';c.lineJoin='round';c.strokeStyle=s.c;c.fillStyle=s.c;
 if(s.t==='hl'){c.globalAlpha=.35;c.lineWidth=lw(s);c.beginPath();c.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++){const m=[(p[i-1][0]+p[i][0])/2,(p[i-1][1]+p[i][1])/2];c.quadraticCurveTo(p[i-1][0],p[i-1][1],m[0],m[1])}c.lineTo(p[p.length-1][0],p[p.length-1][1]);if(p.length===1)c.lineTo(p[0][0]+.1,p[0][1]);c.stroke()}
 else{if(p.length===1){c.beginPath();c.arc(p[0][0],p[0][1],lw(s,p[0][2])/2,0,7);c.fill()}else for(let i=1;i<p.length;i++)seg(c,s,i)}
 c.restore()}
function seg(c,s,i){const p=s.pts,a=p[i-1],b=p[i];const m0=i===1?a:[(p[i-2][0]+a[0])/2,(p[i-2][1]+a[1])/2];const m1=[(a[0]+b[0])/2,(a[1]+b[1])/2];
 c.lineWidth=lw(s,(a[2]+b[2])/2);c.beginPath();c.moveTo(m0[0],m0[1]);c.quadraticCurveTo(a[0],a[1],m1[0],m1[1]);c.stroke()}
function redraw(extra){ctx.clearRect(0,0,W,H);list().forEach(s=>drawStroke(ctx,s));if(extra)drawStroke(ctx,extra)}

function pos(e){const r=stage.getBoundingClientRect();return [(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height,e.pointerType==='pen'?(e.pressure||.5):.5]}
let cur=null,erasing=false,trail=[];
function eraseAt(x,y){const L=list(),r=22;let ch=false;for(let i=L.length-1;i>=0;i--){if(L[i].pts.some(p=>Math.hypot(p[0]-x,p[1]-y)<r+lw(L[i],p[2])/2)){L.splice(i,1);ch=true}}if(ch)redraw()}
cv.addEventListener('pointerdown',e=>{if(tool==='none')return;e.preventDefault();cv.setPointerCapture(e.pointerId);const p=pos(e);
 erasing=tool==='erase'||e.button===5||(e.buttons&32);
 if(tool==='laser'){trail=[[p[0],p[1],performance.now()]];return}
 if(erasing){eraseAt(p[0],p[1]);return}
 cur={t:tool,c:color,w:SIZES[sizeI],pts:[p]};if(tool==='pen')drawStroke(ctx,cur)});
cv.addEventListener('pointermove',e=>{if(tool==='none')return;const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
 if(tool==='laser'){const p=pos(e);trail.push([p[0],p[1],performance.now()]);return}
 if(!e.buttons)return;
 for(const ev of (evs.length?evs:[e])){const p=pos(ev);if(erasing){eraseAt(p[0],p[1]);continue}if(!cur)continue;const l=cur.pts[cur.pts.length-1];if(Math.hypot(p[0]-l[0],p[1]-l[1])<1.2)continue;cur.pts.push(p);
  if(cur.t==='pen'){ctx.save();ctx.lineCap='round';ctx.strokeStyle=cur.c;seg(ctx,cur,cur.pts.length-1);ctx.restore()}}
 if(cur&&cur.t==='hl')redraw(cur)});
function up(){if(cur){list().push(cur);cur=null;redraw()}erasing=false}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('pointerleave',()=>{if(tool==='laser')trail.push(null)});
['touchstart','touchmove','touchend'].forEach(t=>cv.addEventListener(t,e=>{if(tool!=='none')e.stopPropagation()},{passive:true}));
cv.addEventListener('contextmenu',e=>{if(tool!=='none')e.preventDefault()});

(function loop(){const now=performance.now();lctx.clearRect(0,0,W,H);
 if(tool==='laser'){trail=trail.filter(p=>p&&now-p[2]<450);for(let i=1;i<trail.length;i++){const a=trail[i-1],b=trail[i],k=1-(now-b[2])/450;lctx.strokeStyle=`rgba(255,40,40,${.7*k})`;lctx.lineWidth=10*k+2;lctx.lineCap='round';lctx.beginPath();lctx.moveTo(a[0],a[1]);lctx.lineTo(b[0],b[1]);lctx.stroke()}
  const t=trail[trail.length-1];if(t){lctx.fillStyle='rgba(255,40,40,.25)';lctx.beginPath();lctx.arc(t[0],t[1],22,0,7);lctx.fill();lctx.fillStyle='#FF2A2A';lctx.beginPath();lctx.arc(t[0],t[1],9,0,7);lctx.fill()}}
 requestAnimationFrame(loop)})();

function setTool(t){tool=t;cv.className=t==='none'?'':'on'+(t==='erase'?' erase':'')+(t==='laser'?' laser':'');if(t!=='laser')trail=[];
 tb.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===t))}
function setColor(c){color=c;tb.querySelectorAll('.sw').forEach(b=>b.classList.toggle('on',b.dataset.c===c));if(tool==='none'||tool==='erase'||tool==='laser')setTool('pen')}
function setSize(i){sizeI=i;tb.querySelectorAll('.sz').forEach(b=>b.classList.toggle('on',+b.dataset.s===i))}
function openTools(open){tb.hidden=!open;if(open){if(tool==='none')setTool('pen')}else{setTool('none');if(!board.hidden)toggleBoard()}if(dbtn)dbtn.classList.toggle('on',open)}
function toggleBoard(){board.hidden=!board.hidden;tb.querySelector('[data-a="board"]').classList.toggle('on',!board.hidden);if(!board.hidden&&tool==='none')setTool('pen');redraw()}
function undo(){const L=list();if(L.length)L.pop();else if(backup[key()]){store[key()]=backup[key()];delete backup[key()]}redraw()}
function clearAll(){const L=list();if(!L.length)return;backup[key()]=L.slice();store[key()]=[];redraw()}
tb.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.t)setTool(b.dataset.t);else if(b.dataset.c)setColor(b.dataset.c);else if(b.dataset.s)setSize(+b.dataset.s);
 else if(b.dataset.a==='undo')undo();else if(b.dataset.a==='clear')clearAll();else if(b.dataset.a==='board')toggleBoard();else if(b.dataset.a==='close')openTools(false)});

let dbtn=null;
if(bar){dbtn=document.createElement('button');dbtn.id='drawB';dbtn.innerHTML='✏️ <span class="bi"><span class="a">قلم / سبورة</span><span class="e">Pen / board</span></span>';dbtn.title='أدوات الكتابة (D)';
 dbtn.onclick=()=>openTools(tb.hidden);const ref=document.getElementById('notesB');bar.insertBefore(dbtn,ref||null);
 const st=document.createElement('style');st.textContent='#drawB.on{background:#C9A35A!important;color:#0B2431!important;border-color:#C9A35A!important}';document.head.appendChild(st)}
setColor(COLORS[0]);setTool('none');setSize(1);

let last=idx();
new MutationObserver(()=>{const i=idx();if(i!==last){last=i;if(!board.hidden){board.hidden=true;tb.querySelector('[data-a="board"]').classList.remove('on')}redraw()}}).observe(stage,{subtree:true,attributes:true,attributeFilter:['class']});

document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;const k=e.key.toLowerCase();
 if((e.ctrlKey||e.metaKey)&&k==='z'){if(!tb.hidden){e.preventDefault();undo()}return}
 if(e.ctrlKey||e.metaKey||e.altKey)return;
 if(k==='d'){openTools(tb.hidden);return}
 if(tb.hidden&&!['p','h','w','l'].includes(k))return;
 if(k==='p'){openTools(true);setTool('pen')}else if(k==='h'){openTools(true);setTool('hl')}else if(k==='e'&&!tb.hidden)setTool('erase')
 else if(k==='l'){openTools(true);setTool('laser')}else if(k==='v'||k==='escape')setTool('none');else if(k==='w'){openTools(true);toggleBoard()}});
})();
</script>

</body></html>
