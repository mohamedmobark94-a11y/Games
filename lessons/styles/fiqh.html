<!doctype html><html lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>فقه الشباب · Mohamed Mubarak</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Amiri+Quran&family=Cairo:wght@400;600;700;800;900&display=swap">
<style>
/* Layout: a fixed 1600×900 slide stage scaled to fit, in the course's navy & gold;
   light content slides carry a mist side panel with the section badge (as in the original deck). */
:root{
  --navy:#14374A; --deep:#0B2431; --abyss:#081B25;
  --gold:#C9A35A; --gold-soft:#EBDDBB; --gold-ink:#8A6A2C;
  --mist:#E8EEF1; --paper:#FFFFFF; --text:#1D2B33; --muted:#5E6E77; --line:#D6DFE4;
  --ok:#2E8B5A; --ok-soft:#DDF1E5; --bad:#C2453A; --bad-soft:#F8E1DE;
  --f-ui:"Cairo","Segoe UI",Tahoma,sans-serif;
  --f-q:"Amiri Quran","Amiri","Traditional Arabic",serif;
  --f-h:"Amiri","Traditional Arabic",serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--abyss);color:var(--text);font-family:var(--f-ui);overflow:hidden}
*{box-sizing:border-box}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

#app{position:absolute;inset:0;display:flex;flex-direction:column}
#viewport{flex:1;position:relative;overflow:hidden;min-height:0}
#stage{position:absolute;width:1600px;height:900px;left:50%;top:50%;transform-origin:center center;transform:translate(-50%,-50%) scale(.5);box-shadow:0 30px 80px rgba(0,0,0,.45);background:var(--paper)}
#fx{position:absolute;inset:0;pointer-events:none;z-index:50}

/* ---------- slides ---------- */
.slide{position:absolute;inset:0;display:none;overflow:hidden;direction:rtl}
.slide.active{display:block;animation:fadein .45s ease}
@keyframes fadein{from{opacity:.0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* dark */
.dark{background:var(--navy);color:#fff}
.dark .blob{position:absolute;width:960px;height:960px;border-radius:50%;background:#0D2532;left:-440px;top:-520px}
.dark .arc{position:absolute;width:640px;height:640px;border-radius:50%;border:2px solid var(--gold);right:-340px;bottom:-376px}
.dark .medal{position:absolute;left:150px;top:324px;width:254px;height:254px;border-radius:50%;background:#071923;border:3px solid var(--gold);display:grid;place-items:center;color:#000}
.dark .medal svg{width:120px;height:120px;stroke:var(--gold);stroke-width:1.6}
.dark .big-n{position:absolute;left:446px;top:270px;font:900 150px/1 var(--f-ui);color:#0C2633;direction:ltr}
.dark .goldbar{position:absolute;left:450px;top:454px;width:156px;height:4px;background:var(--gold)}
.dark .titles{position:absolute;right:76px;top:330px;width:820px;text-align:right}
.dark .eyebrow{color:var(--gold);font:700 26px/1.4 var(--f-ui);letter-spacing:.5px;margin-bottom:12px}
.dark h1{font:800 76px/1.35 var(--f-ui);margin:0;text-wrap:balance}
.dark .sub{color:var(--gold);font:600 34px/1.6 var(--f-ui);margin-top:18px}
.dark .tagline{position:absolute;right:76px;bottom:70px;color:#9FB6C2;font:600 22px/1 var(--f-ui)}

/* light */
.light{background:var(--paper)}
.side{position:absolute;left:0;top:0;bottom:0;width:384px;background:var(--mist);display:flex;flex-direction:column;align-items:center;padding-top:150px;direction:rtl}
.badge{width:200px;height:200px;border-radius:50%;background:var(--navy);border:4px solid var(--gold);display:grid;place-items:center}
.badge svg{width:96px;height:96px;stroke:var(--gold);stroke-width:1.7}
.side-title{margin-top:34px;font:800 30px/1.4 var(--f-ui);color:var(--navy);text-align:center;padding:0 28px}
.side-bar{width:120px;height:4px;background:var(--gold);margin-top:14px}
.side-foot{position:absolute;bottom:26px;left:40px;font:600 15px/1 var(--f-ui);color:var(--muted)}
.mins{margin-top:26px;font:700 18px/1 var(--f-ui);color:var(--gold-ink);background:#fff;border:1px solid var(--gold-soft);padding:8px 16px;border-radius:30px}
.pnum{position:absolute;right:48px;bottom:24px;font:600 18px/1 var(--f-ui);color:var(--muted);direction:ltr}
.main{position:absolute;left:384px;right:0;top:0;bottom:0;padding:54px 72px 60px 72px;display:flex;flex-direction:column}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;border-bottom:1px solid var(--line);padding-bottom:22px}
.head h2{margin:0;font:800 50px/1.35 var(--f-ui);color:var(--navy);text-wrap:balance}
.kicker{font:800 52px/1 var(--f-ui);color:var(--gold);margin-top:10px;flex:none}
.content{flex:1;min-height:0;padding-top:30px;display:flex;flex-direction:column;gap:22px}
.lead{font:600 30px/1.75 var(--f-ui);color:var(--text);margin:0}
.small{font:600 20px/1.6 var(--f-ui);color:var(--muted)}
.src{font:600 17px/1.5 var(--f-ui);color:var(--muted);direction:rtl}
.src b{color:var(--gold-ink)}

.quran{font:400 40px/2.1 var(--f-q);color:var(--navy);text-align:center;background:linear-gradient(#FBF7EE,#F6EFDD);border:1px solid var(--gold-soft);border-radius:18px;padding:22px 30px}
.quran .ref{display:block;font:700 20px/1.6 var(--f-ui);color:var(--gold-ink);margin-top:2px}
.hadith{font:700 34px/1.9 var(--f-h);color:var(--navy);background:var(--mist);border-right:6px solid var(--gold);border-radius:12px;padding:18px 28px}
.hadith .ref{display:block;font:700 19px/1.6 var(--f-ui);color:var(--gold-ink)}

.btn{border:0;border-radius:14px;padding:14px 30px;font:800 26px/1.2 var(--f-ui);background:var(--navy);color:#fff;transition:transform .12s, background .2s}
.btn:hover{transform:translateY(-2px)}
.btn.gold{background:var(--gold);color:var(--deep)}
.btn.ghost{background:transparent;color:var(--navy);border:2px solid var(--navy)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.row{display:flex;gap:18px;align-items:center;flex-wrap:wrap}

/* steps */
.step{opacity:0;transform:translateY(12px);transition:opacity .4s, transform .4s}
.step.shown{opacity:1;transform:none}
.step-hint{position:absolute;left:456px;bottom:22px;font:700 17px/1 var(--f-ui);color:var(--gold-ink);background:#FBF5E8;border:1px dashed var(--gold);border-radius:20px;padding:7px 14px}

/* hook */
.hook{display:grid;grid-template-columns:240px 1fr;gap:40px;align-items:center;background:var(--mist);border-radius:22px;padding:30px 40px}
.hook svg{width:200px;height:200px;stroke:var(--navy);stroke-width:1.3}
.vote{display:flex;gap:22px}
.vote button{flex:1;display:flex;justify-content:space-between;align-items:center;padding:20px 30px;border-radius:16px;border:2px solid var(--line);background:#fff;font:800 32px/1 var(--f-ui);color:var(--navy)}
.vote .cnt{min-width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--mist);font:900 30px/1 var(--f-ui)}
.vote button.yes .cnt{background:var(--bad-soft);color:var(--bad)}
.vote button.no .cnt{background:var(--ok-soft);color:var(--ok)}
.reveal-box{background:var(--navy);color:#fff;border-radius:20px;padding:26px 34px;font:700 32px/1.7 var(--f-ui)}
.reveal-box .q{font:400 34px/2 var(--f-q);color:var(--gold-soft);display:block;margin-top:8px}

/* match */
.match{display:grid;grid-template-columns:1fr 1.6fr;gap:30px 46px}
.match .col{display:flex;flex-direction:column;gap:14px}
.mitem{border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 20px;font:700 25px/1.5 var(--f-ui);color:var(--text);text-align:right;transition:all .2s}
.mword{font:800 30px/1.4 var(--f-ui);color:var(--navy);background:var(--mist)}
.mitem.sel{border-color:var(--gold);background:#FBF3E1;box-shadow:0 0 0 4px rgba(201,163,90,.25)}
.mitem.done{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);cursor:default}
.mitem.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}
.meter{display:flex;align-items:center;gap:14px;font:800 24px/1 var(--f-ui);color:var(--navy)}
.meter .track{width:260px;height:14px;background:var(--mist);border-radius:8px;overflow:hidden}
.meter .fill{height:100%;width:0;background:var(--gold);transition:width .4s}

/* two glances */
.glances{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.glance{border-radius:20px;padding:24px 28px;display:flex;flex-direction:column;gap:10px}
.glance h3{margin:0;font:800 34px/1.3 var(--f-ui)}
.glance p{margin:0;font:600 26px/1.6 var(--f-ui)}
.glance.g1{background:var(--ok-soft);color:#1E5E3D;border:2px solid #A9D9BD}
.glance.g2{background:var(--bad-soft);color:#8E2D25;border:2px solid #EDB7B0}
.glance .ic{width:56px;height:56px}
.rule{display:flex;gap:18px;align-items:center;background:var(--navy);color:#fff;border-radius:16px;padding:16px 26px;font:700 27px/1.5 var(--f-ui)}
.rule b{color:var(--gold)}
.rule svg{width:46px;height:46px;stroke:var(--gold);flex:none}

/* binary game */
.bgame{display:flex;flex-direction:column;gap:22px;flex:1}
.bcard{background:var(--mist);border-radius:22px;padding:30px 40px;min-height:210px;display:flex;flex-direction:column;justify-content:center;gap:14px;position:relative}
.bcard .count{position:absolute;top:16px;left:22px;font:800 20px/1 var(--f-ui);color:var(--muted);direction:ltr}
.bcard .txt{font:700 36px/1.65 var(--f-ui);color:var(--navy)}
.bcard .why{font:700 26px/1.6 var(--f-ui);border-radius:14px;padding:12px 20px;display:none}
.bcard .why.ok{display:block;background:var(--ok-soft);color:#1E5E3D}
.bcard .why.bad{display:block;background:var(--bad-soft);color:#8E2D25}
.bopts{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.bopt{border-radius:18px;border:3px solid transparent;padding:20px;font:800 32px/1.3 var(--f-ui);display:flex;align-items:center;justify-content:center;gap:14px}
.bopt svg{width:40px;height:40px;stroke-width:2.4}
.bopt.a{background:#E6F4EC;color:#1E5E3D;border-color:#A9D9BD}
.bopt.b{background:#FAE7E4;color:#8E2D25;border-color:#EDB7B0}
.bopt.right{outline:5px solid var(--ok)}
.bopt.wrong{outline:5px solid var(--bad)}
.bnav{display:flex;justify-content:space-between;align-items:center}

/* rulings */
.rules3{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.rcard{border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:10px;border:2px solid var(--line);background:#fff}
.rcard h3{margin:0;font:800 32px/1.3 var(--f-ui);color:var(--navy)}
.rcard .who{font:600 21px/1.5 var(--f-ui);color:var(--muted)}
.rcard .verdict{margin-top:auto;font:800 25px/1.5 var(--f-ui);padding:10px 14px;border-radius:12px}
.v-ok{background:var(--ok-soft);color:#1E5E3D}.v-mid{background:#FBF3E1;color:var(--gold-ink)}.v-no{background:var(--bad-soft);color:#8E2D25}
.screen-note{display:flex;gap:18px;align-items:center;background:var(--navy);color:#fff;border-radius:16px;padding:18px 26px;font:700 27px/1.5 var(--f-ui)}
.screen-note svg{width:52px;height:52px;stroke:var(--gold);flex:none}

/* guess */
.guess{display:grid;grid-template-columns:1fr 470px;gap:44px;flex:1;min-height:0}
.gq{font:700 31px/1.7 var(--f-ui);color:var(--navy);margin:0}
.slider{display:flex;align-items:center;gap:20px;background:var(--mist);border-radius:18px;padding:18px 24px}
.slider input{flex:1;accent-color:var(--gold);height:30px}
.slider output{font:900 48px/1 var(--f-ui);color:var(--navy);min-width:120px;text-align:center;direction:ltr}
.gres{font:800 30px/1.6 var(--f-ui);color:var(--navy);min-height:96px}
.gres .big{font:900 92px/1 var(--f-ui);color:var(--gold);direction:ltr;display:inline-block}
.dots{display:grid;grid-template-columns:repeat(10,1fr);gap:9px;align-self:center;direction:ltr}
.dot{aspect-ratio:1;border-radius:50%;background:#DCE4E8;transition:background .25s, transform .25s}
.dot.on{background:var(--gold);transform:scale(1.04)}
.dot.guess-mark{box-shadow:0 0 0 3px var(--navy) inset}
.ring{position:relative;width:420px;height:420px;align-self:center;justify-self:center}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .lbl b{display:block;font:900 110px/1 var(--f-ui);color:var(--navy);direction:ltr}
.ring .lbl span{font:700 24px/1.4 var(--f-ui);color:var(--muted)}

/* age chart */
.agegrid{display:grid;grid-template-columns:1fr 1.15fr;gap:40px;flex:1;min-height:0}
.facts{display:flex;flex-direction:column;gap:16px}
.fact{display:flex;align-items:center;gap:22px;background:var(--mist);border-radius:18px;padding:16px 24px}
.fact b{font:900 58px/1 var(--f-ui);color:var(--gold-ink);min-width:150px;text-align:center;direction:ltr}
.fact span{font:700 25px/1.55 var(--f-ui);color:var(--navy)}
.chart{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px 28px;display:flex;flex-direction:column;gap:22px}
.chart h4{margin:0;font:800 26px/1.4 var(--f-ui);color:var(--navy)}
.barrow{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center}
.barrow .k{font:700 23px/1 var(--f-ui);color:var(--text)}
.track2{height:72px;background:var(--mist);border-radius:10px;position:relative;overflow:hidden}
.bar{position:absolute;top:0;bottom:0;right:0;width:0;background:var(--navy);border-radius:10px;display:flex;align-items:center;justify-content:flex-start;padding-right:14px;min-width:64px;color:#fff;font:800 26px/1 var(--f-ui);transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.bar.gold{background:var(--gold);color:var(--deep)}
.axis{display:grid;grid-template-columns:150px 1fr;gap:16px}
.axis div{display:flex;justify-content:space-between;font:600 16px/1 var(--f-ui);color:var(--muted);direction:rtl}

/* behind screen */
.behind{display:grid;grid-template-columns:1fr 440px;gap:40px;flex:1;min-height:0}
.plist{display:flex;flex-direction:column;gap:14px}
.pitem{display:flex;gap:18px;align-items:center;font:700 27px/1.55 var(--f-ui);color:var(--navy);background:var(--mist);border-radius:16px;padding:14px 22px}
.pitem svg{width:44px;height:44px;stroke:var(--gold-ink);flex:none}

/* brain loop */
.brain{display:grid;grid-template-columns:560px 1fr;gap:40px;flex:1;min-height:0}
.loop{position:relative;width:560px;height:560px;align-self:center}
.loop svg.track{position:absolute;inset:0}
.node{position:absolute;width:170px;height:170px;margin:-85px 0 0 -85px;border-radius:50%;background:#fff;border:3px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px;font:800 22px/1.35 var(--f-ui);color:var(--navy);transition:all .35s}
.node i{font-style:normal;font:900 20px/1 var(--f-ui);color:var(--gold-ink);margin-bottom:6px}
.node.on{background:var(--navy);color:#fff;border-color:var(--gold);transform:scale(1.08);box-shadow:0 10px 30px rgba(20,55,74,.3)}
.node.on i{color:var(--gold)}
.loop .center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;font:800 24px/1.4 var(--f-ui);color:var(--muted);width:170px}
.bside{display:flex;flex-direction:column;gap:16px}
.ndesc{min-height:118px;background:#FBF5E8;border:1px solid var(--gold-soft);border-radius:16px;padding:16px 22px;font:700 26px/1.6 var(--f-ui);color:var(--navy)}
.study{background:var(--mist);border-radius:16px;padding:16px 22px;font:700 23px/1.6 var(--f-ui);color:var(--navy)}
.good{background:var(--ok-soft);color:#1E5E3D;border-radius:16px;padding:16px 22px;font:700 24px/1.6 var(--f-ui)}

/* flip cards */
.flips{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr;gap:20px;flex:1;min-height:0}
.flip{perspective:1200px;border:0;background:none;padding:0;text-align:right}
.flip .in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.flip.open .in{transform:rotateY(180deg)}
.flip .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;padding:20px 24px;display:flex;flex-direction:column}
.flip .front{background:var(--navy);color:#fff;justify-content:center;align-items:center;text-align:center;gap:12px}
.flip .front svg{width:70px;height:70px;stroke:var(--gold);stroke-width:1.6}
.flip .front b{font:800 31px/1.3 var(--f-ui)}
.flip .front small{font:700 17px/1 var(--f-ui);color:var(--gold)}
.flip .back{background:#FBF5E8;border:2px solid var(--gold);color:var(--navy);transform:rotateY(180deg);font:700 22.5px/1.6 var(--f-ui);justify-content:center;gap:6px}
.flip .back h4{margin:0;font:800 25px/1.3 var(--f-ui);color:var(--gold-ink)}
.flip .tag{position:absolute;top:14px;left:16px;font:900 22px/1 var(--f-ui);color:#3E6378}

/* chat story */
.chat{display:flex;flex-direction:column;gap:14px;flex:1}
.bub{max-width:80%;border-radius:22px;padding:14px 24px;font:700 27px/1.6 var(--f-ui)}
.bub small{display:block;font:800 17px/1.4 var(--f-ui);opacity:.75}
.bub.y{align-self:flex-start;background:var(--mist);color:var(--navy);border-top-right-radius:6px}
.bub.p{align-self:flex-end;background:var(--navy);color:#fff;border-top-left-radius:6px}
.bub.p small{color:var(--gold)}
.bub.lesson{align-self:stretch;max-width:none;background:#FBF5E8;border:2px solid var(--gold);color:var(--navy);text-align:center;font-size:29px}

/* shield */
.shieldgame{display:grid;grid-template-columns:1fr 300px;gap:30px;flex:1;min-height:0}
.shieldbox{display:flex;flex-direction:column;align-items:center;gap:12px;justify-content:center}
.shieldbox svg{width:260px;height:300px}
.shieldbox .pct{font:900 40px/1 var(--f-ui);color:var(--navy);direction:ltr}
.halt{font:700 21px/1.6 var(--f-ui);color:#8E2D25;background:var(--bad-soft);border-radius:14px;padding:12px 16px;text-align:center}

/* tawba */
.tsteps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.ts{background:var(--mist);border-radius:18px;padding:18px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.ts b{width:52px;height:52px;border-radius:50%;background:var(--gold);color:var(--deep);display:grid;place-items:center;font:900 26px/1 var(--f-ui)}
.ts span{font:800 25px/1.45 var(--f-ui);color:var(--navy)}

/* rewards */
.rewards{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;flex:1}
.rw{border-radius:22px;background:var(--navy);color:#fff;padding:26px 26px;display:flex;flex-direction:column;gap:14px}
.rw .top{display:flex;align-items:center;gap:14px;font:800 30px/1.3 var(--f-ui);color:var(--gold)}
.rw .top svg{width:52px;height:52px;stroke:var(--gold)}
.rw .h{font:700 31px/1.9 var(--f-h);color:#fff}
.rw .ref{font:700 17px/1.4 var(--f-ui);color:#9FB6C2;margin-top:auto}

/* quiz */
.quiz{display:flex;flex-direction:column;gap:18px;flex:1}
.qtop{display:flex;justify-content:space-between;align-items:center}
.turn{font:800 26px/1 var(--f-ui);color:var(--deep);background:var(--gold);padding:12px 22px;border-radius:30px}
.qnum{font:800 22px/1 var(--f-ui);color:var(--muted)}
.qtext{font:800 38px/1.6 var(--f-ui);color:var(--navy);background:var(--mist);border-radius:20px;padding:22px 30px}
.qopts{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.qopt{display:flex;align-items:center;gap:16px;border:3px solid var(--line);background:#fff;border-radius:18px;padding:18px 22px;font:700 28px/1.45 var(--f-ui);color:var(--text);text-align:right}
.qopt b{flex:none;width:52px;height:52px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font:900 24px/1 var(--f-ui)}
.qopt.right{border-color:var(--ok);background:var(--ok-soft)}
.qopt.right b{background:var(--ok)}
.qopt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.qopt.wrong b{background:var(--bad)}
.qfoot{display:flex;justify-content:space-between;align-items:center;margin-top:auto}
.teams{display:flex;gap:16px}
.tm{display:flex;align-items:center;gap:12px;background:var(--mist);border-radius:16px;padding:10px 18px;font:800 24px/1 var(--f-ui);color:var(--navy);border:3px solid transparent}
.tm.cur{border-color:var(--gold)}
.tm .s{font:900 34px/1 var(--f-ui);color:var(--gold-ink);min-width:40px;text-align:center}
.winner{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;flex:1;text-align:center}
.winner svg{width:140px;height:140px;stroke:var(--gold);stroke-width:1.4}
.winner h3{margin:0;font:900 56px/1.3 var(--f-ui);color:var(--navy)}
.winner p{margin:0;font:700 30px/1.5 var(--f-ui);color:var(--muted)}

/* pledge */
.pledge{display:grid;grid-template-columns:1fr 1fr;gap:34px;flex:1;min-height:0}
.chips{display:flex;flex-direction:column;gap:12px}
.chip{border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 18px;font:700 24px/1.4 var(--f-ui);color:var(--navy);text-align:right;display:flex;gap:12px;align-items:center}
.chip i{width:30px;height:30px;border-radius:8px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-style:normal}
.chip.on{border-color:var(--gold);background:#FBF5E8}
.chip.on i{background:var(--gold);border-color:var(--gold);color:var(--deep)}
.card{background:var(--navy);color:#fff;border-radius:22px;padding:28px 32px;display:flex;flex-direction:column;gap:12px;border:3px solid var(--gold);position:relative;overflow:hidden}
.card h3{margin:0;font:800 34px/1.3 var(--f-ui);color:var(--gold)}
.card input{background:transparent;border:0;border-bottom:2px dashed var(--gold);color:#fff;font:800 28px/1.4 var(--f-ui);padding:4px 2px;width:100%}
.card input::placeholder{color:#7F9BAA}
.card ul{margin:0;padding:0 26px 0 0;font:700 24px/1.7 var(--f-ui)}
.card .dua{margin-top:auto;font:700 27px/1.8 var(--f-h);color:var(--gold-soft);border-top:1px solid #2C5568;padding-top:12px}

/* sources */
.srcs{font:600 19px/1.7 var(--f-ui);color:var(--text);columns:2;column-gap:40px}
.srcs p{margin:0 0 12px;break-inside:avoid}
.srcs b{color:var(--navy)}

/* ---------- control bar ---------- */
#bar{flex:none;direction:rtl;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:#071721;color:#CFE0E8;border-top:1px solid #1C3B4B;font:700 15px/1 var(--f-ui)}
#bar button{background:#12303F;color:#E8F1F5;border:1px solid #24485A;border-radius:10px;padding:8px 12px;font:700 15px/1 var(--f-ui);display:flex;align-items:center;gap:6px}
#bar button:hover{background:#1A4054}
#bar button.nav{background:var(--gold);color:var(--deep);border-color:var(--gold);padding:8px 18px;font-weight:900}
#bar svg{width:18px;height:18px}
#bar .grow{flex:1;min-width:20px}
#prog{flex:1;min-width:120px;height:6px;background:#173646;border-radius:4px;overflow:hidden}
#prog i{display:block;height:100%;width:0;background:var(--gold);transition:width .3s}
#count,#clock{font-variant-numeric:tabular-nums;direction:ltr;color:#fff}
#clock{background:#12303F;border:1px solid #24485A;border-radius:10px;padding:8px 10px}
.tbar{display:flex;align-items:center;gap:6px;background:#12303F;border:1px solid #24485A;border-radius:10px;padding:4px 6px}
.tbar input{width:110px;background:transparent;border:0;color:#fff;font:800 15px/1 var(--f-ui)}
.tbar .sc{min-width:26px;text-align:center;color:var(--gold);font:900 18px/1 var(--f-ui)}
.tbar button{padding:4px 8px !important}
#notes{position:absolute;left:16px;right:16px;bottom:10px;max-width:980px;margin:0 auto;background:rgba(7,23,33,.96);color:#E8F1F5;border:1px solid var(--gold);border-radius:14px;padding:14px 18px;font:600 16px/1.8 var(--f-ui);direction:rtl;z-index:60}
#notes b{color:var(--gold)}
@media (max-width:700px){#bar .hide-s{display:none}.tbar input{width:70px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* iPad / touch */
*{-webkit-tap-highlight-color:transparent}
button,select,.flip,.chip,.opt,.mopt,.qopt{touch-action:manipulation}
html,body{overscroll-behavior:none}
#app{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app input,#app textarea{-webkit-user-select:text;user-select:text}

/* ===== language switch: ع / ع+EN / EN ===== */
.bi .e{display:none}
body.m-both .bi .e{display:block;font-family:var(--f-ui);font-weight:600;font-size:.62em;line-height:1.35;direction:ltr;unicode-bidi:isolate;opacity:.85;margin-top:3px;letter-spacing:0}
body.m-en .bi .a{display:none}
body.m-en .bi .e{display:inline;direction:ltr;unicode-bidi:isolate;font-family:var(--f-ui)}
body.m-en .slide{direction:ltr}
body.m-en .dark .titles{text-align:left}
body.m-en .hadith,body.m-en .rulebar .rl,body.m-en .quran{direction:rtl}
#bar .bi .e{font-size:.85em}
body.m-both #bar .bi .e{display:none}
.mean{display:none}
body.m-both .mean,body.m-en .mean{display:block;direction:ltr;text-align:left;font:600 22px/1.5 var(--f-ui);color:var(--muted);margin-top:4px}
.reveal-box .mean{color:#CFE0E8}
.svg-e{display:none}
body.m-both .svg-e,body.m-en .svg-e{display:inline}
body.m-en .svg-a{display:none}
.lang3{display:inline-flex;border-radius:10px;overflow:hidden;border:1px solid rgba(201,163,90,.6)}
.lang3 button{border:0;border-radius:0;background:transparent;color:#CFE0E8;font:700 14px/1 var(--f-ui);padding:0 12px;min-height:34px}
.lang3 button[aria-pressed="true"]{background:var(--gold);color:var(--deep)}
.snd{flex:none;width:52px;height:52px;border-radius:50%;border:2px solid var(--gold-soft);background:#fff;font-size:24px;line-height:1;vertical-align:middle;margin-inline-end:10px;display:inline-grid;place-items:center}
.snd:hover{background:#FBF5E8}
.ladder5{display:flex;flex-direction:column;gap:12px}
.rung{display:flex;align-items:center;gap:20px;border-radius:16px;padding:12px 22px;color:#fff;font:600 26px/1.4 var(--f-ui)}
.rung b{font:800 34px/1.2 var(--f-ui);min-width:220px}
.rung .snd{border-color:rgba(255,255,255,.6)}
.rung.r1{background:#2d6a4f}.rung.r2{background:#3f8a6a}.rung.r3{background:#4a6fa5}.rung.r4{background:#b9741f}.rung.r5{background:#a33a2f}
.words4{display:flex;flex-wrap:wrap;gap:12px 28px;font:600 24px/1.5 var(--f-ui);color:var(--muted)}
.words4 b{font:700 30px/1.5 var(--f-h);color:var(--navy)}
.qzgrid{display:flex;flex-direction:column;gap:10px}
.headrow{display:flex;align-items:center;gap:26px}
.headsv{width:170px;height:170px;flex:none}
.rulebar{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;background:#FBF5E8;border:1px solid var(--gold-soft);border-right:6px solid var(--gold);border-radius:14px;padding:12px 22px}
.rulebar .rl{font:700 34px/1.7 var(--f-h);color:var(--navy)}
.rulebar .mean{flex-basis:100%}
.awr{display:grid;grid-template-columns:380px 1fr;gap:30px;align-items:center;flex:1;min-height:0}
.awrsv{width:100%;max-height:640px}
.hwbtn{display:inline-block;margin-top:18px;text-decoration:none}
.chat.tight{gap:8px}.chat.tight .bub{font-size:23px;padding:8px 20px;line-height:1.5}.chat.tight .bub small{font-size:15px}

</style>

<script>
(function(){
/* ---------- icons ---------- */
const P={
 eyeOff:'<path d="M3 3l18 18"/><path d="M10.6 5.1A10.9 10.9 0 0 1 12 5c5 0 9 4.5 10 7-.4 1-1.3 2.4-2.6 3.7M6.6 6.6C4.4 8 2.8 10 2 12c1 2.5 5 7 10 7 1.7 0 3.3-.5 4.7-1.3"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>',

 sources:'<path d="M4 4h16v16H4z"/><path d="M8 8h8M8 12h8M8 16h5"/>'
};
const I=(n,extra='')=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" ${extra}>${P[n]}</svg>`;

/* ---------- slide builders ---------- */
const FOOT='فقه الشباب في سؤال وجواب';
function dark({icon,num,eyebrow,title,sub,tag}){
 return `<section class="slide dark"><div class="blob"></div><div class="arc"></div>
 <div class="medal">${I(icon)}</div><div class="big-n">${num}</div><div class="goldbar"></div>
 <div class="titles">${eyebrow?`<div class="eyebrow">${eyebrow}</div>`:''}<h1>${title}</h1><div class="sub">${sub}</div></div>
 ${tag?`<div class="tagline">${tag}</div>`:''}</section>`;
}

 return `<section class="slide light"><aside class="side"><div class="badge">${I(icon)}</div><div class="side-title">${side}</div><div class="side-bar"></div>${mins?`<div class="mins">⏱ ${mins}</div>`:''}<div class="side-foot">${FOOT}</div></aside>
 <div class="main"><div class="head"><h2>${title}</h2><span class="kicker">${kicker}</span></div><div class="content">${body}</div></div>
 ${steps?'<div class="step-hint">اضغط «التالي» لإظهار الخطوة التالية</div>':''}<div class="pnum"></div></section>`;
}

/* ---------- extra icons, sound and the language switch ---------- */
P.scissors='<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M8.1 8.1L20 20M8.1 15.9L20 4"/>';

<!--LESSON-->/* match helper */
function matchSet(s,DATA){
  const W=s.querySelector('.words'),M=s.querySelector('.means'),n=DATA.length;
  DATA.forEach((v,i)=>{W.insertAdjacentHTML('beforeend',`<button class="mitem mword" data-i="${i}">${v[0]}</button>`)});
  shuffle(DATA.map((v,i)=>[v[1],i])).forEach(([x,i])=>M.insertAdjacentHTML('beforeend',`<button class="mitem" data-i="${i}">${x}</button>`));
  let sel=null,done=0;
  W.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(b.classList.contains('done'))return;W.querySelectorAll('.sel').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=b;tone('tap')});
  M.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(!sel||b.classList.contains('done'))return;
   if(sel.dataset.i===b.dataset.i){sel.classList.remove('sel');sel.classList.add('done');b.classList.add('done');sel=null;done++;
     s.querySelector('.mc').textContent=done+' / '+n;s.querySelector('.meter .fill').style.width=(done/n*100)+'%';tone('ok');if(done===n)confetti()}
   else{b.classList.add('shake');tone('bad');setTimeout(()=>b.classList.remove('shake'),400)}});
}
/* sound buttons */
let curA=null;
document.addEventListener('click',e=>{const b=e.target.closest('.snd');if(!b)return;e.stopPropagation();if(muted)return;try{if(curA)curA.pause();curA=new Audio(AUD[b.dataset.a]);curA.play().catch(()=>{})}catch(_){}},true);

/* ---------- engine ---------- */
const stage=document.getElementById('stage');
stage.innerHTML=S.map(s=>s.html).join('');
const slides=[...stage.querySelectorAll('.slide')];
slides.forEach((el,i)=>{const n=el.querySelector('.pnum');if(n)n.textContent=i+1});
const inited=new Set();let cur=0;

function fit(){const vp=document.getElementById('viewport');const sc=Math.min(vp.clientWidth/1600,vp.clientHeight/900)*0.98;stage.style.transform=`translate(-50%,-50%) scale(${sc})`;
 const c=document.getElementById('fx');c.width=vp.clientWidth;c.height=vp.clientHeight}
window.addEventListener('resize',fit);

function go(i){i=Math.max(0,Math.min(slides.length-1,i));slides[cur].classList.remove('active');cur=i;const el=slides[cur];el.classList.add('active');
 if(!inited.has(i)&&S[i].init){S[i].init(el);inited.add(i)}
 if(S[i].onEnter)S[i].onEnter(el);
 document.getElementById('count').textContent=`${i+1} / ${slides.length}`;
 document.querySelector('#prog i').style.width=((i+1)/slides.length*100)+'%';
 document.getElementById('notes').innerHTML=S[i].notes||'';
 try{localStorage.setItem('fiqh4-slide',i)}catch(e){}
 setTimeout(()=>window.fitContent&&window.fitContent(),30);}
function next(){const st=slides[cur].querySelector('.step:not(.shown)');if(st){st.classList.add('shown');tone('tap');return}go(cur+1)}
function prev(){go(cur-1)}
document.getElementById('nextB').onclick=next;document.getElementById('prevB').onclick=prev;
document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA/.test(e.target.tagName))return;
 if(['ArrowLeft','PageDown',' '].includes(e.key)){e.preventDefault();next()}
 else if(['ArrowRight','PageUp'].includes(e.key)){e.preventDefault();prev()}
 else if(e.key==='n'||e.key==='N'){toggleNotes()}});
let tx=null;document.getElementById('viewport').addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
document.getElementById('viewport').addEventListener('touchend',e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>70){dx>0?next():prev()}tx=null});

function toggleNotes(){const n=document.getElementById('notes');n.hidden=!n.hidden}
document.getElementById('notesB').onclick=toggleNotes;
/* language: Arabic / Arabic + English / English (remembered for every lesson) */
/* shrink a slide's content when the extra English makes it too tall */
function fitContent(){const sl=document.querySelector('.slide.active');if(!sl)return;const c=sl.querySelector('.content');if(!c)return;
 c.style.transform='';c.style.width='';const ov=c.scrollHeight-c.clientHeight;
 if(ov>2){const k=Math.max(.62,c.clientHeight/c.scrollHeight);c.style.transformOrigin=document.body.classList.contains('m-en')?'top left':'top right';c.style.transform='scale('+k+')';c.style.width=(100/k)+'%';
  if(document.body.classList.contains('m-en'))c.style.marginLeft='0';}}
window.fitContent=fitContent;
document.addEventListener('click',()=>setTimeout(fitContent,60));
function setLang(m){document.body.classList.remove('m-ar','m-both','m-en');document.body.classList.add('m-'+m);setTimeout(fitContent,30);
 document.querySelectorAll('.lang3 button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===m));
 try{localStorage.setItem('mobark-lesson-lang',m)}catch(e){}}
document.querySelectorAll('.lang3 button').forEach(b=>b.onclick=()=>{setLang(b.dataset.m);tone('tap')});
let lang0='ar';try{lang0=localStorage.getItem('mobark-lesson-lang')||'ar'}catch(e){}
setLang(['ar','both','en'].includes(lang0)?lang0:'ar');
let muted=false;document.getElementById('soundB').onclick=e=>{muted=!muted;e.currentTarget.innerHTML=t('الصوت: '+(muted?'مغلق':'يعمل'),'Sound: '+(muted?'off':'on'))};
document.getElementById('fsB').onclick=()=>{const d=document,el=d.documentElement;try{const on=d.fullscreenElement||d.webkitFullscreenElement;if(on){(d.exitFullscreen||d.webkitExitFullscreen).call(d)}else{const r=(el.requestFullscreen||el.webkitRequestFullscreen);if(r){const p=r.call(el);if(p&&p.catch)p.catch(()=>{})}}}catch(e){}};

/* lesson clock */
const t0=Date.now();setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);document.getElementById('clock').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},1000);

/* teams */
const score=[0,0];
function setScore(t,v){score[t]=Math.max(0,v);document.getElementById('t'+t+'s').textContent=score[t];document.querySelectorAll('.tm .s[data-t="'+t+'"]').forEach(x=>x.textContent=score[t])}
document.querySelectorAll('.tbar button').forEach(b=>b.onclick=()=>{setScore(+b.dataset.t,score[+b.dataset.t]+ +b.dataset.d);tone(+b.dataset.d>0?'ok':'tap')});
const tname=t=>document.getElementById('t'+t+'n').value||('فريق '+(t+1));

/* sound */
let ac=null;
function tone(kind){if(muted)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
 const seq=kind==='ok'?[[660,.09],[880,.14]]:kind==='bad'?[[220,.12],[170,.18]]:[[520,.05]];let t=ac.currentTime;
 seq.forEach(([f,d])=>{const o=ac.createOscillator(),g=ac.createGain();o.type=kind==='bad'?'square':'sine';o.frequency.value=f;g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d);t+=d})}catch(e){}}

/* confetti */
function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const c=document.getElementById('fx'),x=c.getContext('2d');const W=c.width,H=c.height;
 const cols=['#C9A35A','#EBDDBB','#14374A','#FFFFFF','#2E8B5A'];const ps=Array.from({length:150},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.35,vx:(Math.random()-.5)*16,vy:-Math.random()*14-4,r:Math.random()*7+4,c:cols[Math.random()*5|0],a:Math.random()*6,va:(Math.random()-.5)*.3}));
 let f=0;(function loop(){x.clearRect(0,0,W,H);ps.forEach(p=>{p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});
 if(++f<120)requestAnimationFrame(loop);else x.clearRect(0,0,W,H)})()}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}

/* binary game */
function binaryGame(root,items,labels,cb,compact){let i=0,right=0;
 function render(){if(i>=items.length){root.innerHTML=`<div class="bcard" style="text-align:center;align-items:center"><div class="txt">${t('انْتَهَى التَّمْرِينُ! ✓','Done! ✓')}</div><div class="small" style="font-size:28px">${t('إِجَابَاتٌ صَحِيحَةٌ','Correct answers')}: <b style="color:var(--gold-ink)">${right} / ${items.length}</b></div><button class="btn ghost" data-r>${t('مِنَ البِدَايَةِ','Start again')}</button></div>`;
   root.querySelector('[data-r]').onclick=()=>{i=0;right=0;render()};if(right===items.length&&!compact)confetti();return}
  const it=items[i];
  root.innerHTML=`<div class="bcard"><span class="count">${i+1} / ${items.length}</span><div class="txt"${compact?' style="font-size:32px"':''}>${it[0]}</div><div class="why"></div></div>
  <div class="bopts"><button class="bopt a" data-a="0">${I(labels[0][1])}${labels[0][0]}</button><button class="bopt b" data-a="1">${I(labels[1][1])}${labels[1][0]}</button></div>
  <div class="bnav"><span class="small">${t('الإِجَابَاتُ الصَّحِيحَةُ','Correct')}: ${right}</span><button class="btn" data-n hidden>${t('التَّالِي','Next')} ←</button></div>`;
  let answered=false;
  root.querySelectorAll('.bopt').forEach(b=>b.onclick=()=>{if(answered)return;answered=true;const ok=+b.dataset.a===it[1];if(ok)right++;
   b.classList.add(ok?'right':'wrong');if(!ok)root.querySelector(`.bopt[data-a="${it[1]}"]`).classList.add('right');
   const w=root.querySelector('.why');w.className='why '+(ok?'ok':'bad');w.innerHTML=(ok?t('صَحِيحٌ! ','Right! '):t('لَا، ','No: '))+it[2];tone(ok?'ok':'bad');cb&&cb(ok);
   const n=root.querySelector('[data-n]');n.hidden=false;n.onclick=()=>{i++;render()}});}
 render()}

/* guess game */
function guessGame(s,ans,kind,fmt){const inp=s.querySelector('input[type=range]'),out=s.querySelector('output');
 inp.oninput=()=>{out.textContent=inp.value;if(kind==='dots')mark()};
 const D=s.querySelector('.dots');if(D){D.innerHTML=Array.from({length:100},()=>'<i class="dot"></i>').join('')}
 function mark(){if(!D)return;D.querySelectorAll('.dot').forEach((d,k)=>d.classList.toggle('guess-mark',k<+inp.value&&!d.classList.contains('on')))}
 mark();
 s.querySelector('[data-go]').onclick=e=>{e.currentTarget.disabled=true;const g=+inp.value;
  if(kind==='dots'){const dots=D.querySelectorAll('.dot');dots.forEach(d=>d.classList.remove('guess-mark'));let k=0;const iv=setInterval(()=>{if(k>=ans){clearInterval(iv);done();return}dots[k++].classList.add('on')},18)}
  else{const a=s.querySelector('.arcv');a.setAttribute('stroke-dasharray',`${314.16*ans/100} 314.16`);const rv=s.querySelector('.rv');let v=0;const iv=setInterval(()=>{v=Math.min(ans,v+2);rv.textContent=v+'%';if(v>=ans){clearInterval(iv);done()}},30)}
  function done(){const r=s.querySelector('.gres');if(r)r.innerHTML=fmt(ans);const pl=s.querySelector('.plist');if(pl)pl.hidden=false;
   const diff=Math.abs(g-ans);tone(diff<=10?'ok':'tap');if(diff<=10)confetti();
   const rt=s.querySelector('.rt');if(rt)rt.innerHTML=`مِنْ 100 مَشْهَدٍ فِيهِ عُنْفٌ<br>تَخْمِينُكُمْ: ${g}%`}}}

/* quiz */
function quizGame(root){let q=0,turn=0;const order=QUIZ;
 function teamsHTML(){return `<div class="teams">${[0,1].map(t=>`<div class="tm ${t===turn?'cur':''}">${tname(t)}<span class="s" data-t="${t}">${score[t]}</span></div>`).join('')}</div>`}
 function render(){
  if(q>=order.length){const w=score[0]===score[1]?-1:(score[0]>score[1]?0:1);
   root.innerHTML=`<div class="winner">${I('trophy')}<h3>${w<0?t('تَعَادُلٌ! أَحْسَنْتُمْ جَمِيعًا','A draw! Well done, everyone'):t('الفَائِزُ: ','Winner: ')+tname(w)}</h3><p>${tname(0)}: ${score[0]} · ${tname(1)}: ${score[1]}</p><button class="btn ghost" data-r>${t('أَعِدِ المُسَابَقَةَ','Play again')}</button></div>`;
   confetti();tone('ok');root.querySelector('[data-r]').onclick=()=>{q=0;turn=0;render()};return}
  const [qt,opts,a]=order[q];const L=['أ','ب','ج','د'];
  root.innerHTML=`<div class="qtop"><span class="turn">${t('الدَّوْرُ','Turn')}: ${tname(turn)}</span><span class="qnum">${t('سُؤَالٌ '+(q+1)+' مِنْ '+order.length,'Question '+(q+1)+' of '+order.length)}</span></div>
  <div class="qtext">${qt}</div><div class="qopts">${opts.map((o,k)=>`<button class="qopt" data-k="${k}"><b>${t(L[k],'ABCD'[k])}</b>${o}</button>`).join('')}</div>
  <div class="qfoot">${teamsHTML()}<button class="btn" data-n hidden>${t('السُّؤَالُ التَّالِي','Next question')} ←</button></div>`;
  let done=false;
  root.querySelectorAll('.qopt').forEach(b=>b.onclick=()=>{if(done)return;done=true;const ok=+b.dataset.k===a;
   b.classList.add(ok?'right':'wrong');root.querySelector(`.qopt[data-k="${a}"]`).classList.add('right');
   if(ok){setScore(turn,score[turn]+1);confetti()}tone(ok?'ok':'bad');
   const n=root.querySelector('[data-n]');n.hidden=false;n.onclick=()=>{q++;turn=1-turn;render()}});}
 render()}

/* boot */
fit();
let start=0;try{start=+(localStorage.getItem('fiqh4-slide')||0)}catch(e){}
const hot=window.claude&&window.claude.hot;
if(hot&&hot.data&&typeof hot.data.slide==='number')start=hot.data.slide;
if(hot&&hot.snapshot)try{hot.snapshot(()=>({slide:cur}))}catch(e){}
slides[0].classList.add('active');go(start||0);
setTimeout(fit,300);
})();
</script>

#board .bt{position:absolute;top:18px;left:50%;transform:translateX(-50%);font:700 18px/1 "Cairo","Lexend",sans-serif;color:#86662A;background:#FBF3E1;border:1px solid #EBDDBB;border-radius:20px;padding:8px 16px}
#tools{position:absolute;left:10px;top:50%;transform:translateY(-50%);z-index:70;display:flex;flex-direction:column;gap:5px;background:rgba(7,23,33,.95);border:1px solid #C9A35A;border-radius:16px;padding:7px;box-shadow:0 10px 30px rgba(0,0,0,.35);max-height:calc(100% - 16px);overflow-y:auto;gap:4px}
#tools button{width:36px;height:36px;flex:none;border-radius:10px;border:1px solid #24485A;background:#12303F;color:#E8F1F5;display:grid;place-items:center;padding:0;cursor:pointer}

@media (max-height:640px){#tools{flex-direction:row;flex-wrap:wrap;top:auto;bottom:8px;transform:none;max-width:calc(100% - 20px)}#tools .sep{width:1px;height:auto;margin:0 2px}}

<script>
(function(){
const stage=document.getElementById('stage'),vp=document.getElementById('viewport'),bar=document.getElementById('bar');
if(!stage||!vp)return;
const W=1600,H=900,DPR=2;
const board=document.createElement('div');board.id='board';board.hidden=true;board.innerHTML='<span class="bt">سبورة بيضاء · Whiteboard</span>';stage.appendChild(board);
const cv=document.createElement('canvas');cv.id='ink';cv.width=W*DPR;cv.height=H*DPR;stage.appendChild(cv);
const lz=document.createElement('canvas');lz.id='laser';lz.width=W;lz.height=H;stage.appendChild(lz);
const ctx=cv.getContext('2d'),lctx=lz.getContext('2d');
ctx.scale(DPR,DPR);

const SV=p=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const IC={
 hand:SV('<path d="M7 11V5a1.5 1.5 0 0 1 3 0v5M10 10V3.5a1.5 1.5 0 0 1 3 0V10M13 10V4.5a1.5 1.5 0 0 1 3 0V12M16 9.5a1.5 1.5 0 0 1 3 0V15a7 7 0 0 1-7 7h-1a6 6 0 0 1-5-3l-2.5-4.5a1.5 1.5 0 0 1 2.6-1.5L7 15"/>'),
 pen:SV('<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>'),
 hl:SV('<path d="M9 11l-6 6v3h9l3-3"/><path d="M22 12l-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/>'),
 erase:SV('<path d="M20 20H8l-5-5a2 2 0 0 1 0-2.8L12.2 3a2 2 0 0 1 2.8 0l6 6a2 2 0 0 1 0 2.8L13 20"/><path d="M6 11l7 7"/>'),
 laser:SV('<circle cx="12" cy="12" r="3" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/>'),
 undo:SV('<path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/>'),
 clear:SV('<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>'),
 board:SV('<rect x="3" y="4" width="18" height="13" rx="1"/><path d="M8 21l4-4 4 4"/>'),
 close:SV('<path d="M6 6l12 12M18 6L6 18"/>')
};
const COLORS=['#C2453A','#14374A','#2E8B5A','#2F6FB3','#C9A35A','#FFFFFF'];
const SIZES=[2.5,5,9];
const tb=document.createElement('div');tb.id='tools';tb.hidden=true;
tb.innerHTML=`
 <button data-t="none" title="تحكم في الشريحة (V / Esc)">${IC.hand}</button>
 <button data-t="pen" title="قلم (P)">${IC.pen}</button>
 <button data-t="hl" title="هايلايتر لتظليل الكلمات (H)">${IC.hl}</button>
 <button data-t="erase" title="ممحاة (E)">${IC.erase}</button>
 <button data-t="laser" title="مؤشر ليزر (L)">${IC.laser}</button>
 <div class="sep"></div>
 ${COLORS.map((c,i)=>`<button class="sw" data-c="${c}" title="لون"><i style="background:${c}"></i></button>`).join('')}
 <div class="sep"></div>
 ${SIZES.map((s,i)=>`<button class="sz" data-s="${i}" title="سُمك"><i style="width:${6+i*6}px;height:${6+i*6}px"></i></button>`).join('')}
 <div class="sep"></div>
 <button data-a="undo" title="تراجع (Ctrl+Z)">${IC.undo}</button>
 <button data-a="clear" title="امسح كتابة هذه الشريحة">${IC.clear}</button>
 <button data-a="board" title="سبورة بيضاء (W)">${IC.board}</button>
 <button data-a="close" title="إغلاق أدوات الكتابة (D)">${IC.close}</button>`;
vp.appendChild(tb);

let tool='none',color=COLORS[0],sizeI=1;
const store={},backup={};
const slides=()=>[...stage.querySelectorAll('.slide')];
const idx=()=>slides().findIndex(s=>s.classList.contains('active'));
const key=()=>idx()+(board.hidden?'':'-wb');
const list=()=>store[key()]||(store[key()]=[]);

function lw(s,pr){return s.t==='hl'?s.w*5:s.w*(0.45+1.1*(pr==null?.5:pr))}
function drawStroke(c,s){const p=s.pts;if(!p.length)return;c.save();c.lineCap='round';c.lineJoin='round';c.strokeStyle=s.c;c.fillStyle=s.c;
 if(s.t==='hl'){c.globalAlpha=.35;c.lineWidth=lw(s);c.beginPath();c.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++){const m=[(p[i-1][0]+p[i][0])/2,(p[i-1][1]+p[i][1])/2];c.quadraticCurveTo(p[i-1][0],p[i-1][1],m[0],m[1])}c.lineTo(p[p.length-1][0],p[p.length-1][1]);if(p.length===1)c.lineTo(p[0][0]+.1,p[0][1]);c.stroke()}
 else{if(p.length===1){c.beginPath();c.arc(p[0][0],p[0][1],lw(s,p[0][2])/2,0,7);c.fill()}else for(let i=1;i<p.length;i++)seg(c,s,i)}
 c.restore()}
function seg(c,s,i){const p=s.pts,a=p[i-1],b=p[i];const m0=i===1?a:[(p[i-2][0]+a[0])/2,(p[i-2][1]+a[1])/2];const m1=[(a[0]+b[0])/2,(a[1]+b[1])/2];
 c.lineWidth=lw(s,(a[2]+b[2])/2);c.beginPath();c.moveTo(m0[0],m0[1]);c.quadraticCurveTo(a[0],a[1],m1[0],m1[1]);c.stroke()}
function redraw(extra){ctx.clearRect(0,0,W,H);list().forEach(s=>drawStroke(ctx,s));if(extra)drawStroke(ctx,extra)}

function pos(e){const r=stage.getBoundingClientRect();return [(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height,e.pointerType==='pen'?(e.pressure||.5):.5]}
let cur=null,erasing=false,trail=[];
function eraseAt(x,y){const L=list(),r=22;let ch=false;for(let i=L.length-1;i>=0;i--){if(L[i].pts.some(p=>Math.hypot(p[0]-x,p[1]-y)<r+lw(L[i],p[2])/2)){L.splice(i,1);ch=true}}if(ch)redraw()}
let penSeen=false;const palm=e=>{if(e.pointerType==='pen')penSeen=true;return penSeen&&e.pointerType==='touch'};
cv.addEventListener('pointerdown',e=>{if(tool==='none'||palm(e))return;e.preventDefault();cv.setPointerCapture(e.pointerId);const p=pos(e);
 erasing=tool==='erase'||e.button===5||(e.buttons&32);
 if(tool==='laser'){trail=[[p[0],p[1],performance.now()]];return}
 if(erasing){eraseAt(p[0],p[1]);return}
 cur={t:tool,c:color,w:SIZES[sizeI],pts:[p]};if(tool==='pen')drawStroke(ctx,cur)});
cv.addEventListener('pointermove',e=>{if(tool==='none'||(penSeen&&e.pointerType==='touch'))return;const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
 if(tool==='laser'){const p=pos(e);trail.push([p[0],p[1],performance.now()]);return}
 if(!e.buttons)return;
 for(const ev of (evs.length?evs:[e])){const p=pos(ev);if(erasing){eraseAt(p[0],p[1]);continue}if(!cur)continue;const l=cur.pts[cur.pts.length-1];if(Math.hypot(p[0]-l[0],p[1]-l[1])<1.2)continue;cur.pts.push(p);
  if(cur.t==='pen'){ctx.save();ctx.lineCap='round';ctx.strokeStyle=cur.c;seg(ctx,cur,cur.pts.length-1);ctx.restore()}}
 if(cur&&cur.t==='hl')redraw(cur)});
function up(){if(cur){list().push(cur);cur=null;redraw()}erasing=false}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('pointerleave',()=>{if(tool==='laser')trail.push(null)});
['touchstart','touchmove','touchend'].forEach(t=>cv.addEventListener(t,e=>{if(tool!=='none')e.stopPropagation()},{passive:true}));
cv.addEventListener('contextmenu',e=>{if(tool!=='none')e.preventDefault()});

(function loop(){const now=performance.now();lctx.clearRect(0,0,W,H);
 if(tool==='laser'){trail=trail.filter(p=>p&&now-p[2]<450);for(let i=1;i<trail.length;i++){const a=trail[i-1],b=trail[i],k=1-(now-b[2])/450;lctx.strokeStyle=`rgba(255,40,40,${.7*k})`;lctx.lineWidth=10*k+2;lctx.lineCap='round';lctx.beginPath();lctx.moveTo(a[0],a[1]);lctx.lineTo(b[0],b[1]);lctx.stroke()}
  const t=trail[trail.length-1];if(t){lctx.fillStyle='rgba(255,40,40,.25)';lctx.beginPath();lctx.arc(t[0],t[1],22,0,7);lctx.fill();lctx.fillStyle='#FF2A2A';lctx.beginPath();lctx.arc(t[0],t[1],9,0,7);lctx.fill()}}
 requestAnimationFrame(loop)})();

function setTool(t){tool=t;cv.className=t==='none'?'':'on'+(t==='erase'?' erase':'')+(t==='laser'?' laser':'');if(t!=='laser')trail=[];
 tb.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===t))}
function setColor(c){color=c;tb.querySelectorAll('.sw').forEach(b=>b.classList.toggle('on',b.dataset.c===c));if(tool==='none'||tool==='erase'||tool==='laser')setTool('pen')}
function setSize(i){sizeI=i;tb.querySelectorAll('.sz').forEach(b=>b.classList.toggle('on',+b.dataset.s===i))}
function openTools(open){tb.hidden=!open;if(open){if(tool==='none')setTool('pen')}else{setTool('none');if(!board.hidden)toggleBoard()}if(dbtn)dbtn.classList.toggle('on',open)}
function toggleBoard(){board.hidden=!board.hidden;tb.querySelector('[data-a="board"]').classList.toggle('on',!board.hidden);if(!board.hidden&&tool==='none')setTool('pen');redraw()}
function undo(){const L=list();if(L.length)L.pop();else if(backup[key()]){store[key()]=backup[key()];delete backup[key()]}redraw()}
function clearAll(){const L=list();if(!L.length)return;backup[key()]=L.slice();store[key()]=[];redraw()}
tb.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.t)setTool(b.dataset.t);else if(b.dataset.c)setColor(b.dataset.c);else if(b.dataset.s)setSize(+b.dataset.s);
 else if(b.dataset.a==='undo')undo();else if(b.dataset.a==='clear')clearAll();else if(b.dataset.a==='board')toggleBoard();else if(b.dataset.a==='close')openTools(false)});

let dbtn=null;
if(bar){dbtn=document.createElement('button');dbtn.id='drawB';dbtn.innerHTML='✏️ '+(window.t?window.t('قلم / سبورة','Pen / board'):'قلم / سبورة');dbtn.title='أدوات الكتابة (D)';
 dbtn.onclick=()=>openTools(tb.hidden);const ref=document.getElementById('notesB');bar.insertBefore(dbtn,ref||null);
 const st=document.createElement('style');st.textContent='#drawB.on{background:#C9A35A!important;color:#0B2431!important;border-color:#C9A35A!important}';document.head.appendChild(st)}
setColor(COLORS[0]);setTool('none');setSize(1);

let last=idx();
new MutationObserver(()=>{const i=idx();if(i!==last){last=i;if(!board.hidden){board.hidden=true;tb.querySelector('[data-a="board"]').classList.remove('on')}redraw()}}).observe(stage,{subtree:true,attributes:true,attributeFilter:['class']});

document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;const k=e.key.toLowerCase();
 if((e.ctrlKey||e.metaKey)&&k==='z'){if(!tb.hidden){e.preventDefault();undo()}return}
 if(e.ctrlKey||e.metaKey||e.altKey)return;
 if(k==='d'){openTools(tb.hidden);return}
 if(tb.hidden&&!['p','h','w','l'].includes(k))return;
 if(k==='p'){openTools(true);setTool('pen')}else if(k==='h'){openTools(true);setTool('hl')}else if(k==='e'&&!tb.hidden)setTool('erase')
 else if(k==='l'){openTools(true);setTool('laser')}else if(k==='v'||k==='escape')setTool('none');else if(k==='w'){openTools(true);toggleBoard()}});
})();
</script>
