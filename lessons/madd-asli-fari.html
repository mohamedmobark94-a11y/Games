<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>المد الأصلي والفرعي · Original and Secondary Madd</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@600;700&family=Fredoka:wght@500;600;700&family=Inter:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="../assets/deck/deck.css">
</head>
<body>
<script>
/* Qur'an text: al-Maktaba al-Shamela (Hafs, إملائي) — 110:1, 108:1, 103:3, 102:2–3, 1:2, 1:7, 69:1. Audio: Husary via everyayah.com. */
const A = (ar, en) => ({ar, en});
window.DECK = {
  title: A('المد الأصلي والمد الفرعي', 'Original and Secondary Madd'), theme: 'th-night', lang: 'en', mascot: 'owl_3d.png',
  voice: 'lessons/madd-asli-fari/s',
  slides: [
  {kick: A('تجويد · المدود ٢', 'Tajweed · Madd 2'), title: A('أيهما أطول؟', 'Which one is longer?'), min: 3,
   guide: A('اسمع المعلم يقرأ «جَاءَ» بطريقتين. أيهما الصحيح؟', 'Listen: the teacher reads «جَاءَ» in two ways. Which one is right?'),
   note: 'اقرأ «جَاءَ» مرة بحركتين (خطأ) ومرة بأربع أو خمس (صح). لا تذكر السبب الآن؛ الطالب يكتشفه في المحطة ٥.', say: 'Listen carefully. Which one is right? The first or the second?',
   art: [{src: 'deciduous_tree_3d.png', x: 150, y: 0, w: 290, float: 1}, {src: 'glowing_star_3d.png', x: 30, y: 30, w: 90, float: 1}, {src: 'sparkles_3d.png', x: 470, y: 20, w: 70, float: 1}],
   blocks: [
    {t: 'ayah', text: 'إِذَا <b>جَاءَ</b> نَصْرُ اللَّهِ وَالْفَتْحُ', ref: A('النصر: ١ · الحصري', 'An-Nasr 110:1 · Husary'), s: 110, a: 1},
    {t: 'mcq', key: 'h0', q: A('الصحيح في «جَاءَ»:', 'The right way to read «جَاءَ»:'), opts: [A('قصير<small>حركتان</small>', 'Short<small>2 counts</small>'), A('أطول<small>٤ أو ٥ حركات</small>', 'Longer<small>4–5 counts</small>')], a: 1,
     why: A('صح! بعد الألف <b>سبب</b> يجعلنا نمد أكثر. اليوم نعرف ما هو.', 'Right! Something comes after the Alif that makes it longer. Today we find out what it is.')}]},

  {kick: A('مراجعة', 'Review'), title: A('حروف المد الثلاثة', 'The three Madd letters'), min: 2,
   guide: A('حروف المد ثلاثة تجمعها كلمة نُوحِيهَا.', 'Remember the three Madd letters with the word نُوحِيهَا.'),
   note: 'مراجعة سريعة. السؤال الثاني فخ: الواو بعد فتحة حرف لين لا مد.', say: 'Show me the Madd letter. Good job!',
   art: [{src: 'open_book_3d.png', x: 160, y: 10, w: 260, float: 1}, {src: 'light_bulb_3d.png', x: 440, y: 0, w: 100, float: 1}],
   blocks: [
    {t: 'cards', items: [{ar: 'قَ<b>ا</b>لَ', p: A('ألف قبلها فتحة', 'Alif after Fatha'), c: '#3D8FD1'}, {ar: 'يَقُ<b>و</b>لُ', p: A('واو قبلها ضمة', 'Waw after Damma'), c: '#3D8FD1'}, {ar: 'قِ<b>ي</b>لَ', p: A('ياء قبلها كسرة', 'Yaa after Kasra'), c: '#3D8FD1'}]},
    {t: 'mcq', key: 'r1', q: A('الواو في <span class="ar">سَوْفَ</span> حرف مد؟', 'Is the Waw in <span class="ar">سَوْفَ</span> a Madd letter?'), opts: [A('نعم', 'Yes'), A('لا', 'No')], a: 1,
     why: A('لا. قبلها فتحة، فهي حرف <b>لين</b>.', 'No. Fatha comes before it, so it is a <b>Leen</b> letter.')}]},

  {kick: A('الجذر', 'The root'), title: A('المد الأصلي', 'Original Madd'), min: 4,
   guide: A('المد الأصلي هو حرف المد بنفسه، بلا سبب بعده. اسمه أيضًا المد الطبيعي، ونمده حركتين.', 'Original Madd is the Madd letter by itself, with no cause after it. It is also called Natural Madd: 2 counts.'),
   note: 'سُمّي أصليًا لأن الحرف لا يقوم إلا به: لو حذفناه ضاع حرف المد («الْمَقَبِرَ» خطأ). اطلب منه أن يعدّ بأصابعه.', say: 'Listen carefully. Repeat after me. Now read alone.',
   art: [{src: 'seedling_3d.png', x: 170, y: 0, w: 250, float: 1}, {src: 'hourglass_not_done_3d.png', x: 40, y: 140, w: 100, float: 1}],
   blocks: [
    {t: 'ayah', text: 'حَتَّى زُرْتُمُ <b>الْمَقَابِرَ</b>', ref: A('التكاثر: ٢ — من حفظك!', 'At-Takathur 102:2 — you memorised it!'), s: 102, a: 2},
    {t: 'count', n: 2, label: A('مُدّ ألف «الْمَقَابِرَ» حركتين مع النقاط', 'Stretch the Alif in «الْمَقَابِرَ» for 2 counts')},
    {t: 'mcq', key: 'a1', q: A('لماذا اسمه «أصلي»؟', 'Why is it called “original”?'), opts: [A('لأن الحرف لا يُنطق صحيحًا بدونه', 'Without it the letter is wrong'), A('لأنه أطول مد', 'It is the longest Madd')], a: 0,
     why: A('صح! بدونه يضيع حرف المد نفسه.', 'Right! Without it the Madd letter itself is lost.')}]},

  {kick: A('الفروع', 'The branches'), title: A('المد الفرعي', 'Secondary Madd'), min: 4,
   guide: A('المد الفرعي زيادة على الأصلي بسبب: همزة أو سكون. مثل الشجرة: جذر وفرعان.', 'Secondary Madd is extra length because of a cause: Hamza or Sukoon. Like a tree: one root, two branches.'),
   note: 'ارسم الشجرة على السبورة (W) أو استخدم الرسمة. اقلب البطاقات واحدة واحدة.', say: 'Look. This is the root. These are the branches.',
   art: [{src: 'puzzle_piece_3d.png', x: 200, y: 20, w: 220, float: 1}, {src: 'sparkles_3d.png', x: 440, y: 0, w: 80, float: 1}],
   blocks: [
    {t: 'tree'},
    {t: 'flip', items: [{f: A('أصل', 'Asl · root'), b: A('ما يُبنى عليه غيره', 'what other things are built on')}, {f: A('فرع', 'Far‘ · branch'), b: A('ما يخرج من الأصل ويزيد عليه', 'grows from the root and adds to it')}, {f: A('السبب', 'The cause'), b: A('همزة أو سكون بعد حرف المد', 'Hamza or Sukoon after the Madd letter')}]}]},

  {kick: A('السبب ١', 'Cause 1'), title: A('الهمزة', 'Hamza'), min: 5,
   guide: A('همزة بعد حرف المد تجعلنا نمد أكثر: في نفس الكلمة أو في الكلمة التالية.', 'A Hamza after the Madd letter makes it longer. It can be in the same word or in the next word.'),
   note: 'لا تفصّل المتصل والمنفصل الآن (درس الحصة القادمة). البدل: همزة قبل حرف المد مثل «آمَنُوا» (العصر ٣) يُذكر فقط.', say: 'Find the Hamza. Is it after the Madd letter?',
   art: [{src: 'rocket_3d.png', x: 180, y: 0, w: 250, float: 1}, {src: 'shooting_star_3d.png', x: 40, y: 40, w: 100, float: 1}],
   blocks: [
    {t: 'cards', items: [{h: A('نفس الكلمة', 'Same word'), ar: 'جَ<b>اءَ</b>', s: 110, a: 1, p: A('النصر: ١', 'An-Nasr 110:1'), c: '#E8485F'}, {h: A('الكلمة التالية', 'Next word'), ar: 'إِنَّ<b>ا أَ</b>عْطَيْنَاكَ', s: 108, a: 1, p: A('الكوثر: ١', 'Al-Kawthar 108:1'), c: '#E8485F'}]},
    {t: 'mcq', key: 'h1', q: A('في «إِنَّا أَعْطَيْنَاكَ» أين الهمزة؟', 'In «إِنَّا أَعْطَيْنَاكَ», where is the Hamza?'), opts: [A('في نفس كلمة «إِنَّا»', 'In the same word «إِنَّا»'), A('في أول الكلمة التالية', 'At the start of the next word')], a: 1,
     why: A('الألف في آخر «إِنَّا» والهمزة في أول «أَعْطَيْنَاكَ».', 'The Alif ends «إِنَّا»; the Hamza starts «أَعْطَيْنَاكَ».')}]},

  {kick: A('السبب ٢', 'Cause 2'), title: A('السكون', 'Sukoon'), min: 5,
   guide: A('سكون بعد حرف المد يجعلنا نمد أكثر: ثابت دائمًا، أو عارض عند الوقف.', 'A Sukoon after the Madd letter makes it longer: permanent, or temporary when we stop.'),
   note: 'الشدة = حرفان أولهما ساكن، لذلك في «الضَّالِّينَ» بعد الألف سكون ثابت. في «تَعْلَمُونَ» الوقف يجعل النون ساكنة. اطلب منه الوقف على آيات التكاثر.', say: 'Stop here. Read the end again. Good!',
   art: [{src: 'crescent_moon_3d.png', x: 190, y: 0, w: 230, float: 1}, {src: 'star_3d.png', x: 60, y: 60, w: 80, float: 1}],
   blocks: [
    {t: 'cards', n: 2, items: [{h: A('ثابت (أو شدة)', 'Permanent (or Shadda)'), ar: 'الضَّ<b>ا</b>لِّينَ', s: 1, a: 7, p: A('الفاتحة: ٧', 'Al-Fatihah 1:7'), c: '#B65BD6'}, {h: A('عارض عند الوقف', 'Temporary: when stopping'), ar: 'تَعْلَمُ<b>و</b>نَ', s: 102, a: 3, p: A('التكاثر: ٣ — قف عليها', 'At-Takathur 102:3 — stop on it'), c: '#B65BD6'}]},
    {t: 'mcq', key: 's1', q: A('لماذا نمد ألف <span class="ar">الْحَاقَّةُ</span> (الحاقة ١) طويلًا؟', 'Why is the Alif in <span class="ar">الْحَاقَّةُ</span> (69:1) long?'), opts: [A('بعدها همزة', 'A Hamza after it'), A('بعدها شدة: سكون ثابت', 'A Shadda after it: permanent Sukoon')], a: 1,
     why: A('القاف مشددة: أولها ساكن.', 'The Qaf has Shadda: its first part is sakin.')}]},

  {kick: A('لعبة', 'Game'), title: A('مُدّ بالضبط!', 'Stretch it right!'), min: 3,
   guide: A('اضغط على الزر باستمرار وأنت تقرأ، وارفع إصبعك بعد ٤ أو ٥ حركات.', 'Press and hold the button while you read. Let go after 4 or 5 counts.'),
   note: 'لعبة الإحساس بطول المد: المعلم يقرأ والطالب يضغط، ثم يتبادلان. السبب هنا همزة بعد الألف.', say: 'Hold, and read with me. Stop at four or five.',
   art: [{src: 'bullseye_3d.png', x: 180, y: 0, w: 240, float: 1}, {src: 'hourglass_not_done_3d.png', x: 440, y: 40, w: 90, float: 1}],
   blocks: [{t: 'hold', key: 'g0', word: 'جَاءَ', lo: 4, hi: 5, label: A('«جَاءَ»: فرعي بسبب الهمزة', '«جَاءَ»: Secondary, because of Hamza')}]},

  {kick: A('لعبة', 'Game'), title: A('لعبة الشجرة', 'The tree game'), min: 3,
   guide: A('اختر الكلمة، ثم اضغط على الغصن الصحيح.', 'Pick a word, then tap the right branch.'),
   note: 'إذا أخطأ اسأله: «بعد حرف المد: همزة؟ سكون؟ لا شيء؟».', say: 'What comes after the Madd letter? Hamza? Sukoon? Nothing?',
   art: [{src: 'deciduous_tree_3d.png', x: 170, y: 0, w: 250, float: 1}, {src: 'gem_stone_3d.png', x: 450, y: 40, w: 80, float: 1}],
   blocks: [{t: 'sort', key: 'g1', bins: [{id: 'a', label: A('أصلي', 'Original'), c: '#5BB6F5'}, {id: 'h', label: A('فرعي: همزة', 'Secondary: Hamza'), c: '#FF7A8A'}, {id: 's', label: A('فرعي: سكون', 'Secondary: Sukoon'), c: '#D68BEF'}],
    items: [{w: 'قَالَ', bin: 'a'}, {w: 'يَقُولُ', bin: 'a'}, {w: 'الْمَقَابِرَ', bin: 'a'}, {w: 'جَاءَ', bin: 'h'}, {w: 'إِنَّا أَعْطَيْنَاكَ', bin: 'h'}, {w: 'مَاءٌ', bin: 'h'}, {w: 'الضَّالِّينَ', bin: 's'}, {w: 'الْحَاقَّةُ', bin: 's'}, {w: 'تَعْلَمُونْ', bin: 's'}]}]},

  {kick: A('اختبار', 'Quiz'), title: A('الاختبار النهائي', 'Final quiz'), min: 3,
   guide: A('خمسة أسئلة. الإجابة الصحيحة من أول مرة = نجمة!', 'Five questions. Right the first time = a star!'),
   note: 'دع الطالب يجيب وحده؛ لا تساعده إلا بعد الخطأ الأول.', say: 'Read the question. Take your time.',
   art: [{src: 'thinking_face_3d.png', x: 180, y: 0, w: 240, float: 1}, {src: 'hundred_points_3d.png', x: 440, y: 30, w: 100, float: 1}],
   blocks: [{t: 'quiz', key: 'q', qs: [
    {q: A('المد الأصلي نمده:', 'Original Madd is stretched:'), opts: [A('حركتين', '2 counts'), A('أربع', '4 counts'), A('ست', '6 counts')], a: 0, why: A('حركتان دائمًا.', 'Always 2 counts.')},
    {q: A('سببا المد الفرعي:', 'The two causes of Secondary Madd:'), opts: [A('الهمزة والسكون', 'Hamza and Sukoon'), A('الضمة والكسرة', 'Damma and Kasra')], a: 0, why: A('الهمزة والسكون فقط.', 'Only Hamza and Sukoon.')},
    {q: A('<span class="ar">الْمَقَابِرَ</span>: الألف فيها مد', '<span class="ar">الْمَقَابِرَ</span>: the Alif is'), opts: [A('أصلي', 'Original'), A('فرعي: همزة', 'Secondary: Hamza'), A('فرعي: سكون', 'Secondary: Sukoon')], a: 0, why: A('لا همزة ولا سكون بعدها.', 'No Hamza and no Sukoon after it.')},
    {q: A('<span class="ar">جَاءَ</span>: الألف فيها مد', '<span class="ar">جَاءَ</span>: the Alif is'), opts: [A('أصلي', 'Original'), A('فرعي: همزة', 'Secondary: Hamza'), A('فرعي: سكون', 'Secondary: Sukoon')], a: 1, why: A('بعد الألف همزة.', 'A Hamza comes after the Alif.')},
    {q: A('<span class="ar">الضَّالِّينَ</span>: سبب المد', '<span class="ar">الضَّالِّينَ</span>: the cause is'), opts: [A('همزة', 'Hamza'), A('سكون (شدة)', 'Sukoon (Shadda)'), A('لا سبب', 'No cause')], a: 1, why: A('اللام مشددة: أولها ساكن.', 'The Lam has Shadda: its first part is sakin.')}]}]},

  {kick: A('أحسنت', 'Well done'), title: A('نجومك والواجب', 'Your stars and homework'), min: 0,
   guide: A('ما شاء الله! هذه نجومك. والواجب على الموقع من لينكك.', 'Mashaa Allah! Here are your stars. Your homework is on your homework link.'),
   note: 'بعد الحصة: ابعت لينك الواجب من المنصة، وحدّث «وقفنا عند» في الخطة.', say: 'Mashaa Allah! See you next class.',
   art: [{src: 'party_popper_3d.png', x: 170, y: 0, w: 250, float: 1}, {src: 'glowing_star_3d.png', x: 440, y: 30, w: 90, float: 1}],
   blocks: [{t: 'result',
    rows: [{t: A('أصلي (طبيعي)', 'Original (natural)'), when: A('لا شيء بعده · ٢', 'nothing after it · 2'), ex: 'الْمَقَابِرَ', c: '#5BB6F5'},
           {t: A('فرعي', 'Secondary'), when: A('همزة بعده', 'Hamza after it'), ex: 'جَاءَ', c: '#FF7A8A'},
           {t: A('فرعي', 'Secondary'), when: A('سكون بعده', 'Sukoon after it'), ex: 'الضَّالِّينَ', c: '#D68BEF'}],
    hw: [A('لعبة «أصلي أم فرعي؟» وسجّل قراءتك للتكاثر ١–٣ بالوقف.', 'Play «Original or Secondary?» and record At-Takathur 1–3, stopping at each ayah.'),
         A('استمع إلى التكاثر ٣–٨ ثلاث مرات ثم سمّعها.', 'Listen to At-Takathur 3–8 three times, then recite it.')],
    next: A('الحصة القادمة: المد المتصل والمد المنفصل.', 'Next class: Connected and Separated Madd.')}]}
  ]
};
</script>
