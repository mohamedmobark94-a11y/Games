<style>

}

  --star:#E8B53A; --star-ink:#F2C964; --note-bg:#2A2412;
  --good:#4CC384; --good-bg:#14301F; --good-ink:#8BE0B1; --bad:#E5685F; --bad-bg:#3A1A18; --bad-ink:#F4A39C;
  --m-tab:#7DB8EA; --m-wajib:#FF5C70; --m-jaiz:#FFA23D; --m-lazim:#FF8A8A; --m-badal:#E8C25A; color-scheme:dark}}

*{box-sizing:border-box}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-block:12px}

.flip{cursor:pointer;min-height:130px;display:flex;flex-direction:column;justify-content:center;text-align:center;user-select:none;transition:background .2s}

.widget{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-block:16px}

.widget .q .ar{font-family:var(--f-quran);font-size:1.5rem;font-weight:400}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button,.pool button,.order-pool button,.go{font:inherit;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:8px 16px;cursor:pointer;min-height:44px;transition:transform .1s,background .2s,border-color .2s}

.starpop{position:fixed;top:30%;left:50%;transform:translate(-50%,-50%);font-family:var(--f-display);font-size:2rem;color:var(--star-ink);background:var(--surface);border:2px solid var(--star);border-radius:999px;padding:6px 22px;pointer-events:none;animation:pop 1s ease forwards;z-index:9}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}25%{opacity:1;transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%)}}

#wbBoard .bt{position:absolute;top:calc(18px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);font:700 18px/1 var(--f-body);color:#86662A;background:#FBF3E1;border:1px solid #EBDDBB;border-radius:20px;padding:8px 16px;z-index:2;pointer-events:none;white-space:nowrap}

<script>
(function(){
const mcq=(key,q,opts,a,why,letters)=>`<div class="widget w-mcq" data-key="${key}" data-a="${a}"><div class="q">${q}</div><div class="opts">${opts.map(o=>`<button class="${letters?'letter':''}">${o}</button>`).join('')}</div><div class="why">${why}</div></div>`;
const count=(n,label)=>`<div class="widget w-count" data-n="${n}"><div class="q">${label}</div><div class="counter"><button class="go">ابدأ العدّ</button><div class="dots">${Array.from({length:n},(_,i)=>`<b>${'١٢٣٤٥٦'[i]}</b>`).join('')}</div></div></div>`;
const en=t=>` <span class="en">${t}</span>`;
const T=(c,t)=>`<span class="${c}">${t}</span>`;
const tab=t=>T('c-tab',t), waj=t=>T('c-wajib',t), jaz=t=>T('c-jaiz',t), laz=t=>T('c-lazim',t), bad=t=>T('c-badal',t);

window.LESSON={
title:'أحكام المد',
sub:'التجويد للمبتدئين · ترتيل القرآن | Tarteel Al-Quran',
guideSvg:'<svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="23" fill="var(--accent-wash)"/><path d="M12 33 L24 25 L36 33 M12 33 L24 41 L36 33" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round"/><path d="M24 25 V13 C20 11 15 11 12 12 V24 C15 23 20 23 24 25 C28 23 33 23 36 24 V12 C33 11 28 11 24 13" fill="var(--surface)" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/></svg>',
stages:[
{title:'هيا نبدأ الرحلة', min:3,
 guide:'السلام عليكم يا بطل! اليوم نتعلم <b>كيف نمدّ الصوت</b> في القرآن، ومتى يكون المدّ قصيرًا ومتى يكون طويلًا.'+en('Today we learn how to stretch the sound in the Quran.'),
 note:'ابدأ بقراءة كلمة «قَالَ» بصوت واضح، ثم اقرأها خطأً بدون مد «قَلَ» واسأل الطالب: أيهما صحيح؟',
 html:`
 <p class="big">استمع إلى المعلم وهو يقرأ:</p>
 <div class="quran">${'قَ'+tab('ا')+'لَ'}</div>
 ${mcq('m0','هل الصوت بعد حرف القاف قصير أم طويل؟'+en('Is the sound after Qaf short or long?'),['قصير','طويل'],1,'أحسنت! الصوت طويل، لأن بعد القاف حرف <b>ألف</b>. هذا هو المد.')}
 <h3>ماذا سأتعلم اليوم؟</h3>
 <ul class="clean">
  <li>معنى المد${en('What Madd means')}</li>
  <li>حروف المد الثلاثة${en('The 3 Madd letters')}</li>
  <li>المد الطبيعي: حركتان${en('Natural Madd: 2 counts')}</li>
  <li>الفرق بين المتصل والمنفصل${en('Connected vs separated Madd')}</li>
  <li>المد العارض والمد اللازم والبدل${en('Temporary, compulsory and Badal Madd')}</li>
 </ul>`},

{title:'ما هو المد؟', min:3,
 guide:'المد يعني أن <b>نُطيل الصوت</b>، مثل المطاط عندما نسحبه.'+en('Madd = making the sound longer, like stretching a rubber band.'),
 note:'اجعل الطالب يقبض أصابعه أو يبسطها مع كل حركة؛ هذا هو مقياس «الحركة» المعروف عند المعلمين.',
 html:`
 <div class="grid">
  <div class="card"><h4>المد في اللغة</h4><p>الزيادة.${en('Linguistic: increase.')}</p></div>
  <div class="card"><h4>المد في التجويد</h4><p>إطالة الصوت بحرف من حروف المد.${en('Tajweed: lengthening the sound with a Madd letter.')}</p></div>
 </div>
 <div class="widget"><div class="q">شاهد الصوت وهو يطول: «مَـــــــا»</div><div class="stretch" id="str"><i></i></div><button class="go" id="strB">اسحب الصوت</button></div>
 <h3>كيف نقيس طول المد؟</h3>
 <p>نقيسه بـ <b>الحركة</b>. الحركة = وقت قبض إصبع واحد أو بسطه.${en('One count (haraka) = the time to fold or open one finger.')}</p>
 ${count(2,'جرّب: مُدّ «مَا» حركتين مع النقاط')}`},

{title:'حروف المد الثلاثة', min:5,
 guide:'حروف المد ثلاثة فقط، وتجمعها كلمة جميلة من القرآن: <b>نُوحِيهَا</b>.'+en('There are only 3 Madd letters. Remember them with the word: نوحيها'),
 note:'نبّه على الفخ: الواو والياء الساكنتان بعد فتح (خَوْف، بَيْت) حرفا لين لا مد. السؤال الأخير يختبر هذا.',
 html:`
 <div class="quran">${'نُ'+tab('و')+'حِ'+tab('ي')+'هَ'+tab('ا')}<span class="ref">هود: ٤٩</span></div>
 <div class="grid">
  <div class="card"><h4 class="ex">ا</h4><p>الألف الساكنة، وقبلها <b>فتحة</b>: قَـ<b>ا</b>لَ${en('Alif with Fatha before it')}</p></div>
  <div class="card"><h4 class="ex">و</h4><p>الواو الساكنة، وقبلها <b>ضمة</b>: يَقُـ<b>و</b>لُ${en('Waw sakinah with Damma before it')}</p></div>
  <div class="card"><h4 class="ex">ي</h4><p>الياء الساكنة، وقبلها <b>كسرة</b>: قِـ<b>ي</b>لَ${en('Yaa sakinah with Kasra before it')}</p></div>
 </div>
 <h3>أين حرف المد؟ اضغط عليه</h3>
 ${mcq('m1','<span class="ar">قَالَ</span>',['قَ','ا','لَ'],1,'الألف حرف مد، وقبلها فتحة على القاف.',true)}
 ${mcq('m2','<span class="ar">يَقُولُ</span>',['يَ','قُ','و','لُ'],2,'الواو ساكنة وقبلها ضمة، فهي حرف مد.',true)}
 ${mcq('m3','<span class="ar">قِيلَ</span>',['قِ','ي','لَ'],1,'الياء ساكنة وقبلها كسرة، فهي حرف مد.',true)}
 ${mcq('m4','سؤال ذكي: الواو في كلمة <span class="ar">خَوْف</span> حرف مد؟'+en('Is the Waw in خوف a Madd letter?'),['صح','خطأ'],1,'خطأ! قبل الواو <b>فتحة</b> وليست ضمة، فهي حرف <b>لين</b> وليست حرف مد.')}`},

{title:'المد الطبيعي', min:4,
 guide:'إذا جاء حرف المد، ولم يأتِ بعده <b>همزة</b> ولا <b>سكون</b>، فهو مد طبيعي. نمده <b>حركتين</b> فقط.'+en('Madd letter + no Hamza and no Sukoon after it = Natural Madd, 2 counts.'),
 note:'سُمي طبيعيًا لأن صاحب الطبيعة السليمة لا يزيده ولا ينقصه. انتبه لخطأين شائعين عند الأعاجم: قصره (قَلَ) أو مطّه أكثر من حركتين.',
 html:`
 <div class="card type" style="--tc:var(--m-tab)"><span class="cnt">حركتان دائمًا</span><p>حرف مد + لا همزة بعده + لا سكون بعده</p></div>
 <div class="quran">${'مَ'+tab('ا')+'لِكِ يَوْمِ الدِّينِ'}<span class="ref">الفاتحة: ٤ — الألف في «مالك» مد طبيعي</span></div>
 <div class="grid">
  <div class="card ex" style="text-align:center">${'قَ'+tab('ا')+'لَ'}</div>
  <div class="card ex" style="text-align:center">${'يَقُ'+tab('و')+'لُ'}</div>
  <div class="card ex" style="text-align:center">${'نُ'+tab('و')+'حِ'+tab('ي')+'هَ'+tab('ا')}</div>
 </div>
 ${count(2,'اقرأ «قَالَ» ومُدّ حركتين مع النقاط')}
 ${mcq('m5','كم حركة نمد المد الطبيعي؟'+en('How many counts?'),['حركة واحدة','حركتان','ست حركات'],1,'حركتان، لا أكثر ولا أقل.')}`},

{title:'المد الفرعي: له سبب', min:2,
 guide:'أحيانًا يأتي بعد حرف المد <b>سبب</b> يجعلنا نمد أكثر. الأسباب اثنان فقط: <b>الهمزة</b> و<b>السكون</b>.'+en('Longer Madd has a cause: Hamza (ء) or Sukoon (ْ).'),
 note:'هذه الشجرة هي خريطة بقية الدرس؛ ارجع إليها بعد كل نوع.',
 html:`
 <div class="tree">
  <div class="row"><div class="card type" style="--tc:var(--m-tab)"><h4>المد الطبيعي</h4><p>لا سبب بعده · <span class="cnt">٢</span></p></div>
   <div class="card type" style="--tc:var(--accent)"><h4>المد الفرعي</h4><p>بعده سبب: همز أو سكون</p></div></div>
  <div class="row"><div class="cause">السبب: الهمزة ء</div><div class="cause">السبب: السكون ـْ</div></div>
  <div class="row">
   <div class="card type" style="--tc:var(--m-wajib)"><h4>المتصل</h4><p class="cnt">٤ أو ٥</p></div>
   <div class="card type" style="--tc:var(--m-jaiz)"><h4>المنفصل</h4><p class="cnt">٤ أو ٥</p></div>
   <div class="card type" style="--tc:var(--m-badal)"><h4>البدل</h4><p class="cnt">٢</p></div>
   <div class="card type" style="--tc:var(--m-jaiz)"><h4>العارض للسكون</h4><p class="cnt">٢ أو ٤ أو ٦</p></div>
   <div class="card type" style="--tc:var(--m-lazim)"><h4>اللازم</h4><p class="cnt">٦</p></div>
  </div>
 </div>`},

{title:'المد المتصل', min:5,
 guide:'حرف المد، وبعده <b>همزة</b> في <b>نفس الكلمة</b>. مثل صديقين متصلين في بيت واحد.'+en('Madd letter + Hamza in the SAME word.'),
 note:'المتصل واجب المد ٤ أو ٥ حركات لحفص من طريق الشاطبية. إذا وقفت على همزة في آخر الكلمة (السَّمَاءْ) جاز المد ٦.',
 html:`
 <div class="card type" style="--tc:var(--m-wajib)"><span class="cnt">٤ أو ٥ حركات · واجب</span><p>حرف مد + همزة في <b>كلمة واحدة</b></p></div>
 <div class="quran">إِذَا ${'جَ'+waj('ا')+'ءَ'} نَصْرُ اللَّهِ وَالْفَتْحُ<span class="ref">النصر: ١</span></div>
 <div class="grid">
  <div class="card ex" style="text-align:center">${'جَ'+waj('ا')+'ءَ'}</div>
  <div class="card ex" style="text-align:center">${'السَّمَ'+waj('ا')+'ءِ'}</div>
  <div class="card ex" style="text-align:center">${'السُّ'+waj('و')+'ءَ'}</div>
  <div class="card ex" style="text-align:center">${'سِ'+waj('ي')+'ءَ'}</div>
 </div>
 ${count(4,'اقرأ «جَاءَ» ومُدّ أربع حركات')}
 ${mcq('m6','أين المد المتصل؟'+en('Which one is connected Madd?'),['<span class="ar">قَالَ</span>','<span class="ar">جَاءَ</span>','<span class="ar">يَا أَيُّهَا</span>'],1,'«جَاءَ»: الألف وبعدها الهمزة في نفس الكلمة.')}`},

{title:'المد المنفصل', min:4,
 guide:'حرف المد في <b>آخر الكلمة</b>، والهمزة في <b>أول الكلمة التالية</b>. صديقان في بيتين منفصلين.'+en('Madd letter at the END of a word + Hamza at the START of the next word.'),
 note:'المنفصل جائز ٤ أو ٥ لحفص من الشاطبية، ويجوز قصره حركتين من طريق الطيبة. الزم طولًا واحدًا في التلاوة كلها. وإذا وقفت على الكلمة الأولى صار المد طبيعيًا.',
 html:`
 <div class="card type" style="--tc:var(--m-jaiz)"><span class="cnt">٤ أو ٥ حركات · جائز</span><p>حرف مد آخر الكلمة + همزة أول الكلمة التالية</p></div>
 <div class="quran">${'وَلَ'+jaz('ا')} أَنتُمْ عَابِدُونَ ${'مَ'+jaz('ا')} أَعْبُدُ<span class="ref">الكافرون: ٣</span></div>
 <div class="grid">
  <div class="card ex" style="text-align:center">${'يَ'+jaz('ا')} أَيُّهَا</div>
  <div class="card ex" style="text-align:center">${'إِنَّ'+jaz('ا')} أَعْطَيْنَاكَ</div>
  <div class="card ex" style="text-align:center">${'قُ'+jaz('و')+'ا'} أَنفُسَكُمْ</div>
  <div class="card ex" style="text-align:center">${'فِ'+jaz('ي')} أَنفُسِكُمْ</div>
 </div>
 <div class="grid">
  <div class="card"><h4>المتصل</h4><p>كلمة <b>واحدة</b>: جَاءَ</p></div>
  <div class="card"><h4>المنفصل</h4><p>كلمتان <b>اثنتان</b>: يَا أَيُّهَا</p></div>
 </div>
 ${mcq('m7','<span class="ar">إِنَّا أَعْطَيْنَاكَ الْكَوْثَرَ</span> — المد في «إنّا» نوعه:',['متصل','منفصل','طبيعي'],1,'منفصل: الألف آخر «إنّا»، والهمزة أول «أعطيناك».')}`},

{title:'المد العارض للسكون', min:3,
 guide:'عندما <b>نقف</b> على آخر الآية، يصبح الحرف الأخير ساكنًا. إذا كان قبله حرف مد، فهذا مد عارض للسكون.'+en('When we STOP at the end of a verse, the last letter gets Sukoon. Madd before it = Temporary Madd.'),
 note:'يجوز ٢ أو ٤ أو ٦، والأفضل للمبتدئ أن يختار طولًا واحدًا ويلتزمه في السورة كلها. في الوصل يرجع طبيعيًا.',
 html:`
 <div class="card type" style="--tc:var(--m-jaiz)"><span class="cnt">٢ أو ٤ أو ٦ حركات · عند الوقف فقط</span><p>حرف مد + حرف سكّنّاه بسبب الوقف</p></div>
 <div class="quran">الْحَمْدُ لِلَّهِ رَبِّ ${'الْعَالَمِ'+jaz('ي')+'نْ'}<span class="ref">الفاتحة: ٢ — عند الوقف</span></div>
 <div class="grid">
  <div class="card ex" style="text-align:center">${'الرَّحِ'+jaz('ي')+'مْ'}</div>
  <div class="card ex" style="text-align:center">${'الدِّ'+jaz('ي')+'نْ'}</div>
  <div class="card ex" style="text-align:center">${'نَسْتَعِ'+jaz('ي')+'نْ'}</div>
 </div>
 ${count(6,'قف على «نَسْتَعِينْ» ومُدّ ست حركات')}
 ${mcq('m8','إذا وصلنا «الرَّحْمَٰنِ الرَّحِيمِ» بما بعدها ولم نقف، المد في «الرحيم»:',['عارض للسكون','طبيعي'],1,'صحيح! لا يوجد وقف، فلا يوجد سكون، فيرجع المد طبيعيًا حركتين.')}`},

{title:'المد اللازم ومد البدل', min:3,
 guide:'<b>اللازم</b>: بعد حرف المد سكون <b>أصلي</b> لا يتغير، فنمده <b>ست حركات</b> دائمًا. و<b>البدل</b>: الهمزة <b>قبل</b> حرف المد، ونمده حركتين.'+en('Lazim: original Sukoon/Shadda after the Madd letter = always 6. Badal: Hamza BEFORE the Madd letter = 2.'),
 note:'من اللازم أيضًا: آلْآنَ (يونس ٥١ و٩١) والحروف المقطعة مثل «الم» (لامْ ميمْ ست حركات). سُمي البدل لأن أصله همزتان أُبدلت الثانية حرف مد: أَأْمَنوا ← آمَنوا.',
 html:`
 <div class="card type" style="--tc:var(--m-lazim)"><span class="cnt">٦ حركات · لزومًا</span><p>حرف مد + سكون أصلي أو شدة في نفس الكلمة</p></div>
 <div class="quran">غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا ${'الضَّ'+laz('ا')+'لِّينَ'}<span class="ref">الفاتحة: ٧</span></div>
 <div class="grid">
  <div class="card ex" style="text-align:center">${'الْحَ'+laz('ا')+'قَّةُ'}</div>
  <div class="card ex" style="text-align:center">${'الطَّ'+laz('ا')+'مَّةُ'}</div>
  <div class="card ex" style="text-align:center">الٓمٓ<div class="hint" style="font-family:var(--f-body);font-size:.85rem;color:var(--muted)">أَلِفْ لَآمْ مِيٓمْ</div></div>
 </div>
 ${count(6,'اقرأ «الضَّالِّينَ» ومُدّ الألف ست حركات')}
 <h3>مد البدل</h3>
 <div class="card type" style="--tc:var(--m-badal)"><span class="cnt">حركتان</span><p>همزة <b>ثم</b> حرف مد</p></div>
 <div class="grid">
  <div class="card ex" style="text-align:center">${bad('آ')+'مَنُوا'}</div>
  <div class="card ex" style="text-align:center">${'إِ'+bad('ي')+'مَانًا'}</div>
  <div class="card ex" style="text-align:center">${'أُ'+bad('و')+'تُوا'}</div>
 </div>`},

{title:'لعبة التصنيف', min:4,
 guide:'اضغط على الكلمة، ثم اضغط على الصندوق الصحيح. انتبه: الكلمات هنا بدون ألوان!'+en('Tap a word, then tap the right box.'),
 note:'اطلب من الطالب أن يقول السبب بصوت عالٍ قبل أن يضغط: «فيه همزة؟ في نفس الكلمة؟ فيه سكون؟».',
 html:`
 <div class="widget w-sort" data-key="m9">
  <div class="bins">
   <div class="bin" data-bin="t" style="--bin-c:var(--m-tab)"><b>طبيعي</b></div>
   <div class="bin" data-bin="w" style="--bin-c:var(--m-wajib)"><b>متصل</b></div>
   <div class="bin" data-bin="j" style="--bin-c:var(--m-jaiz)"><b>منفصل</b></div>
   <div class="bin" data-bin="a" style="--bin-c:var(--m-jaiz)"><b>عارض للسكون</b></div>
   <div class="bin" data-bin="l" style="--bin-c:var(--m-lazim)"><b>لازم</b></div>
  </div>
  <div class="pool">
   <button data-bin="t">قَالَ</button><button data-bin="t">يَقُولُ</button><button data-bin="t">قِيلَ</button>
   <button data-bin="w">جَاءَ</button><button data-bin="w">السَّمَاءِ</button><button data-bin="w">السُّوءَ</button>
   <button data-bin="j">يَا أَيُّهَا</button><button data-bin="j">قُوا أَنفُسَكُمْ</button><button data-bin="j">فِي أَنفُسِكُمْ</button>
   <button data-bin="a">الْعَالَمِينْ (وقف)</button><button data-bin="a">نَسْتَعِينْ (وقف)</button>
   <button data-bin="l">الضَّالِّينَ</button><button data-bin="l">الْحَاقَّةُ</button>
  </div>
  <div class="done-msg">ممتاز! صنّفت كل الكلمات.</div>
 </div>`},

{title:'الاختبار النهائي', min:4,
 guide:'ستة أسئلة. إذا أجبت صحيحًا من أول مرة تأخذ نجمة!'+en('Answer right the first time to get a star.'),
 note:'',
 html:`
 ${mcq('q1','١. حروف المد هي:',['ب ت ث','ا و ي','م ن ل'],1,'الألف والواو والياء، وتجمعها كلمة «نُوحِيهَا».')}
 ${mcq('q2','٢. سبب المد الفرعي:',['الهمزة أو السكون','الفتحة أو الكسرة','الشدة فقط'],0,'السبب همز أو سكون.')}
 ${mcq('q3','٣. <span class="ar">السَّمَاءِ</span> فيها مد:',['منفصل','متصل','بدل'],1,'الألف والهمزة في كلمة واحدة: متصل، ٤ أو ٥.')}
 ${mcq('q4','٤. <span class="ar">قُوا أَنفُسَكُمْ</span> فيها مد:',['منفصل','لازم','طبيعي'],0,'الواو آخر «قوا» والهمزة أول «أنفسكم»: منفصل.')}
 ${mcq('q5','٥. <span class="ar">الْحَاقَّةُ</span> نمد الألف:',['حركتين','أربع حركات','ست حركات'],2,'بعد الألف شدة أصلية: مد لازم، ست حركات دائمًا.')}
 ${mcq('q6','٦. <span class="ar">آمَنُوا</span> الهمزة قبل حرف المد، فهو:',['مد بدل، حركتان','مد متصل، ٤ أو ٥','مد عارض'],0,'الهمزة قبل حرف المد: مد بدل، حركتان.')}`},

{title:'نتيجتك والواجب', min:0,
 html:`
 <div class="result"><div>نجومك</div><div class="score" id="res"></div><p id="resMsg" style="margin-inline:auto"></p></div>
 <h3>الخلاصة</h3>
 <div class="tw"><table class="sum"><thead><tr><th>النوع</th><th>متى؟</th><th>الطول</th><th>مثال</th></tr></thead><tbody>
  <tr><td class="c-tab"><b>طبيعي</b></td><td>لا همز ولا سكون بعده</td><td>٢</td><td class="ex" style="font-size:1.3rem">قَالَ</td></tr>
  <tr><td class="c-wajib"><b>متصل</b></td><td>همزة بعده في نفس الكلمة</td><td>٤–٥</td><td class="ex" style="font-size:1.3rem">جَاءَ</td></tr>
  <tr><td class="c-jaiz"><b>منفصل</b></td><td>همزة في أول الكلمة التالية</td><td>٤–٥</td><td class="ex" style="font-size:1.3rem">يَا أَيُّهَا</td></tr>
  <tr><td class="c-badal"><b>بدل</b></td><td>همزة قبله</td><td>٢</td><td class="ex" style="font-size:1.3rem">آمَنُوا</td></tr>
  <tr><td class="c-jaiz"><b>عارض للسكون</b></td><td>سكون بسبب الوقف</td><td>٢ / ٤ / ٦</td><td class="ex" style="font-size:1.3rem">نَسْتَعِينْ</td></tr>
  <tr><td class="c-lazim"><b>لازم</b></td><td>سكون أصلي أو شدة بعده</td><td>٦</td><td class="ex" style="font-size:1.3rem">الضَّالِّينَ</td></tr>
 </tbody></table></div>
 <h3>الواجب</h3>
 <ul class="clean">
  <li>اقرأ سورة <b>الفاتحة</b> واكتب: ٣ أمثلة مد طبيعي، ومثال مد عارض للسكون، ومثال مد لازم.${en('Read Al-Fatiha: find 3 natural, 1 temporary, 1 compulsory Madd.')}</li>
  <li>اقرأ سورة <b>الكافرون</b> وعُدّ كم مدًا منفصلًا فيها.${en('Read Al-Kafirun: count the separated Madd.')}</li>
  <li>سجّل تلاوتك للفاتحة وأرسلها للمعلم.${en('Record your Fatiha and send it to your teacher.')}</li>
 </ul>`,
 onEnter:({earned,total,ar,$})=>{
  $('#res').textContent=ar(earned)+' / '+ar(total);
  const r=earned/total;
  $('#resMsg').textContent=r>=.85?'ما شاء الله! أنت بطل التجويد اليوم.':r>=.6?'أحسنت! راجع الأنواع التي أخطأت فيها مرة أخرى.':'بداية طيبة. نراجع الدرس معًا في الحصة القادمة إن شاء الله.';
 }}
],
init:({$$})=>{
  const s=document.getElementById('str'), b=document.getElementById('strB');
  if(b)b.onclick=()=>{s.classList.remove('go');void s.offsetWidth;s.classList.add('go')};
  $$('.w-count').forEach(w=>{
    const dots=$$('.dots b',w), btn=w.querySelector('.go'); let t=[];
    btn.onclick=()=>{t.forEach(clearTimeout);t=[];dots.forEach(d=>d.classList.remove('on'));
      dots.forEach((d,i)=>t.push(setTimeout(()=>d.classList.add('on'),700*(i+1))));};
  });
}
};
/* ---------- English version of every station (same widgets, answers and keys as the Arabic one) ---------- */
const countE=(n,label)=>`<div class="widget w-count" data-n="${n}"><div class="q">${label}</div><div class="counter"><button class="go">Start counting</button><div class="dots">${Array.from({length:n},(_,i)=>`<b>${i+1}</b>`).join('')}</div></div></div>`;
const ref=t=>`<span class="ref">${t}</span>`;
const LESSON_EN=[
{title:'Let’s begin the journey', 
 guide:'Peace be upon you, champion! Today we learn <b>how to stretch the sound</b> in the Qur’an — and when the stretch is short and when it is long.',
 note:'Start by reading the word “قَالَ” clearly, then read it wrongly without the stretch, “قَلَ”, and ask the student which one is correct.',
 html:`
 <p class="big">Listen to the teacher reading:</p>
 <div class="quran">${'قَ'+tab('ا')+'لَ'}</div>
 ${mcq('m0','Is the sound after the letter Qaf short or long?',['Short','Long'],1,'Well done! The sound is long, because after the Qaf comes the letter <b>alif</b>. This is Madd.')}
 <h3>What will I learn today?</h3>
 <ul class="clean">
  <li>What Madd means</li>
  <li>The three Madd letters</li>
  <li>Natural Madd: two counts</li>
  <li>Connected versus separated Madd</li>
  <li>Temporary, compulsory and Badal Madd</li>
 </ul>`},

{title:'What is Madd?',
 guide:'Madd means that we <b>lengthen the sound</b>, like pulling on a rubber band.',
 note:'Have the student close and open their fingers with each count; this is the traditional way teachers measure a “haraka” (count).',
 html:`
 <div class="grid">
  <div class="card"><h4>Madd in the language</h4><p>Increase.</p></div>
  <div class="card"><h4>Madd in Tajweed</h4><p>Lengthening the sound with one of the Madd letters.</p></div>
 </div>
 <div class="widget"><div class="q">Watch the sound stretch: <span class="ar">مَـــــــا</span></div><div class="stretch" id="str"><i></i></div><button class="go" id="strB">Stretch the sound</button></div>
 <h3>How do we measure the length of Madd?</h3>
 <p>We measure it in <b>counts (harakat)</b>. One count = the time it takes to close or open one finger.</p>
 ${countE(2,'Try it: stretch <span class="ar">مَا</span> for two counts, following the dots')}`},

{title:'The three Madd letters',
 guide:'There are only three Madd letters, and one beautiful word from the Qur’an collects them: <b>نُوحِيهَا</b> (nūḥīhā).',
 note:'Warn about the trap: a sākin waw or yā’ after a fatḥa (خَوْف، بَيْت) are letters of softness (līn), not Madd. The last question tests this.',
 html:`
 <div class="quran">${'نُ'+tab('و')+'حِ'+tab('ي')+'هَ'+tab('ا')}${ref('Hud 11:49')}</div>
 <div class="grid">
  <div class="card"><h4 class="ex">ا</h4><p>A silent <b>alif</b> with a <b>fatha</b> before it: قَـ<b>ا</b>لَ</p></div>
  <div class="card"><h4 class="ex">و</h4><p>A silent <b>waw</b> with a <b>damma</b> before it: يَقُـ<b>و</b>لُ</p></div>
  <div class="card"><h4 class="ex">ي</h4><p>A silent <b>yā’</b> with a <b>kasra</b> before it: قِـ<b>ي</b>لَ</p></div>
 </div>
 <h3>Where is the Madd letter? Tap it</h3>
 ${mcq('m1','<span class="ar">قَالَ</span>',['قَ','ا','لَ'],1,'The alif is the Madd letter, with a fatha on the Qaf before it.',true)}
 ${mcq('m2','<span class="ar">يَقُولُ</span>',['يَ','قُ','و','لُ'],2,'The waw is silent and has a damma before it, so it is a Madd letter.',true)}
 ${mcq('m3','<span class="ar">قِيلَ</span>',['قِ','ي','لَ'],1,'The yā’ is silent and has a kasra before it, so it is a Madd letter.',true)}
 ${mcq('m4','A tricky one: is the waw in <span class="ar">خَوْف</span> a Madd letter?',['Yes','No'],1,'No! Before the waw there is a <b>fatha</b>, not a damma, so it is a letter of <b>softness (līn)</b>, not a Madd letter.')}`},

{title:'Natural Madd',
 guide:'When a Madd letter comes and is followed by no <b>hamza</b> and no <b>sukoon</b>, it is Natural Madd. We stretch it only <b>two counts</b>.',
 note:'It is called “natural” because a person with a sound natural way of speaking neither adds to it nor cuts it short. Watch for two common mistakes among non-Arabic speakers: cutting it short (قَلَ) or stretching it beyond two counts.',
 html:`
 <div class="card type" style="--tc:var(--m-tab)"><span class="cnt">Always two counts</span><p>A Madd letter + no hamza after it + no sukoon after it</p></div>
 <div class="quran">${'مَ'+tab('ا')+'لِكِ يَوْمِ الدِّينِ'}${ref('Al-Fatihah 1:4 — the alif in “māliki” is Natural Madd')}</div>
 <div class="grid">
  <div class="card ex" style="text-align:center">${'قَ'+tab('ا')+'لَ'}</div>
  <div class="card ex" style="text-align:center">${'يَقُ'+tab('و')+'لُ'}</div>
  <div class="card ex" style="text-align:center">${'نُ'+tab('و')+'حِ'+tab('ي')+'هَ'+tab('ا')}</div>
 </div>
 ${countE(2,'Read <span class="ar">قَالَ</span> and stretch it two counts, following the dots')}
 ${mcq('m5','How many counts do we stretch Natural Madd?',['One count','Two counts','Six counts'],1,'Two counts — no more, no less.')}`},

{title:'Secondary Madd: it has a cause',
 guide:'Sometimes a <b>cause</b> comes after the Madd letter that makes us stretch longer. There are only two causes: the <b>hamza</b> and the <b>sukoon</b>.',
 note:'This tree is the map of the rest of the lesson; come back to it after each type.',
 html:`
 <div class="tree">
  <div class="row"><div class="card type" style="--tc:var(--m-tab)"><h4>Natural Madd</h4><p>No cause after it · <span class="cnt">2</span></p></div>
   <div class="card type" style="--tc:var(--accent)"><h4>Secondary Madd</h4><p>A cause after it: hamza or sukoon</p></div></div>
  <div class="row"><div class="cause">Cause: the hamza ء</div><div class="cause">Cause: the sukoon ـْ</div></div>
  <div class="row">
   <div class="card type" style="--tc:var(--m-wajib)"><h4>Connected (Muttasil)</h4><p class="cnt">4 or 5</p></div>
   <div class="card type" style="--tc:var(--m-jaiz)"><h4>Separated (Munfasil)</h4><p class="cnt">4 or 5</p></div>
   <div class="card type" style="--tc:var(--m-badal)"><h4>Badal</h4><p class="cnt">2</p></div>
   <div class="card type" style="--tc:var(--m-jaiz)"><h4>Temporary (‘Arid lis-Sukun)</h4><p class="cnt">2, 4 or 6</p></div>
   <div class="card type" style="--tc:var(--m-lazim)"><h4>Compulsory (Lazim)</h4><p class="cnt">6</p></div>
  </div>
 </div>`},

{title:'Connected Madd (Muttasil)',
 guide:'A Madd letter followed by a <b>hamza</b> in the <b>same word</b> — like two friends living in the same house.',
 note:'Connected Madd is obligatory: 4 or 5 counts for Hafs via ash-Shatibiyyah. If you stop on a hamza at the end of a word (as-samā’), 6 counts are allowed.',
 html:`
 <div class="card type" style="--tc:var(--m-wajib)"><span class="cnt">4 or 5 counts · obligatory</span><p>A Madd letter + a hamza in <b>one word</b></p></div>
 <div class="quran">إِذَا ${'جَ'+waj('ا')+'ءَ'} نَصْرُ اللَّهِ وَالْفَتْحُ${ref('An-Nasr 110:1')}</div>
 <div class="grid">
  <div class="card ex" style="text-align:center">${'جَ'+waj('ا')+'ءَ'}</div>
  <div class="card ex" style="text-align:center">${'السَّمَ'+waj('ا')+'ءِ'}</div>
  <div class="card ex" style="text-align:center">${'السُّ'+waj('و')+'ءَ'}</div>
  <div class="card ex" style="text-align:center">${'سِ'+waj('ي')+'ءَ'}</div>
 </div>
 ${countE(4,'Read <span class="ar">جَاءَ</span> and stretch it four counts')}
 ${mcq('m6','Which one is Connected Madd?',['<span class="ar">قَالَ</span>','<span class="ar">جَاءَ</span>','<span class="ar">يَا أَيُّهَا</span>'],1,'“جَاءَ”: the alif is followed by the hamza in the same word.')}`},

{title:'Separated Madd (Munfasil)',
 guide:'The Madd letter is at the <b>end of a word</b> and the hamza is at the <b>start of the next word</b> — two friends in two separate houses.',
 note:'Separated Madd is permissible at 4 or 5 counts for Hafs via ash-Shatibiyyah, and it may be shortened to two counts via at-Tayyibah. Keep one length throughout the whole recitation. If you stop on the first word, it becomes Natural Madd.',
 html:`
 <div class="card type" style="--tc:var(--m-jaiz)"><span class="cnt">4 or 5 counts · permissible</span><p>A Madd letter at the end of a word + a hamza at the start of the next word</p></div>
 <div class="quran">${'وَلَ'+jaz('ا')} أَنتُمْ عَابِدُونَ ${'مَ'+jaz('ا')} أَعْبُدُ${ref('Al-Kafirun 109:3')}</div>
 <div class="grid">
  <div class="card ex" style="text-align:center">${'يَ'+jaz('ا')} أَيُّهَا</div>
  <div class="card ex" style="text-align:center">${'إِنَّ'+jaz('ا')} أَعْطَيْنَاكَ</div>
  <div class="card ex" style="text-align:center">${'قُ'+jaz('و')+'ا'} أَنفُسَكُمْ</div>
  <div class="card ex" style="text-align:center">${'فِ'+jaz('ي')} أَنفُسِكُمْ</div>
 </div>
 <div class="grid">
  <div class="card"><h4>Connected</h4><p><b>One</b> word: جَاءَ</p></div>
  <div class="card"><h4>Separated</h4><p><b>Two</b> words: يَا أَيُّهَا</p></div>
 </div>
 ${mcq('m7','<span class="ar">إِنَّا أَعْطَيْنَاكَ الْكَوْثَرَ</span> — what type is the Madd in “innā”?',['Connected','Separated','Natural'],1,'Separated: the alif is at the end of “innā” and the hamza is at the start of “a‘ṭaynāka”.')}`},

{title:'Temporary Madd (‘Arid lis-Sukun)',
 guide:'When we <b>stop</b> at the end of a verse, the last letter becomes silent. If a Madd letter comes before it, this is Temporary Madd.',
 note:'2, 4 or 6 counts are allowed. For a beginner it is best to choose one length and keep it throughout the surah. When we continue reading without stopping, it goes back to Natural Madd.',
 html:`
 <div class="card type" style="--tc:var(--m-jaiz)"><span class="cnt">2, 4 or 6 counts · only when stopping</span><p>A Madd letter + a letter that we made silent because we stopped</p></div>
 <div class="quran">الْحَمْدُ لِلَّهِ رَبِّ ${'الْعَالَمِ'+jaz('ي')+'نْ'}${ref('Al-Fatihah 1:2 — when stopping')}</div>
 <div class="grid">
  <div class="card ex" style="text-align:center">${'الرَّحِ'+jaz('ي')+'مْ'}</div>
  <div class="card ex" style="text-align:center">${'الدِّ'+jaz('ي')+'نْ'}</div>
  <div class="card ex" style="text-align:center">${'نَسْتَعِ'+jaz('ي')+'نْ'}</div>
 </div>
 ${countE(6,'Stop on <span class="ar">نَسْتَعِينْ</span> and stretch it six counts')}
 ${mcq('m8','If we join “الرَّحْمَٰنِ الرَّحِيمِ” to what follows and do not stop, the Madd in “ar-raḥīm” is:',['Temporary','Natural'],1,'Correct! There is no stop, so there is no sukoon, and the Madd goes back to Natural: two counts.')}`},

{title:'Compulsory Madd and Badal',
 guide:'<b>Lazim</b>: an <b>original</b> sukoon that never changes comes after the Madd letter, so we <b>always</b> stretch <b>six counts</b>. <b>Badal</b>: the hamza comes <b>before</b> the Madd letter, and we stretch two counts.',
 note:'Also Lazim: آلْآنَ (Yunus 10:51 and 91) and the separate letters such as “الم” (lām and mīm are six counts). It is called Badal because its origin is two hamzas where the second was replaced by a Madd letter: أَأْمَنُوا → آمَنُوا.',
 html:`
 <div class="card type" style="--tc:var(--m-lazim)"><span class="cnt">6 counts · always</span><p>A Madd letter + an original sukoon or a shadda in the same word</p></div>
 <div class="quran">غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا ${'الضَّ'+laz('ا')+'لِّينَ'}${ref('Al-Fatihah 1:7')}</div>
 <div class="grid">
  <div class="card ex" style="text-align:center">${'الْحَ'+laz('ا')+'قَّةُ'}</div>
  <div class="card ex" style="text-align:center">${'الطَّ'+laz('ا')+'مَّةُ'}</div>
  <div class="card ex" style="text-align:center">الٓمٓ<div class="hint" style="font-family:var(--f-body);font-size:.85rem;color:var(--muted)">أَلِفْ لَآمْ مِيٓمْ</div></div>
 </div>
 ${countE(6,'Read <span class="ar">الضَّالِّينَ</span> and stretch the alif six counts')}
 <h3>Badal Madd</h3>
 <div class="card type" style="--tc:var(--m-badal)"><span class="cnt">Two counts</span><p>A hamza <b>then</b> a Madd letter</p></div>
 <div class="grid">
  <div class="card ex" style="text-align:center">${bad('آ')+'مَنُوا'}</div>
  <div class="card ex" style="text-align:center">${'إِ'+bad('ي')+'مَانًا'}</div>
  <div class="card ex" style="text-align:center">${'أُ'+bad('و')+'تُوا'}</div>
 </div>`},

{title:'Sorting game',
 guide:'Tap a word, then tap the right box. Careful: the words here have no colours!',

{title:'Final quiz',
 guide:'Six questions. Answer correctly the first time and you earn a star!',
 note:'',

 <div class="sep"></div>
 ${SIZES.map((s,i)=>`<button class="sz" data-s="${i}" title="سُمك" aria-label="سمك ${i+1}"><i style="width:${6+i*6}px;height:${6+i*6}px"></i></button>`).join('')}
 <div class="sep"></div>
 <button data-a="undo" title="تراجع (Ctrl+Z)" aria-label="تراجع">${IC.undo}</button>
 <button data-a="clear" title="امسح كتابة هذه المحطة" aria-label="مسح">${IC.clear}</button>
 <button data-a="board" title="سبورة بيضاء (W)" aria-label="سبورة بيضاء">${IC.board}</button>
 <button data-a="close" title="إغلاق أدوات الكتابة (D)" aria-label="إغلاق">${IC.close}</button>`;
document.body.appendChild(tb);

// whiteboard overlay + laser layer
const board=document.createElement('div');board.id='wbBoard';board.hidden=true;board.innerHTML='<span class="bt">سبورة بيضاء · Whiteboard</span>';document.body.appendChild(board);
const lz=document.createElement('canvas');lz.id='wbLaser';document.body.appendChild(lz);const lctx=lz.getContext('2d');

let tool='none',color=COLORS[0],sizeI=1,stage=0;
const store={},backup={};
const key=()=>stage+(board.hidden?'':'-wb');
const list=()=>store[key()]||(store[key()]=[]);

function lw(s,pr){return s.t==='hl'?s.w*5:s.w*(0.45+1.1*(pr==null?.5:pr))}
function seg(c,s,i){const p=s.pts,a=p[i-1],b=p[i];const m0=i===1?a:[(p[i-2][0]+a[0])/2,(p[i-2][1]+a[1])/2];const m1=[(a[0]+b[0])/2,(a[1]+b[1])/2];
 c.lineWidth=lw(s,(a[2]+b[2])/2);c.beginPath();c.moveTo(m0[0],m0[1]);c.quadraticCurveTo(a[0],a[1],m1[0],m1[1]);c.stroke()}
function drawStroke(c,s){const p=s.pts;if(!p.length)return;c.save();c.lineCap='round';c.lineJoin='round';c.strokeStyle=s.c;c.fillStyle=s.c;
 if(s.t==='hl'){c.globalAlpha=.35;c.lineWidth=lw(s);c.beginPath();c.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++){const m=[(p[i-1][0]+p[i][0])/2,(p[i-1][1]+p[i][1])/2];c.quadraticCurveTo(p[i-1][0],p[i-1][1],m[0],m[1])}c.lineTo(p[p.length-1][0],p[p.length-1][1]);if(p.length===1)c.lineTo(p[0][0]+.1,p[0][1]);c.stroke()}
 else{if(p.length===1){c.beginPath();c.arc(p[0][0],p[0][1],lw(s,p[0][2])/2,0,7);c.fill()}else for(let i=1;i<p.length;i++)seg(c,s,i)}
 c.restore()}

// canvases: one per station + one on the board
const cvs={};
function makeCanvas(host,k){
 const cv=document.createElement('canvas');cv.className='ink-cv';host.appendChild(cv);
 const o={cv,ctx:cv.getContext('2d'),w:0,h:0,k};
 o.fit=()=>{const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;o.w=r.width;o.h=r.height;cv.width=Math.max(1,Math.round(r.width*d));cv.height=Math.max(1,Math.round(r.height*d));o.ctx.setTransform(d,0,0,d,0,0);o.redraw()};
 o.redraw=extra=>{o.ctx.clearRect(0,0,o.w,o.h);(store[o.k()]||[]).forEach(s=>drawStroke(o.ctx,s));if(extra)drawStroke(o.ctx,extra)};
 bind(o);return o;
}
function stageCanvas(i){
 if(cvs[i])return cvs[i];const sec=document.getElementById('s'+i);if(!sec)return null;
 const o=makeCanvas(sec,()=>String(i));new ResizeObserver(()=>o.fit()).observe(sec);return cvs[i]=o;
}
const bcv=makeCanvas(board,()=>stage+'-wb');
const active=()=>board.hidden?stageCanvas(stage):bcv;
function redraw(){const a=active();if(a)a.redraw()}

let cur=null,erasing=false,trail=[];
function bind(o){
 const cv=o.cv;
 const pos=e=>{const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top,e.pointerType==='pen'?(e.pressure||.5):.5]};
 const eraseAt=(x,y)=>{const L=store[o.k()]||[],r=14;let ch=false;for(let i=L.length-1;i>=0;i--){if(L[i].pts.some(p=>Math.hypot(p[0]-x,p[1]-y)<r+lw(L[i],p[2])/2)){L.splice(i,1);ch=true}}if(ch)o.redraw()};
 cv.addEventListener('pointerdown',e=>{if(tool==='none')return;e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}const p=pos(e);
  erasing=tool==='erase'||e.button===5||!!(e.buttons&32);
  if(tool==='laser'){trail=[[e.clientX,e.clientY,performance.now()]];return}
  if(erasing){eraseAt(p[0],p[1]);return}
  cur={t:tool,c:color,w:SIZES[sizeI],pts:[p]};if(tool==='pen')drawStroke(o.ctx,cur)});
 cv.addEventListener('pointermove',e=>{if(tool==='none')return;const ce=e.getCoalescedEvents?e.getCoalescedEvents():[];const evs=ce.length?ce:[e];
  if(tool==='laser'){trail.push([e.clientX,e.clientY,performance.now()]);return}
  if(!e.buttons)return;
  for(const ev of evs){const p=pos(ev);if(erasing){eraseAt(p[0],p[1]);continue}if(!cur)continue;const l=cur.pts[cur.pts.length-1];if(Math.hypot(p[0]-l[0],p[1]-l[1])<1.2)continue;cur.pts.push(p);
   if(cur.t==='pen'){o.ctx.save();o.ctx.lineCap='round';o.ctx.strokeStyle=cur.c;seg(o.ctx,cur,cur.pts.length-1);o.ctx.restore()}}
  if(cur&&cur.t==='hl')o.redraw(cur)});
 const up=()=>{if(cur){(store[o.k()]||(store[o.k()]=[])).push(cur);cur=null;o.redraw()}erasing=false};
 cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
 cv.addEventListener('pointerleave',()=>{if(tool==='laser')trail.push(null)});
 cv.addEventListener('contextmenu',e=>{if(tool!=='none')e.preventDefault()});
}

function fitLaser(){const d=window.devicePixelRatio||1;lz.width=innerWidth*d;lz.height=innerHeight*d;lctx.setTransform(d,0,0,d,0,0)}
fitLaser();
(function loop(){const now=performance.now();lctx.clearRect(0,0,innerWidth,innerHeight);
 if(tool==='laser'){trail=trail.filter(p=>p&&now-p[2]<450);for(let i=1;i<trail.length;i++){const a=trail[i-1],b=trail[i],k=1-(now-b[2])/450;lctx.strokeStyle=`rgba(255,40,40,${.7*k})`;lctx.lineWidth=8*k+2;lctx.lineCap='round';lctx.beginPath();lctx.moveTo(a[0],a[1]);lctx.lineTo(b[0],b[1]);lctx.stroke()}
  const t=trail[trail.length-1];if(t){lctx.fillStyle='rgba(255,40,40,.25)';lctx.beginPath();lctx.arc(t[0],t[1],16,0,7);lctx.fill();lctx.fillStyle='#FF2A2A';lctx.beginPath();lctx.arc(t[0],t[1],7,0,7);lctx.fill()}}
 requestAnimationFrame(loop)})();

function markCurrent(){Object.entries(cvs).forEach(([i,o])=>o.cv.classList.toggle('cur',+i===stage))}
function setTool(t){tool=t;if(t!=='laser')trail=[];
 document.body.classList.toggle('ink-on',t!=='none');document.body.classList.toggle('ink-erase',t==='erase');document.body.classList.toggle('ink-laser',t==='laser');
 if(t!=='none'){const a=stageCanvas(stage);if(a&&!a.w)a.fit()}markCurrent();
 tb.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===t))}
function setColor(c){color=c;tb.querySelectorAll('.sw').forEach(b=>b.classList.toggle('on',b.dataset.c===c));if(tool==='none'||tool==='erase'||tool==='laser')setTool('pen')}
function setSize(i){sizeI=i;tb.querySelectorAll('.sz').forEach(b=>b.classList.toggle('on',+b.dataset.s===i))}
function openTools(open){tb.hidden=!open;if(open){if(tool==='none')setTool('pen')}else{setTool('none');if(!board.hidden)toggleBoard()}if(dbtn)dbtn.classList.toggle('on',open)}
function toggleBoard(){board.hidden=!board.hidden;tb.querySelector('[data-a="board"]').classList.toggle('on',!board.hidden);if(!board.hidden){bcv.fit();if(tool==='none')setTool('pen')}redraw()}
function undo(){const L=list();if(L.length)L.pop();else if(backup[key()]){store[key()]=backup[key()];delete backup[key()]}redraw()}
function clearAll(){const L=list();if(!L.length)return;backup[key()]=L.slice();store[key()]=[];redraw()}
tb.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.t)setTool(b.dataset.t);else if(b.dataset.c)setColor(b.dataset.c);else if(b.dataset.s)setSize(+b.dataset.s);
 else if(b.dataset.a==='undo')undo();else if(b.dataset.a==='clear')clearAll();else if(b.dataset.a==='board')toggleBoard();else if(b.dataset.a==='close')openTools(false)});

let dbtn=null;
document.addEventListener('lesson:stage',e=>{
 if(!dbtn){const row=document.querySelector('.top-row');if(row){dbtn=document.createElement('button');dbtn.id='drawB';dbtn.className='tbtn';dbtn.innerHTML='✏️ قلم / سبورة';dbtn.title='أدوات الكتابة (D)';
  dbtn.onclick=()=>openTools(tb.hidden);row.appendChild(dbtn)}}
 stage=e.detail;
 if(!board.hidden){board.hidden=true;tb.querySelector('[data-a="board"]').classList.remove('on')}
 if(store[String(stage)]||tool!=='none'){const o=stageCanvas(stage);if(o)requestAnimationFrame(()=>o.fit())}
 markCurrent();
});
window.addEventListener('resize',()=>{fitLaser();if(!board.hidden)bcv.fit()});
setColor(COLORS[0]);setTool('none');setSize(1);

document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;const k=e.key.toLowerCase();
 if((e.ctrlKey||e.metaKey)&&k==='z'){if(!tb.hidden){e.preventDefault();undo()}return}
 if(e.ctrlKey||e.metaKey||e.altKey)return;
 if(k==='d'){openTools(tb.hidden);return}
 if(tb.hidden&&!['p','h','w','l'].includes(k))return;
 if(k==='p'){openTools(true);setTool('pen')}else if(k==='h'){openTools(true);setTool('hl')}else if(k==='e'&&!tb.hidden)setTool('erase')
 else if(k==='l'){openTools(true);setTool('laser')}else if(k==='v'||k==='escape')setTool('none');else if(k==='w'){openTools(true);toggleBoard()}});
})();

</script>
<script>
(function(){
const L=window.LESSON, S=L.stages;
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const hot=window.claude&&window.claude.hot;
let cur=0, earned=new Set();
const EN=()=>document.body.classList.contains('show-en');
const T=(a,e)=>EN()?e:a;
const ar=n=>EN()?String(n):String(n).replace(/\d/g,d=>'\u0660\u0661\u0662\u0663\u0664\u0665\u0666\u0667\u0668\u0669'[d]);
const fld=(s,k)=>EN()&&s.en&&s.en[k]!=null?s.en[k]:s[k];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

const app=$('#app');
app.innerHTML=`
<header class="top"><div class="top-row">
  <h1 class="brand" id="brandH"></h1>
  <span class="chip stars" aria-live="polite">\u2605 <span id="sc">0</span> / <span id="st">0</span></span>
  <span class="chip" id="mins"></span>
  <button class="tbtn" id="enT" aria-pressed="false">English</button>
  <button class="tbtn" id="tT" aria-pressed="false"></button>
</div><div class="progress" id="prog"></div></header>
<main id="stages"></main>`;
const nav=document.createElement('nav');nav.className='nav';
nav.innerHTML=`<div class="nav-in"><button class="prev" id="prev"></button><span class="where" id="where"></span><button class="next" id="next"></button></div>`;
document.body.appendChild(nav);

const main=$('#stages'), prog=$('#prog');
const total=S.reduce((a,s)=>a+(s.min||0),0);
S.forEach((s,i)=>{
  const sec=document.createElement('section');sec.className='stage';sec.hidden=true;sec.id='s'+i;
  sec.innerHTML='<div class="sc"></div>';
  main.appendChild(sec);
  const b=document.createElement('button');b.onclick=()=>go(i);prog.appendChild(b);
});

function star(key){
  if(!key||earned.has(key))return; earned.add(key); $('#sc').textContent=ar(earned.size);
  const p=document.createElement('div');p.className='starpop';p.textContent='★ +١';document.body.appendChild(p);setTimeout(()=>p.remove(),1000);
}
function wrongFx(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')}


/* (re)draw every station in the current language, then re-bind the widgets */
function fill(){
  app.dir=EN()?'ltr':'rtl';app.lang=EN()?'en':'ar';
  $('#brandH').innerHTML=EN()&&L.titleEn?`${L.titleEn}<small>${L.subEn||L.sub}</small>`:`${L.title}<small>${L.sub}</small>`;
  $('#tT').textContent=T('ملاحظات المعلم','Teacher notes');
  $('#prev').textContent=T('\u2192 السابق','\u2190 Previous');$('#next').textContent=T('التالي \u2190','Next \u2192');
  S.forEach((s,i)=>{
    const c=$('.sc',$('#s'+i)),title=fld(s,'title'),guide=fld(s,'guide'),note=fld(s,'note');
    c.innerHTML=`<div class="stage-head"><span class="n">${T('المحطة '+ar(i+1),'Station '+(i+1))}</span><h2>${title}</h2>${s.min?`<span class="chip">${T(ar(s.min)+' د',s.min+' min')}</span>`:''}</div>
    ${guide?`<div class="guide">${L.guideSvg}<p>${guide}</p></div>`:''}
    ${note?`<div class="tnote">${note}</div>`:''}
    <div class="body">${fld(s,'html')}</div>`;
    const b=prog.children[i];b.title=title.replace(/<[^>]+>/g,'');b.setAttribute('aria-label',T('المحطة ','Station ')+(i+1)+': '+b.title);
  });
  $('#sc').textContent=ar(earned.size);
  bindAll();
}
function bindAll(){
// MCQ / true-false / letter pick
$$('.w-mcq').forEach(w=>{
  const a=+w.dataset.a, btns=$$('.opts button',w); let tries=0;
  btns.forEach((b,i)=>b.onclick=()=>{
    if(w.classList.contains('answered'))return;
    tries++;
    if(i===a){b.classList.add('right');w.classList.add('answered');if(tries===1)star(w.dataset.key);}
    else{b.classList.add('wrong');wrongFx(b);if(tries>=2){btns[a].classList.add('right');w.classList.add('answered');}}
  });
});
// sort into bins
$$('.w-sort').forEach(w=>{
  const pool=$('.pool',w), items=shuffle($$('button',pool)); items.forEach(b=>pool.appendChild(b));
  let sel=null;
  items.forEach(b=>b.onclick=()=>{items.forEach(x=>x.classList.remove('sel'));sel=b;b.classList.add('sel');$$('.bin',w).forEach(x=>x.classList.add('armed'))});
  $$('.bin',w).forEach(bin=>{
    bin.tabIndex=0;
    const drop=()=>{
      if(!sel)return;
      if(sel.dataset.bin===bin.dataset.bin){const d=document.createElement('div');d.className='placed';d.innerHTML=sel.innerHTML;bin.appendChild(d);sel.remove();sel=null;$$('.bin',w).forEach(x=>x.classList.remove('armed'));
        if(!$$('button',pool).length){w.classList.add('complete');star(w.dataset.key)}}
      else{wrongFx(sel)}
    };
    bin.onclick=drop;bin.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();drop()}};
  });
});
// order sequence
$$('.w-order').forEach(w=>{
  const pool=$('.order-pool',w), slots=$('.order-slots',w), items=$$('button',pool), n=items.length; let next=0;
  slots.innerHTML=items.map((_,i)=>`<span>${ar(i+1)}</span>`).join('<i>←</i>');
  shuffle(items).forEach(b=>pool.appendChild(b));
  items.forEach(b=>b.onclick=()=>{
    if(+b.dataset.i===next){const s=$$('span',slots)[next];s.textContent=b.textContent;s.classList.add('f');b.remove();next++;if(next===n){w.classList.add('complete');star(w.dataset.key)}}
    else wrongFx(b);
  });
});
// flip cards
$$('.flip').forEach(c=>{c.tabIndex=0;c.setAttribute('role','button');const t=()=>c.classList.toggle('open');c.onclick=t;c.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();t()}}});

$('#st').textContent=ar($$('[data-key]').length);
if(L.init)L.init({star,ar,$,$$});
}

function go(i,keepScroll){
  i=Math.max(0,Math.min(S.length-1,i)); cur=i;
  $$('.stage').forEach((s,k)=>s.hidden=k!==i);
  $$('#prog button').forEach((b,k)=>{b.className=k===i?'on':k<i?'done':''});
  $('#prev').disabled=i===0; $('#next').disabled=i===S.length-1;
  $('#where').textContent=T(`${ar(i+1)} من ${ar(S.length)}`,`${i+1} of ${S.length}`);
  const spent=S.slice(0,i).reduce((a,s)=>a+(s.min||0),0);
  $('#mins').textContent=T(`الوقت: ${ar(spent)}\u2013${ar(spent+(S[i].min||0))} من ${ar(total)} د`,`Time: ${spent}\u2013${spent+(S[i].min||0)} of ${total} min`);
  document.dispatchEvent(new CustomEvent('lesson:stage',{detail:i}));
  const oe=(EN()&&S[i].en&&S[i].en.onEnter)||S[i].onEnter;
  if(oe)oe({earned:earned.size,total:$$('[data-key]').length,ar,$,$$});
  if(!keepScroll)window.scrollTo({top:0,behavior:'instant'in window?'instant':'auto'});
}
$('#prev').onclick=()=>go(cur-1); $('#next').onclick=()=>go(cur+1);
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea'))return;const f=EN()?1:-1;if(e.key==='ArrowLeft')go(cur-f);if(e.key==='ArrowRight')go(cur+f)});
const tog=(btn,cls)=>{btn.onclick=()=>{const on=document.body.classList.toggle(cls);btn.setAttribute('aria-pressed',on)}};
tog($('#enT'),'show-en'); tog($('#tT'),'teacher');
/* the shared top bar switches language: redraw the stations in the new language, staying on the same one */
window.addEventListener('tq-lang',()=>{fill();go(cur,true)});
fill();
if(hot&&hot.snapshot)hot.snapshot(()=>({cur}));
const start=d=>go((d&&d.cur)||0);
hot&&hot.ready?hot.ready(start):start(hot&&hot.data||{});
})();

</script>
