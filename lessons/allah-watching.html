<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="../tq-i18n.css"><script src="../tq-i18n.js"></script>
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Allah Is Watching Me</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Amiri+Quran&family=Cairo:wght@600;700&family=Lexend:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: fixed 1600×900 slide stage scaled to fit; course navy & gold, with one colour per level:
   green = Islām (body), blue = Īmān (heart), gold = Iḥsān (the top). Lexend for easy reading by English learners. */
:root{
  --navy:#14374A; --deep:#0B2431; --abyss:#081B25;
  --gold:#C9A35A; --gold-soft:#EBDDBB; --gold-ink:#86662A;
  --islam:#2E8B5A; --islam-soft:#DDF1E5; --iman:#2F6FB3; --iman-soft:#DFEAF7; --ihsan:#C9A35A; --ihsan-soft:#FBF3E1;
  --mist:#E8EEF1; --paper:#FFFFFF; --text:#1D2B33; --muted:#5E6E77; --line:#D6DFE4;
  --bad:#C2453A; --bad-soft:#F8E1DE;
  --f-ui:"Lexend","Segoe UI",system-ui,sans-serif; --f-ar:"Amiri","Traditional Arabic",serif; --f-q:"Amiri Quran","Amiri",serif; --f-note:"Cairo",Tahoma,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--abyss);color:var(--text);font-family:var(--f-ui);overflow:hidden}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font-family:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
#app{position:absolute;inset:0;display:flex;flex-direction:column}
#viewport{flex:1;position:relative;overflow:hidden;min-height:0}
#stage{position:absolute;width:1600px;height:900px;left:50%;top:50%;transform-origin:center;transform:translate(-50%,-50%) scale(.5);background:var(--paper);box-shadow:0 30px 80px rgba(0,0,0,.45)}
#fx{position:absolute;inset:0;pointer-events:none;z-index:50}
.slide{position:absolute;inset:0;display:none;overflow:hidden}
.slide.active{display:block;animation:fadein .4s ease}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ar{font-family:var(--f-ar);direction:rtl;unicode-bidi:isolate}

/* dark slides */
.dark{background:var(--navy);color:#fff}
.dark .blob{position:absolute;width:960px;height:960px;border-radius:50%;background:#0D2532;right:-440px;top:-520px}
.dark .arc{position:absolute;width:640px;height:640px;border-radius:50%;border:2px solid var(--gold);left:-340px;bottom:-376px}
.dark .medal{position:absolute;right:150px;top:300px;width:280px;height:280px}
.dark .titles{position:absolute;left:96px;top:250px;width:900px}
.dark .eyebrow{color:var(--gold);font:600 26px/1.4 var(--f-ui);letter-spacing:.5px;margin-bottom:12px}
.dark h1{font:800 84px/1.12 var(--f-ui);margin:0;letter-spacing:-1px;text-wrap:balance}
.dark h1 .ar{display:block;font:700 58px/1.5 var(--f-ar);color:var(--gold-soft);margin-top:10px}
.dark .sub{color:#B9CDD8;font:500 30px/1.5 var(--f-ui);margin-top:18px}
.dark .tagline{position:absolute;left:96px;bottom:64px;color:#9FB6C2;font:500 22px/1 var(--f-ui)}

/* light slides */
.light{background:var(--paper)}
.side{position:absolute;left:0;top:0;bottom:0;width:360px;background:var(--mist);display:flex;flex-direction:column;align-items:center;padding-top:140px}
.badge{width:190px;height:190px;border-radius:50%;background:var(--navy);border:4px solid var(--gold);display:grid;place-items:center}
.badge svg{width:92px;height:92px;stroke:var(--gold);stroke-width:1.7}
.side-title{margin-top:30px;font:700 29px/1.3 var(--f-ui);color:var(--navy);text-align:center;padding:0 24px}
.side-title .ar{display:block;font:700 30px/1.5 var(--f-ar);color:var(--gold-ink)}
.side-bar{width:120px;height:4px;background:var(--gold);margin-top:14px}
.mins{margin-top:24px;font:600 18px/1 var(--f-ui);color:var(--gold-ink);background:#fff;border:1px solid var(--gold-soft);padding:8px 16px;border-radius:30px}
.side-foot{position:absolute;bottom:24px;left:0;right:0;text-align:center;font:500 15px/1 var(--f-ui);color:var(--muted)}
.lv-islam .badge{border-color:var(--islam)} .lv-islam .badge svg{stroke:#7FD3A6}
.lv-iman .badge{border-color:var(--iman)} .lv-iman .badge svg{stroke:#9CC4F0}
.pnum{position:absolute;right:44px;bottom:22px;font:500 18px/1 var(--f-ui);color:var(--muted)}
.main{position:absolute;left:360px;right:0;top:0;bottom:0;padding:50px 72px 56px;display:flex;flex-direction:column}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;border-bottom:1px solid var(--line);padding-bottom:20px}
.head h2{margin:0;font:800 52px/1.15 var(--f-ui);color:var(--navy);letter-spacing:-.5px;text-wrap:balance}
.kicker{font:700 20px/1 var(--f-ui);color:var(--gold-ink);background:var(--ihsan-soft);border:1px solid var(--gold-soft);padding:9px 16px;border-radius:30px;flex:none;white-space:nowrap}
.content{flex:1;min-height:0;padding-top:28px;display:flex;flex-direction:column;gap:22px}
.lead{font:500 31px/1.6 var(--f-ui);color:var(--text);margin:0}
.lead b{color:var(--navy)}
.small{font:500 21px/1.55 var(--f-ui);color:var(--muted);margin:0}
.btn{border:0;border-radius:14px;padding:14px 30px;font:700 26px/1.2 var(--f-ui);background:var(--navy);color:#fff;transition:transform .12s}
.btn:hover{transform:translateY(-2px)}
.btn.gold{background:var(--gold);color:var(--deep)}
.btn.ghost{background:#fff;color:var(--navy);border:2px solid var(--navy)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.row{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.step{opacity:0;transform:translateY(12px);transition:opacity .4s,transform .4s}
.step.shown{opacity:1;transform:none}
.step-hint{position:absolute;right:120px;bottom:18px;font:600 17px/1 var(--f-ui);color:var(--gold-ink);background:#FBF5E8;border:1px dashed var(--gold);border-radius:20px;padding:7px 14px}
.hadith{background:var(--mist);border-left:6px solid var(--gold);border-radius:14px;padding:18px 26px;font:500 28px/1.6 var(--f-ui);color:var(--navy)}
.hadith .ar{display:block;font:700 30px/1.9 var(--f-ar);color:var(--navy);margin-bottom:6px}
.hadith small{display:block;font:600 18px/1.5 var(--f-ui);color:var(--gold-ink);margin-top:4px}
.tag{display:inline-flex;align-items:center;gap:8px;border-radius:30px;padding:6px 16px;font:700 20px/1.3 var(--f-ui)}
.t-islam{background:var(--islam-soft);color:#1E5E3D}.t-iman{background:var(--iman-soft);color:#1F4F85}.t-ihsan{background:var(--ihsan-soft);color:var(--gold-ink)}

/* feedback line */
.fb{font:600 26px/1.5 var(--f-ui);border-radius:14px;padding:12px 20px}
.fb.ok{background:var(--islam-soft);color:#1E5E3D}.fb.no{background:var(--bad-soft);color:#8E2D25}

/* warm-up choices */
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.choice{border:3px solid var(--line);background:#fff;border-radius:22px;padding:22px;display:flex;flex-direction:column;align-items:center;gap:12px;font:700 30px/1.2 var(--f-ui);color:var(--navy)}
.choice svg{width:120px;height:110px}
.choice.right{border-color:var(--islam);background:var(--islam-soft)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}

/* match */
.match{display:grid;grid-template-columns:1fr 1.5fr;gap:24px 40px}
.match .col{display:flex;flex-direction:column;gap:12px}
.mitem{border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 18px;font:500 24px/1.4 var(--f-ui);color:var(--text);text-align:left;transition:all .2s}
.mword{font:700 27px/1.3 var(--f-ui);color:var(--navy);background:var(--mist);display:flex;justify-content:space-between;align-items:center;gap:10px}
.mword .ar{font-size:28px;color:var(--gold-ink)}
.mitem.sel{border-color:var(--gold);background:#FBF3E1;box-shadow:0 0 0 4px rgba(201,163,90,.25)}
.mitem.done{border-color:var(--islam);background:var(--islam-soft);color:#1E5E3D;cursor:default}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}
.meter{display:flex;align-items:center;gap:14px;font:700 22px/1 var(--f-ui);color:var(--navy)}
.meter .track{width:240px;height:14px;background:var(--mist);border-radius:8px;overflow:hidden}
.meter .fill{height:100%;width:0;background:var(--gold);transition:width .4s}

/* visitor */
.visitor{display:grid;grid-template-columns:1fr 440px;gap:36px;flex:1;min-height:0}
.clues{display:flex;flex-direction:column;gap:12px}
.clue{display:flex;gap:16px;align-items:center;background:var(--mist);border-radius:16px;padding:12px 20px;font:500 26px/1.45 var(--f-ui);color:var(--navy)}
.clue .n{flex:none;font-style:normal;width:44px;height:44px;border-radius:50%;background:var(--navy);color:var(--gold);display:grid;place-items:center;font:700 20px/1 var(--f-ui)}
.guessbox{background:var(--navy);border-radius:22px;padding:24px;color:#fff;display:flex;flex-direction:column;gap:12px}
.guessbox h3{margin:0;font:700 28px/1.3 var(--f-ui);color:var(--gold)}
.gopt{border:2px solid #2C5568;background:#0F2C3B;color:#fff;border-radius:14px;padding:12px 16px;font:600 23px/1.3 var(--f-ui);text-align:left}
.gopt.sel{border-color:var(--gold);background:#1E4357}
.guessbox p{margin:0;font:500 19px/1.5 var(--f-ui);color:#B9CDD8}

/* building */
.bldg{display:grid;grid-template-columns:600px 1fr;gap:40px;flex:1;min-height:0;align-items:center}
.bldg svg{width:600px;height:560px}
.floor{cursor:pointer;transition:opacity .3s}
.floor .lbl{opacity:0;transition:opacity .4s}
.floor.open .lbl{opacity:1}
.finfo{display:flex;flex-direction:column;gap:14px}
.fcard{border-radius:18px;padding:16px 22px;border:2px solid var(--line);opacity:.35;transition:opacity .4s}
.fcard.open{opacity:1}
.fcard h3{margin:0 0 4px;font:700 30px/1.3 var(--f-ui)}
.fcard p{margin:0;font:500 22px/1.5 var(--f-ui);color:var(--text)}
.fc-islam{border-color:#A9D9BD;background:var(--islam-soft)}.fc-islam h3{color:#1E5E3D}
.fc-iman{border-color:#A9C6EA;background:var(--iman-soft)}.fc-iman h3{color:#1F4F85}
.fc-ihsan{border-color:var(--gold-soft);background:var(--ihsan-soft)}.fc-ihsan h3{color:var(--gold-ink)}

/* level definition */
.defn{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.dcard{border-radius:20px;padding:22px 26px;display:flex;flex-direction:column;gap:8px}
.dcard h3{margin:0;font:700 22px/1.2 var(--f-ui);text-transform:uppercase;letter-spacing:1.5px}
.dcard p{margin:0;font:600 30px/1.45 var(--f-ui)}
.dcard small{font:500 20px/1.5 var(--f-ui);opacity:.85}

/* pillars build */
.pbuild{display:grid;grid-template-columns:1fr 640px;gap:36px;flex:1;min-height:0}
.pcards{display:flex;flex-direction:column;gap:12px}
.pcard{display:flex;align-items:center;gap:16px;border:2px solid var(--line);background:#fff;border-radius:16px;padding:12px 18px;text-align:left}
.pcard .ic{width:56px;height:56px;border-radius:14px;background:var(--islam-soft);display:grid;place-items:center;flex:none}
.pcard .ic svg{width:32px;height:32px;stroke:var(--islam)}
.pcard b{font:700 26px/1.2 var(--f-ui);color:var(--navy);display:block}
.pcard span{font:500 19px/1.35 var(--f-ui);color:var(--muted)}
.pcard .ar{font-size:24px;color:var(--gold-ink);margin-left:auto}
.pcard.used{opacity:.3;pointer-events:none}
.house{position:relative;height:620px;align-self:center}
.house svg{width:100%;height:100%}
.house .col{transition:transform .5s cubic-bezier(.2,.9,.3,1.3),opacity .3s;transform-box:fill-box;transform-origin:bottom;transform:scaleY(0)}
.house .col.up{transform:scaleY(1)}
.house text{font-family:var(--f-ui)}

/* iman roots pick */
.roots{display:grid;grid-template-columns:1fr 520px;gap:30px;flex:1;min-height:0}
.chips{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;align-content:start}
.chip{border:2px solid var(--line);background:#fff;border-radius:14px;padding:14px 12px;font:600 23px/1.3 var(--f-ui);color:var(--navy);text-align:center}
.chip .ar{display:block;font-size:22px;color:var(--gold-ink)}
.chip.on{border-color:var(--iman);background:var(--iman-soft)}
.chip.right{border-color:var(--islam);background:var(--islam-soft);color:#1E5E3D}
.chip.wrong{border-color:var(--bad);background:var(--bad-soft);color:#8E2D25}
.chip.missed{border-style:dashed;border-color:var(--islam)}
.tree svg{width:520px;height:560px}

/* binary sort */
.bgame{display:flex;flex-direction:column;gap:20px;flex:1}
.bcard{background:var(--mist);border-radius:22px;padding:28px 36px;min-height:190px;display:flex;flex-direction:column;justify-content:center;gap:12px;position:relative}
.bcard .count{position:absolute;top:14px;right:22px;font:600 19px/1 var(--f-ui);color:var(--muted)}
.bcard .txt{font:700 38px/1.45 var(--f-ui);color:var(--navy)}
.bopts{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.bopt{border-radius:18px;border:3px solid transparent;padding:18px;font:700 30px/1.3 var(--f-ui);display:flex;align-items:center;justify-content:center;gap:14px}
.bopt svg{width:42px;height:42px}
.bopt.a{background:var(--islam-soft);color:#1E5E3D;border-color:#A9D9BD}
.bopt.b{background:var(--iman-soft);color:#1F4F85;border-color:#A9C6EA}
.bopt.right{outline:5px solid var(--islam)}.bopt.wrong{outline:5px solid var(--bad)}
.bnav{display:flex;justify-content:space-between;align-items:center}

/* ihsan steps */
.ihs{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.ist{border-radius:22px;padding:26px;background:linear-gradient(160deg,#FBF3E1,#F3E3BD);border:2px solid var(--gold-soft);display:flex;flex-direction:column;gap:10px}
.ist .n{font:800 20px/1 var(--f-ui);color:var(--gold-ink);letter-spacing:1px}
.ist h3{margin:0;font:800 36px/1.2 var(--f-ui);color:var(--navy)}
.ist p{margin:0;font:500 24px/1.5 var(--f-ui);color:var(--text)}

/* mcq */
.mcq{display:flex;flex-direction:column;gap:16px;flex:1}
.mq{font:700 34px/1.45 var(--f-ui);color:var(--navy);background:var(--mist);border-radius:20px;padding:20px 28px}
.mopts{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.mopt{display:flex;align-items:center;gap:16px;border:3px solid var(--line);background:#fff;border-radius:18px;padding:16px 20px;font:600 26px/1.4 var(--f-ui);color:var(--text);text-align:left}
.mopt b{flex:none;width:48px;height:48px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font:700 22px/1 var(--f-ui)}
.mopt.right{border-color:var(--islam);background:var(--islam-soft)}.mopt.right b{background:var(--islam)}
.mopt.wrong{border-color:var(--bad);background:var(--bad-soft)}.mopt.wrong b{background:var(--bad)}
.mfoot{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:auto}
.prog{font:600 20px/1 var(--f-ui);color:var(--muted)}

/* circles */
.circ{display:grid;grid-template-columns:560px 1fr;gap:40px;flex:1;min-height:0;align-items:center}
.circ svg{width:560px;height:560px}
.circ circle{cursor:pointer}
.facts{display:flex;flex-direction:column;gap:14px}
.fact{background:var(--mist);border-radius:16px;padding:14px 22px;font:600 26px/1.5 var(--f-ui);color:var(--navy)}

/* reveal secret */
.secret{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;flex:1;text-align:center}
.secret .q{font:700 40px/1.3 var(--f-ui);color:var(--navy)}
.secret .ans{font:800 50px/1.25 var(--f-ui);color:var(--gold-ink)}
.secret .ans .ar{display:block;font-size:44px;line-height:1.8;margin-bottom:8px}

/* fill memo */
.memo{background:var(--navy);color:#fff;border-radius:24px;padding:28px 34px;text-align:center}
.memo .line{font:700 40px/2 var(--f-ar);direction:rtl}
.memo .slot{display:inline-block;min-width:110px;border-bottom:3px dashed var(--gold);color:var(--gold);margin:0 6px;padding:0 6px}
.memo .slot.ok{border-bottom-style:solid;color:#9FE0BC}
.memo .tr{font:500 24px/1.6 var(--f-ui);color:#B9CDD8;margin-top:6px}
.wchips{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.wchip{border:2px solid var(--line);background:#fff;border-radius:14px;padding:10px 22px;font:700 34px/1.4 var(--f-ar);color:var(--navy)}
.wchip.used{opacity:.25;pointer-events:none}

/* pledge */
.pledge{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;flex:1;min-height:0}
.pcol{border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px}
.pcol h3{margin:0 0 4px;font:700 26px/1.3 var(--f-ui)}
.popt{border:2px solid transparent;background:#fff;border-radius:14px;padding:12px 14px;font:500 21px/1.4 var(--f-ui);color:var(--text);text-align:left}
.popt.on{border-color:var(--navy);font-weight:700}
.pc-islam{background:var(--islam-soft)}.pc-islam h3{color:#1E5E3D}
.pc-iman{background:var(--iman-soft)}.pc-iman h3{color:#1F4F85}
.pc-ihsan{background:var(--ihsan-soft)}.pc-ihsan h3{color:var(--gold-ink)}

.srcs{font:500 21px/1.7 var(--f-ui);color:var(--text)}
.srcs p{margin:0 0 12px}


/* lesson 2 additions */
.sortbad .bopt.b{background:var(--bad-soft);color:#8E2D25;border-color:#EDB7B0}
.cam3{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:16px}
.cam3 div{border-radius:18px;padding:18px 22px;display:flex;flex-direction:column;gap:6px}
.cam3 div:first-child{background:var(--mist)}.cam3 div:last-child{background:var(--navy);color:#fff}
.cam3 b{font:700 30px/1.2 var(--f-ui)}.cam3 div:last-child b{color:var(--gold)}
.cam3 span{font:500 23px/1.6 var(--f-ui)}
.flips{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;flex:1;min-height:0}
.flip{perspective:1200px;border:0;background:none;padding:0;text-align:left}
.flip .in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.flip.open .in{transform:rotateY(180deg)}
.flip .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;padding:22px;display:flex;flex-direction:column}
.flip .front{background:var(--navy);color:#fff;justify-content:center;align-items:center;text-align:center;gap:10px}
.flip .front svg{width:76px;height:76px;stroke:var(--gold);stroke-width:1.6}
.flip .front b{font:700 32px/1.2 var(--f-ui)}
.flip .front .ar{font-size:36px;color:var(--gold-soft)}
.flip .front small{font:500 16px/1 var(--f-ui);color:var(--gold)}
.flip .back{background:#FBF5E8;border:2px solid var(--gold);color:var(--navy);transform:rotateY(180deg);font:500 23px/1.55 var(--f-ui);justify-content:center;gap:10px}
.flip .back h4{margin:0;font:700 27px/1.2 var(--f-ui);color:var(--gold-ink)}
.chat{display:flex;flex-direction:column;gap:9px;flex:1}
.bub{max-width:78%;border-radius:22px;padding:10px 22px;font:500 24px/1.45 var(--f-ui)}
.bub small{display:block;font:700 16px/1.4 var(--f-ui);opacity:.75;text-transform:uppercase;letter-spacing:1px}
.bub.y{align-self:flex-start;background:var(--mist);color:var(--navy);border-top-left-radius:6px}
.bub.p{align-self:flex-end;background:var(--navy);color:#fff;border-top-right-radius:6px}
.bub.p small{color:var(--gold)}
.bub.lesson{align-self:stretch;max-width:none;background:var(--islam-soft);color:#1E5E3D;text-align:center}
.chips4{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.wings{display:grid;grid-template-columns:560px 1fr;gap:36px;flex:1;min-height:0;align-items:center}
.bird{width:560px;height:420px;transition:transform 1s}
.bird .w{cursor:pointer;opacity:.35;transition:opacity .4s}
.bird .w.on{opacity:1}
.bird.fly{animation:fly 2.4s ease-in-out infinite}
@keyframes fly{50%{transform:translateY(-22px)}}
.wfacts{display:flex;flex-direction:column;gap:14px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.three .ist h3{font-size:29px}
.rewards2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.rw2{background:var(--navy);color:#fff;border-radius:22px;padding:22px 26px;display:flex;flex-direction:column;gap:10px;border-top:5px solid var(--gold)}
.rw2 .ar{font:700 32px/1.8 var(--f-ar);color:var(--gold-soft);text-align:right}
.rw2 p{margin:0;font:500 24px/1.5 var(--f-ui)}
.rw2 small{font:600 17px/1.4 var(--f-ui);color:#9FB6C2}

/* bar */
#bar{flex:none;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:#071721;color:#CFE0E8;border-top:1px solid #1C3B4B;font:600 15px/1 var(--f-ui)}
#bar button{background:#12303F;color:#E8F1F5;border:1px solid #24485A;border-radius:10px;padding:8px 12px;font:600 15px/1 var(--f-ui)}
#bar button.nav{background:var(--gold);color:var(--deep);border-color:var(--gold);padding:8px 18px;font-weight:800}
#prog{flex:1;min-width:100px;height:6px;background:#173646;border-radius:4px;overflow:hidden}
#prog i{display:block;height:100%;width:0;background:var(--gold);transition:width .3s}
#count,#clock{font-variant-numeric:tabular-nums;color:#fff}
#clock,#stars{background:#12303F;border:1px solid #24485A;border-radius:10px;padding:8px 10px}
#stars{color:var(--gold);font-weight:800}
#notes{position:absolute;left:16px;right:16px;bottom:10px;max-width:1000px;margin:0 auto;background:rgba(7,23,33,.97);color:#E8F1F5;border:1px solid var(--gold);border-radius:14px;padding:14px 18px;font:600 16px/1.8 var(--f-note);direction:rtl;z-index:60}
#notes b{color:var(--gold)}
#notes .say{direction:ltr;text-align:left;font:500 16px/1.6 var(--f-ui);background:#0F2C3B;border-radius:10px;padding:8px 12px;margin-top:8px;color:#fff}
#notes .say:before{content:"Say: ";color:var(--gold);font-weight:700}
@media (max-width:700px){#bar .hide-s{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* iPad / touch */
*{-webkit-tap-highlight-color:transparent}
button,select,.flip,.chip,.opt,.mopt,.qopt{touch-action:manipulation}
html,body{overscroll-behavior:none}
#app{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#app input,#app textarea{-webkit-user-select:text;user-select:text}

function matchGame(s,V){const W=s.querySelector('.words'),M=s.querySelector('.means');
 V.forEach((v,i)=>W.insertAdjacentHTML('beforeend',`<button class="mitem mword" data-i="${i}"><span>${v[0]}</span><span class="ar">${v[1]}</span></button>`));
 shuffle(V.map((v,i)=>[v[2],i])).forEach(([t,i])=>M.insertAdjacentHTML('beforeend',`<button class="mitem" data-i="${i}">${t}</button>`));
 let sel=null,done=0;
 W.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(b.classList.contains('done'))return;W.querySelectorAll('.sel').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=b;tone('tap')});
 M.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(!sel||b.classList.contains('done'))return;
  if(sel.dataset.i===b.dataset.i){sel.classList.replace('sel','done');b.classList.add('done');sel=null;done++;s.querySelector('.mc').textContent=done+' / '+V.length;s.querySelector('.fill').style.width=done/V.length*100+'%';win(done===V.length)}
  else{b.classList.add('shake');tone('bad');setTimeout(()=>b.classList.remove('shake'),400)}})}
function memoGame(s,words,extra,tr){const W=s.querySelector('.wchips');let k=0;
 shuffle(words.concat(extra)).forEach(w=>W.insertAdjacentHTML('beforeend',`<button class="wchip" data-w="${w}">${w} <small style="font:500 16px var(--f-ui);color:var(--muted)">${tr[w]||''}</small></button>`));
 W.querySelectorAll('.wchip').forEach(b=>b.onclick=()=>{if(k>=words.length)return;if(b.dataset.w===words[k]){const sl=s.querySelector(`.slot[data-s="${k}"]`);sl.textContent=b.dataset.w;sl.classList.add('ok');b.classList.add('used');k++;if(k===words.length){const f=s.querySelector('.fb');f.hidden=false;f.className='fb ok';f.textContent='Mashā’ Allāh! Now say it from memory.'}win(k===words.length)}else{b.classList.add('shake');tone('bad');setTimeout(()=>b.classList.remove('shake'),400)}})}

/* engine */
const stage=document.getElementById('stage');stage.innerHTML=S.map(s=>s.html).join('');
const slides=[...stage.querySelectorAll('.slide')];slides.forEach((el,i)=>{const n=el.querySelector('.pnum');if(n)n.textContent=i+1});
const inited=new Set();let cur=0,stars=0;
function fit(){const vp=document.getElementById('viewport');const sc=Math.min(vp.clientWidth/1600,vp.clientHeight/900)*.98;stage.style.transform=`translate(-50%,-50%) scale(${sc})`;const c=document.getElementById('fx');c.width=vp.clientWidth;c.height=vp.clientHeight}
window.addEventListener('resize',fit);
function go(i){i=Math.max(0,Math.min(slides.length-1,i));slides[cur].classList.remove('active');cur=i;const el=slides[i];el.classList.add('active');if(!inited.has(i)&&S[i].init){S[i].init(el);inited.add(i)}if(S[i].onEnter)S[i].onEnter(el);
 document.getElementById('count').textContent=`${i+1} / ${slides.length}`;document.querySelector('#prog i').style.width=(i+1)/slides.length*100+'%';document.getElementById('notes').innerHTML=S[i].notes||'';try{localStorage.setItem('watch-slide',i)}catch(e){}}
function next(){const st=slides[cur].querySelector('.step:not(.shown)');if(st){st.classList.add('shown');tone('tap');return}go(cur+1)}
document.getElementById('nextB').onclick=next;document.getElementById('prevB').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA/.test(e.target.tagName))return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();next()}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}else if(e.key==='n'||e.key==='N')toggleNotes()});
let tx=null;const vp=document.getElementById('viewport');vp.addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});vp.addEventListener('touchend',e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>70)dx<0?next():go(cur-1);tx=null});
function toggleNotes(){const n=document.getElementById('notes');n.hidden=!n.hidden}
document.getElementById('notesB').onclick=toggleNotes;
let muted=false;document.getElementById('soundB').onclick=e=>{muted=!muted;e.currentTarget.textContent='Sound: '+(muted?'off':'on')};
document.getElementById('fsB').onclick=()=>{const d=document,el=d.documentElement;try{const on=d.fullscreenElement||d.webkitFullscreenElement;if(on){(d.exitFullscreen||d.webkitExitFullscreen).call(d)}else{const r=(el.requestFullscreen||el.webkitRequestFullscreen);if(r){const p=r.call(el);if(p&&p.catch)p.catch(()=>{})}}}catch(e){}};
const t0=Date.now();setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);document.getElementById('clock').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},1000);
function addStar(n=1){stars+=n;const el=document.getElementById('stars');el.textContent='★ '+stars}
function win(big){addStar();tone('ok');if(big)confetti()}
let ac=null;function tone(k){if(muted)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();const seq=k==='ok'?[[660,.09],[880,.14]]:k==='bad'?[[220,.12],[170,.18]]:[[520,.05]];let t=ac.currentTime;seq.forEach(([f,d])=>{const o=ac.createOscillator(),g=ac.createGain();o.type=k==='bad'?'square':'sine';o.frequency.value=f;g.gain.setValueAtTime(.1,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d);t+=d})}catch(e){}}
function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const c=document.getElementById('fx'),x=c.getContext('2d'),W=c.width,H=c.height;const cols=['#C9A35A','#EBDDBB','#2E8B5A','#2F6FB3','#FFFFFF'];
 const ps=Array.from({length:140},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.35,vx:(Math.random()-.5)*16,vy:-Math.random()*14-4,r:Math.random()*7+4,c:cols[Math.random()*5|0],a:Math.random()*6,va:(Math.random()-.5)*.3}));
 let f=0;(function loop(){x.clearRect(0,0,W,H);ps.forEach(p=>{p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});if(++f<110)requestAnimationFrame(loop);else x.clearRect(0,0,W,H)})()}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function mini(el,okMsg,noMsg){const a=el.dataset.a;let done=false;el.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{if(done)return;const f=el.querySelector('.fb');f.hidden=false;
 if(b.dataset.v===a){done=true;b.classList.remove('ghost');b.style.background='var(--islam)';f.className='fb ok';f.textContent=okMsg;win()}else{f.className='fb no';f.textContent=noMsg;tone('bad')}})}
function binaryGame(root,items,labels){let i=0,right=0;
 function render(){if(i>=items.length){root.innerHTML=`<div class="bcard" style="align-items:center;text-align:center"><div class="txt">Finished! ✓</div><div class="small" style="font-size:28px">Right answers: <b style="color:var(--gold-ink)">${right} / ${items.length}</b></div><button class="btn ghost" data-r>Play again</button></div>`;root.querySelector('[data-r]').onclick=()=>{i=0;right=0;render()};if(right===items.length)confetti();return}
  const it=items[i];root.innerHTML=`<div class="bcard"><span class="count">${i+1} / ${items.length}</span><div class="txt">${it[0]}</div><div class="fb" hidden></div></div>
  <div class="bopts"><button class="bopt a" data-a="0">${I(labels[0][1])}${labels[0][0]}</button><button class="bopt b" data-a="1">${I(labels[1][1])}${labels[1][0]}</button></div><div class="bnav"><span class="small">Right answers: ${right}</span><button class="btn" data-n hidden>Next card →</button></div>`;
  let ans=false;root.querySelectorAll('.bopt').forEach(b=>b.onclick=()=>{if(ans)return;ans=true;const ok=+b.dataset.a===it[1];if(ok)right++;b.classList.add(ok?'right':'wrong');if(!ok)root.querySelector(`.bopt[data-a="${it[1]}"]`).classList.add('right');
   const f=root.querySelector('.fb');f.hidden=false;f.className='fb '+(ok?'ok':'no');f.textContent=(ok?'Correct! ':'Not this one. ')+it[2];ok?win():tone('bad');const n=root.querySelector('[data-n]');n.hidden=false;n.onclick=()=>{i++;render()}})}
 render()}
function mcqSet(root,qs,explain,final){let i=0,right=0;const L=['A','B','C','D'];
 function render(){if(i>=qs.length){const pct=Math.round(right/qs.length*100);root.innerHTML=`<div class="secret">${I('trophy','style="width:120px;height:120px;stroke:var(--gold)"')}<div class="ans">${right} / ${qs.length}</div><div class="q">${final?(pct>=90?'Excellent! You are a star student.':pct>=70?'Very good! Review the questions you missed.':'Good try! Let’s review the lesson together.'):'Well done!'}</div><button class="btn ghost" data-r>Try again</button></div>`;
   root.querySelector('[data-r]').onclick=()=>{i=0;right=0;render()};if(final)confetti();return}
  const q=qs[i];root.innerHTML=`<div class="mq">${q.q}</div><div class="mopts" style="${q.o.length===2?'grid-template-columns:1fr 1fr':''}">${q.o.map((o,k)=>`<button class="mopt" data-k="${k}"><b>${L[k]}</b>${o}</button>`).join('')}</div>
  ${explain?'<div class="fb" hidden></div>':''}<div class="mfoot"><span class="prog">Question ${i+1} of ${qs.length} · Right: ${right}</span><button class="btn" data-n hidden>${i===qs.length-1?'See my result →':'Next question →'}</button></div>`;
  let ans=false;root.querySelectorAll('.mopt').forEach(b=>b.onclick=()=>{if(ans)return;ans=true;const ok=+b.dataset.k===q.a;if(ok)right++;b.classList.add(ok?'right':'wrong');root.querySelector(`.mopt[data-k="${q.a}"]`).classList.add('right');
   if(explain){const f=root.querySelector('.fb');f.hidden=false;f.className='fb '+(ok?'ok':'no');f.textContent=q.e}ok?win():tone('bad');const n=root.querySelector('[data-n]');n.hidden=false;n.onclick=()=>{i++;render()}})}
 render()}
fit();let start=0;try{start=+(localStorage.getItem('watch-slide')||0)}catch(e){}
slides[0].classList.add('active');go(start||0);setTimeout(fit,300);
})();
</script>

<style>
/* ---------- whiteboard / pen layer ---------- */
#ink{position:absolute;left:0;top:0;width:1600px;height:900px;z-index:45;pointer-events:none;touch-action:none}
#ink.on{pointer-events:auto;cursor:crosshair}
#ink.erase{cursor:cell}
#ink.laser{cursor:none}
#laser{position:absolute;left:0;top:0;width:1600px;height:900px;z-index:46;pointer-events:none}
#board{position:absolute;inset:0;z-index:44;background-color:#FDFCF8;background-image:linear-gradient(#E6ECEF 1px,transparent 1px),linear-gradient(90deg,#E6ECEF 1px,transparent 1px);background-size:40px 40px}
#board .bt{position:absolute;top:18px;left:50%;transform:translateX(-50%);font:700 18px/1 "Cairo","Lexend",sans-serif;color:#86662A;background:#FBF3E1;border:1px solid #EBDDBB;border-radius:20px;padding:8px 16px}
#tools{position:absolute;left:10px;top:50%;transform:translateY(-50%);z-index:70;display:flex;flex-direction:column;gap:5px;background:rgba(7,23,33,.95);border:1px solid #C9A35A;border-radius:16px;padding:7px;box-shadow:0 10px 30px rgba(0,0,0,.35);max-height:calc(100% - 16px);overflow-y:auto;gap:4px}
#tools button{width:36px;height:36px;flex:none;border-radius:10px;border:1px solid #24485A;background:#12303F;color:#E8F1F5;display:grid;place-items:center;padding:0;cursor:pointer}
#tools button svg{width:20px;height:20px}
#tools button.on{background:#C9A35A;color:#0B2431;border-color:#C9A35A}
#tools .sw i{width:20px;height:20px;border-radius:50%;display:block;border:2px solid rgba(255,255,255,.6)}
#tools .sw.on{background:#24485A;border-color:#C9A35A}
#tools .sz i{display:block;border-radius:50%;background:#E8F1F5}
#tools .sep{height:1px;background:#2A5266;margin:2px 0}
#tools[hidden]{display:none!important}
@media (max-height:820px) and (min-height:641px){#tools{display:grid;grid-template-columns:36px 36px;align-content:start}#tools .sep{grid-column:1/-1;width:auto;height:1px}}

@media (max-height:640px){#tools{flex-direction:row;flex-wrap:wrap;top:auto;bottom:8px;transform:none;max-width:calc(100% - 20px)}#tools .sep{width:1px;height:auto;margin:0 2px}}
</style>
<script>
(function(){
const stage=document.getElementById('stage'),vp=document.getElementById('viewport'),bar=document.getElementById('bar');
if(!stage||!vp)return;
const W=1600,H=900,DPR=2;
const board=document.createElement('div');board.id='board';board.hidden=true;board.innerHTML='<span class="bt">سبورة بيضاء · Whiteboard</span>';stage.appendChild(board);
const cv=document.createElement('canvas');cv.id='ink';cv.width=W*DPR;cv.height=H*DPR;stage.appendChild(cv);
const lz=document.createElement('canvas');lz.id='laser';lz.width=W;lz.height=H;stage.appendChild(lz);
const ctx=cv.getContext('2d'),lctx=lz.getContext('2d');
ctx.scale(DPR,DPR);

const SV=p=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const IC={
 hand:SV('<path d="M7 11V5a1.5 1.5 0 0 1 3 0v5M10 10V3.5a1.5 1.5 0 0 1 3 0V10M13 10V4.5a1.5 1.5 0 0 1 3 0V12M16 9.5a1.5 1.5 0 0 1 3 0V15a7 7 0 0 1-7 7h-1a6 6 0 0 1-5-3l-2.5-4.5a1.5 1.5 0 0 1 2.6-1.5L7 15"/>'),
 pen:SV('<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>'),
 hl:SV('<path d="M9 11l-6 6v3h9l3-3"/><path d="M22 12l-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/>'),
 erase:SV('<path d="M20 20H8l-5-5a2 2 0 0 1 0-2.8L12.2 3a2 2 0 0 1 2.8 0l6 6a2 2 0 0 1 0 2.8L13 20"/><path d="M6 11l7 7"/>'),
 laser:SV('<circle cx="12" cy="12" r="3" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/>'),
 undo:SV('<path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/>'),
 clear:SV('<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>'),
 board:SV('<rect x="3" y="4" width="18" height="13" rx="1"/><path d="M8 21l4-4 4 4"/>'),
 close:SV('<path d="M6 6l12 12M18 6L6 18"/>')
};
const COLORS=['#C2453A','#14374A','#2E8B5A','#2F6FB3','#C9A35A','#FFFFFF'];
const SIZES=[2.5,5,9];
const tb=document.createElement('div');tb.id='tools';tb.hidden=true;
tb.innerHTML=`
 <button data-t="none" title="تحكم في الشريحة (V / Esc)">${IC.hand}</button>
 <button data-t="pen" title="قلم (P)">${IC.pen}</button>
 <button data-t="hl" title="هايلايتر لتظليل الكلمات (H)">${IC.hl}</button>
 <button data-t="erase" title="ممحاة (E)">${IC.erase}</button>
 <button data-t="laser" title="مؤشر ليزر (L)">${IC.laser}</button>
 <div class="sep"></div>
 ${COLORS.map((c,i)=>`<button class="sw" data-c="${c}" title="لون"><i style="background:${c}"></i></button>`).join('')}
 <div class="sep"></div>
 ${SIZES.map((s,i)=>`<button class="sz" data-s="${i}" title="سُمك"><i style="width:${6+i*6}px;height:${6+i*6}px"></i></button>`).join('')}
 <div class="sep"></div>
 <button data-a="undo" title="تراجع (Ctrl+Z)">${IC.undo}</button>
 <button data-a="clear" title="امسح كتابة هذه الشريحة">${IC.clear}</button>
 <button data-a="board" title="سبورة بيضاء (W)">${IC.board}</button>
 <button data-a="close" title="إغلاق أدوات الكتابة (D)">${IC.close}</button>`;
vp.appendChild(tb);

let tool='none',color=COLORS[0],sizeI=1;
const store={},backup={};
const slides=()=>[...stage.querySelectorAll('.slide')];
const idx=()=>slides().findIndex(s=>s.classList.contains('active'));
const key=()=>idx()+(board.hidden?'':'-wb');
const list=()=>store[key()]||(store[key()]=[]);

function lw(s,pr){return s.t==='hl'?s.w*5:s.w*(0.45+1.1*(pr==null?.5:pr))}
function drawStroke(c,s){const p=s.pts;if(!p.length)return;c.save();c.lineCap='round';c.lineJoin='round';c.strokeStyle=s.c;c.fillStyle=s.c;
 if(s.t==='hl'){c.globalAlpha=.35;c.lineWidth=lw(s);c.beginPath();c.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++){const m=[(p[i-1][0]+p[i][0])/2,(p[i-1][1]+p[i][1])/2];c.quadraticCurveTo(p[i-1][0],p[i-1][1],m[0],m[1])}c.lineTo(p[p.length-1][0],p[p.length-1][1]);if(p.length===1)c.lineTo(p[0][0]+.1,p[0][1]);c.stroke()}
 else{if(p.length===1){c.beginPath();c.arc(p[0][0],p[0][1],lw(s,p[0][2])/2,0,7);c.fill()}else for(let i=1;i<p.length;i++)seg(c,s,i)}
 c.restore()}
function seg(c,s,i){const p=s.pts,a=p[i-1],b=p[i];const m0=i===1?a:[(p[i-2][0]+a[0])/2,(p[i-2][1]+a[1])/2];const m1=[(a[0]+b[0])/2,(a[1]+b[1])/2];
 c.lineWidth=lw(s,(a[2]+b[2])/2);c.beginPath();c.moveTo(m0[0],m0[1]);c.quadraticCurveTo(a[0],a[1],m1[0],m1[1]);c.stroke()}
function redraw(extra){ctx.clearRect(0,0,W,H);list().forEach(s=>drawStroke(ctx,s));if(extra)drawStroke(ctx,extra)}

function pos(e){const r=stage.getBoundingClientRect();return [(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height,e.pointerType==='pen'?(e.pressure||.5):.5]}
let cur=null,erasing=false,trail=[];
function eraseAt(x,y){const L=list(),r=22;let ch=false;for(let i=L.length-1;i>=0;i--){if(L[i].pts.some(p=>Math.hypot(p[0]-x,p[1]-y)<r+lw(L[i],p[2])/2)){L.splice(i,1);ch=true}}if(ch)redraw()}
let penSeen=false;const palm=e=>{if(e.pointerType==='pen')penSeen=true;return penSeen&&e.pointerType==='touch'};
cv.addEventListener('pointerdown',e=>{if(tool==='none'||palm(e))return;e.preventDefault();cv.setPointerCapture(e.pointerId);const p=pos(e);
 erasing=tool==='erase'||e.button===5||(e.buttons&32);
 if(tool==='laser'){trail=[[p[0],p[1],performance.now()]];return}
 if(erasing){eraseAt(p[0],p[1]);return}
 cur={t:tool,c:color,w:SIZES[sizeI],pts:[p]};if(tool==='pen')drawStroke(ctx,cur)});
cv.addEventListener('pointermove',e=>{if(tool==='none'||(penSeen&&e.pointerType==='touch'))return;const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
 if(tool==='laser'){const p=pos(e);trail.push([p[0],p[1],performance.now()]);return}
 if(!e.buttons)return;
 for(const ev of (evs.length?evs:[e])){const p=pos(ev);if(erasing){eraseAt(p[0],p[1]);continue}if(!cur)continue;const l=cur.pts[cur.pts.length-1];if(Math.hypot(p[0]-l[0],p[1]-l[1])<1.2)continue;cur.pts.push(p);
  if(cur.t==='pen'){ctx.save();ctx.lineCap='round';ctx.strokeStyle=cur.c;seg(ctx,cur,cur.pts.length-1);ctx.restore()}}
 if(cur&&cur.t==='hl')redraw(cur)});
function up(){if(cur){list().push(cur);cur=null;redraw()}erasing=false}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('pointerleave',()=>{if(tool==='laser')trail.push(null)});
['touchstart','touchmove','touchend'].forEach(t=>cv.addEventListener(t,e=>{if(tool!=='none')e.stopPropagation()},{passive:true}));
cv.addEventListener('contextmenu',e=>{if(tool!=='none')e.preventDefault()});

(function loop(){const now=performance.now();lctx.clearRect(0,0,W,H);
 if(tool==='laser'){trail=trail.filter(p=>p&&now-p[2]<450);for(let i=1;i<trail.length;i++){const a=trail[i-1],b=trail[i],k=1-(now-b[2])/450;lctx.strokeStyle=`rgba(255,40,40,${.7*k})`;lctx.lineWidth=10*k+2;lctx.lineCap='round';lctx.beginPath();lctx.moveTo(a[0],a[1]);lctx.lineTo(b[0],b[1]);lctx.stroke()}
  const t=trail[trail.length-1];if(t){lctx.fillStyle='rgba(255,40,40,.25)';lctx.beginPath();lctx.arc(t[0],t[1],22,0,7);lctx.fill();lctx.fillStyle='#FF2A2A';lctx.beginPath();lctx.arc(t[0],t[1],9,0,7);lctx.fill()}}
 requestAnimationFrame(loop)})();

function setTool(t){tool=t;cv.className=t==='none'?'':'on'+(t==='erase'?' erase':'')+(t==='laser'?' laser':'');if(t!=='laser')trail=[];
 tb.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===t))}
function setColor(c){color=c;tb.querySelectorAll('.sw').forEach(b=>b.classList.toggle('on',b.dataset.c===c));if(tool==='none'||tool==='erase'||tool==='laser')setTool('pen')}
function setSize(i){sizeI=i;tb.querySelectorAll('.sz').forEach(b=>b.classList.toggle('on',+b.dataset.s===i))}
function openTools(open){tb.hidden=!open;if(open){if(tool==='none')setTool('pen')}else{setTool('none');if(!board.hidden)toggleBoard()}if(dbtn)dbtn.classList.toggle('on',open)}
function toggleBoard(){board.hidden=!board.hidden;tb.querySelector('[data-a="board"]').classList.toggle('on',!board.hidden);if(!board.hidden&&tool==='none')setTool('pen');redraw()}
function undo(){const L=list();if(L.length)L.pop();else if(backup[key()]){store[key()]=backup[key()];delete backup[key()]}redraw()}
function clearAll(){const L=list();if(!L.length)return;backup[key()]=L.slice();store[key()]=[];redraw()}
tb.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.t)setTool(b.dataset.t);else if(b.dataset.c)setColor(b.dataset.c);else if(b.dataset.s)setSize(+b.dataset.s);
 else if(b.dataset.a==='undo')undo();else if(b.dataset.a==='clear')clearAll();else if(b.dataset.a==='board')toggleBoard();else if(b.dataset.a==='close')openTools(false)});

let dbtn=null;
if(bar){dbtn=document.createElement('button');dbtn.id='drawB';dbtn.innerHTML='✏️ قلم / سبورة';dbtn.title='أدوات الكتابة (D)';
 dbtn.onclick=()=>openTools(tb.hidden);const ref=document.getElementById('notesB');bar.insertBefore(dbtn,ref||null);
 const st=document.createElement('style');st.textContent='#drawB.on{background:#C9A35A!important;color:#0B2431!important;border-color:#C9A35A!important}';document.head.appendChild(st)}
setColor(COLORS[0]);setTool('none');setSize(1);

let last=idx();
new MutationObserver(()=>{const i=idx();if(i!==last){last=i;if(!board.hidden){board.hidden=true;tb.querySelector('[data-a="board"]').classList.remove('on')}redraw()}}).observe(stage,{subtree:true,attributes:true,attributeFilter:['class']});

document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;const k=e.key.toLowerCase();
 if((e.ctrlKey||e.metaKey)&&k==='z'){if(!tb.hidden){e.preventDefault();undo()}return}
 if(e.ctrlKey||e.metaKey||e.altKey)return;
 if(k==='d'){openTools(tb.hidden);return}
 if(tb.hidden&&!['p','h','w','l'].includes(k))return;
 if(k==='p'){openTools(true);setTool('pen')}else if(k==='h'){openTools(true);setTool('hl')}else if(k==='e'&&!tb.hidden)setTool('erase')
 else if(k==='l'){openTools(true);setTool('laser')}else if(k==='v'||k==='escape')setTool('none');else if(k==='w'){openTools(true);toggleBoard()}});
})();
</script>
