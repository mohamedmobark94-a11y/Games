<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="../tq-i18n.css"><script src="../tq-i18n.js"></script>
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>اختبار فقه الشباب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;800;900&display=swap">
<style>
/* Layout: navy header with timer, one question card at a time, side map of questions (drawer on phones); course navy & gold. */
:root{
  --navy:#14374A; --deep:#0B2431; --gold:#C9A35A; --gold-soft:#EBDDBB; --gold-ink:#86662A;
  --mist:#E8EEF1; --paper:#FFFFFF; --ground:#F3F6F8; --text:#1D2B33; --muted:#5E6E77; --line:#D6DFE4;
  --ok:#2E8B5A; --ok-soft:#E1F3E8; --bad:#C2453A; --bad-soft:#F9E4E1; --flag:#D98E04;
  --f-ui:"Cairo","Segoe UI",Tahoma,sans-serif; --f-h:"Amiri","Traditional Arabic",serif;
  color-scheme:light;
}
html,body{min-height:100%}
body{margin:0;background:var(--ground);color:var(--text);font-family:var(--f-ui);direction:rtl}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select{font-family:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px}

/* header */
header{background:var(--navy);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;border-bottom:3px solid var(--gold)}
header .wrap{display:flex;align-items:center;gap:14px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.brand .seal{width:42px;height:42px;border-radius:50%;border:2px solid var(--gold);display:grid;place-items:center;flex:none;background:var(--deep)}
.brand .seal svg{width:22px;height:22px;stroke:var(--gold)}
.brand b{display:block;font:800 18px/1.3 var(--f-ui)}
.brand small{display:block;font:600 13px/1.3 var(--f-ui);color:#A9C1CD}
.timer{display:flex;align-items:center;gap:8px;background:var(--deep);border:1px solid #2A5266;border-radius:30px;padding:6px 14px;font:800 18px/1 var(--f-ui);font-variant-numeric:tabular-nums}
.timer svg{width:18px;height:18px;stroke:var(--gold)}
.timer.warn{border-color:var(--bad);color:#FFD2CC}
.hprog{flex-basis:100%;height:6px;background:#0E2A38;border-radius:4px;overflow:hidden}
.hprog i{display:block;height:100%;width:0;background:var(--gold);transition:width .3s}

/* start */
.start{padding-block:28px 40px}
.hero{background:var(--navy);color:#fff;border-radius:24px;padding:30px 28px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;width:420px;height:420px;border-radius:50%;background:#0F2C3B;left:-160px;top:-220px}
.hero:after{content:"";position:absolute;width:300px;height:300px;border-radius:50%;border:2px solid var(--gold);right:-170px;bottom:-200px}
.hero:before,.hero:after{z-index:0}
.hero>*{position:relative;z-index:1}
.hero .eb{color:var(--gold);font:700 15px/1.5 var(--f-ui)}
.hero h1{margin:4px 0 6px;font:900 clamp(30px,5vw,44px)/1.3 var(--f-ui);text-wrap:balance}
.hero p{margin:0;color:#CFE0E8;font:600 17px/1.8 var(--f-ui);max-width:62ch}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}
.stat{background:rgba(255,255,255,.07);border:1px solid #2A5266;border-radius:14px;padding:10px 16px;min-width:110px}
.stat b{display:block;font:900 26px/1.1 var(--f-ui);color:var(--gold)}
.stat span{font:700 14px/1.4 var(--f-ui);color:#CFE0E8}
.grid2{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;margin-top:20px}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:22px}
.panel h2{margin:0 0 12px;font:800 21px/1.4 var(--f-ui);color:var(--navy)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font:700 15px/1.4 var(--f-ui);color:var(--muted)}
.field input{border:2px solid var(--line);border-radius:12px;padding:12px 14px;font:700 18px/1.4 var(--f-ui);color:var(--navy);background:#fff}
.field input:focus{border-color:var(--gold);outline:0}
.rules{margin:0;padding:0 20px 0 0;display:flex;flex-direction:column;gap:8px;font:600 16px/1.7 var(--f-ui)}
.rules b{color:var(--navy)}
.units{display:flex;flex-direction:column;gap:8px}
.unit{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:12px;background:var(--mist)}
.unit .ic{width:36px;height:36px;border-radius:50%;background:var(--navy);display:grid;place-items:center;flex:none}
.unit .ic svg{width:18px;height:18px;stroke:var(--gold)}
.unit span{font:700 15.5px/1.4 var(--f-ui);color:var(--navy);flex:1}
.unit em{font-style:normal;font:800 13px/1 var(--f-ui);color:var(--gold-ink);background:#fff;border-radius:20px;padding:5px 9px}
.btn{border:0;border-radius:14px;padding:13px 24px;font:800 18px/1.2 var(--f-ui);background:var(--navy);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,background .2s}
.btn:hover{transform:translateY(-1px)}
.btn.gold{background:var(--gold);color:var(--deep)}
.btn.ghost{background:#fff;color:var(--navy);border:2px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn svg{width:20px;height:20px}
.err{color:var(--bad);font:700 14px/1.4 var(--f-ui);min-height:20px}

/* exam */
.exam{display:grid;grid-template-columns:1fr 290px;gap:20px;padding-block:22px 110px;align-items:start}
@media (max-width:900px){.exam{grid-template-columns:1fr}}
.qcard{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:24px;min-width:0}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.sec{display:inline-flex;align-items:center;gap:8px;background:var(--mist);color:var(--navy);border-radius:30px;padding:6px 12px 6px 14px;font:800 14px/1.2 var(--f-ui)}
.sec svg{width:16px;height:16px;stroke:var(--gold-ink)}
.qn{font:800 14px/1 var(--f-ui);color:var(--muted)}
.qtype{font:700 13px/1 var(--f-ui);color:var(--gold-ink);background:#FBF5E8;border:1px solid var(--gold-soft);border-radius:20px;padding:5px 10px}
.qtext{font:800 clamp(21px,3vw,27px)/1.75 var(--f-ui);color:var(--navy);margin:4px 0 18px;text-wrap:pretty}
.qtext .h{font-family:var(--f-h);font-weight:700}
.opts{display:grid;gap:12px}
.opt{display:flex;align-items:center;gap:14px;text-align:right;border:2px solid var(--line);background:#fff;border-radius:16px;padding:14px 16px;font:700 19px/1.6 var(--f-ui);color:var(--text);width:100%;transition:border-color .15s,background .15s}
.opt:hover{border-color:#B8C7CF}
.opt b{flex:none;width:38px;height:38px;border-radius:50%;background:var(--mist);color:var(--navy);display:grid;place-items:center;font:900 17px/1 var(--f-ui)}
.opt.sel{border-color:var(--navy);background:#EEF4F7}
.opt.sel b{background:var(--navy);color:#fff}
.tf{grid-template-columns:1fr 1fr}
.tf .opt{justify-content:center;font-size:22px;padding:18px}
.tf .opt svg{width:26px;height:26px}
.hint{font:600 15px/1.6 var(--f-ui);color:var(--muted);margin:-8px 0 14px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:12px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--mist);margin-bottom:10px}
@media (max-width:560px){.mrow{grid-template-columns:1fr}}
.mrow .l{font:800 18px/1.5 var(--f-ui);color:var(--navy)}
.mrow select{width:100%;border:2px solid var(--line);border-radius:12px;padding:10px 12px;font:700 16px/1.5 var(--f-ui);color:var(--text);background:#fff}
.mrow select.done{border-color:var(--navy)}
.order{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:640px){.order{grid-template-columns:1fr}}
.order h4{margin:0 0 8px;font:800 15px/1.4 var(--f-ui);color:var(--muted)}
.pool,.seq{display:flex;flex-direction:column;gap:8px;min-height:60px;border-radius:16px;padding:10px;border:2px dashed var(--line)}
.seq{border-color:var(--gold-soft);background:#FFFCF5}
.chipq{display:flex;align-items:center;gap:10px;border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;font:700 17px/1.5 var(--f-ui);color:var(--text);text-align:right}
.chipq b{flex:none;width:30px;height:30px;border-radius:50%;background:var(--gold);color:var(--deep);display:grid;place-items:center;font:900 15px/1 var(--f-ui)}
.seq .empty,.pool .empty{font:600 14px/1.5 var(--f-ui);color:var(--muted);padding:6px}
.qfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:22px;flex-wrap:wrap}
.flagb{background:#fff;border:2px solid var(--line);color:var(--muted);border-radius:12px;padding:9px 14px;font:800 15px/1 var(--f-ui);display:inline-flex;gap:6px;align-items:center}
.flagb svg{width:18px;height:18px}
.flagb.on{border-color:var(--flag);color:var(--flag);background:#FFF6E3}
.side{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:18px;position:sticky;top:96px}
@media (max-width:900px){.side{position:static}}
.side h3{margin:0 0 10px;font:800 16px/1.4 var(--f-ui);color:var(--navy)}
.map{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;direction:rtl}
@media (max-width:900px){.map{grid-template-columns:repeat(10,1fr)}}
.map button{aspect-ratio:1;border-radius:9px;border:2px solid var(--line);background:#fff;font:800 13px/1 var(--f-ui);color:var(--muted);position:relative;padding:0}
.map button.ans{background:var(--navy);border-color:var(--navy);color:#fff}
.map button.cur{outline:3px solid var(--gold);outline-offset:1px}
.map button.fl:after{content:"";position:absolute;top:-4px;left:-4px;width:10px;height:10px;border-radius:50%;background:var(--flag);border:2px solid #fff}
.legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;font:700 12.5px/1.4 var(--f-ui);color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-left:5px;border:2px solid var(--line)}
.counts{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font:700 15px/1.8 var(--f-ui)}
.counts b{color:var(--navy)}
.bottombar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);z-index:15;padding-bottom:env(safe-area-inset-bottom,0px);backdrop-filter:blur(6px)}
.bottombar .wrap{display:flex;gap:10px;align-items:center;padding-block:12px}
.bottombar .sp{flex:1}
@media (max-width:560px){.bottombar .wrap{gap:8px}.bottombar .btn{padding:11px 14px;font-size:16px}.bottombar .btn svg{display:none}}

/* modal */
.modal{position:fixed;inset:0;background:rgba(8,27,37,.6);display:grid;place-items:center;z-index:40;padding:16px}
.mbox{background:#fff;border-radius:22px;padding:26px;max-width:460px;width:100%;border-top:6px solid var(--gold)}
.mbox h3{margin:0 0 8px;font:900 24px/1.4 var(--f-ui);color:var(--navy)}
.mbox p{margin:0 0 18px;font:600 17px/1.8 var(--f-ui);color:var(--text)}
.mbox .row{display:flex;gap:10px;flex-wrap:wrap}

/* results */
.results{padding-block:24px 50px}
.cert{background:var(--navy);color:#fff;border-radius:26px;padding:28px;display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center;border:3px solid var(--gold);position:relative;overflow:hidden}
.cert:after{content:"";position:absolute;width:360px;height:360px;border-radius:50%;border:2px solid rgba(201,163,90,.5);left:-180px;bottom:-220px}
@media (max-width:640px){.cert{grid-template-columns:1fr;justify-items:center;text-align:center}}
.ring{position:relative;width:190px;height:190px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .v b{display:block;font:900 54px/1 var(--f-ui);color:#fff;direction:ltr}
.ring .v span{font:700 15px/1.4 var(--f-ui);color:#A9C1CD}
.cert .eb{color:var(--gold);font:800 15px/1.5 var(--f-ui)}
.cert h2{margin:2px 0 6px;font:900 clamp(26px,4vw,36px)/1.3 var(--f-ui)}
.cert .grade{display:inline-block;background:var(--gold);color:var(--deep);border-radius:30px;padding:6px 18px;font:900 20px/1.3 var(--f-ui);margin:4px 0 10px}
.cert p{margin:0;color:#CFE0E8;font:600 16px/1.8 var(--f-ui)}
.cert .dua{font:700 21px/1.8 var(--f-h);color:var(--gold-soft);margin-top:8px}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}
@media (max-width:820px){.rgrid{grid-template-columns:1fr}}
.brow{display:grid;grid-template-columns:150px 1fr 54px;gap:10px;align-items:center;margin-bottom:10px}
.brow span{font:700 14.5px/1.35 var(--f-ui);color:var(--navy)}
.brow .tr{height:14px;background:var(--mist);border-radius:8px;overflow:hidden}
.brow .tr i{display:block;height:100%;border-radius:8px;background:var(--navy);transition:width 1s cubic-bezier(.2,.8,.2,1)}
.brow .tr i.lo{background:var(--bad)}
.brow .tr i.hi{background:var(--ok)}
.brow b{font:800 14px/1 var(--f-ui);color:var(--muted);direction:ltr;text-align:left;font-variant-numeric:tabular-nums}
.actions{display:flex;gap:10px;flex-wrap:wrap}
textarea.copybox{width:100%;min-height:150px;margin-top:10px;border:2px solid var(--line);border-radius:12px;padding:10px;font:600 16px/1.7 var(--f-ui);direction:rtl}
.review{margin-top:20px}
.review h2{font:800 22px/1.4 var(--f-ui);color:var(--navy);margin:0 0 10px}
.filters{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.filters button{border:2px solid var(--line);background:#fff;border-radius:30px;padding:7px 14px;font:800 14px/1 var(--f-ui);color:var(--muted)}
.filters button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.ritem{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin-bottom:12px;border-right:6px solid var(--ok)}
.ritem.bad{border-right-color:var(--bad)}
.ritem.part{border-right-color:var(--flag)}
.ritem .top{display:flex;justify-content:space-between;gap:10px;font:800 13px/1.4 var(--f-ui);color:var(--muted);margin-bottom:6px}
.ritem .q{font:800 18px/1.7 var(--f-ui);color:var(--navy)}
.ritem .ans{font:700 16px/1.8 var(--f-ui);margin-top:6px}
.ritem .ans .you{color:var(--bad)}
.ritem .ans .right{color:var(--ok)}
.ritem .ev{margin-top:8px;background:#FBF5E8;border-radius:12px;padding:10px 14px;font:600 15px/1.8 var(--f-ui);color:var(--text)}
.ritem .ev b{color:var(--gold-ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* iPad / touch */
*{-webkit-tap-highlight-color:transparent}
button,select,.flip,.chip,.opt,.mopt,.qopt{touch-action:manipulation}
html,body{overscroll-behavior:none}
</style>

<header><div class="wrap">
  <div class="brand"><div class="seal"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5c3-1.5 7-1.5 10 1 3-2.5 7-2.5 10-1v14c-3-1.5-7-1.5-10 1-3-2.5-7-2.5-10-1z"/><path d="M12 6v14"/></svg></div>
   <div><b>اخْتِبَارُ فِقْهِ الشَّبَابِ</b><small>فقه الشباب في سؤال وجواب · مراتب الدين</small></div></div>
  <div class="timer" id="timer" hidden><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg><span id="tleft">30:00</span></div>
  <div class="hprog" id="hprog" hidden><i></i></div>
</div></header>

<main id="root"></main>

<script>
(function(){
const MIN=30;          // مدة الاختبار بالدقائق
const PER=2.5;         // درجة كل سؤال (40 × 2.5 = 100)
const KEY='fiqh-exam-v1';

const ICON={
 layers:'<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/>',
 moon:'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
 eye:'<path d="M3 3l18 18"/><path d="M10.6 5.1A10.9 10.9 0 0 1 12 5c5 0 9 4.5 10 7-.4 1-1.3 2.4-2.6 3.7M6.6 6.6C4.4 8 2.8 10 2 12c1 2.5 5 7 10 7 1.7 0 3.3-.5 4.7-1.3"/>',
 shirt:'<path d="M8 3l-5 3 2 5 3-1v11h8V10l3 1 2-5-5-3a4 4 0 0 1-8 0z"/>',
 mosque:'<path d="M12 3c-3 2-5 4-5 7h10c0-3-2-5-5-7z"/><path d="M4 21V11h16v10M10 21v-5h4v5M2 21h20"/>',
 ball:'<circle cx="12" cy="12" r="9"/><path d="M12 7l4 3-1.5 4.5h-5L8 10z"/>',
 hands:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.5a5 5 0 0 1 5.5 5"/>',
 gavel:'<path d="M14 4l6 6M11 7l6 6M12.5 5.5l-6 6 3 3 6-6M8 13l-6 6 2 2 6-6"/>',
 check:'<path d="M4 12.5l5 5L20 6.5"/>', x:'<path d="M6 6l12 12M18 6L6 18"/>',
 flag:'<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>',
 arrowR:'<path d="M5 12h14M13 6l6 6-6 6"/>', arrowL:'<path d="M19 12H5M11 6l-6 6 6 6"/>',
 copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>',
 redo:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>'
};
const I=(n,a='')=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ${a}>${ICON[n]}</svg>`;

const SECS=[
 ['مَرَاتِبُ الدِّينِ','layers'],
 ['البُلُوغُ وَعَلَامَاتُهُ','moon'],
 ['غَضُّ البَصَرِ وَحِفْظُ الفَرْجِ','eye'],
 ['المَظْهَرُ وَالزِّينَةُ','shirt'],
 ['الصَّلَاةُ وَحُكْمُ تَارِكِهَا','mosque'],
 ['التَّرْفِيهُ بَيْنَ الحَلَالِ وَالحَرَامِ','ball'],
 ['آدَابُ الأُخُوَّةِ','hands'],
 ['كَبَائِرُ يَجِبُ الحَذَرُ مِنْهَا','gavel']
];

/* t: mcq | tf | match | order ;  a = index of right option (mcq) / true|false (tf) ; fix = don't shuffle options */
const Q=[
 // 0 مراتب الدين
 {s:0,t:'mcq',q:'مَنِ «الضَّيْفُ الغَرِيبُ» الَّذِي جَاءَ يَسْأَلُ النَّبِيَّ ﷺ عَنِ الدِّينِ؟',o:['جِبْرِيلُ عَلَيْهِ السَّلَامُ','عُمَرُ بْنُ الخَطَّابِ','رَجُلٌ مِنَ اليَمَنِ','أَبُو بَكْرٍ الصِّدِّيقُ'],a:0,ev:'قَالَ النَّبِيُّ ﷺ: «فَإِنَّهُ جِبْرِيلُ أَتَاكُمْ يُعَلِّمُكُمْ دِينَكُمْ» [مسلم].'},
 {s:0,t:'order',q:'رَتِّبْ مَرَاتِبَ الدِّينِ مِنَ الأَوْسَعِ (الأَوَّلِ) إِلَى الأَعْلَى:',items:['الإِسْلَامُ','الإِيمَانُ','الإِحْسَانُ'],ev:'الإِسْلَامُ هُوَ الطَّابَقُ الأَوَّلُ، ثُمَّ الإِيمَانُ، ثُمَّ الإِحْسَانُ وَهُوَ أَعْلَى مَرَاتِبِ الدِّينِ.'},
 {s:0,t:'mcq',q:'أَيُّ هَذِهِ لَيْسَ مِنْ أَرْكَانِ الإِسْلَامِ الخَمْسَةِ؟',o:['الشَّهَادَتَانِ','إِقَامُ الصَّلَاةِ','الإِيمَانُ بِالمَلَائِكَةِ','صَوْمُ رَمَضَانَ'],a:2,ev:'الإِيمَانُ بِالمَلَائِكَةِ مِنْ أَرْكَانِ «الإِيمَانِ» السِّتَّةِ. وَأَرْكَانُ الإِسْلَامِ: الشَّهَادَتَانِ، الصَّلَاةُ، الزَّكَاةُ، الصَّوْمُ، الحَجُّ.'},
 {s:0,t:'match',q:'صِلْ كُلَّ مَرْتَبَةٍ بِمَا يُنَاسِبُهَا:',pairs:[['الإِسْلَامُ','أَعْمَالٌ ظَاهِرَةٌ بِالجَوَارِحِ (5 أَرْكَانٍ)'],['الإِيمَانُ','أَعْمَالٌ بَاطِنَةٌ فِي القَلْبِ (6 أَرْكَانٍ)'],['الإِحْسَانُ','أَنْ تَعْبُدَ اللهَ كَأَنَّكَ تَرَاهُ (رُكْنٌ وَاحِدٌ)']],ev:'الإِسْلَامُ مَحَلُّهُ الجَوَارِحُ، وَالإِيمَانُ مَحَلُّهُ القَلْبُ، وَالإِحْسَانُ: «أَنْ تَعْبُدَ اللهَ كَأَنَّكَ تَرَاهُ، فَإِنْ لَمْ تَكُنْ تَرَاهُ فَإِنَّهُ يَرَاكَ».'},
 {s:0,t:'mcq',q:'كَمْ رُكْنًا لِلْإِيمَانِ؟',o:['خَمْسَةٌ','سِتَّةٌ','ثَلَاثَةٌ','سَبْعَةٌ'],a:1,ev:'أَنْ تُؤْمِنَ بِاللهِ، وَمَلَائِكَتِهِ، وَكُتُبِهِ، وَرُسُلِهِ، وَاليَوْمِ الآخِرِ، وَالقَدَرِ خَيْرِهِ وَشَرِّهِ.'},
 {s:0,t:'tf',q:'كُلُّ مُسْلِمٍ قَدْ وَصَلَ إِلَى مَرْتَبَةِ الإِحْسَانِ.',a:false,ev:'كُلُّ مُحْسِنٍ مُؤْمِنٌ وَمُسْلِمٌ، لَكِنْ لَيْسَ كُلُّ مُسْلِمٍ وَصَلَ إِلَى الإِحْسَانِ. الإِسْلَامُ أَوْسَعُ الدَّوَائِرِ، وَالإِحْسَانُ أَضْيَقُهَا.'},
 // 1 البلوغ
 {s:1,t:'mcq',q:'مِنْ عَلَامَاتِ البُلُوغِ المُشْتَرَكَةِ بَيْنَ الذَّكَرِ وَالأُنْثَى:',o:['الاحْتِلَامُ','الإِنْبَاتُ (ظُهُورُ شَعْرِ العَانَةِ)','بُلُوغُ 15 سَنَةً قَمَرِيَّةً','كُلُّ مَا سَبَقَ'],a:3,fix:1,ev:'العَلَامَاتُ المُشْتَرَكَةُ ثَلَاثٌ: الاحْتِلَامُ، وَالإِنْبَاتُ، وَبُلُوغُ خَمْسَ عَشْرَةَ سَنَةً.'},
 {s:1,t:'mcq',q:'ابْنُ عُمَرَ رَضِيَ اللهُ عَنْهُمَا أَجَازَهُ النَّبِيُّ ﷺ لِلْقِتَالِ يَوْمَ الخَنْدَقِ وَهُوَ ابْنُ:',o:['12 سَنَةً','14 سَنَةً','15 سَنَةً','18 سَنَةً'],a:2,ev:'«عَرَضَنِي يَوْمَ أُحُدٍ وَأَنَا ابْنُ أَرْبَعَ عَشْرَةَ فَلَمْ يُجِزْنِي، وَعَرَضَنِي يَوْمَ الخَنْدَقِ وَأَنَا ابْنُ خَمْسَ عَشْرَةَ فَأَجَازَنِي» [متفق عليه].'},
 {s:1,t:'match',q:'صِلْ كُلَّ وَاحِدٍ بِحُكْمِهِ:',pairs:[['المَنِيُّ','يُوجِبُ الغُسْلَ الكَامِلَ'],['المَذْيُ','يُوجِبُ الوُضُوءَ وَغَسْلَ الذَّكَرِ'],['الوَدْيُ','حُكْمُهُ حُكْمُ البَوْلِ: يُوجِبُ الوُضُوءَ']],ev:'المَنِيُّ يَخْرُجُ بِدَفْقٍ عِنْدَ الشَّهْوَةِ وَيُوجِبُ الغُسْلَ، وَالمَذْيُ رَقِيقٌ شَفَّافٌ، وَالوَدْيُ أَبْيَضُ ثَخِينٌ بَعْدَ البَوْلِ.'},
 {s:1,t:'tf',q:'إِذَا احْتَلَمَ الشَّابُّ فِي نَوْمِهِ وَلَمْ يَجِدْ مَنِيًّا، فَلَا غُسْلَ عَلَيْهِ.',a:true,ev:'العِبْرَةُ بِخُرُوجِ المَنِيِّ: إِنْ لَمْ يَجِدْ مَنِيًّا فَلَا غُسْلَ عَلَيْهِ.'},
 {s:1,t:'order',q:'رَتِّبْ صِفَةَ الغُسْلِ الكَامِلِ مِنَ الجَنَابَةِ:',items:['النِّيَّةُ وَالبَسْمَلَةُ','غَسْلُ اليَدَيْنِ ثَلَاثًا ثُمَّ الفَرْجِ','الوُضُوءُ كَوُضُوءِ الصَّلَاةِ','إِفَاضَةُ المَاءِ عَلَى الرَّأْسِ ثَلَاثًا','إِفَاضَةُ المَاءِ عَلَى الجَسَدِ بِالأَيْمَنِ ثُمَّ الأَيْسَرِ'],ev:'هَذِهِ الصِّفَةُ الكَامِلَةُ، ثُمَّ يَغْسِلُ قَدَمَيْهِ. وَالصِّفَةُ المُجْزِئَةُ: النِّيَّةُ وَتَعْمِيمُ الجَسَدِ بِالمَاءِ.'},
 // 2 غض البصر
 {s:2,t:'mcq',q:'آيَةُ ﴿قُل لِّلْمُؤْمِنِينَ يَغُضُّوا مِنْ أَبْصَارِهِمْ﴾ فِي سُورَةِ:',o:['النُّورِ','البَقَرَةِ','يُوسُفَ','الكَهْفِ'],a:0,ev:'﴿قُل لِّلْمُؤْمِنِينَ يَغُضُّوا مِنْ أَبْصَارِهِمْ وَيَحْفَظُوا فُرُوجَهُمْ ۚ ذَٰلِكَ أَزْكَىٰ لَهُمْ﴾ [النور: 30].'},
 {s:2,t:'mcq',q:'النَّظْرَةُ الأُولَى الَّتِي تَأْتِي فَجْأَةً بِدُونِ قَصْدٍ:',o:['لَا إِثْمَ فِيهَا، وَعَلَيْكَ أَنْ تَصْرِفَ بَصَرَكَ','عَلَيْكَ فِيهَا إِثْمٌ كَبِيرٌ','يَجُوزُ أَنْ تُكَرِّرَهَا','تُبْطِلُ الصَّلَاةَ'],a:0,ev:'«يَا عَلِيُّ، لَا تُتْبِعِ النَّظْرَةَ النَّظْرَةَ، فَإِنَّ لَكَ الأُولَى وَلَيْسَتْ لَكَ الآخِرَةُ» [أبو داود والترمذي].'},
 {s:2,t:'match',q:'صِلْ كُلَّ وَاحِدَةٍ بِحُكْمِ النَّظَرِ إِلَيْهَا:',pairs:[['الزَّوْجَةُ','يَجُوزُ النَّظَرُ إِلَيْهَا عَلَى كُلِّ حَالٍ'],['المَحَارِمُ (الأُمُّ، الأُخْتُ…)','يَجُوزُ النَّظَرُ إِلَى الوَجْهِ وَالأَطْرَافِ'],['الأَجْنَبِيَّةُ','لَا يَجُوزُ النَّظَرُ إِلَيْهَا إِلَّا لِضَرُورَةٍ']],ev:'وَاسْتُثْنِيَ مِنَ الأَجْنَبِيَّةِ حَالَاتُ الضَّرُورَةِ كَالكَشْفِ الطِّبِّيِّ.'},
 {s:2,t:'mcq',q:'حُكْمُ العَادَةِ السِّرِّيَّةِ عِنْدَ جُمْهُورِ العُلَمَاءِ:',o:['مُحَرَّمَةٌ','مُبَاحَةٌ','مُسْتَحَبَّةٌ','وَاجِبَةٌ'],a:0,ev:'لِقَوْلِهِ تَعَالَى: ﴿فَمَنِ ابْتَغَىٰ وَرَاءَ ذَٰلِكَ فَأُولَٰئِكَ هُمُ الْعَادُونَ﴾ [المؤمنون: 7].'},
 {s:2,t:'mcq',q:'فِي حَدِيثِ «يَا مَعْشَرَ الشَّبَابِ»: مَنْ لَمْ يَسْتَطِعِ الزَّوَاجَ فَعَلَيْهِ بِـ…',o:['الصَّوْمِ','النَّوْمِ','السَّفَرِ','الرِّيَاضَةِ فَقَطْ'],a:0,ev:'«وَمَنْ لَمْ يَسْتَطِعْ فَعَلَيْهِ بِالصَّوْمِ، فَإِنَّهُ لَهُ وِجَاءٌ» [متفق عليه]. وِجَاءٌ = حِمَايَةٌ.'},
 {s:2,t:'tf',q:'الصُّوَرُ وَالفِيدْيُوهَاتُ عَلَى الشَّاشَةِ لَيْسَ لَهَا حُكْمُ النَّظَرِ، لِأَنَّهَا لَيْسَتْ حَقِيقِيَّةً.',a:false,ev:'الشَّاشَةُ مِثْلُ الشَّارِعِ: النَّظَرُ إِلَى الحَرَامِ فِيهَا حَرَامٌ، وَمُشَاهَدَةُ الأَفْلَامِ الإِبَاحِيَّةِ حَرَامٌ قَطْعًا.'},
 {s:2,t:'mcq',q:'فِي دِرَاسَةٍ عَلَى 304 مَشَاهِدَ مِنْ أَفْلَامٍ إِبَاحِيَّةٍ: 88 مِنْ كُلِّ 100 مَشْهَدٍ فِيهِ…',o:['عُنْفٌ وَضَرْبٌ','حُبٌّ وَرَحْمَةٌ','تَعْلِيمٌ مُفِيدٌ','رِيَاضَةٌ'],a:0,ev:'هَذِهِ الأَفْلَامُ كَذِبٌ وَتَمْثِيلٌ وَعُنْفٌ، وَلَيْسَتْ حُبًّا (دِرَاسَةُ Bridges، 2010).'},
 {s:2,t:'mcq',q:'جَاءَ شَابٌّ يَسْتَأْذِنُ النَّبِيَّ ﷺ فِي الزِّنَا، فَمَاذَا سَأَلَهُ النَّبِيُّ ﷺ؟',o:['«أَتُحِبُّهُ لِأُمِّكَ؟»','«كَمْ عُمْرُكَ؟»','«مِنْ أَيِّ قَبِيلَةٍ أَنْتَ؟»','لَمْ يَسْأَلْهُ وَأَمَرَ بِطَرْدِهِ'],a:0,ev:'ثُمَّ دَعَا لَهُ: «اللَّهُمَّ اغْفِرْ ذَنْبَهُ، وَطَهِّرْ قَلْبَهُ، وَحَصِّنْ فَرْجَهُ» [أحمد].'},
 {s:2,t:'mcq',q:'أَيُّ هَذِهِ لَيْسَ مِنْ شُرُوطِ مُشَاهَدَةِ الأَفْلَامِ وَالمُسَلْسَلَاتِ؟',o:['أَلَّا تَحْتَوِيَ عَلَى المَعَازِفِ','أَلَّا تَحْتَوِيَ عَلَى النِّسَاءِ المُتَبَرِّجَاتِ','أَنْ تَدْعُوَ إِلَى مَكَارِمِ الأَخْلَاقِ','أَنْ تَكُونَ طَوِيلَةً'],a:3,ev:'وَكُلَّمَا اخْتَلَّتْ هَذِهِ الشُّرُوطُ فَالأَوْلَى الابْتِعَادُ عَنْهَا؛ فَإِنَّ السَّلَامَةَ لَا يَعْدِلُهَا شَيْءٌ.'},
 // 3 المظهر
 {s:3,t:'mcq',q:'حُكْمُ حَلْقِ اللِّحْيَةِ عِنْدَ جُمْهُورِ الفُقَهَاءِ:',o:['يَحْرُمُ','يُسْتَحَبُّ','يَجِبُ','مُبَاحٌ بِلَا كَرَاهَةٍ'],a:0,ev:'«أَحْفُوا الشَّوَارِبَ وَأَعْفُوا اللِّحَى» [متفق عليه]. وَيُسَنُّ قَصُّ الشَّارِبِ.'},
 {s:3,t:'mcq',q:'مَا مَعْنَى «القَزَعِ»؟',o:['حَلْقُ بَعْضِ شَعْرِ الرَّأْسِ وَتَرْكُ بَعْضِهِ','حَلْقُ الرَّأْسِ كُلِّهِ','إِطَالَةُ الشَّعْرِ','صَبْغُ الشَّعْرِ'],a:0,ev:'ثَبَتَ النَّهْيُ عَنِ القَزَعِ فِي الصَّحِيحَيْنِ عَنِ ابْنِ عُمَرَ رَضِيَ اللهُ عَنْهُمَا.'},
 {s:3,t:'mcq',q:'أَيُّ خَاتَمٍ لَا يَجُوزُ لِلرَّجُلِ أَنْ يَلْبَسَهُ؟',o:['خَاتَمُ الذَّهَبِ','خَاتَمُ الفِضَّةِ','خَاتَمُ الحَدِيدِ (عَلَى الرَّاجِحِ)','لَا شَيْءَ مِمَّا سَبَقَ'],a:0,fix:1,ev:'نَهَى النَّبِيُّ ﷺ عَنِ التَّخَتُّمِ بِالذَّهَبِ لِلرِّجَالِ، وَلَبِسَ ﷺ خَاتَمًا مِنْ فِضَّةٍ.'},
 {s:3,t:'mcq',q:'عَوْرَةُ الرَّجُلِ فِي أَرْجَحِ الأَقْوَالِ:',o:['مِنَ السُّرَّةِ إِلَى الرُّكْبَةِ','الرُّكْبَةُ فَقَطْ','الوَجْهُ وَاليَدَانِ','مِنَ الصَّدْرِ إِلَى القَدَمِ'],a:0,ev:'لِذَلِكَ لَا يَجُوزُ لُبْسُ الضَّيِّقِ أَوِ المُمَزَّقِ الَّذِي يُبَيِّنُ العَوْرَةَ.'},
 {s:3,t:'tf',q:'يَجُوزُ تَعْلِيقُ «الحَظَّاظَةِ» وَالتَّمَائِمِ مِنَ العِظَامِ وَالوَدَعِ لِلْحِمَايَةِ.',a:false,ev:'«مَنْ تَعَلَّقَ تَمِيمَةً فَقَدْ أَشْرَكَ» [أحمد]. فَهِيَ مُحَرَّمَةٌ.'},
 // 4 الصلاة
 {s:4,t:'mcq',q:'أَكْمِلِ الحَدِيثَ: «العَهْدُ الَّذِي بَيْنَنَا وَبَيْنَهُمُ … فَمَنْ تَرَكَهَا فَقَدْ كَفَرَ»',o:['الصَّلَاةُ','الصَّوْمُ','الزَّكَاةُ','الحَجُّ'],a:0,ev:'رَوَاهُ أَصْحَابُ السُّنَنِ.'},
 {s:4,t:'mcq',q:'الصَّلَاةُ فِي الإِسْلَامِ مِثْلُ… البَيْتِ.',o:['العَمُودِ','البَابِ','النَّافِذَةِ','السَّقْفِ'],a:0,ev:'«فَإِنَّهَا عَمُودُ الإِسْلَامِ، فَمَنْ أَقَامَهَا فَقَدْ أَقَامَ الدِّينَ، وَمَنْ تَرَكَهَا فَقَدْ هَدَمَ الدِّينَ».'},
 {s:4,t:'tf',q:'تَرْكُ الصَّلَاةِ بِالكُلِّيَّةِ كَسَلًا ذَنْبٌ صَغِيرٌ.',a:false,ev:'«إِنَّ بَيْنَ الرَّجُلِ وَبَيْنَ الشِّرْكِ وَالكُفْرِ تَرْكَ الصَّلَاةِ» [مسلم]. وَهُوَ كُفْرٌ عِنْدَ جُمْهُورِ السَّلَفِ.'},
 // 5 الترفيه
 {s:5,t:'mcq',q:'الأَصْلُ فِي مُمَارَسَةِ الرِّيَاضَةِ مِثْلَ كُرَةِ القَدَمِ:',o:['الإِبَاحَةُ بِضَوَابِطَ','التَّحْرِيمُ','الوُجُوبُ','الكَرَاهَةُ دَائِمًا'],a:0,ev:'بِشَرْطِ: سَتْرِ العَوْرَةِ، وَعَدَمِ تَضْيِيعِ الصَّلَاةِ وَالوَقْتِ، وَاجْتِنَابِ التَّعَصُّبِ.'},
 {s:5,t:'mcq',q:'حُكْمُ المَعَازِفِ (آلَاتِ المُوسِيقَى) عِنْدَ جُمْهُورِ العُلَمَاءِ:',o:['التَّحْرِيمُ','الاسْتِحْبَابُ','الوُجُوبُ','لَا خِلَافَ فِي جَوَازِهَا'],a:0,ev:'«لَيَكُونَنَّ مِنْ أُمَّتِي أَقْوَامٌ يَسْتَحِلُّونَ الحِرَ وَالحَرِيرَ وَالخَمْرَ وَالمَعَازِفَ» [البخاري].'},
 {s:5,t:'tf',q:'يَجُوزُ لِلشَّابِّ أَنْ يُرَاسِلَ فَتَاةً أَجْنَبِيَّةً عَنْهُ إِذَا ظَنَّ أَنَّهُ آمِنٌ مِنَ الفِتْنَةِ.',a:false,ev:'لَا يَجُوزُ وَإِنْ ظَنَّ أَنَّهُ آمِنٌ. ﴿فَلَا تَخْضَعْنَ بِالْقَوْلِ فَيَطْمَعَ الَّذِي فِي قَلْبِهِ مَرَضٌ﴾ [الأحزاب: 32].'},
 {s:5,t:'tf',q:'مُشَاهَدَةُ المُبَارَيَاتِ الَّتِي تُضَيِّعُ الوَقْتَ وَالصَّلَاةَ لَا يَنْبَغِي لِلْمُسْلِمِ.',a:true,ev:'وَمُشَاهَدَةُ بَعْضِهَا بِدُونِ تَضْيِيعِ الصَّلَاةِ وَالوَقْتِ لَا بَأْسَ بِهَا، مَعَ الحَذَرِ مِنَ التَّعَصُّبِ.'},
 // 6 الأخوة
 {s:6,t:'mcq',q:'أَكْمِلْ: «سِبَابُ المُسْلِمِ … وَقِتَالُهُ كُفْرٌ»',o:['فُسُوقٌ','مُبَاحٌ','مِزَاحٌ','صَغِيرَةٌ'],a:0,ev:'مُتَّفَقٌ عَلَيْهِ. وَقَالَ تَعَالَى: ﴿إِنَّمَا الْمُؤْمِنُونَ إِخْوَةٌ فَأَصْلِحُوا بَيْنَ أَخَوَيْكُمْ﴾.'},
 {s:6,t:'mcq',q:'مَا هِيَ «الغِيبَةُ»؟',o:['ذِكْرُكَ أَخَاكَ بِمَا يَكْرَهُ','نَقْلُ الكَلَامِ بَيْنَ النَّاسِ لِلْإِفْسَادِ','الكَذِبُ فِي البَيْعِ','السُّكُوتُ عَنِ الحَقِّ'],a:0,ev:'قَالَ ﷺ: «الغِيبَةُ ذِكْرُكَ أَخَاكَ بِمَا يَكْرَهُ». وَنَقْلُ الكَلَامِ لِلْإِفْسَادِ هُوَ «النَّمِيمَةُ».'},
 {s:6,t:'tf',q:'الاسْتِهْزَاءُ بِاللهِ أَوْ بِالدِّينِ عَلَى سَبِيلِ المِزَاحِ لَا شَيْءَ فِيهِ.',a:false,ev:'﴿قُلْ أَبِاللَّهِ وَآيَاتِهِ وَرَسُولِهِ كُنتُمْ تَسْتَهْزِئُونَ ۝ لَا تَعْتَذِرُوا قَدْ كَفَرْتُم بَعْدَ إِيمَانِكُمْ﴾ [التوبة: 65–66].'},
 {s:6,t:'mcq',q:'أَكْمِلْ: «لَيْسَ المُؤْمِنُ بِالطَّعَّانِ، وَلَا اللَّعَّانِ، وَلَا الفَاحِشِ، وَلَا …»',o:['البَذِيءِ','الغَنِيِّ','الضَّعِيفِ','الصَّامِتِ'],a:0,ev:'فَالأَلْفَاظُ البَذِيئَةُ فِي المِزَاحِ لَا تَلِيقُ بِالمُسْلِمِ.'},
 // 7 الكبائر
 {s:7,t:'mcq',q:'قَالَ تَعَالَى: ﴿وَلَا تَقْرَبُوا الزِّنَا﴾. النَّهْيُ عَنِ «القُرْبِ» يَشْمَلُ:',o:['المُقَدِّمَاتِ كَالخَلْوَةِ وَالنَّظَرِ المُحَرَّمِ','الفِعْلَ فَقَطْ','الكَلَامَ عَنِ الزَّوَاجِ','لَا شَيْءَ'],a:0,ev:'﴿وَلَا تَقْرَبُوا الزِّنَىٰ ۖ إِنَّهُ كَانَ فَاحِشَةً وَسَاءَ سَبِيلًا﴾ [الإسراء: 32]. وَ«الزِّنَا عَبْرَ الإِنْتَرْنِتْ» مِنْ وَسَائِلِهِ.'},
 {s:7,t:'mcq',q:'«قَذْفُ المُحْصَنَاتِ» مَعْنَاهُ:',o:['اتِّهَامُ المَرْأَةِ العَفِيفَةِ بِالزِّنَا بِلَا بَيِّنَةٍ','السَّلَامُ عَلَى النِّسَاءِ','الزَّوَاجُ مِنِ امْرَأَةٍ صَالِحَةٍ','الدُّعَاءُ لِلنِّسَاءِ'],a:0,ev:'وَهُوَ مِنَ السَّبْعِ المُوبِقَاتِ: «اجْتَنِبُوا السَّبْعَ المُوبِقَاتِ… وَقَذْفُ المُحْصَنَاتِ الغَافِلَاتِ المُؤْمِنَاتِ» [متفق عليه].'},
 {s:7,t:'tf',q:'المِزَاحُ بِاتِّهَامِ النَّاسِ بِالفَاحِشَةِ («الهَزَارُ») أَمْرٌ عَادِيٌّ لَا يَضُرُّ.',a:false,ev:'هَذَا خَطَأٌ عَظِيمٌ؛ فَهُوَ مِنَ القَذْفِ الَّذِي هُوَ مِنَ الكَبَائِرِ.'},
 {s:7,t:'mcq',q:'السَّرِقَةُ وَاللِّوَاطُ (عَمَلُ قَوْمِ لُوطٍ) مِنْ:',o:['كَبَائِرِ الذُّنُوبِ','صَغَائِرِ الذُّنُوبِ','الأُمُورِ المُبَاحَةِ','المَكْرُوهَاتِ الخَفِيفَةِ'],a:0,ev:'﴿وَالسَّارِقُ وَالسَّارِقَةُ فَاقْطَعُوا أَيْدِيَهُمَا﴾ [المائدة: 38]، وَقَدْ أَهْلَكَ اللهُ قَوْمَ لُوطٍ بِأَشَدِّ العَذَابِ.'}
];

const TYPE={mcq:'اخْتِيَارٌ مِنْ مُتَعَدِّدٍ',tf:'صَحٌّ أَمْ خَطَأٌ',match:'تَوْصِيلٌ',order:'تَرْتِيبٌ'};
const LET=['أ','ب','ج','د'];
const root=document.getElementById('root');
const $=s=>document.querySelector(s);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* state */
let S=null; // {name,group,start,end,order:[qi],optOrder:{qi:[...]},ans:{},flags:{},cur,done}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){return null}}

/* ---------- start screen ---------- */
function startScreen(){
 $('#timer').hidden=true;$('#hprog').hidden=true;
 const prev=load();
 const counts=SECS.map((_,i)=>Q.filter(q=>q.s===i).length);
 root.innerHTML=`<div class="wrap start">
 <section class="hero"><div class="eb">الاخْتِبَارُ الشَّامِلُ</div><h1>فِقْهُ الشَّبَابِ وَمَرَاتِبُ الدِّينِ</h1>
  <p>اخْتِبَارٌ عَلَى كُلِّ الدُّرُوسِ الَّتِي دَرَسْنَاهَا. اقْرَأْ كُلَّ سُؤَالٍ جَيِّدًا، ثُمَّ اخْتَرِ الإِجَابَةَ. بِالتَّوْفِيقِ إِنْ شَاءَ اللهُ.</p>
  <div class="stats"><div class="stat"><b>${Q.length}</b><span>سُؤَالًا</span></div><div class="stat"><b>100</b><span>الدَّرَجَةُ الكُلِّيَّةُ</span></div><div class="stat"><b>${MIN}</b><span>دَقِيقَةً</span></div><div class="stat"><b>8</b><span>أَقْسَامٍ</span></div></div>
 </section>
 <div class="grid2">
  <section class="panel"><h2>بَيَانَاتُ الطَّالِبِ</h2>
   <div class="field"><label for="sname">الاسْمُ الكَامِلُ</label><input id="sname" autocomplete="name" placeholder="اكْتُبِ اسْمَكَ هُنَا" value="${esc(prev&&!prev.done?prev.name:'')}"></div>
   <div class="field"><label for="sgroup">المَجْمُوعَةُ أَوِ الفَصْلُ (اخْتِيَارِيٌّ)</label><input id="sgroup" placeholder="مِثَالٌ: مَجْمُوعَةُ السَّبْتِ" value="${esc(prev&&!prev.done?prev.group||'':'')}"></div>
   <h2 style="margin-top:6px">التَّعْلِيمَاتُ</h2>
   <ol class="rules">
    <li>عِنْدَكَ <b>${MIN} دَقِيقَةً</b>. عِنْدَمَا يَنْتَهِي الوَقْتُ، يُسَلَّمُ الاخْتِبَارُ وَحْدَهُ.</li>
    <li>كُلُّ سُؤَالٍ = <b>${PER} دَرَجَةٍ</b>. فِي «التَّوْصِيلِ» وَ«التَّرْتِيبِ» تَأْخُذُ جُزْءًا مِنَ الدَّرَجَةِ عَلَى كُلِّ جُزْءٍ صَحِيحٍ.</li>
    <li>تَسْتَطِيعُ الرُّجُوعَ لِأَيِّ سُؤَالٍ، وَوَضْعَ <b>عَلَامَةِ مُرَاجَعَةٍ</b> عَلَى السُّؤَالِ.</li>
    <li>بَعْدَ التَّسْلِيمِ تَرَى دَرَجَتَكَ، وَالإِجَابَةَ الصَّحِيحَةَ مَعَ الدَّلِيلِ.</li>
   </ol>
  </section>
  <section class="panel"><h2>أَقْسَامُ الاخْتِبَارِ</h2><div class="units">
   ${SECS.map((s,i)=>`<div class="unit"><div class="ic">${I(s[1])}</div><span>${s[0]}</span><em>${counts[i]} أَسْئِلَةٍ</em></div>`).join('')}
  </div></section>
 </div>
 <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:20px">
  ${prev&&!prev.done?`<button class="btn gold" id="resume">أَكْمِلِ الاخْتِبَارَ السَّابِقَ ${I('arrowL')}</button><button class="btn ghost" id="go">ابْدَأْ مِنْ جَدِيدٍ</button>`:`<button class="btn gold" id="go">ابْدَأِ الاخْتِبَارَ ${I('arrowL')}</button>`}
  <span class="err" id="err"></span>
 </div></div>`;
 $('#go').onclick=()=>{const n=$('#sname').value.trim();if(n.length<3){$('#err').textContent='اكْتُبِ اسْمَكَ أَوَّلًا (3 أَحْرُفٍ عَلَى الأَقَلِّ).';$('#sname').focus();return}
  // shuffle questions inside each section, keep section order; shuffle options
  const order=[];SECS.forEach((_,si)=>shuffle(Q.map((q,i)=>i).filter(i=>Q[i].s===si)).forEach(i=>order.push(i)));
  const optOrder={};Q.forEach((q,i)=>{if(q.t==='mcq')optOrder[i]=q.fix?[0,1,2,3]:shuffle([0,1,2,3]);if(q.t==='match')optOrder[i]=shuffle(q.pairs.map((_,k)=>k));if(q.t==='order')optOrder[i]=shuffle(q.items.map((_,k)=>k))});
  S={name:n,group:$('#sgroup').value.trim(),start:Date.now(),end:Date.now()+MIN*60000,order,optOrder,ans:{},flags:{},cur:0,done:false};save();examScreen()};
 const r=$('#resume');if(r)r.onclick=()=>{S=prev;if(Date.now()>=S.end){finish();return}examScreen()};
}

/* ---------- exam ---------- */
let tick=null;
function answered(qi){const q=Q[qi],a=S.ans[qi];if(a==null)return false;
 if(q.t==='match')return q.pairs.every((_,k)=>a[k]!=null&&a[k]!=='');
 if(q.t==='order')return a.length===q.items.length;return true}
function examScreen(){
 $('#timer').hidden=false;$('#hprog').hidden=false;
 root.innerHTML=`<div class="wrap exam"><section class="qcard" id="qcard" aria-live="polite"></section>
 <aside class="side"><h3>خَرِيطَةُ الأَسْئِلَةِ</h3><div class="map" id="map"></div>
  <div class="legend"><span><i style="background:var(--navy);border-color:var(--navy)"></i>أُجِيبَ</span><span><i></i>لَمْ يُجَبْ</span><span><i style="background:var(--flag);border-color:var(--flag);border-radius:50%"></i>لِلْمُرَاجَعَةِ</span></div>
  <div class="counts" id="counts"></div></aside></div>
 <div class="bottombar"><div class="wrap"><button class="btn ghost" id="prev">${I('arrowR')} السَّابِقُ</button><div class="sp"></div><button class="btn" id="next">التَّالِي ${I('arrowL')}</button><button class="btn gold" id="submit">تَسْلِيمٌ</button></div></div>`;
 $('#prev').onclick=()=>go(S.cur-1);$('#next').onclick=()=>go(S.cur+1);$('#submit').onclick=confirmSubmit;
 clearInterval(tick);tick=setInterval(updTimer,500);updTimer();render();
}
function updTimer(){const ms=Math.max(0,S.end-Date.now());const m=Math.floor(ms/60000),s=Math.floor(ms/1000)%60;
 $('#tleft').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');$('#timer').classList.toggle('warn',ms<5*60000);
 if(ms<=0){clearInterval(tick);finish()}}
function go(i){if(i<0||i>=S.order.length)return;S.cur=i;save();render();window.scrollTo({top:0,behavior:'smooth'})}
function render(){
 const qi=S.order[S.cur],q=Q[qi],a=S.ans[qi];
 let body='';
 if(q.t==='mcq'){body=`<div class="opts">${S.optOrder[qi].map((k,pos)=>`<button class="opt ${a===k?'sel':''}" data-k="${k}"><b>${LET[pos]}</b><span>${q.o[k]}</span></button>`).join('')}</div>`}
 else if(q.t==='tf'){body=`<div class="opts tf"><button class="opt ${a===true?'sel':''}" data-tf="1">${I('check')} صَحٌّ</button><button class="opt ${a===false?'sel':''}" data-tf="0">${I('x')} خَطَأٌ</button></div>`}
 else if(q.t==='match'){const rights=S.optOrder[qi];const cur=a||{};
  body=`<p class="hint">اخْتَرْ مِنَ القَائِمَةِ المَعْنَى المُنَاسِبَ لِكُلِّ كَلِمَةٍ.</p>${q.pairs.map((p,k)=>`<div class="mrow"><span class="l">${p[0]}</span><select data-k="${k}" class="${cur[k]!=null&&cur[k]!==''?'done':''}" aria-label="${esc(p[0])}"><option value="">— اخْتَرْ —</option>${rights.map(r=>`<option value="${r}" ${String(cur[k])===String(r)?'selected':''}>${q.pairs[r][1]}</option>`).join('')}</select></div>`).join('')}`}
 else if(q.t==='order'){const seq=a||[];const pool=S.optOrder[qi].filter(k=>!seq.includes(k));
  body=`<p class="hint">اضْغَطْ عَلَى الخُطُوَاتِ بِالتَّرْتِيبِ. لِلتَّعْدِيلِ: اضْغَطْ عَلَى الخُطْوَةِ فِي «تَرْتِيبِكَ» لِتُرْجِعَهَا.</p>
  <div class="order"><div><h4>الخُطُوَاتُ</h4><div class="pool">${pool.length?pool.map(k=>`<button class="chipq" data-add="${k}">${q.items[k]}</button>`).join(''):'<span class="empty">تَمَّ! ✓</span>'}</div></div>
  <div><h4>تَرْتِيبُكَ</h4><div class="seq">${seq.length?seq.map((k,n)=>`<button class="chipq" data-rm="${n}"><b>${n+1}</b>${q.items[k]}</button>`).join(''):'<span class="empty">ابْدَأْ بِالضَّغْطِ عَلَى الخُطْوَةِ الأُولَى.</span>'}</div></div></div>`}
 const sec=SECS[q.s];
 $('#qcard').innerHTML=`<div class="qhead"><span class="sec">${I(sec[1])}${sec[0]}</span><span class="qtype">${TYPE[q.t]}</span></div>
  <div class="qn">سُؤَالٌ ${S.cur+1} مِنْ ${S.order.length}</div>
  <div class="qtext">${q.q}</div>${body}
  <div class="qfoot"><button class="flagb ${S.flags[qi]?'on':''}" id="flag">${I('flag')} ${S.flags[qi]?'عَلَيْهِ عَلَامَةُ مُرَاجَعَةٍ':'ضَعْ عَلَامَةَ مُرَاجَعَةٍ'}</button><span class="qn">${PER} دَرَجَةٍ</span></div>`;
 const card=$('#qcard');
 card.querySelectorAll('[data-k].opt').forEach(b=>b.onclick=()=>{S.ans[qi]=+b.dataset.k;save();render()});
 card.querySelectorAll('[data-tf]').forEach(b=>b.onclick=()=>{S.ans[qi]=b.dataset.tf==='1';save();render()});
 card.querySelectorAll('select').forEach(sl=>sl.onchange=()=>{const cur=Object.assign({},S.ans[qi]||{});cur[sl.dataset.k]=sl.value===''?null:+sl.value;S.ans[qi]=cur;save();render()});
 card.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{S.ans[qi]=(S.ans[qi]||[]).concat(+b.dataset.add);save();render()});
 card.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{const s=(S.ans[qi]||[]).slice();s.splice(+b.dataset.rm,1);S.ans[qi]=s.length?s:null;save();render()});
 $('#flag').onclick=()=>{S.flags[qi]=!S.flags[qi];save();render()};
 $('#prev').disabled=S.cur===0;$('#next').disabled=S.cur===S.order.length-1;
 // map
 $('#map').innerHTML=S.order.map((qq,n)=>`<button class="${answered(qq)?'ans':''} ${n===S.cur?'cur':''} ${S.flags[qq]?'fl':''}" data-n="${n}" aria-label="سؤال ${n+1}">${n+1}</button>`).join('');
 $('#map').querySelectorAll('button').forEach(b=>b.onclick=()=>go(+b.dataset.n));
 const done=S.order.filter(answered).length,fl=S.order.filter(x=>S.flags[x]).length;
 $('#counts').innerHTML=`أُجِيبَ: <b>${done}</b> مِنْ ${S.order.length}<br>لِلْمُرَاجَعَةِ: <b>${fl}</b>`;
 $('#hprog i').style.width=(done/S.order.length*100)+'%';
}
function confirmSubmit(){
 const left=S.order.filter(x=>!answered(x)).length;
 const m=document.createElement('div');m.className='modal';
 m.innerHTML=`<div class="mbox" role="dialog" aria-modal="true"><h3>تَسْلِيمُ الاخْتِبَارِ؟</h3><p>${left?`بَقِيَ <b style="color:var(--bad)">${left}</b> ${left>10?'سُؤَالًا':'أَسْئِلَةٍ'} بِدُونِ إِجَابَةٍ. هَلْ تُرِيدُ التَّسْلِيمَ الآنَ؟`:'أَجَبْتَ عَنْ كُلِّ الأَسْئِلَةِ. بَعْدَ التَّسْلِيمِ لَا يُمْكِنُ التَّعْدِيلُ.'}</p>
 <div class="row"><button class="btn gold" id="yes">نَعَمْ، سَلِّمْ</button><button class="btn ghost" id="no">رُجُوعٌ لِلْأَسْئِلَةِ</button></div></div>`;
 document.body.appendChild(m);m.querySelector('#yes').focus();
 m.querySelector('#no').onclick=()=>m.remove();m.onclick=e=>{if(e.target===m)m.remove()};
 m.querySelector('#yes').onclick=()=>{m.remove();finish()};
}

/* ---------- grading ---------- */
function grade(qi){const q=Q[qi],a=S.ans[qi];
 if(q.t==='mcq')return a===q.a?1:0;
 if(q.t==='tf')return a===q.a?1:0;
 if(q.t==='match'){if(!a)return 0;let c=0;q.pairs.forEach((_,k)=>{if(a[k]===k)c++});return c/q.pairs.length}
 if(q.t==='order'){if(!a)return 0;let c=0;q.items.forEach((_,k)=>{if(a[k]===k)c++});return c/q.items.length}
 return 0}
function label(p){return p>=90?'مُمْتَازٌ':p>=80?'جَيِّدٌ جِدًّا':p>=65?'جَيِّدٌ':p>=50?'مَقْبُولٌ':'يَحْتَاجُ مُرَاجَعَةً'}

function finish(){
 clearInterval(tick);S.done=true;S.finishedAt=S.finishedAt||Date.now();save();
 $('#timer').hidden=true;$('#hprog').hidden=true;
 const g={};S.order.forEach(qi=>g[qi]=grade(qi));
 let total=Math.round(S.order.reduce((t,qi)=>t+g[qi]*PER,0)*2)/2;
 const pct=total;const used=Math.round((S.finishedAt-S.start)/60000);
 const secs=SECS.map((s,i)=>{const qs=Q.map((q,k)=>k).filter(k=>Q[k].s===i);const got=qs.reduce((t,k)=>t+g[k],0);return {name:s[0],got,max:qs.length,p:Math.round(got/qs.length*100)}});
 const date=new Date(S.finishedAt).toLocaleDateString('ar-EG',{year:'numeric',month:'long',day:'numeric'});
 const nOk=S.order.filter(x=>g[x]===1).length,nBad=S.order.filter(x=>g[x]===0).length,nPart=S.order.length-nOk-nBad;
 const summary=`نتيجة اختبار فقه الشباب\nالاسم: ${S.name}${S.group?'\nالمجموعة: '+S.group:''}\nالدرجة: ${total} / 100 (${label(pct).replace(/[ً-ْ]/g,'')})\nالتاريخ: ${date} · الوقت: ${used} دقيقة\n`+secs.map(s=>`- ${s.name.replace(/[ً-ْ]/g,'')}: ${s.p}%`).join('\n');
 const C=2*Math.PI*52;
 root.innerHTML=`<div class="wrap results">
 <section class="cert"><div class="ring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="#0E2A38" stroke-width="12"/><circle id="arc" cx="60" cy="60" r="52" fill="none" stroke="#C9A35A" stroke-width="12" stroke-linecap="round" stroke-dasharray="0 ${C}" style="transition:stroke-dasharray 1.4s cubic-bezier(.2,.8,.2,1)"/></svg><div class="v"><div><b>${total}</b><span>مِنْ 100</span></div></div></div>
  <div><div class="eb">نَتِيجَةُ اخْتِبَارِ فِقْهِ الشَّبَابِ</div><h2>${esc(S.name)}</h2><span class="grade">${label(pct)}</span>
   <p>${S.group?esc(S.group)+' · ':''}${date} · الوَقْتُ: ${used} دَقِيقَةً<br>صَحِيحٌ: ${nOk} · جُزْئِيٌّ: ${nPart} · خَطَأٌ أَوْ بِدُونِ إِجَابَةٍ: ${nBad}</p>
   <div class="dua">«مَنْ يُرِدِ اللهُ بِهِ خَيْرًا يُفَقِّهْهُ فِي الدِّينِ»</div></div></section>
 <div class="rgrid">
  <section class="panel"><h2>النَّتِيجَةُ فِي كُلِّ قِسْمٍ</h2>${secs.map(s=>`<div class="brow"><span>${s.name}</span><div class="tr"><i class="${s.p<50?'lo':s.p>=85?'hi':''}" data-w="${s.p}" style="width:0"></i></div><b>${s.p}%</b></div>`).join('')}</section>
  <section class="panel"><h2>أَرْسِلْ نَتِيجَتَكَ لِلْمُعَلِّمِ</h2><p style="margin:0 0 12px;font:600 15.5px/1.8 var(--f-ui);color:var(--muted)">انْسَخِ النَّتِيجَةَ وَأَرْسِلْهَا لِلْمُعَلِّمِ عَلَى وَاتْسَاب، أَوْ خُذْ صُورَةً (سكرين شوت) لِهَذِهِ الصَّفْحَةِ.</p>
   <div class="actions"><button class="btn" id="copy">${I('copy')} نَسْخُ النَّتِيجَةِ</button><button class="btn ghost" id="again">${I('redo')} اخْتِبَارٌ جَدِيدٌ</button></div>
   <textarea class="copybox" id="cbox" readonly aria-label="نص النتيجة">${esc(summary)}</textarea><div class="err" id="cmsg" style="color:var(--ok)"></div></section>
 </div>
 <section class="review"><h2>مُرَاجَعَةُ الإِجَابَاتِ</h2>
  <div class="filters"><button class="on" data-f="all">الكُلُّ (${S.order.length})</button><button data-f="bad">الأَخْطَاءُ (${nBad+nPart})</button><button data-f="ok">الصَّحِيحُ (${nOk})</button></div>
  <div id="rlist"></div></section></div>`;
 requestAnimationFrame(()=>requestAnimationFrame(()=>{$('#arc').setAttribute('stroke-dasharray',`${C*pct/100} ${C}`);document.querySelectorAll('.brow i').forEach(i=>i.style.width=i.dataset.w+'%')}));
 $('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(summary);$('#cmsg').textContent='تَمَّ النَّسْخُ ✓'}catch(e){const t=$('#cbox');t.focus();t.select();$('#cmsg').textContent='النَّصُّ مُحَدَّدٌ: اضْغَطْ «نَسْخ» مِنْ لَوْحَةِ المَفَاتِيحِ.'}};
 $('#again').onclick=()=>{const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="mbox"><h3>اخْتِبَارٌ جَدِيدٌ؟</h3><p>سَتُحْذَفُ هَذِهِ النَّتِيجَةُ مِنْ هَذَا الجِهَازِ. انْسَخْهَا أَوَّلًا إِنْ لَمْ تُرْسِلْهَا.</p><div class="row"><button class="btn gold" id="y">نَعَمْ</button><button class="btn ghost" id="n">إِلْغَاءٌ</button></div></div>`;document.body.appendChild(m);
  m.querySelector('#n').onclick=()=>m.remove();m.querySelector('#y').onclick=()=>{m.remove();try{localStorage.removeItem(KEY)}catch(e){}S=null;startScreen();window.scrollTo(0,0)}};
 function ansText(qi){const q=Q[qi],a=S.ans[qi];
  if(q.t==='mcq')return {you:a==null?'—':q.o[a],right:q.o[q.a]};
  if(q.t==='tf')return {you:a==null?'—':(a?'صَحٌّ':'خَطَأٌ'),right:q.a?'صَحٌّ':'خَطَأٌ'};
  if(q.t==='match')return {you:a?q.pairs.map((p,k)=>p[0]+' ← '+(a[k]!=null?q.pairs[a[k]][1]:'—')).join('<br>'):'—',right:q.pairs.map(p=>p[0]+' ← '+p[1]).join('<br>')};
  if(q.t==='order')return {you:a?a.map(k=>q.items[k]).join(' ← '):'—',right:q.items.join(' ← ')};}
 function list(f){$('#rlist').innerHTML=S.order.map((qi,n)=>({qi,n})).filter(({qi})=>f==='all'||(f==='ok'?g[qi]===1:g[qi]<1)).map(({qi,n})=>{const q=Q[qi],t=ansText(qi),v=g[qi];
  return `<article class="ritem ${v===1?'':v===0?'bad':'part'}"><div class="top"><span>سُؤَالٌ ${n+1} · ${SECS[q.s][0]}</span><span>${Math.round(v*PER*10)/10} / ${PER}</span></div>
  <div class="q">${q.q}</div><div class="ans">${v===1?`<span class="right">✓ ${t.right}</span>`:`<span class="you">إِجَابَتُكَ: ${t.you}</span><br><span class="right">الصَّوَابُ: ${t.right}</span>`}</div>
  <div class="ev"><b>الدَّلِيلُ: </b>${q.ev}</div></article>`}).join('')||'<p class="hint">لَا يُوجَدُ.</p>'}
 list('all');
 document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('on'));b.classList.add('on');list(b.dataset.f)});
 window.scrollTo(0,0);
}

/* boot */
const prev=load();
if(prev&&prev.done){S=prev;finish()}else startScreen();
})();
</script>
