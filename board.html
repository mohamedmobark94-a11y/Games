<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>سبورة المعلم محمد مبارك</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Amiri+Quran&family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap">
<style>
/* Layout: slim top bar + section tabs, then a board stage (16:9 paper) beside a hideable tool drawer.
   Palette: emerald (primary), sun (praise), coral (encouragement), sky, plum; board paper stays light in every theme. */
:root{
  --bg:#E8F1EE; --panel:#FFFFFF; --panel2:#F2F8F6; --ink:#12302B; --mut:#58736C; --line:#CBDDD6;
  --pri:#0E7C66; --pri-ink:#FFFFFF; --sun:#F6B93B; --coral:#EF6F5E; --sky:#3E8EDE; --plum:#8A5CC2;
  --ok:#1E9D6B; --soft:#DDEFE9; --shadow:0 8px 24px rgba(18,48,43,.14);
  --paper:#FFFEFB;
  --f-ui:"Baloo Bhaijaan 2",system-ui,"Segoe UI",Tahoma,sans-serif;
  --f-ar:"Amiri","Scheherazade New","Traditional Arabic",serif;
  --f-q:"Amiri Quran","Amiri",serif;
  --r:18px; --btn:50px; --sw:318px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0E1A19;--panel:#16282A;--panel2:#1B3134;--ink:#E7F3F0;--mut:#9DBBB4;--line:#2B4649;--pri:#2FC3A0;--pri-ink:#06231D;--soft:#1F3B3A;--shadow:0 8px 24px rgba(0,0,0,.45);color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#0E1A19;--panel:#16282A;--panel2:#1B3134;--ink:#E7F3F0;--mut:#9DBBB4;--line:#2B4649;--pri:#2FC3A0;--pri-ink:#06231D;--soft:#1F3B3A;--shadow:0 8px 24px rgba(0,0,0,.45);color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:500 16px/1.35 var(--f-ui);background:var(--bg);color:var(--ink);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.arx{font-family:var(--f-ar);font-weight:700;font-size:1.18em}
[data-l="ar"] .e{display:none}
[data-l="en"] .a{display:none}
.bi{display:inline-flex;flex-direction:column;line-height:1.18;text-align:inherit;min-width:0}
[data-l="bi"] .bi .e{font-size:.74em;font-weight:500;opacity:.85}
[data-l="bi"] .bi.one .e{font-size:1em;opacity:1}
.blk{display:flex}

#app{height:100%;display:flex;flex-direction:column;gap:8px;padding-block:8px;min-height:0}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grow{flex:1}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:var(--btn);height:var(--btn);border-radius:50%;background:var(--sun);color:#4a3200;display:grid;place-items:center;font:700 1.9rem/1 var(--f-ar);flex:none}
.bn{display:flex;flex-direction:column;line-height:1.15}
.bn b{font:700 1.15rem var(--f-ar)}
.bn span{font-size:.82rem;color:var(--mut)}
.ib{width:var(--btn);height:var(--btn);border-radius:var(--r);border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;flex:none}
.ib svg,.sb svg,.tool svg{width:24px;height:24px}
.ib:hover,.sb:hover{background:var(--soft)}
.ib.on{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;padding:6px 12px;min-height:var(--btn);min-width:44px}
.seg button.on{background:var(--pri);color:var(--pri-ink)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:thin}
.sec{flex:none;display:flex;align-items:center;gap:8px;padding:6px 14px;min-height:var(--btn);border-radius:999px;border:2px solid var(--line);background:var(--panel);font-weight:700}
.sec .em{font-size:1.35rem}
.sec.on{background:var(--c);border-color:var(--c);color:#1c1a12;box-shadow:var(--shadow)}
.mode-simple .sec.on{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.hint{font-size:.92rem;color:var(--mut);padding:0 4px}
.main{flex:1;min-height:0;display:flex;gap:10px;position:relative}
.side{width:var(--sw);flex:none;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:calc(var(--r) + 4px);box-shadow:var(--shadow);min-height:0;overflow:hidden}
.side.closed{display:none}
.stabs{display:flex;border-bottom:1px solid var(--line);background:var(--panel2)}
.stabs button{flex:1;border:0;background:none;padding:10px 4px;display:grid;place-items:center;border-bottom:3px solid transparent;color:var(--mut)}
.stabs button svg{width:26px;height:26px}
.stabs button.on{color:var(--pri);border-bottom-color:var(--pri);background:var(--panel)}
.panes{flex:1;overflow:auto;padding:12px}
.pane{display:none;flex-direction:column;gap:10px}
.pane.on{display:flex}
.pane h3{margin:0;font-size:1.2rem}
.pane h4{margin:6px 0 0;font-size:.9rem;color:var(--mut);font-weight:700}
.tip{margin:0;font-size:.88rem;color:var(--mut);background:var(--panel2);padding:8px 10px;border-radius:12px}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tool{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:68px;padding:6px 2px;border-radius:var(--r);border:2px solid var(--line);background:var(--panel);font-size:.85rem;font-weight:700;text-align:center}
.tool:hover{background:var(--soft)}
.tool.on{border-color:var(--pri);background:var(--soft);color:var(--pri)}
.sw{display:flex;flex-wrap:wrap;gap:8px}
.sw button{width:36px;height:36px;border-radius:50%;border:3px solid var(--panel);box-shadow:0 0 0 2px var(--line)}
.sw button.on{box-shadow:0 0 0 3px var(--ink)}
.rowc{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
input[type=color]{width:44px;height:36px;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:2px}
input[type=range]{width:100%;accent-color:var(--pri)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 16px;border-radius:var(--r);border:2px solid var(--line);background:var(--panel);font-weight:700}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.warn{background:var(--coral);border-color:var(--coral);color:#fff}
.btn.sm{min-height:36px;padding:4px 12px;font-size:.9rem}
.btn svg{width:20px;height:20px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:.88rem;font-weight:700;color:var(--mut)}
.fld input,.fld textarea,.fld select{border:2px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--panel);color:var(--ink);font-weight:500;font-size:1rem;width:100%}
.fld textarea{resize:vertical}
.qta{font:400 1.6rem/1.9 var(--f-q)!important;min-height:130px}
.stage{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.shead{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sb{min-width:42px;height:42px;padding:0 8px;border-radius:14px;border:1px solid var(--line);background:var(--panel);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:.9rem}
.sb:disabled{opacity:.4;cursor:default}
.sep{width:1px;height:26px;background:var(--line);margin:0 4px}
.pg{font-weight:800;min-width:56px;text-align:center;font-variant-numeric:tabular-nums}
.saved{font-size:.8rem;color:var(--mut);opacity:0;transition:opacity .3s}
.saved.on{opacity:1}
.strip{display:flex;gap:8px;flex-wrap:wrap}
.strip span{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:.92rem;font-weight:700}
#bw{flex:1;min-height:0;position:relative;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:calc(var(--r) + 4px);overflow:hidden}
#cv{background:var(--paper);border-radius:14px;box-shadow:var(--shadow);touch-action:none;display:block;cursor:crosshair}
#cv.t-select{cursor:default}
#cv.t-text{cursor:text}
#cv.t-eraser{cursor:cell}
.ctx{position:absolute;top:10px;inset-inline:0;margin-inline:auto;width:max-content;max-width:94%;display:flex;gap:6px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:6px;box-shadow:var(--shadow);z-index:5}
.te{position:absolute;z-index:6;width:min(360px,92%);background:var(--panel);border:2px solid var(--pri);border-radius:18px;padding:10px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.te textarea{width:100%;min-height:96px;border:2px solid var(--line);border-radius:12px;padding:8px;font:700 1.7rem/1.7 var(--f-ar);background:#fff;color:#12302B;resize:vertical}
.hk{display:flex;flex-wrap:wrap;gap:4px}
.hk button{min-width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font:700 1.4rem/1 var(--f-ar)}
.hk button:hover{background:var(--soft)}
.tmr{display:flex;align-items:center;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:2px 4px}
.tmr b{font-size:1.25rem;min-width:62px;text-align:center;font-variant-numeric:tabular-nums}
.tmr.end{background:var(--coral);color:#fff;animation:pulse 1s infinite}
.pgrid{display:grid;grid-template-columns:1fr;gap:8px}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:start;padding:10px 14px;border-radius:var(--r);border:2px solid var(--line);background:var(--panel);font-weight:700}
.ph:hover{background:var(--soft);border-color:var(--sun)}
.ph .arx{font-size:1.3em}
.stars{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stars button{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:8px 12px;border-radius:var(--r);border:2px solid var(--line);background:var(--panel);font-weight:700;min-height:54px}
.stars button:hover{border-color:var(--sun);background:#fff8e6;color:#3b2d00}
.stars button em{font-style:normal;background:var(--sun);color:#3b2d00;border-radius:999px;min-width:28px;height:28px;display:grid;place-items:center;font-size:.9rem}
.row5{display:flex;gap:4px;justify-content:center}
.row5 svg{width:34px;height:34px;fill:var(--line);stroke:none;transition:fill .2s}
.row5 svg.f{fill:var(--sun)}
.edrow{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;align-items:center}
.edrow input{border:2px solid var(--line);border-radius:10px;padding:6px 8px;background:var(--panel);min-width:0}
.alist{display:flex;flex-direction:column;gap:8px}
.ac{display:flex;gap:10px;align-items:center;padding:10px;border:2px solid var(--line);border-radius:var(--r);background:var(--panel);text-align:start;flex:1;min-width:0}
.ac:hover{background:var(--soft);border-color:var(--pri)}
.ac .ei{font-size:1.8rem;flex:none}
.ac small{display:block;color:var(--mut);font-size:.8rem;font-weight:500}
.ac .grow{min-width:0}
.cardprev{width:100%;border-radius:14px;border:1px solid var(--line);display:block}
.chk{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.95rem}
.chk input{width:20px;height:20px;accent-color:var(--pri)}
.kidsonly{}
.mode-simple .kidsonly{display:none!important}
.mode-simple{--r:10px;--btn:42px;--sw:280px}
html[dir="ltr"] #bPrev svg,html[dir="ltr"] #bNext svg{transform:scaleX(-1)}
.focus .hint,.focus .bn span,.focus .strip{display:none}
.focus .tabs{padding-bottom:2px}

/* overlays */
#praise{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:60}
.pc{pointer-events:auto;min-width:min(520px,88vw);max-width:92vw;text-align:center;padding:28px 40px 24px;border-radius:36px;background:linear-gradient(135deg,var(--g1),var(--g2));color:#1c1a12;box-shadow:0 20px 60px rgba(0,0,0,.35);opacity:0;transform:scale(.7) rotate(-2deg);transition:opacity .25s,transform .35s cubic-bezier(.2,1.4,.4,1)}
.pc.show{opacity:1;transform:none}
.pa{font:700 clamp(2.4rem,7vw,4.6rem)/1.5 var(--f-ar)}
.pe{font:800 clamp(1.4rem,3.6vw,2.4rem)/1.2 var(--f-ui)}
.pn{margin-top:10px;font:800 1.5rem var(--f-ui);background:rgba(255,255,255,.55);border-radius:999px;display:inline-block;padding:2px 22px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:61;overflow:hidden}
.pt{position:absolute;left:50%;top:50%;font-size:2rem;animation:fly 1.6s ease-out forwards}
@keyframes fly{from{transform:translate(-50%,-50%) scale(.4);opacity:1}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--rot)) scale(1.1);opacity:0}}
@keyframes pulse{50%{filter:brightness(1.2)}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.shake{animation:shake .4s}
#toast{position:fixed;bottom:22px;inset-inline:0;margin-inline:auto;width:max-content;max-width:90vw;background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:999px;z-index:80;opacity:0;pointer-events:none;transition:opacity .25s;font-weight:700}
#toast.on{opacity:1}
.modal{position:fixed;inset:0;background:rgba(10,25,22,.55);display:grid;place-items:center;z-index:70;padding:16px}
.dlg{background:var(--panel);border-radius:24px;padding:22px;max-width:420px;width:100%;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:16px;text-align:center}
.dlg .rowc{justify-content:center}
.actp{background:var(--panel);width:min(1100px,100%);height:min(780px,100%);border-radius:28px;display:flex;flex-direction:column;box-shadow:var(--shadow);overflow:hidden}
.acth{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--panel2)}
.acth h2{margin:0;font-size:1.3rem;flex:1}
#actBody{flex:1;overflow:auto;padding:22px;display:flex;flex-direction:column;align-items:center;gap:18px}
.prog{display:flex;gap:8px}
.prog i{width:14px;height:14px;border-radius:50%;background:var(--line)}
.prog i.d{background:var(--ok)}
.prog i.c{background:var(--sun);transform:scale(1.25)}
.bigcard{width:min(760px,100%);min-height:230px;border-radius:32px;background:linear-gradient(135deg,#e9f7f1,#fdf1d4);color:#12302B;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:26px;text-align:center;box-shadow:var(--shadow)}
.qq{font:700 clamp(2rem,5vw,3.4rem)/1.7 var(--f-ui)}
.aa{font:700 clamp(1.6rem,4vw,2.6rem)/1.6 var(--f-ui);color:#0b6150;border-top:3px dashed #9ccdbf;padding-top:10px}
.opts{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;width:100%}
.opt{min-width:150px;min-height:92px;padding:10px 24px;border-radius:26px;border:3px solid var(--line);background:var(--panel);font:700 2.2rem/1.5 var(--f-ui)}
.opt:hover{border-color:var(--pri);background:var(--soft)}
.opt.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.no{opacity:.45;border-style:dashed}
.fb{min-height:48px;padding:8px 18px;border-radius:18px;font-weight:700;text-align:center;max-width:720px}
.fb.ok{background:#d9f4e6;color:#0b5a3a}
.fb.hint{background:#fff1cf;color:#5a4100}
.nav{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.tile{min-width:76px;min-height:76px;padding:6px 18px;border-radius:20px;background:var(--sky);color:#fff;border:0;font:700 2.4rem/1.4 var(--f-ui);box-shadow:0 4px 0 rgba(0,0,0,.18);touch-action:none;user-select:none;cursor:grab}
.tile.sel{outline:4px solid var(--sun);transform:translateY(-3px)}
.tile.locked{background:var(--ok);cursor:default}
.tile.done{visibility:hidden}
.ghost{position:fixed;z-index:90;pointer-events:none;opacity:.9;transform:translate(-50%,-50%) scale(1.08)}
.cols{display:flex;gap:44px;flex-wrap:wrap;justify-content:center;width:100%}
.col{display:flex;flex-direction:column;gap:12px;align-items:center}
.slot{min-width:150px;min-height:84px;border:3px dashed var(--line);border-radius:22px;display:flex;align-items:center;justify-content:center;gap:10px;padding:6px 14px;font-weight:700;font-size:1.15rem;background:var(--panel2)}
.slot.full{border-style:solid;border-color:var(--ok);background:#d9f4e6;color:#0b5a3a}
.slot .tile{min-width:60px;min-height:60px;font-size:2rem}
.slots,.pool{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;min-height:90px;align-items:center}
.pool{border-radius:22px;background:var(--panel2);padding:12px;min-width:min(520px,100%)}
.slots .slot{min-width:92px}
.mw{font:700 clamp(4rem,12vw,7rem)/1.8 var(--f-ar);color:#12302B;background:linear-gradient(135deg,#e9f7f1,#fdf1d4);border-radius:32px;padding:0 40px;direction:rtl}
.mc{cursor:pointer;border-radius:12px}
.mc:hover{background:rgba(246,185,59,.45)}
.mc.ok{background:var(--ok);color:#fff}
.mc.no{background:rgba(239,111,94,.4)}
.steps{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.stp{padding:10px 22px;border-radius:999px;border:3px solid var(--line);font-weight:800;font-size:1.2rem;background:var(--panel);opacity:.6}
.stp.on{opacity:1;color:#1c1a12;background:var(--c);border-color:var(--c);transform:scale(1.08)}
.help{font-size:.9rem;color:var(--mut);background:var(--panel2);border-radius:12px;padding:10px 14px;max-width:760px;width:100%}
#edTa{width:min(760px,100%);min-height:280px;border:2px solid var(--line);border-radius:16px;padding:12px;font:500 1.3rem/1.8 var(--f-ar);background:var(--panel);color:var(--ink)}
@media (max-width:760px){
  .side{position:absolute;inset-block:0;inset-inline-start:0;z-index:20;width:min(var(--sw),92%)}
  .bn span{display:none}
  .sb .bi .e,.sb .bi .a{font-size:.85rem}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app" class="mode-kids">
  <header class="top">
    <button class="ib on" id="bSide" data-ic="side" data-ti="الشريط الجانبي|Side panel"></button>
    <div class="brand">
      <span class="logo" aria-hidden="true">م</span>
      <div class="bn"><b>المعلم محمد مبارك</b><span dir="ltr">Teacher Mohamed Mubarak</span></div>
    </div>
    <div class="grow"></div>
    <div class="seg" id="segLang" role="group" aria-label="Language">
      <button data-l="ar">ع</button><button data-l="bi">ع+EN</button><button data-l="en">EN</button>
    </div>
    <div class="seg" id="segMode" role="group" aria-label="Mode">
      <button data-m="kids"><span data-t="للأطفال|Kids"></span></button><button data-m="simple"><span data-t="بسيط|Simple"></span></button>
    </div>
    <button class="ib" id="bTimer" data-ic="timer" data-ti="المؤقّت (اختياري)|Timer (optional)"></button>
    <button class="ib" id="bFs" data-ic="full" data-ti="ملء الشاشة|Full screen"></button>
  </header>
  <nav class="tabs" id="tabs" aria-label="Lesson sections"></nav>
  <div class="hint" id="secHint"></div>
  <div class="main">
    <aside class="side" id="side">
      <div class="stabs" id="stabs">
        <button data-pane="tools" data-ic="pen" data-ti="الأدوات|Tools"></button>
        <button data-pane="lesson" data-ic="book" data-ti="الحلقة والآيات|Lesson and verses"></button>
        <button data-pane="praise" data-ic="star" data-ti="التشجيع والنجوم|Praise and stars"></button>
        <button data-pane="act" data-ic="puzzle" data-ti="الأنشطة|Activities"></button>
        <button data-pane="end" data-ic="flag" data-ti="نهاية الحلقة|End of lesson"></button>
      </div>
      <div class="panes">
        <!-- tools -->
        <div class="pane on" id="p-tools">
          <h3 data-t="الأدوات|Tools"></h3>
          <div class="tgrid" id="tgrid"></div>
          <h4 data-t="اللون|Colour"></h4>

  const acts={}; Object.keys(ACTDEF).forEach(k=>acts[k]=ACTDEF[k].txt);
  return {lang:'bi',mode:'kids',side:true,pane:'tools',sec:'welcome',tool:'pen',color:'#1b2a41',hl:'#ffd23f',w:6,hw:34,tsize:84,qsize:76,showMarks:true,
    sound:false,useName:true,lesson:{student:'',surah:'',ayat:'',goal:''},quran:'',secs,imgs:{},praise:PRAISE0.map(p=>({...p})),
    stars:{effort:0,focus:0,try:0,improve:0,log:[]},acts,end:{rev:'',learn:'',hw:'',dua:'بارك الله فيك وزادك علمًا — May Allah bless you and increase your knowledge.'},
    timer:{show:false,min:10}};

let fresh=true;

  const d=defState();
  try{const r=localStorage.getItem(KEY); if(r){const o=JSON.parse(r); fresh=false;
    const s=Object.assign(d,o); s.lesson=Object.assign(defState().lesson,o.lesson); s.stars=Object.assign(defState().stars,o.stars);

/* ---------- history ---------- */
const H={};
function hist(p){return H[p.id]||(H[p.id]={st:[JSON.stringify(p.objs)],i:0})}
function commit(){const p=page(),h=hist(p);h.st=h.st.slice(0,h.i+1);h.st.push(JSON.stringify(p.objs));if(h.st.length>80)h.st.shift();h.i=h.st.length-1;saveSoon();updHead();draw()}
function undo(){const p=page(),h=hist(p);if(h.i>0){h.i--;p.objs=JSON.parse(h.st[h.i]);selId=null;saveSoon();updHead();updCtx();draw()}}
function redo(){const p=page(),h=hist(p);if(h.i<h.st.length-1){h.i++;p.objs=JSON.parse(h.st[h.i]);selId=null;saveSoon();updHead();updCtx();draw()}}

/* ---------- text layout ---------- */
const mctx=document.createElement('canvas').getContext('2d');
function tfont(o){return o.q?`${o.size}px "Amiri Quran","Amiri",serif`:(AR.test(o.s)?`700 ${o.size}px "Amiri","Scheherazade New",serif`:`700 ${o.size}px "Baloo Bhaijaan 2",system-ui,sans-serif`)}
function layout(o){
  mctx.font=tfont(o); const hasAr=AR.test(o.s); const lh=o.size*(hasAr?1.8:1.35); let lines=[];
  o.s.split('\n').forEach(l=>{
    if(o.q){const ww=o.ww||1300;const toks=l.split(/(\s+)/);let cur='';
      toks.forEach(t=>{if(cur&&mctx.measureText((cur+t).trimEnd()).width>ww&&t.trim()){lines.push(cur.trimEnd());cur=t.trimStart()}else cur+=t});
      lines.push(cur.trimEnd());}
    else lines.push(l);
  });
  const items=lines.map(s=>({s,rtl:AR.test(s),w:mctx.measureText(s).width}));
  return {items,lh,w:Math.max(20,...items.map(i=>i.w)),h:lh*items.length};
}
function bbox(o){
  if(o.t==='text'){const L=layout(o),p=o.q?30:8;return {x:o.x-p,y:o.y-p,w:L.w+p*2,h:L.h+p*2}}
  if(o.t==='img')return {x:o.x,y:o.y,w:o.w,h:o.h};
  if(o.t==='shape'){const p=o.w/2+4;return {x:Math.min(o.x1,o.x2)-p,y:Math.min(o.y1,o.y2)-p,w:Math.abs(o.x2-o.x1)+p*2,h:Math.abs(o.y2-o.y1)+p*2}}
  let a=1e9,b=1e9,c=-1e9,d=-1e9;for(let i=0;i<o.pts.length;i+=2){a=Math.min(a,o.pts[i]);c=Math.max(c,o.pts[i]);b=Math.min(b,o.pts[i+1]);d=Math.max(d,o.pts[i+1])}
  const p=o.w/2+4;return {x:a-p,y:b-p,w:c-a+p*2,h:d-b+p*2};
}
function segDist(px,py,x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1,l=dx*dx+dy*dy;let t=l?((px-x1)*dx+(py-y1)*dy)/l:0;t=clamp(t,0,1);return Math.hypot(px-(x1+t*dx),py-(y1+t*dy))}
function hit(o,x,y,tol){
  if(o.t==='text'||o.t==='img'){const b=bbox(o);return x>=b.x-tol&&x<=b.x+b.w+tol&&y>=b.y-tol&&y<=b.y+b.h+tol}
  if(o.t==='stroke'){const p=o.pts,r=o.w/2+tol;if(p.length<=2)return Math.hypot(x-p[0],y-p[1])<=r;for(let i=0;i+3<p.length;i+=2)if(segDist(x,y,p[i],p[i+1],p[i+2],p[i+3])<=r)return true;return false}
  const r=o.w/2+tol;
  if(o.kind==='line'||o.kind==='arrow')return segDist(x,y,o.x1,o.y1,o.x2,o.y2)<=r;
  const l=Math.min(o.x1,o.x2),rr=Math.max(o.x1,o.x2),t=Math.min(o.y1,o.y2),b=Math.max(o.y1,o.y2);
  if(o.kind==='rect'){const inX=x>=l-r&&x<=rr+r,inY=y>=t-r&&y<=b+r;if(!(inX&&inY))return false;return Math.min(Math.abs(x-l),Math.abs(x-rr),Math.abs(y-t),Math.abs(y-b))<=r}
  const cx=(l+rr)/2,cy=(t+b)/2,rx=Math.max(1,(rr-l)/2),ry=Math.max(1,(b-t)/2);
  const k=Math.hypot((x-cx)/rx,(y-cy)/ry);return Math.abs(k-1)*Math.min(rx,ry)<=r;
}
function scaleFrom(o,f,ox,oy){
  const n=JSON.parse(JSON.stringify(o));const sx=v=>ox+(v-ox)*f,sy=v=>oy+(v-oy)*f;
  if(n.t==='stroke'){for(let i=0;i<n.pts.length;i+=2){n.pts[i]=sx(n.pts[i]);n.pts[i+1]=sy(n.pts[i+1])}}
  else if(n.t==='shape'){n.x1=sx(n.x1);n.x2=sx(n.x2);n.y1=sy(n.y1);n.y2=sy(n.y2)}
  else if(n.t==='text'){n.x=sx(n.x);n.y=sy(n.y);n.size=clamp(n.size*f,14,420);if(n.ww)n.ww*=f}
  else{n.x=sx(n.x);n.y=sy(n.y);n.w*=f;n.h*=f}
  return n;
}

/* ---------- painting ---------- */
const IMGC={};
function getImg(id){let i=IMGC[id];if(!i){i=new Image();i.onload=()=>draw();i.src=S.imgs[id]||'';IMGC[id]=i}return i}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function drawStroke(g,o){
  const p=o.pts;g.save();g.lineCap='round';g.lineJoin='round';g.strokeStyle=o.color;g.fillStyle=o.color;g.lineWidth=o.w;
  if(o.kind==='hl'){g.globalAlpha=.5;g.globalCompositeOperation='multiply'}
  if(p.length<=2){g.beginPath();g.arc(p[0],p[1],o.w/2,0,7);g.fill()}
  else{g.beginPath();g.moveTo(p[0],p[1]);
    for(let i=2;i<p.length-2;i+=2){g.quadraticCurveTo(p[i],p[i+1],(p[i]+p[i+2])/2,(p[i+1]+p[i+3])/2)}
    g.lineTo(p[p.length-2],p[p.length-1]);g.stroke()}
  g.restore();
}
function drawShape(g,o){
  g.save();g.strokeStyle=o.color;g.lineWidth=o.w;g.lineCap='round';g.lineJoin='round';
  const {x1,y1,x2,y2}=o;g.beginPath();
  if(o.kind==='line'||o.kind==='arrow'){g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();
    if(o.kind==='arrow'){const a=Math.atan2(y2-y1,x2-x1),h=Math.max(22,o.w*4.5);g.beginPath();g.moveTo(x2,y2);g.lineTo(x2-h*Math.cos(a-.5),y2-h*Math.sin(a-.5));g.moveTo(x2,y2);g.lineTo(x2-h*Math.cos(a+.5),y2-h*Math.sin(a+.5));g.stroke()}}
  else if(o.kind==='circle'){g.ellipse((x1+x2)/2,(y1+y2)/2,Math.max(1,Math.abs(x2-x1)/2),Math.max(1,Math.abs(y2-y1)/2),0,0,7);g.stroke()}
  else{rr(g,Math.min(x1,x2),Math.min(y1,y2),Math.abs(x2-x1),Math.abs(y2-y1),Math.min(14,Math.abs(x2-x1)/3,Math.abs(y2-y1)/3));g.stroke()}
  g.restore();
}
function drawText(g,o){
  const L=layout(o);g.save();g.font=tfont(o);g.textBaseline='middle';
  if(o.q){const b=bbox(o);rr(g,b.x,b.y,b.w,b.h,26);g.fillStyle='#F1FAF5';g.fill();g.strokeStyle='#9CCDBF';g.lineWidth=3;g.stroke()}
  g.fillStyle=o.color;
  L.items.forEach((it,i)=>{const y=o.y+L.lh*i+L.lh/2;
    if(o.q){g.direction=it.rtl?'rtl':'ltr';g.textAlign='center';g.fillText(it.s,o.x+L.w/2,y)}
    else if(it.rtl){g.direction='rtl';g.textAlign='right';g.fillText(it.s,o.x+L.w,y)}
    else{g.direction='ltr';g.textAlign='left';g.fillText(it.s,o.x,y)}});
  g.restore();
}
function paint(g,k,p,ui){
  g.setTransform(k,0,0,k,0,0);g.fillStyle='#FFFEFB';g.fillRect(0,0,LW,LH);
  g.save();g.lineWidth=2;
  if(p.bg==='lines'){g.strokeStyle='#CFE3F5';for(let y=170;y<LH;y+=110){g.beginPath();g.moveTo(40,y);g.lineTo(LW-40,y);g.stroke()}}
  if(p.bg==='grid'){g.strokeStyle='#E1ECF3';for(let x=0;x<=LW;x+=50){g.beginPath();g.moveTo(x,0);g.lineTo(x,LH);g.stroke()}for(let y=0;y<=LH;y+=50){g.beginPath();g.moveTo(0,y);g.lineTo(LW,y);g.stroke()}}
  g.restore();
  // teacher name tag
  g.save();g.textBaseline='middle';g.font='700 22px "Baloo Bhaijaan 2",system-ui,sans-serif';g.fillStyle='rgba(14,124,102,.6)';
  const en='Teacher Mohamed Mubarak',ar='المعلم محمد مبارك';g.font='700 26px "Amiri",serif';const wa=g.measureText(ar).width;
  g.font='700 21px "Baloo Bhaijaan 2",system-ui,sans-serif';const we=g.measureText(en).width;const tot=we+wa+40,x0=(LW-tot)/2,y0=LH-24;
  g.textAlign='left';g.direction='ltr';g.fillText(en,x0,y0);g.fillText('|',x0+we+16,y0);
  g.font='700 26px "Amiri",serif';g.fillText(ar,x0+we+40,y0);g.restore();
  p.objs.forEach(o=>{
    if(!S.showMarks&&(o.t==='stroke'||o.t==='shape'))return;
    if(o.t==='stroke')drawStroke(g,o);else if(o.t==='shape')drawShape(g,o);else if(o.t==='text')drawText(g,o);
    else if(o.t==='img'){const im=getImg(o.src);if(im.complete&&im.naturalWidth)g.drawImage(im,o.x,o.y,o.w,o.h)}
  });
  if(ui&&selId){const o=p.objs.find(q=>q.id===selId);if(o){const b=bbox(o),s=view.s;g.save();g.setLineDash([8/s,6/s]);g.lineWidth=2.5/s;g.strokeStyle='#3E8EDE';g.strokeRect(b.x,b.y,b.w,b.h);g.setLineDash([]);
    g.fillStyle='#3E8EDE';g.beginPath();g.arc(b.x+b.w,b.y+b.h,12/s,0,7);g.fill();g.strokeStyle='#fff';g.lineWidth=3/s;g.stroke();g.restore()}}
}
const cv=$('#cv'),cx=cv.getContext('2d');
const view={s:1,dpr:1};
let raf=0;
function draw(){if(raf)return;raf=requestAnimationFrame(()=>{raf=0;paint(cx,view.s*view.dpr,page(),true)})}
function fit(){
  const r=$('#bw').getBoundingClientRect(),pad=14;
  const s=Math.max(.15,Math.min((r.width-pad*2)/LW,(r.height-pad*2)/LH));
  view.s=s;view.dpr=Math.min(window.devicePixelRatio||1,2);
  cv.style.width=LW*s+'px';cv.style.height=LH*s+'px';cv.width=Math.round(LW*s*view.dpr);cv.height=Math.round(LH*s*view.dpr);
  draw();if(ted)posTE();
}

/* ---------- pointer tools ---------- */
let selId=null,gest=null;
const ptr=e=>{const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)/view.s,y:(e.clientY-r.top)/view.s}};
function topHit(x,y,tol,skipQ){const o=page().objs;for(let i=o.length-1;i>=0;i--){const q=o[i];if(!S.showMarks&&(q.t==='stroke'||q.t==='shape'))continue;if(skipQ&&q.q)continue;if(hit(q,x,y,tol))return q}return null}
cv.addEventListener('pointerdown',e=>{
  if(!e.isPrimary||e.button>0)return;
  if(ted){commitTE()}
  const m=ptr(e),p=page(),t=S.tool;
  cv.setPointerCapture(e.pointerId);
  if(t==='pen'||t==='hl'){
    const o={id:uid(),t:'stroke',kind:t,color:t==='hl'?S.hl:S.color,w:t==='hl'?S.hw:S.w,pts:[m.x,m.y]};
    p.objs.push(o);gest={type:'draw',o};
  }else if(t==='eraser'){gest={type:'erase',hit:false};eraseAt(m)}
  else if(['arrow','line','circle','rect'].includes(t)){
    const o={id:uid(),t:'shape',kind:t,color:S.color,w:S.w,x1:m.x,y1:m.y,x2:m.x,y2:m.y};p.objs.push(o);gest={type:'shape',o};
  }else if(t==='text'){gest={type:'none'};openTE(m.x,m.y,null)}
  else if(t==='select'){
    const sel=selId&&p.objs.find(o=>o.id===selId);
    if(sel){const b=bbox(sel);if(Math.hypot(m.x-(b.x+b.w),m.y-(b.y+b.h))<=22/view.s){gest={type:'scale',o0:JSON.parse(JSON.stringify(sel)),b,id:sel.id};return}}
    const h=topHit(m.x,m.y,6/view.s);
    if(h){selId=h.id;gest={type:'move',id:h.id,sx:m.x,sy:m.y,o0:JSON.parse(JSON.stringify(h)),moved:false}}else{selId=null;gest={type:'none'}}
    updCtx();draw();
  }
  draw();
});
cv.addEventListener('pointermove',e=>{
  if(!gest)return;const m=ptr(e),p=page();
  if(gest.type==='draw'){const a=gest.o.pts,lx=a[a.length-2],ly=a[a.length-1];if(Math.hypot(m.x-lx,m.y-ly)>1.6){a.push(+m.x.toFixed(1),+m.y.toFixed(1));draw()}}
  else if(gest.type==='erase')eraseAt(m);
  else if(gest.type==='shape'){gest.o.x2=m.x;gest.o.y2=m.y;if(e.shiftKey&&(gest.o.kind==='circle'||gest.o.kind==='rect')){const d=Math.max(Math.abs(m.x-gest.o.x1),Math.abs(m.y-gest.o.y1));gest.o.x2=gest.o.x1+Math.sign(m.x-gest.o.x1||1)*d;gest.o.y2=gest.o.y1+Math.sign(m.y-gest.o.y1||1)*d}draw()}
  else if(gest.type==='move'){const dx=m.x-gest.sx,dy=m.y-gest.sy;if(Math.abs(dx)+Math.abs(dy)>2)gest.moved=true;const i=p.objs.findIndex(o=>o.id===gest.id);const n=JSON.parse(JSON.stringify(gest.o0));
    if(n.t==='stroke'){for(let k=0;k<n.pts.length;k+=2){n.pts[k]+=dx;n.pts[k+1]+=dy}}else if(n.t==='shape'){n.x1+=dx;n.x2+=dx;n.y1+=dy;n.y2+=dy}else{n.x+=dx;n.y+=dy}
    p.objs[i]=n;draw()}
  else if(gest.type==='scale'){const b=gest.b;const f=clamp(((m.x-b.x)*b.w+(m.y-b.y)*b.h)/(b.w*b.w+b.h*b.h),.1,8);const i=p.objs.findIndex(o=>o.id===gest.id);p.objs[i]=scaleFrom(gest.o0,f,b.x,b.y);gest.changed=true;draw()}
});
function endGest(){
  if(!gest)return;const g=gest;gest=null;const p=page();
  if(g.type==='draw'||(g.type==='erase'&&g.hit)||(g.type==='move'&&g.moved)||(g.type==='scale'&&g.changed))commit();
  else if(g.type==='shape'){const o=g.o;if(Math.hypot(o.x2-o.x1,o.y2-o.y1)<8){p.objs=p.objs.filter(q=>q!==o);draw()}else commit()}
  updCtx();
}
cv.addEventListener('pointerup',endGest);cv.addEventListener('pointercancel',endGest);
cv.addEventListener('dblclick',e=>{if(S.tool!=='select')return;const m=ptr(e),h=topHit(m.x,m.y,6/view.s);if(h&&h.t==='text'&&!h.q)openTE(h.x,h.y,h)});
function eraseAt(m){const p=page(),n=p.objs.length;p.objs=p.objs.filter(o=>o.q||!hit(o,m.x,m.y,14));if(p.objs.length!==n){gest.hit=true;draw()}}

/* context bar */
function updCtx(){
  const o=selId&&S.tool==='select'?page().objs.find(q=>q.id===selId):null;
  $('#ctx').hidden=!o;if(!o)return;
  $('#cCol').hidden=o.t==='img'||!!o.q;$('#cCol').value=o.color&&/^#[0-9a-f]{6}$/i.test(o.color)?o.color:'#000000';
  $('#cEdit').hidden=!(o.t==='text'&&!o.q);
}
function scaleSel(f){const p=page(),i=p.objs.findIndex(o=>o.id===selId);if(i<0)return;const b=bbox(p.objs[i]);p.objs[i]=scaleFrom(p.objs[i],f,b.x,b.y);commit()}
$('#cPlus').onclick=()=>scaleSel(1.15);$('#cMinus').onclick=()=>scaleSel(1/1.15);
$('#cCol').oninput=e=>{const o=page().objs.find(q=>q.id===selId);if(o){o.color=e.target.value;draw()}};
$('#cCol').onchange=()=>commit();
$('#cDel').onclick=delSel;
$('#cEdit').onclick=()=>{const o=page().objs.find(q=>q.id===selId);if(o)openTE(o.x,o.y,o)};
function delSel(){if(!selId)return;const p=page();p.objs=p.objs.filter(o=>o.id!==selId);selId=null;commit();updCtx()}

/* ---------- text editor ---------- */
let ted=null;
const HK=[['064E','فتحة'],['064F','ضمة'],['0650','كسرة'],['0652','سكون'],['0651','شدّة'],['064B','تنوين فتح'],['064C','تنوين ضم'],['064D','تنوين كسر'],['0653','مدّة'],['0670','ألف خنجرية']];
$('#hk').innerHTML=HK.map(([c,n])=>`<button type="button" data-c="${c}" title="${n}">◌${String.fromCharCode(parseInt(c,16))}</button>`).join('');
$('#hk').onclick=e=>{const b=e.target.closest('button');if(!b)return;const ta=$('#teTa'),ch=String.fromCharCode(parseInt(b.dataset.c,16));ta.setRangeText(ch,ta.selectionStart,ta.selectionEnd,'end');ta.focus()};
function posTE(){
  const el=$('#te'),bw=$('#bw').getBoundingClientRect();let x=cv.offsetLeft+ted.x*view.s,y=cv.offsetTop+ted.y*view.s;
  const w=el.offsetWidth||340,h=el.offsetHeight||260;
  x=clamp(x-w/2,6,Math.max(6,bw.width-w-6));y=clamp(y,6,Math.max(6,bw.height-h-6));el.style.left=x+'px';el.style.top=y+'px';
}
function openTE(x,y,o){ted={x,y,o};const ta=$('#teTa');ta.value=o?o.s:'';ta.style.color='#12302B';$('#te').hidden=false;posTE();setTimeout(()=>ta.focus(),140)}
function closeTE(){ted=null;$('#te').hidden=true}
function commitTE(){
  if(!ted)return;const v=$('#teTa').value.replace(/\r/g,''),t=ted;closeTE();if(!v.trim())return;
  if(t.o){if(t.o.s!==v){t.o.s=v;commit()}}
  else{const o={id:uid(),t:'text',s:v,size:S.tsize,color:S.color,x:t.x,y:t.y};const L=layout(o);if(AR.test(v))o.x=clamp(t.x-L.w,10,LW-L.w-10);else o.x=clamp(t.x,10,LW-L.w-10);o.y=clamp(t.y-L.lh/2,10,LH-L.h-10);page().objs.push(o);selId=o.id;commit()}
}
$('#teOk').onclick=commitTE;$('#teNo').onclick=closeTE;
$('#teTa').addEventListener('keydown',e=>{if(e.key==='Escape'){e.stopPropagation();closeTE()}else if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){commitTE()}});

/* ---------- images ---------- */
function addImageFile(f){
  if(!f||!/^image\//.test(f.type))return;
  const rd=new FileReader();rd.onload=()=>{
    const im=new Image();im.onload=()=>{
      const M=900,k=Math.min(1,M/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);

let AC=null;
function beep(kind){
  if(!S.sound)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const seq=kind==='star'?[[784,0],[988,.1],[1319,.2]]:kind==='ok'?[[659,0],[880,.12]]:[[392,0],[349,.14]];
    seq.forEach(([f,t])=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,AC.currentTime+t);g.gain.linearRampToValueAtTime(.07,AC.currentTime+t+.03);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+t+.35);o.connect(g).connect(AC.destination);o.start(AC.currentTime+t);o.stop(AC.currentTime+t+.4)})}catch(e){}
}
let prT,prN=0;
function fillName(s){const n=(S.lesson.student||'').trim();return n?s.replace(/\{name\}/g,n):s.replace(/\s*\{name\}\s*/g,' ').replace(/\s+([،,!؟?.])/g,'$1').trim()}
function showPraise(p,o){

  const hasTok=/\{name\}/.test(p.ar+p.en);
  box.innerHTML=`<div class="pc" style="--g1:${g[0]};--g2:${g[1]}"><div class="pa" dir="rtl">${esc(fillName(p.ar))}</div><div class="pe" dir="ltr">${esc(fillName(p.en))}</div>${S.useName&&n&&!hasTok?`<div class="pn">⭐ ${esc(n)} ⭐</div>`:''}</div>`;
  const c=box.firstChild;requestAnimationFrame(()=>c.classList.add('show'));c.onclick=()=>{c.classList.remove('show')};
  clearTimeout(prT);prT=setTimeout(()=>{c.classList.remove('show')},o.ms||2600);beep(o.sound||'ok');
  if(o.burst)burst(32);
}
function burst(n){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;

  for(let i=0;i<n;i++){const s=document.createElement('span');s.className='pt';s.textContent=em[i%em.length];const a=Math.random()*6.28,d=160+Math.random()*Math.min(innerWidth,innerHeight)*.45;
    s.style.setProperty('--dx',Math.cos(a)*d+'px');s.style.setProperty('--dy',Math.sin(a)*d+'px');s.style.setProperty('--rot',(Math.random()*360-180)+'deg');s.style.animationDelay=(Math.random()*.2)+'s';fx.appendChild(s);setTimeout(()=>s.remove(),2000)}

  const n=Math.min(tot,15),R=30,gap=70,x0=W/2-((Math.min(n,8)-1)*gap)/2;
  for(let i=0;i<n;i++){const row=i<8?0:1,col=row?i-8:i,cnt=row?n-8:Math.min(n,8);const sx=W/2-((cnt-1)*gap)/2+col*gap,sy=y+58+row*64;starPath(g,sx,sy,R);g.fillStyle='#F6B93B';g.fill();g.strokeStyle='#D99A12';g.lineWidth=3;g.stroke()}
  if(tot===0)T('☆',y+58,FE.replace('%',44),'#B7C9C3');
  if(tot>15)T('+'+(tot-15),y+122,FE.replace('%',28),'#58736C');
  /* dua */
  const dy=H-240;g.fillStyle='#FFF4D6';rr(g,90,dy,W-180,140,34);g.fill();
  const parts=(S.end.dua||'').split(/\s[—-]\s/);
  if(parts.length>=2){T(parts[0],dy+42,f(parts[0],40),'#5a4100',W-240);g.font=f(parts[1],26);const l2=wrap(g,parts.slice(1).join(' — '),W-260).slice(0,2);l2.forEach((l,i)=>T(l,dy+92+i*34,f(l,26),'#5a4100'))}
  else{g.font=f(S.end.dua||'',36);wrap(g,S.end.dua||'',W-260).slice(0,3).forEach((l,i)=>T(l,dy+34+i*44,f(l,34),'#5a4100'))}
  T('المعلم محمد مبارك  |  Teacher Mohamed Mubarak',H-72,FA.replace('%',34),'#0E7C66',W-160);
}
$('#bCard').onclick=()=>{drawCard();$('#cardCv').toBlob(b=>b&&saveFile('lesson-card-'+new Date().toISOString().slice(0,10)+'.png',b),'image/png')};
$('#bFill').onclick=()=>{const L=S.lesson;const t=[L.surah,L.ayat&&('('+L.ayat+')')].filter(Boolean).join(' ');if(t){S.end.learn=t;$('#eLearn').value=t}if(L.goal&&!S.end.rev){}drawCardSoon();saveSoon()};

function centerText(s,size,y,color){const o={id:uid(),t:'text',s,size,color,x:0,y};const L=layout(o);o.x=(LW-L.w)/2;return o}
async function boot(){
  expand();
  try{await Promise.race([Promise.all([document.fonts.load('700 40px Amiri','بَ'),document.fonts.load('40px "Amiri Quran"','بَ'),document.fonts.load('700 30px "Baloo Bhaijaan 2"','Ab')]),new Promise(r=>setTimeout(r,1800))])}catch(e){}
  if(fresh){
    const o=S.secs.welcome.pages[0].objs;
    o.push(centerText('السَّلَامُ عَلَيْكُمْ',170,150,'#0E7C66'));
    o.push(centerText('Welcome! أهلًا وسهلًا',96,380,'#1f7ae0'));
    o.push(centerText('Today we learn, listen and smile.',58,520,'#12302B'));
    o.push({id:uid(),t:'shape',kind:'line',color:'#F6B93B',w:10,x1:520,y1:350,x2:1080,y2:350});
  }
  setupLesson();
  $('#chkName').checked=S.useName;$('#chkSound').checked=S.sound;
  renderPraise();renderStars();renderActList();buildTabs();applyLang();applyMode();applySide();
  $$('#stabs button').forEach(b=>b.classList.toggle('on',b.dataset.pane===S.pane));
  $$('.pane').forEach(p=>{if(p.id.startsWith('p-'))p.classList.toggle('on',p.id==='p-'+S.pane)});
  setTool(S.tool);updHead();tmShow(S.timer.show);tmDraw();
  new ResizeObserver(()=>fit()).observe($('#bw'));
  window.addEventListener('resize',fit);
  document.fonts.addEventListener&&document.fonts.addEventListener('loadingdone',()=>{draw();drawCardSoon()});
  fit();drawCard();
  if(fresh)saveSoon();
}
boot();
})();
