<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>الواجب · Homework — Tarteel</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Amiri:wght@400;700&family=Inter:wght@400;600;800&display=swap">
<style>
:root{color-scheme:dark;--bg:#0B1E2D;--card:#163A57;--card2:#12304A;--ink:#F4EBD6;--muted:#B4C5D3;--line:#2A5675;--gold:#E2B85C;--ok:#2ECC71;--bad:#F1948A;--rec:#E74C3C;
  --f-ui:"Baloo Bhaijaan 2","Segoe UI",Tahoma,sans-serif;--f-ar:"Amiri","Traditional Arabic",serif;--f-en:"Inter","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:500 17px/1.6 var(--f-ui);min-height:100vh}
html[lang=en] body{font-family:var(--f-en)}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 120px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.brand{font:700 1.3rem var(--f-ar);color:var(--gold);margin-inline-end:auto}
.lang{font:inherit;font-weight:700;border:2px solid var(--line);background:var(--card2);color:var(--ink);border-radius:999px;padding:2px 14px;min-height:40px;cursor:pointer}
.hd{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px}
.hd h1{margin:0 0 4px;font-size:1.5rem;line-height:1.3}
.hd .who{color:var(--muted)}
.tag{display:inline-block;border:1px solid var(--gold);color:var(--gold);border-radius:999px;padding:0 12px;font-weight:800;font-size:.85rem;margin-top:8px}
.note{margin-top:12px;background:var(--card2);border-inline-start:4px solid var(--gold);border-radius:12px;padding:10px 14px}
.item{background:var(--card2);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:14px}
.item .n{color:var(--gold);font-weight:800}
.q{font-size:1.15rem;margin:4px 0 10px}
.ayah{font:700 1.6rem/2.2 var(--f-ar);direction:rtl;text-align:center;background:#FFFDF7;color:#1f2a27;border-radius:14px;padding:8px 12px;margin:6px 0 10px}
.opts{display:grid;gap:8px}
.opt{font:inherit;text-align:start;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:10px 14px;min-height:50px;cursor:pointer}
.opt.on{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 16%,var(--card))}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 20%,var(--card))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--card))}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-weight:800;border:0;border-radius:14px;padding:8px 18px;min-height:48px;cursor:pointer;background:var(--gold);color:#10263A}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.rec{background:var(--rec);color:#fff}
.btn.rec.on{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
audio{width:100%;margin-top:8px}
.bar{position:fixed;inset-inline:0;bottom:0;background:color-mix(in srgb,var(--bg) 92%,transparent);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.bar .btn{width:100%;max-width:688px;display:block;margin:0 auto;font-size:1.1rem}
.msg{text-align:center;padding:40px 10px;color:var(--muted)}
.done{background:var(--card);border:2px solid var(--ok);border-radius:20px;padding:18px;margin-top:14px;text-align:center}
.done b{font-size:1.6rem;color:var(--ok)}
.small{font-size:.9rem;color:var(--muted)}
.both .en2{display:block;font-family:var(--f-en);font-size:.9em;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="brand">ترتيل القرآن</div><button class="lang" id="langBtn" type="button">English</button></div>
  <div id="app"><div class="msg">…</div></div>
</div>
<div class="bar" id="bar" hidden><button class="btn" id="send" type="button"></button></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
(function(){
  const esc = TQ.esc, $ = id => document.getElementById(id);
  const db = supabase.createClient(TQ.url, TQ.key, {auth: {persistSession: false, autoRefreshToken: false}});
  const token = new URLSearchParams(location.search).get('t') || '';
  let A = null, lang = 'ar', chosen = {}, recs = {}, sent = false, t0 = Date.now();

  const T = {
    title: ['الواجب', 'Homework'], test: ['اختبار', 'Test'], hw: ['واجب', 'Homework'],
    bad: ['اللينك ده مش شغال. اطلب لينك جديد من المعلم.', 'This link does not work. Please ask your teacher for a new link.'],
    send: ['📤 سلّم الواجب', '📤 Send my homework'], sending: ['بيتبعت…', 'Sending…'],
    q: ['سؤال', 'Question'], recite: ['سمّع', 'Recite'], listen: ['🎧 اسمع', '🎧 Listen'],
    record: ['🎙️ سجّل صوتك', '🎙️ Record your voice'], stop: ['⏹ إيقاف', '⏹ Stop'], again: ['🔁 سجّل تاني', '🔁 Record again'],
    nomic: ['المتصفح ما سمحش بالميكروفون. اسمح بالميكروفون وجرّب تاني.', 'The browser did not allow the microphone. Please allow it and try again.'],
    missing: ['فاضل أسئلة ما جاوبتهاش. تسلّم كده؟', 'Some questions have no answer. Send anyway?'],
    done: ['✅ اتسلّم! جزاك الله خيرًا', '✅ Sent! Jazāk Allāhu khayran'],
    score: ['درجتك', 'Your score'], heard: ['المعلم هيسمع تسجيلك ويرد عليك.', 'Your teacher will listen to your recording and reply.'],
    teacher: ['ملاحظة المعلم على آخر مرة', "Teacher's note on your last try"], redo: ['المعلم طلب تعيد الواجب', 'Your teacher asked you to do it again'],
    open: ['📖 افتح الدرس / اللعبة', '📖 Open the lesson / game'], due: ['آخر ميعاد', 'Due'],
    fail: ['حصلت مشكلة في الإرسال، جرّب تاني.', 'Sending failed. Please try again.'], tries: ['محاولات سابقة', 'Earlier tries']
  };
  const L = k => T[k][lang === 'en' ? 1 : 0];
  const pick = (ar, en) => lang === 'en' ? (en || ar) : (ar || en);

  function setLang(l){
    lang = l; document.documentElement.lang = l === 'en' ? 'en' : 'ar'; document.documentElement.dir = l === 'en' ? 'ltr' : 'rtl';
    $('langBtn').textContent = l === 'en' ? 'عربي' : 'English'; try{ localStorage.setItem('tq-lang', l); }catch(_){}
    if(A) draw();
  }
  $('langBtn').onclick = () => setLang(lang === 'en' ? 'ar' : 'en');

  function draw(){
    const c = A.content || {}, items = c.items || [], st = A.student || {};
    let h = '<div class="hd"><h1>' + esc(A.title) + '</h1><div class="who">👤 ' + esc(pick(st.name_ar, st.name_en)) + '</div>' +
      '<span class="tag">' + L(A.kind === 'test' ? 'test' : 'hw') + (A.subject ? ' · ' + esc(A.subject) : '') + '</span>' +
      (A.due_date ? ' <span class="tag">' + L('due') + ': ' + esc(A.due_date) + '</span>' : '') +
      (c.intro ? '<div class="note">' + esc(pick(c.intro.ar, c.intro.en)) + '</div>' : '');
    if(A.last && (A.last.feedback || A.last.status === 'redo'))
      h += '<div class="note"><b>' + L(A.last.status === 'redo' ? 'redo' : 'teacher') + '</b>' + (A.last.feedback ? '<br>' + esc(A.last.feedback) : '') + '</div>';
    if(A.page_url) h += '<div class="row" style="margin-top:12px"><a class="btn ghost" href="' + esc(A.page_url) + '" target="_blank" rel="noopener">' + L('open') + '</a></div>';
    h += '</div>';
    items.forEach((it, i) => {
      h += '<div class="item" data-i="' + i + '"><div class="n">' + (i + 1) + ' · ' + L(it.type === 'recite' ? 'recite' : 'q') + '</div>';
      if(it.type === 'mcq'){
        h += '<div class="q">' + esc(pick(it.q, it.q_en)) + '</div>' + (it.ayah ? '<div class="ayah">' + esc(it.ayah) + '</div>' : '') + '<div class="opts">' +
          (it.options || []).map((o, j) => {
            let cls = 'opt' + (chosen[i] === j ? ' on' : '');
            if(sent){ if(j === it.answer) cls += ' right'; else if(chosen[i] === j) cls += ' wrong'; }
            return '<button type="button" class="' + cls + '" data-q="' + i + '" data-o="' + j + '"' + (sent ? ' disabled' : '') + '>' + esc(typeof o === 'object' ? pick(o.ar, o.en) : o) + '</button>';
          }).join('') + '</div>';
      } else if(it.type === 'recite'){
        h += (it.say ? '<div class="q">' + esc(pick(it.say, it.say_en)) + '</div>' : '') + (it.text ? '<div class="ayah">' + esc(it.text) + '</div>' : '') +
          '<div class="row">' + (it.ref_audio ? '<button type="button" class="btn ghost" data-ref="' + i + '">' + L('listen') + '</button>' : '') +
          (sent ? '' : '<button type="button" class="btn rec" data-rec="' + i + '">' + (recs[i] ? L('again') : L('record')) + '</button>') + '</div>' +
          (recs[i] ? '<audio controls src="' + recs[i].url + '"></audio>' : '');
      }
      h += '</div>';
    });
    if(sent) h += sentBox;
    $('app').innerHTML = h;
    $('bar').hidden = sent || !items.length; $('send').textContent = L('send');
  }

  let sentBox = '';
  document.addEventListener('click', e => {
    const b = e.target.closest('button'); if(!b) return;
    if(b.dataset.q != null && !sent){ chosen[+b.dataset.q] = +b.dataset.o; draw(); return; }
    if(b.dataset.ref != null){ const a = new Audio(A.content.items[+b.dataset.ref].ref_audio); a.play().catch(() => {}); return; }
    if(b.dataset.rec != null) return toggleRec(+b.dataset.rec, b);
  });

  let mr = null, recFor = -1;
  async function toggleRec(i, b){
    if(mr && mr.state === 'recording'){ mr.stop(); return; }
    let stream;
    try{ stream = await navigator.mediaDevices.getUserMedia({audio: true}); }catch(_){ alert(L('nomic')); return; }
    const chunks = []; recFor = i;
    mr = new MediaRecorder(stream);
    mr.ondataavailable = ev => { if(ev.data.size) chunks.push(ev.data); };
    mr.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      const type = (mr.mimeType || 'audio/webm').split(';')[0];
      const blob = new Blob(chunks, {type});
      if(recs[recFor]) URL.revokeObjectURL(recs[recFor].url);
      recs[recFor] = {blob, type, url: URL.createObjectURL(blob)}; mr = null; draw();
    };
    mr.start(); b.textContent = L('stop'); b.classList.add('on');
  }

  $('send').onclick = async () => {
    const items = (A.content && A.content.items) || [];
    const mcq = items.map((it, i) => [it, i]).filter(x => x[0].type === 'mcq');
    if(mcq.some(x => chosen[x[1]] == null) && !confirm(L('missing'))) return;
    const btn = $('send'); btn.disabled = true; btn.textContent = L('sending');
    try{
      const paths = [], recite = [];
      for(const k of Object.keys(recs)){
        const r = recs[k], ext = r.type.indexOf('mp4') >= 0 ? 'm4a' : r.type.indexOf('ogg') >= 0 ? 'ogg' : r.type.indexOf('mpeg') >= 0 ? 'mp3' : 'webm';
        const path = token + '/' + Date.now() + '-' + k + '.' + ext;
        const up = await db.storage.from('recordings').upload(path, r.blob, {contentType: r.type === 'audio/x-m4a' ? 'audio/mp4' : r.type, upsert: false});
        if(up.error) throw up.error;
        paths.push(path); recite.push({i: +k, path});
      }
      const right = mcq.filter(x => chosen[x[1]] === x[0].answer).length;
      const answers = {mcq: mcq.map(x => ({i: x[1], chose: chosen[x[1]] == null ? null : chosen[x[1]], right: chosen[x[1]] === x[0].answer})), recite};
      const r = await db.rpc('submit_assignment', {p_token: token, p_score: mcq.length ? right : null, p_max: mcq.length || null,
        p_answers: answers, p_audio_paths: paths, p_duration: Math.round((Date.now() - t0) / 1000)});
      if(r.error) throw r.error;
      sent = true;
      sentBox = '<div class="done"><div>' + L('done') + '</div>' + (mcq.length ? '<div style="margin-top:6px">' + L('score') + ': <b>' + right + ' / ' + mcq.length + '</b></div>' : '') +
        (paths.length ? '<div class="small" style="margin-top:6px">' + L('heard') + '</div>' : '') + '</div>';
      draw(); scrollTo({top: document.body.scrollHeight, behavior: 'smooth'});
    }catch(err){
      console.error(err); alert(L('fail') + '\n' + (err.message || err)); btn.disabled = false; btn.textContent = L('send');
    }
  };

  (async () => {
    if(!token){ $('app').innerHTML = '<div class="msg">' + L('bad') + '</div>'; return; }
    const r = await db.rpc('get_assignment', {p_token: token});
    if(r.error || !r.data){ setLang((navigator.language || '').indexOf('ar') === 0 ? 'ar' : 'en'); $('app').innerHTML = '<div class="msg">' + L('bad') + '<br>' + T.bad[1] + '</div>'; return; }
    A = r.data;
    let saved = null; try{ saved = localStorage.getItem('tq-lang'); }catch(_){}
    setLang(saved || (A.student && A.student.lang === 'ar' ? 'ar' : 'en'));
    draw();
  })();
})();
</script>
</body>
</html>
