<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>الواجب · Homework — Mohamed Mubarak</title>
<text y='.9em' font-size='90'>📖</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Amiri:wght@400;700&family=Inter:wght@400;600;800&display=swap">
<style>
:root{color-scheme:dark;--bg:#0B1E2D;--card:#163A57;--card2:#12304A;--ink:#F4EBD6;--muted:#B4C5D3;--line:#2A5675;--gold:#E2B85C;--ok:#2ECC71;--bad:#F1948A;--rec:#E74C3C;
  --f-ui:"Baloo Bhaijaan 2","Segoe UI",Tahoma,sans-serif;--f-ar:"Amiri","Traditional Arabic",serif;--f-en:"Inter","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:500 17px/1.6 var(--f-ui);min-height:100vh}
html[lang=en] body{font-family:var(--f-en)}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 120px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.brand{font:700 1.3rem var(--f-ar);color:var(--gold);margin-inline-end:auto}
.lang{font:inherit;font-weight:700;border:2px solid var(--line);background:var(--card2);color:var(--ink);border-radius:999px;padding:2px 14px;min-height:40px;cursor:pointer}
.hd{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px}
.hd h1{margin:0 0 4px;font-size:1.5rem;line-height:1.3}
.hd .who{color:var(--muted)}
.tag{display:inline-block;border:1px solid var(--gold);color:var(--gold);border-radius:999px;padding:0 12px;font-weight:800;font-size:.85rem;margin-top:8px}
.note{margin-top:12px;background:var(--card2);border-inline-start:4px solid var(--gold);border-radius:12px;padding:10px 14px}
.item{background:var(--card2);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:14px}
.item .n{color:var(--gold);font-weight:800}
.q{font-size:1.15rem;margin:4px 0 10px}
.ayah{font:700 1.6rem/2.2 var(--f-ar);direction:rtl;text-align:center;background:#FFFDF7;color:#1f2a27;border-radius:14px;padding:8px 12px;margin:6px 0 10px}
.opts{display:grid;gap:8px}
.opt{font:inherit;text-align:start;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:10px 14px;min-height:50px;cursor:pointer}
.opt.on{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 16%,var(--card))}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 20%,var(--card))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--card))}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-weight:800;border:0;border-radius:14px;padding:8px 18px;min-height:48px;cursor:pointer;background:var(--gold);color:#10263A}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.rec{background:var(--rec);color:#fff}
.btn.rec.on{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
audio{width:100%;margin-top:8px}
.bar{position:fixed;inset-inline:0;bottom:0;background:color-mix(in srgb,var(--bg) 92%,transparent);border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.bar .btn{width:100%;max-width:688px;display:block;margin:0 auto;font-size:1.1rem}
.msg{text-align:center;padding:40px 10px;color:var(--muted)}
.done{background:var(--card);border:2px solid var(--ok);border-radius:20px;padding:18px;margin-top:14px;text-align:center}
.done b{font-size:1.6rem;color:var(--ok)}
.small{font-size:.9rem;color:var(--muted)}
.pframe{display:block;width:100%;height:520px;border:0;border-radius:14px;background:#fff;margin-top:6px}
.both .en2{display:block;font-family:var(--f-en);font-size:.9em;color:var(--muted)}
</style>
<link rel="icon" type="image/svg+xml" href="../assets/brand/emblem.svg"><link rel="apple-touch-icon" href="../assets/brand/apple-touch-icon.png">
</head>
<body>
<div class="wrap">
  <div class="top"><div class="brand" style="display:flex;align-items:center;gap:10px"><img src="../assets/brand/emblem.svg" alt="" style="width:42px;height:42px">محمد مبارك</div><button class="lang" id="langBtn" type="button">English</button></div>
  <div id="app"><div class="msg">…</div></div>
  <div id="items"></div>
  <div id="after"></div>
</div>
<div class="bar" id="bar" hidden><button class="btn" id="send" type="button"></button></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="quran-data.js"></script>
<script>
(function(){
  const esc = TQ.esc, $ = id => document.getElementById(id);
  const db = supabase.createClient(TQ.url, TQ.key, {auth: {persistSession: false, autoRefreshToken: false}});
  const token = new URLSearchParams(location.search).get('t') || '';
  let A = null, lang = 'ar', chosen = {}, recs = {}, sent = false, t0 = Date.now();

  const T = {
    title: ['الواجب', 'Homework'], test: ['اختبار', 'Test'], hw: ['واجب', 'Homework'],
    bad: ['اللينك ده مش شغال. اطلب لينك جديد من المعلم.', 'This link does not work. Please ask your teacher for a new link.'],
    send: ['📤 سلّم الواجب', '📤 Send my homework'], sending: ['بيتبعت…', 'Sending…'],
    q: ['سؤال', 'Question'], recite: ['سمّع', 'Recite'], listen: ['🎧 اسمع', '🎧 Listen'],
    record: ['🎙️ سجّل صوتك', '🎙️ Record your voice'], stop: ['⏹ إيقاف', '⏹ Stop'], again: ['🔁 سجّل تاني', '🔁 Record again'],
    nomic: ['المتصفح ما سمحش بالميكروفون. اسمح بالميكروفون وجرّب تاني.', 'The browser did not allow the microphone. Please allow it and try again.'],
    missing: ['فاضل أسئلة ما جاوبتهاش. تسلّم كده؟', 'Some questions have no answer. Send anyway?'],
    done: ['✅ اتسلّم! جزاك الله خيرًا', '✅ Sent! Jazāk Allāhu khayran'],
    score: ['درجتك', 'Your score'], heard: ['المعلم هيسمع تسجيلك ويرد عليك.', 'Your teacher will listen to your recording and reply.'],
    teacher: ['ملاحظة المعلم على آخر مرة', "Teacher's note on your last try"], redo: ['المعلم طلب تعيد الواجب', 'Your teacher asked you to do it again'],
    open: ['📖 افتح الدرس / اللعبة', '📖 Open the lesson / game'], due: ['آخر ميعاد', 'Due'],
    lst: ['▶ ابدأ الاستماع', '▶ Start listening'], pause: ['⏸ إيقاف مؤقت', '⏸ Pause'], resume: ['▶ كمّل', '▶ Resume'], rep: ['التكرار', 'Repeat'], ayah: ['الآية', 'Ayah'],
    lfin: ['✓ خلّصت الاستماع', '✓ Listening finished'], speed: ['السرعة', 'Speed'], qhd: ['واجب قرآن', 'Qur’an homework'],
    notext: ['ما قدرنا نحمّل نص الآيات — الاستماع شغال عادي.', 'Could not load the verses text — listening still works.'],
    noaud: ['الصوت ما اتحمّلش. اتأكد من النت وجرّب تاني.', 'The audio did not load. Check your connection and try again.'],
    nolis: ['لسه ما خلّصتش الاستماع المطلوب. تسلّم كده؟', 'You have not finished the required listening. Send anyway?'], reciteNow: ['بعد ما تسمع: سمّع بصوتك وسجّل.', 'After listening: recite in your own voice and record it.'],
    fail: ['حصلت مشكلة في الإرسال، جرّب تاني.', 'Sending failed. Please try again.'], tries: ['محاولات سابقة', 'Earlier tries'],
    page: ['نشاط', 'Activity'], pwait: ['حل النشاط اللي فوق — نتيجتك هتتبعت مع الواجب.', 'Do the activity above — your result is sent with your homework.'],
    pres: ['نتيجتك', 'Your result'], pdone: ['خلّصت ✓', 'finished ✓'], nopage: ['لسه ما خلّصتش النشاط. تسلّم كده؟', 'You have not finished the activity. Send anyway?'],
    precs: ['تسجيلات', 'recordings']
  };
  const L = k => T[k][lang === 'en' ? 1 : 0];
  const pick = (ar, en) => lang === 'en' ? (en || ar) : (ar || en);

  function setLang(l){
    lang = l; document.documentElement.lang = l === 'en' ? 'en' : 'ar'; document.documentElement.dir = l === 'en' ? 'ltr' : 'rtl';
    $('langBtn').textContent = l === 'en' ? 'عربي' : 'English'; try{ localStorage.setItem('tq-lang', l); }catch(_){}
    if(A){ draw(); framesPost({kind: 'lang', lang: l, name: pick((A.student || {}).name_ar, (A.student || {}).name_en) || ''}); pageStatusAll(); }
  }
  $('langBtn').onclick = () => setLang(lang === 'en' ? 'ar' : 'en');

  function draw(){
    const c = A.content || {}, items = c.items || [], st = A.student || {};
    let h = '<div class="hd"><h1>' + esc(A.title) + '</h1><div class="who">👤 ' + esc(pick(st.name_ar, st.name_en)) + '</div>' +
      '<span class="tag">' + L(A.kind === 'test' ? 'test' : 'hw') + (A.subject ? ' · ' + esc(A.subject) : '') + '</span>' +
      (A.due_date ? ' <span class="tag">' + L('due') + ': ' + esc(A.due_date) + '</span>' : '') +
      (c.intro ? '<div class="note">' + esc(pick(c.intro.ar, c.intro.en)) + '</div>' : '');
    if(A.last && (A.last.feedback || A.last.status === 'redo'))
      h += '<div class="note"><b>' + L(A.last.status === 'redo' ? 'redo' : 'teacher') + '</b>' + (A.last.feedback ? '<br>' + esc(A.last.feedback) : '') + '</div>';
    if(A.page_url) h += '<div class="row" style="margin-top:12px"><a class="btn ghost" href="' + esc(A.page_url) + '" target="_blank" rel="noopener">' + L('open') + '</a></div>';
    h += '</div>';
    $('app').innerHTML = h;
    if(!$('items').children.length) $('items').innerHTML = items.map((it, i) => '<div data-box="' + i + '"></div>').join('');
    items.forEach((it, i) => {
      if(it.type === 'page') return;
      h = '<div class="item" data-i="' + i + '"><div class="n">' + (i + 1) + ' · ' + L(it.type === 'quran' ? 'qhd' : it.type === 'recite' ? 'recite' : 'q') + '</div>';
      if(it.type === 'mcq'){
        h += '<div class="q">' + esc(pick(it.q, it.q_en)) + '</div>' + (it.ayah ? '<div class="ayah">' + esc(it.ayah) + '</div>' : '') + '<div class="opts">' +
          (it.options || []).map((o, j) => {
            let cls = 'opt' + (chosen[i] === j ? ' on' : '');
            if(sent){ if(j === it.answer) cls += ' right'; else if(chosen[i] === j) cls += ' wrong'; }
            return '<button type="button" class="' + cls + '" data-q="' + i + '" data-o="' + j + '"' + (sent ? ' disabled' : '') + '>' + esc(typeof o === 'object' ? pick(o.ar, o.en) : o) + '</button>';
          }).join('') + '</div>';
      } else if(it.type === 'quran'){
        h += quranBlock(it, i);
      } else if(it.type === 'recite'){
        h += (it.say ? '<div class="q">' + esc(pick(it.say, it.say_en)) + '</div>' : '') + (it.text ? '<div class="ayah">' + esc(it.text) + '</div>' : '') +
          '<div class="row">' + (it.ref_audio ? '<button type="button" class="btn ghost" data-ref="' + i + '">' + L('listen') + '</button>' : '') +
          (sent ? '' : '<button type="button" class="btn rec" data-rec="' + i + '">' + (recs[i] ? L('again') : L('record')) + '</button>') + '</div>' +
          (recs[i] ? '<audio controls src="' + recs[i].url + '"></audio>' : '');
      }
      h += '</div>';
      document.querySelector('[data-box="' + i + '"]').innerHTML = h;
    });
    $('after').innerHTML = sent ? sentBox : '';
    $('bar').hidden = sent || !items.length; $('send').textContent = L('send');
  }

  /* ---------- 🧩 interactive homework pages (built with app/hwkit.js): they run here and hand back score, answers and recordings ---------- */
  const pageRes = {}, pageRecs = {}, frames = {};
  const pageUrl = (u, st) => { const x = new URL(u, new URL('../', location.href)); x.searchParams.set('embed', '1'); x.searchParams.set('lang', lang);
    x.searchParams.set('name', pick(st.name_ar, st.name_en) || ''); return x.href; };
  function drawPages(){
    const items = (A.content && A.content.items) || [], st = A.student || {};
    items.forEach((it, i) => { if(it.type !== 'page') return;
      document.querySelector('[data-box="' + i + '"]').innerHTML = '<div class="item" data-i="' + i + '"><div class="n" data-pt="' + i + '"></div>' +
        '<iframe class="pframe" data-pf="' + i + '" src="' + esc(pageUrl(it.url, st)) + '" allow="microphone; autoplay; fullscreen" title="' + esc(it.title || '') + '"></iframe>' +
        '<div class="small" data-ps="' + i + '"></div></div>';
      frames[i] = document.querySelector('[data-pf="' + i + '"]'); });
    pageStatusAll();
  }
  function pageStatusAll(){
    if(!A) return; const items = (A.content && A.content.items) || [];
    items.forEach((it, i) => {
      if(it.type !== 'page') return;
      const t = document.querySelector('[data-pt="' + i + '"]'), s = document.querySelector('[data-ps="' + i + '"]'), r = pageRes[i], n = (pageRecs[i] || []).length;
      if(t) t.textContent = (i + 1) + ' · 🧩 ' + (pick(it.title, it.title_en) || L('page'));
      if(s) s.innerHTML = r ? L('pres') + ': ' + (r.max ? '<b dir="ltr">' + r.score + ' / ' + r.max + '</b> ' : '') + (r.done ? L('pdone') : '') + (n ? ' · 🎙️ ' + n + ' ' + L('precs') : '') : L('pwait') + (n ? ' · 🎙️ ' + n + ' ' + L('precs') : '');
    });
  }
  function framesPost(m){ Object.values(frames).forEach(f => { try{ f.contentWindow.postMessage(Object.assign({tq: 'hw'}, m), '*'); }catch(_){} }); }
  window.addEventListener('message', e => {
    const m = e.data; if(!m || m.tq !== 'hw') return;
    const k = Object.keys(frames).find(j => frames[j].contentWindow === e.source); if(k == null) return;
    const i = +k, st = A.student || {};
    if(m.kind === 'ready') e.source.postMessage({tq: 'hw', kind: 'init', lang, name: pick(st.name_ar, st.name_en) || ''}, '*');
    else if(m.kind === 'height') frames[k].style.height = Math.min(Math.max(+m.h || 0, 260), 6000) + 'px';
    else if(m.kind === 'result' && !sent){ pageRes[i] = m.result; pageStatusAll(); }
    else if(m.kind === 'rec' && !sent && m.blob){ const a = pageRecs[i] = pageRecs[i] || []; if(a.length < 5) a.push({blob: m.blob, type: m.type || 'audio/webm', label: m.label || ''}); pageStatusAll(); }
  });

  /* ---------- Qur'an homework: listen N times (ayah by ayah, highlighted), then recite ---------- */
  const lst = {}, verses = {}; let au = null;
  const st = i => lst[i] || (lst[i] = {rep: 0, ayah: 0, playing: false, paused: false, done: false, speed: 1, err: ''});
  function loadVerses(s){
    if(verses[s]) return; verses[s] = {};
    fetch(TQQ.textUrl(s)).then(r => r.json()).then(j => { (j.verses || []).forEach(v => { verses[s][v.verse_key] = v.text_uthmani; }); if(!sent) draw(); })
      .catch(() => { verses[s] = null; if(!sent) draw(); });
  }
  function quranBlock(it, i){
    const s = st(i), n = it.to - it.from + 1, name = TQQ.nameOf(it.surah, lang), V = verses[it.surah];
    if(it.showtext !== false && V === undefined) loadVerses(it.surah);
    let h = '<div class="q"><b>' + esc((lang === 'en' ? 'Surah ' : 'سورة ') + name) + '</b> · ' + L('ayah') + ' ' + it.from + (n > 1 ? '–' + it.to : '') + ' · ×' + it.reps + '</div>';
    if(it.showtext !== false){
      if(V === null) h += '<div class="small">' + L('notext') + '</div>';
      else h += '<div class="ayah" style="line-height:2.3">' + Array.from({length: n}, (_, k) => { const a = it.from + k, t = V && V[it.surah + ':' + a];
        return '<span data-ay="' + i + ':' + a + '" style="' + (s.playing && s.ayah === a ? 'background:#F6E3A8;border-radius:8px;padding:0 6px' : '') + '">' + esc(t || '…') + ' ﴿' + a + '﴾</span> '; }).join('') + '</div>';
    }
    h += '<div class="row">' + (s.done ? '<span class="tag" style="margin:0">' + L('lfin') + ' · ' + it.reps + '/' + it.reps + '</span>' : '') +
      '<button type="button" class="btn" data-play="' + i + '"' + (sent ? ' disabled' : '') + '>' + (s.playing ? L('pause') : s.paused ? L('resume') : L('lst')) + '</button>' +
      '<label class="small">' + L('speed') + ' <select data-speed="' + i + '" style="font:inherit;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:2px 6px">' +
      [.75, 1, 1.25].map(x => '<option value="' + x + '"' + (s.speed === x ? ' selected' : '') + '>' + x + '×</option>').join('') + '</select></label>' +
      '<span class="small" id="lc' + i + '">' + (s.rep ? L('rep') + ' ' + s.rep + '/' + it.reps : '') + '</span></div>' + (s.err ? '<div class="small" style="color:var(--bad)">' + esc(s.err) + '</div>' : '');
    if(it.record){
      h += '<div class="small" style="margin-top:10px">' + L('reciteNow') + '</div><div class="row">' + (sent ? '' : '<button type="button" class="btn rec" data-rec="' + i + '">' + (recs[i] ? L('again') : L('record')) + '</button>') + '</div>' +
        (recs[i] ? '<audio controls src="' + recs[i].url + '"></audio>' : '');
    }
    return h;
  }
  function stopAudio(){ if(au){ au.onended = au.onerror = null; au.pause(); au = null; } }
  function playItem(i){
    const it = A.content.items[i], s = st(i);
    if(s.playing){ s.playing = false; s.paused = true; if(au) au.pause(); draw(); return; }
    if(s.paused && au){ s.playing = true; s.paused = false; au.play().catch(() => {}); draw(); return; }
    stopAll(i); s.rep = 1; s.ayah = it.from; s.playing = true; s.paused = false; s.done = false; s.err = ''; draw(); step(i);
  }
  function stopAll(except){ Object.keys(lst).forEach(k => { if(+k !== except && lst[k].playing){ lst[k].playing = false; lst[k].paused = false; } }); stopAudio(); }
  function step(i){
    const it = A.content.items[i], s = st(i); if(!s.playing) return;
    stopAudio(); au = new Audio(TQQ.audioUrl(it.reciter, it.surah, s.ayah)); au.playbackRate = s.speed;
    au.onended = () => {
      if(s.ayah < it.to) s.ayah++;
      else if(s.rep < it.reps){ s.rep++; s.ayah = it.from; }
      else { s.playing = false; s.done = true; s.reps_done = it.reps; stopAudio(); draw(); return; }
      s.reps_done = s.rep - 1; draw(); step(i);
    };
    au.onerror = () => { s.playing = false; s.err = L('noaud'); stopAudio(); draw(); };
    au.play().catch(() => { s.playing = false; s.err = L('noaud'); draw(); });
    const c = document.getElementById('lc' + i); if(c) c.textContent = L('rep') + ' ' + s.rep + '/' + it.reps;
  }
  document.addEventListener('change', e => { const sp = e.target.closest && e.target.closest('[data-speed]'); if(sp){ const s = st(+sp.dataset.speed); s.speed = +sp.value; if(au) au.playbackRate = s.speed; } });

  let sentBox = '';
  document.addEventListener('click', e => {
    const b = e.target.closest('button'); if(!b) return;
    if(b.dataset.play != null) return playItem(+b.dataset.play);
    if(b.dataset.q != null && !sent){ chosen[+b.dataset.q] = +b.dataset.o; draw(); return; }
    if(b.dataset.ref != null){ const a = new Audio(A.content.items[+b.dataset.ref].ref_audio); a.play().catch(() => {}); return; }
    if(b.dataset.rec != null) return toggleRec(+b.dataset.rec, b);
  });

  let mr = null, recFor = -1;
  async function toggleRec(i, b){
    if(mr && mr.state === 'recording'){ mr.stop(); return; }
    let stream;
    try{ stream = await navigator.mediaDevices.getUserMedia({audio: true}); }catch(_){ alert(L('nomic')); return; }
    const chunks = []; recFor = i;
    mr = new MediaRecorder(stream);
    mr.ondataavailable = ev => { if(ev.data.size) chunks.push(ev.data); };
    mr.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      const type = (mr.mimeType || 'audio/webm').split(';')[0];
      const blob = new Blob(chunks, {type});
      if(recs[recFor]) URL.revokeObjectURL(recs[recFor].url);
      recs[recFor] = {blob, type, url: URL.createObjectURL(blob)}; mr = null; draw();
    };
    mr.start(); b.textContent = L('stop'); b.classList.add('on');
  }

  $('send').onclick = async () => {
    const items = (A.content && A.content.items) || [];
    const mcq = items.map((it, i) => [it, i]).filter(x => x[0].type === 'mcq');
    if(mcq.some(x => chosen[x[1]] == null) && !confirm(L('missing'))) return;
    const qs = items.map((it, i) => [it, i]).filter(x => x[0].type === 'quran');
    if(qs.some(x => !st(x[1]).done) && !confirm(L('nolis'))) return;
    const pg = items.map((it, i) => [it, i]).filter(x => x[0].type === 'page');
    if(pg.some(x => !(pageRes[x[1]] && pageRes[x[1]].done)) && !confirm(L('nopage'))) return;
    const btn = $('send'); btn.disabled = true; btn.textContent = L('sending');
    try{
      const paths = [], recite = [];
      for(const k of Object.keys(recs)){
        const r = recs[k], ext = r.type.indexOf('mp4') >= 0 ? 'm4a' : r.type.indexOf('ogg') >= 0 ? 'ogg' : r.type.indexOf('mpeg') >= 0 ? 'mp3' : 'webm';
        const path = token + '/' + Date.now() + '-' + k + '.' + ext;
        const up = await db.storage.from('recordings').upload(path, r.blob, {contentType: r.type === 'audio/x-m4a' ? 'audio/mp4' : r.type, upsert: false});
        if(up.error) throw up.error;
        paths.push(path); recite.push({i: +k, path});
      }
      for(const k of Object.keys(pageRecs)) for(let n = 0; n < pageRecs[k].length; n++){
        const r = pageRecs[k][n], ext = r.type.indexOf('mp4') >= 0 ? 'm4a' : r.type.indexOf('ogg') >= 0 ? 'ogg' : r.type.indexOf('mpeg') >= 0 ? 'mp3' : 'webm';
        const path = token + '/' + Date.now() + '-p' + k + '-' + n + '.' + ext;
        const up = await db.storage.from('recordings').upload(path, r.blob, {contentType: r.type === 'audio/x-m4a' ? 'audio/mp4' : r.type, upsert: false});
        if(up.error) throw up.error;
        paths.push(path); recite.push({i: +k, path, label: r.label || undefined});
      }
      const right = mcq.filter(x => chosen[x[1]] === x[0].answer).length;
      const listen = qs.map(x => ({i: x[1], reps: x[0].reps, reps_done: st(x[1]).done ? x[0].reps : Math.max(0, (st(x[1]).reps_done || 0)), done: !!st(x[1]).done}));
      const page = pg.map(x => Object.assign({i: x[1]}, pageRes[x[1]] || {score: null, max: null, done: false, details: []}));
      const answers = {listen, mcq: mcq.map(x => ({i: x[1], chose: chosen[x[1]] == null ? null : chosen[x[1]], right: chosen[x[1]] === x[0].answer})), recite, page};
      const pMax = page.reduce((t, p) => t + (p.max || 0), 0), pScore = page.reduce((t, p) => t + (p.max ? (p.score || 0) : 0), 0);
      const tot = right + pScore, totMax = mcq.length + pMax;
      const r = await db.rpc('submit_assignment', {p_token: token, p_score: totMax ? tot : null, p_max: totMax || null,
        p_answers: answers, p_audio_paths: paths, p_duration: Math.round((Date.now() - t0) / 1000)});
      if(r.error) throw r.error;
      sent = true;
      sentBox = '<div class="done"><div>' + L('done') + '</div>' + (totMax ? '<div style="margin-top:6px">' + L('score') + ': <b dir="ltr">' + tot + ' / ' + totMax + '</b></div>' : '') +
        (paths.length ? '<div class="small" style="margin-top:6px">' + L('heard') + '</div>' : '') + '</div>';
      draw(); scrollTo({top: document.body.scrollHeight, behavior: 'smooth'});
    }catch(err){
      console.error(err); alert(L('fail') + '\n' + (err.message || err)); btn.disabled = false; btn.textContent = L('send');
    }
  };

  (async () => {
    if(!token){ $('app').innerHTML = '<div class="msg">' + L('bad') + '</div>'; return; }
    const r = await db.rpc('get_assignment', {p_token: token});
    if(r.error || !r.data){ setLang((navigator.language || '').indexOf('ar') === 0 ? 'ar' : 'en'); $('app').innerHTML = '<div class="msg">' + L('bad') + '<br>' + T.bad[1] + '</div>'; return; }
    A = r.data;
    let saved = null; try{ saved = localStorage.getItem('tq-lang'); }catch(_){}
    setLang(saved || (A.student && A.student.lang === 'ar' ? 'ar' : 'en'));
    draw(); drawPages();
  })();
})();
</script>
