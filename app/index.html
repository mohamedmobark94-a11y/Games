<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>لوحة المعلم · ترتيل</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Amiri:wght@400;700&display=swap">
<style>
:root{color-scheme:dark;--bg:#0B1E2D;--card:#163A57;--card2:#12304A;--ink:#F4EBD6;--muted:#B4C5D3;--line:#2A5675;--gold:#E2B85C;--ok:#2ECC71;--bad:#F1948A;--wa:#25D366;
  --f-ui:"Baloo Bhaijaan 2","Segoe UI",Tahoma,sans-serif;--f-ar:"Amiri","Traditional Arabic",serif}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.6 var(--f-ui);min-height:100vh}
a{color:var(--gold)}
.top{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
.top .in{max-width:1000px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:8px 16px;flex-wrap:wrap}
.brand{font:700 1.3rem var(--f-ar);color:var(--gold);margin-inline-end:auto}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{font:inherit;font-weight:700;border:2px solid var(--line);background:var(--card2);color:var(--ink);border-radius:999px;padding:2px 14px;min-height:40px;cursor:pointer}
.tab.on{background:var(--gold);border-color:var(--gold);color:#10263A}
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:99px;background:var(--bad);color:#10263A;font-size:.8rem;margin-inline-start:4px}
.wrap{max-width:1000px;margin:0 auto;padding:16px 16px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.card.new{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
h2{margin:4px 0 12px;font-size:1.3rem}
label{display:block;font-weight:700;color:var(--muted);font-size:.9rem;margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;background:var(--card2);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:8px 12px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:620px){.grid2{grid-template-columns:1fr}}
.btn{font:inherit;font-weight:800;border:0;border-radius:12px;padding:6px 16px;min-height:44px;cursor:pointer;background:var(--gold);color:#10263A}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn.wa{background:var(--wa);color:#06331A}
.btn.sm{min-height:36px;padding:2px 12px;font-size:.9rem}
.chip{font:inherit;font-weight:700;border:2px solid var(--line);background:var(--card2);color:var(--ink);border-radius:999px;padding:2px 12px;min-height:38px;cursor:pointer}
.chip.on{background:var(--gold);border-color:var(--gold);color:#10263A}
.muted{color:var(--muted)}.small{font-size:.88rem}
.ayah{font:700 1.4rem/2 var(--f-ar);background:#FFFDF7;color:#1f2a27;border-radius:12px;padding:6px 12px;text-align:center}
.item{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}
.score{font-size:1.4rem;font-weight:800;color:var(--ok)}
.st{display:inline-block;border-radius:99px;padding:0 10px;font-size:.8rem;font-weight:800}
.st.submitted{background:var(--gold);color:#10263A}.st.reviewed{background:var(--ok);color:#10263A}.st.redo{background:var(--bad);color:#10263A}
audio{width:100%;margin-top:6px}
table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid var(--line);padding:8px 6px;text-align:start;vertical-align:top}
.link{direction:ltr;unicode-bidi:isolate;font-size:.85rem;word-break:break-all;color:var(--muted)}
.full .wrap{max-width:none;padding:0}
#genFrame{display:block;width:100%;height:calc(100vh - 58px);border:0;background:#fff}
.md h2,.md h3,.md h4,.md h5{margin:14px 0 6px;color:var(--gold)}.md p{margin:4px 0}.md .mdq{border-inline-start:3px solid var(--gold);padding:2px 10px;color:var(--muted);margin:6px 0}
.mdt{margin:8px 0;font-size:.9rem;background:var(--card2);border-radius:10px;overflow:hidden}.mdt th{color:var(--gold)}.md code{background:var(--card2);padding:0 4px;border-radius:4px}
.flash{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ok);color:#10263A;font-weight:800;border-radius:99px;padding:8px 18px;z-index:99}
</style>
</head>
<body>
<div class="top"><div class="in">
  <div class="brand">📖 لوحة المعلم · ترتيل</div>
  <div class="tabs" id="tabs" hidden>
    <button class="tab" data-v="report">📝 تقرير الحصة</button>
    <button class="tab on" data-v="inbox">📥 التسليمات<span class="badge" id="nNew" hidden></span></button>
    <button class="tab" data-v="new">✏️ واجب جديد</button>
    <button class="tab" data-v="list">📋 الواجبات</button>
    <button class="tab" data-v="students">👥 الطلاب<span class="badge" id="nSend" hidden></span></button>
    <button class="tab" data-v="lessons">📚 الدروس</button>
    <button class="tab" data-v="plans">🗂️ الخطط</button>
    <button class="tab" data-v="mushaf">📖 المصحف</button>
    <button class="tab" data-v="games">🎮 الألعاب</button>
    <button class="tab" id="out">خروج</button>
  </div>
</div></div>
<div class="wrap" id="pend" style="padding-bottom:0"></div>
<div class="wrap" id="app"><div class="card muted">…</div></div>
<div class="flash" id="flash" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="quran-data.js"></script>
<script>
(function(){
  const esc = TQ.esc, $ = id => document.getElementById(id), app = $('app');
  const db = supabase.createClient(TQ.url, TQ.key);
  const HW = new URL('app/hw.html', TQ.site).href;
  let view = 'inbox', students = [], draft = null;
  const flash = t => { const f = $('flash'); f.textContent = t; f.hidden = false; clearTimeout(flash.t); flash.t = setTimeout(() => f.hidden = true, 1800); };
  const nm = s => s ? (s.name_ar + (s.name_en ? ' · ' + s.name_en : '')) : '';
  const day = d => d ? new Date(d).toLocaleString('ar-EG', {day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'}) : '';
  const linkOf = tok => HW + '?t=' + tok;
  const copy = async t => { try{ await navigator.clipboard.writeText(t); flash('اتنسخ ✓'); }catch(_){ prompt('انسخ:', t); } };

  /* ---------- sign in ---------- */
  function loginView(msg){
    $('tabs').hidden = true;
    app.innerHTML = '<div class="card" style="max-width:440px;margin:40px auto"><h2>تسجيل الدخول</h2>' +
      (msg ? '<p class="muted">' + msg + '</p>' : '') +
      '<label>الإيميل</label><input id="em" type="email" autocomplete="username">' +
      '<label>الباسورد</label><input id="pw" type="password" autocomplete="current-password">' +
      '<div class="row" style="margin-top:14px"><button class="btn" id="go">دخول</button><button class="btn ghost" id="mk">أول مرة؟ اعمل حساب</button></div>' +
      '<p class="small muted" id="lm"></p></div>';
    const em = $('em'), pw = $('pw'), lm = $('lm');
    $('go').onclick = async () => { lm.textContent = '…'; const r = await db.auth.signInWithPassword({email: em.value.trim(), password: pw.value}); lm.textContent = r.error ? ('معرفتش أدخل: ' + r.error.message) : ''; if(!r.error) start(); };
    $('mk').onclick = async () => {
      if(pw.value.length < 8){ lm.textContent = 'الباسورد لازم 8 حروف أو أكتر.'; return; }
      lm.textContent = '…';
      const r = await db.auth.signUp({email: em.value.trim(), password: pw.value, options: {emailRedirectTo: TQ.site + 'app/'}});
      lm.textContent = r.error ? ('معرفتش أعمل الحساب: ' + r.error.message) : 'اتعمل ✓ — قول لـ Claude «فعّل حسابي» عشان يديك صلاحية المعلم، وبعدها ادخل.';
    };
    pw.addEventListener('keydown', e => { if(e.key === 'Enter') $('go').click(); });
  }
  $('out').onclick = async () => { await db.auth.signOut(); loginView(); };

  async function start(){
    const s = await db.auth.getSession();
    if(!s.data.session) return loginView();
    const t = await db.rpc('is_teacher');
    if(!t.data) return loginView('الحساب ده لسه ما اتفعّلش كحساب معلم — قول لـ Claude «فعّل حسابي».');
    $('tabs').hidden = false;
    const r = await db.from('students').select('*').order('name_ar');
    students = r.data || [];
    go(view);
    checkPending(); setInterval(checkPending, 60000); document.addEventListener('visibilitychange', () => { if(!document.hidden) checkPending(); });
  }
  document.querySelectorAll('.tab[data-v]').forEach(b => b.onclick = () => go(b.dataset.v));
  function go(v){
    view = v; document.querySelectorAll('.tab[data-v]').forEach(b => b.classList.toggle('on', b.dataset.v === v));
    document.body.classList.toggle('full', v === 'report' || v === 'mushaf');
    ({inbox, new: newView, list: listView, students: studentsView, report: reportView, lessons: lessonsView, plans: plansView, games: gamesView, mushaf: mushafView})[v]();
  }

  /* ---------- 📝 the report generator (kept private: it carries student names) ---------- */
  let genUrl = null;
  /* Runs inside the report generator page. 1) "Last report per student" now restores the session length (from the
     student's card in the desk, otherwise from the saved report) and the saved snapshot keeps it. 2) The signature follows
     the student: their last chosen signature (or the one the last report went out with) comes before the teacher-name rule. */
  function genFixes(){
    if(window.__tqFix1) return; window.__tqFix1 = true;
    const $g = id => document.getElementById(id);
    if(typeof window.snapshotForm === 'function'){ const o = window.snapshotForm;
      window.snapshotForm = function(){ const s = o.apply(this, arguments);
        try{ s.duration = $g('duration').value; }catch(e){}
        try{ if(typeof window.effectiveTeam === 'function') s.sig = window.effectiveTeam(); }catch(e){}
        return s; }; }
    window.effectiveTeam = function(){
      const chosen = $g('team').value;
      if(chosen && chosen !== 'auto') return chosen;
      const who = ($g('student').value || '').trim();
      let L = null; try{ L = lastReports; }catch(e){}
      if(who && L && typeof L === 'object'){
        let prev = L[who];
        if(!prev){ const k = Object.keys(L).find(n => (typeof similarNames === 'function') ? similarNames(n, who) : false); if(k) prev = L[k]; }
        if(prev && prev.team && prev.team !== 'auto') return prev.team;
        if(prev && prev.sig && prev.sig !== 'auto') return prev.sig;
      }
      const raw = $g('teacher').value || '', t = raw.toLowerCase();
      if(t.indexOf('mubarak') >= 0 || t.indexOf('mobark') >= 0 || raw.indexOf('مبارك') >= 0) return 'mine';
      return 'ayat';
    };
    if(typeof window.pickLast === 'function'){ const o = window.pickLast;
      window.pickLast = function(){
        const name = ($g('lastPick') || {}).value;
        o.apply(this, arguments);
        try{
          if(!$g('team').value) $g('team').value = 'auto';
          let L = null; try{ L = lastReports; }catch(e){}
          const s = L && L[name]; if(!s) return;
          let d = s.duration || '';
          const st = window.Desk && Desk.match ? Desk.match(s.student) : null; if(st && st.mins) d = String(st.mins);
          if(d) $g('duration').value = d;
          if(typeof window.render === 'function') window.render();
        }catch(e){}
      }; }
  }
  /* Runs inside the report generator page too: who-is-who fixes. The name list itself is private (kv 'genAliases'):
     {drop:{id:[tokens]}, add:{id:[tokens]}, ids:[{id, phrases, tokens, first}]}; accents are ignored in names. */
  function genNameFixes(A){
    if(window.__tqFix2) return; window.__tqFix2 = true;
    if(typeof window.foldId === 'function'){ const o = window.foldId;
      window.foldId = n => o(String(n == null ? '' : n).normalize('NFD').replace(/[\u0300-\u036f]/g, '')); }
    let L; try{ L = STUDENT_IDS; }catch(e){ return; }
    if(!A) return;
    const get = id => L.find(s => s.id === id);
    Object.keys(A.drop || {}).forEach(id => { const s = get(id); if(s) s.tokens = s.tokens.filter(t => A.drop[id].indexOf(t) < 0); });
    Object.keys(A.add || {}).forEach(id => { const s = get(id); if(s) s.tokens.push.apply(s.tokens, A.add[id]); });
    (A.ids || []).forEach(x => { if(!get(x.id)) L[x.first ? 'unshift' : 'push']({id: x.id, phrases: x.phrases || [], tokens: x.tokens || []}); });
  }
  async function reportView(){
    if(genUrl){ app.innerHTML = '<iframe id="genFrame" src="' + genUrl + '" title="تقرير الحصة"></iframe>'; return; }
    app.innerHTML = '<div class="card muted" style="margin:16px">بيفتح المولّد…</div>';
    const r = await db.storage.from('private').download('generator.html');
    if(r.error){ app.innerHTML = '<div class="card" style="margin:16px">معرفتش أفتح المولّد: ' + esc(r.error.message) + '</div>'; return; }
    let html = await r.data.text();
    /* small fixes for the stored generator (skipped automatically once the stored file already contains them) */
    let aliases = null; try{ aliases = JSON.parse(await kvGet('genAliases')); }catch(e){}
    const fix = '<script>(' + genFixes.toString() + ')();(' + genNameFixes.toString() + ')(' + JSON.stringify(aliases).replace(/</g, '\\u003c') + ');<\/script>';
    html = /<\/body>/i.test(html) ? html.replace(/<\/body>(?![\s\S]*<\/body>)/i, fix + '</body>') : html + fix;
    genUrl = URL.createObjectURL(new Blob([html], {type: 'text/html;charset=utf-8'}));
    if(view === 'report') reportView();
  }

  /* ---------- 📥 submissions ---------- */
  async function inbox(){
    app.innerHTML = '<div class="card muted">بيحمّل…</div>';
    const r = await db.from('submissions').select('*, assignment_targets(token, students(id,name_ar,name_en), assignments(id,title,kind,content))').order('submitted_at', {ascending: false}).limit(80);
    if(r.error){ app.innerHTML = '<div class="card">' + esc(r.error.message) + '</div>'; return; }
    const list = r.data || [], waiting = list.filter(x => x.status === 'submitted').length;
    $('nNew').hidden = !waiting; $('nNew').textContent = waiting;
    if(!list.length){ app.innerHTML = '<div class="card"><h2>📥 التسليمات</h2><p class="muted">لسه مفيش حد سلّم. اعمل واجب جديد وابعت اللينك للطالب.</p></div>'; return; }
    const paths = list.flatMap(x => x.audio_paths || []);
    const urls = {};
    if(paths.length){ const u = await db.storage.from('recordings').createSignedUrls(paths, 3600); (u.data || []).forEach(x => { if(x.signedUrl) urls[x.path] = x.signedUrl; }); }
    app.innerHTML = '<h2>📥 التسليمات' + (waiting ? ' <span class="muted small">(' + waiting + ' مستنيين ردّك)</span>' : '') + '</h2>' + list.map(x => {
      const t = x.assignment_targets || {}, a = t.assignments || {}, s = t.students || {}, items = (a.content && a.content.items) || [];
      const wrong = ((x.answers && x.answers.mcq) || []).filter(m => !m.right);
      const rec = ((x.answers && x.answers.recite) || []), lis = ((x.answers && x.answers.listen) || []);
      return '<div class="card' + (x.status === 'submitted' ? ' new' : '') + '" data-id="' + x.id + '">' +
        '<div class="row"><b style="font-size:1.1rem">' + esc(nm(s)) + '</b><span class="muted">· ' + esc(a.title) + '</span><span class="st ' + x.status + '">' + ({submitted: 'جديد', reviewed: 'اتراجع', redo: 'يعيد'})[x.status] + '</span><span class="muted small" style="margin-inline-start:auto">' + day(x.submitted_at) + '</span></div>' +
        (x.max_score ? '<div class="score">' + x.score + ' / ' + x.max_score + '</div>' : '') +
        (lis.length ? '<div class="small">' + lis.map(l => { const it = items[l.i] || {}; return '🎧 ' + esc(it.say || ('آية ' + (l.i + 1))) + ' — ' + (l.done ? '<b style="color:var(--ok)">خلّص ' + l.reps_done + '/' + l.reps + ' ✓</b>' : '<b style="color:var(--bad)">' + l.reps_done + '/' + l.reps + ' (ما خلّصش)</b>'); }).join('<br>') + '</div>' : '') +
        (wrong.length ? '<div class="small muted">غلط في: ' + wrong.map(m => { const it = items[m.i] || {}; const o = (it.options || [])[m.chose]; return 'س' + (m.i + 1) + (o != null ? ' (اختار «' + esc(typeof o === 'object' ? o.ar : o) + '»)' : ' (ما جاوبش)'); }).join('، ') + '</div>' : '') +
        rec.map(p => { const it = items[p.i] || {}; return '<div class="item"><div class="small muted">🎙️ ' + (p.i + 1) + (it.say ? ' · ' + esc(it.say) : '') + '</div>' + (it.text ? '<div class="ayah">' + esc(it.text) + '</div>' : '') + (urls[p.path] ? '<audio controls preload="none" src="' + esc(urls[p.path]) + '"></audio>' : '<div class="small">الملف مش متاح</div>') + '</div>'; }).join('') +
        '<label>ردّك للطالب</label><textarea data-fb>' + esc(x.feedback || '') + '</textarea>' +
        '<div class="row" style="margin-top:8px"><button class="btn ok sm" data-act="reviewed">✅ تمام</button><button class="btn bad sm" data-act="redo">🔁 يعيد</button><button class="btn ghost sm" data-copy="' + esc(linkOf(t.token)) + '">🔗 لينك الطالب</button></div></div>';
    }).join('');
    app.querySelectorAll('[data-act]').forEach(b => b.onclick = async () => {
      const c = b.closest('[data-id]'), fb = c.querySelector('[data-fb]').value.trim();
      const r = await db.from('submissions').update({status: b.dataset.act, feedback: fb || null, reviewed_at: new Date().toISOString()}).eq('id', c.dataset.id);
      if(r.error) return alert(r.error.message); flash('اتحفظ ✓'); inbox();
    });
    app.querySelectorAll('[data-copy]').forEach(b => b.onclick = () => copy(b.dataset.copy));
  }

  /* ---------- ✏️ new homework / test ---------- */
  function blank(){ return {title: '', kind: 'homework', subject: '', page_url: '', due_date: '', intro: '', items: [], who: []}; }
  function newView(){
    draft = draft || blank();
    const d = draft;
    app.innerHTML = '<div class="card"><h2>✏️ واجب أو اختبار جديد</h2>' +
      '<div class="grid2"><div><label>العنوان</label><input id="f_title" value="' + esc(d.title) + '" placeholder="مثلاً: مراجعة أحكام النون الساكنة"></div>' +
      '<div><label>النوع</label><select id="f_kind"><option value="homework"' + (d.kind === 'homework' ? ' selected' : '') + '>واجب</option><option value="test"' + (d.kind === 'test' ? ' selected' : '') + '>اختبار</option></select></div>' +
      '<div><label>المادة</label><input id="f_subject" value="' + esc(d.subject) + '" placeholder="تجويد / عربي / قرآن / إسلاميات"></div>' +
      '<div><label>آخر ميعاد (اختياري)</label><input id="f_due" type="date" value="' + esc(d.due_date) + '"></div></div>' +
      '<label>لينك درس أو لعبة يفتحها الطالب (اختياري)</label><input id="f_url" dir="ltr" value="' + esc(d.page_url) + '" placeholder="https://…">' +
      '<label>رسالة للطالب في الأول (اختياري)</label><textarea id="f_intro">' + esc(d.intro) + '</textarea></div>' +
      '<div class="card"><h2>الأسئلة والتسميع</h2><div id="items">' + d.items.map(itemForm).join('') + '</div>' +
      '<div class="row" style="margin-top:10px"><button class="btn ghost" id="addQ">➕ سؤال اختيارات</button><button class="btn ghost" id="addR">🎙️ تسميع بالصوت</button><button class="btn ghost" id="addL">🎧 واجب قرآن (استماع + تسميع)</button></div></div>' +
      '<div class="card"><h2>لمين؟</h2><div class="row" id="who">' + students.filter(s => s.active).map(s => '<button class="chip' + (d.who.includes(s.id) ? ' on' : '') + '" data-s="' + s.id + '">' + esc(s.name_ar) + '</button>').join('') + '</div>' +
      '<div class="row" style="margin-top:14px"><button class="btn" id="save">💾 احفظ وطلّع اللينكات</button><button class="btn ghost" id="reset">ابدأ من الأول</button></div><div id="out2"></div></div>';
    const sync = () => {
      d.title = $('f_title').value; d.kind = $('f_kind').value; d.subject = $('f_subject').value; d.due_date = $('f_due').value; d.page_url = $('f_url').value.trim(); d.intro = $('f_intro').value;
      app.querySelectorAll('[data-it]').forEach(el => {
        const it = d.items[+el.dataset.it];
        if(it.type === 'mcq'){ it.q = el.querySelector('[data-k=q]').value; it.ayah = el.querySelector('[data-k=ayah]').value;
          it.options = [...el.querySelectorAll('[data-k=o]')].map(x => x.value); const c = el.querySelector('input[type=radio]:checked'); it.answer = c ? +c.value : 0; }
        else if(it.type === 'quran'){ it.surah = +el.querySelector('[data-k=surah]').value; it.reciter = el.querySelector('[data-k=reciter]').value;
          it.from = +el.querySelector('[data-k=from]').value; it.to = +el.querySelector('[data-k=to]').value;

  /* ---------- 🔔 a new lesson was created → send the student's fixed link ----------
     The site cannot send WhatsApp messages by itself, so: every minute (and when you come back to the tab) it looks for lessons created
     after the last send for each student, and shows a banner with a ready message + the student's fixed page link (one tap opens WhatsApp). */
  const kvGet = async k => { const r = await db.from('kv').select('value').eq('key', k).maybeSingle(); return r.data ? r.data.value : null; };
  const kvSet = (k, v) => db.from('kv').upsert({key: k, value: String(v)});
  const toMs = l => { const c = l.created; if(typeof c === 'number') return c; if(c && !isNaN(+c)) return +c; const d = Date.parse(c || l.date || ''); return isNaN(d) ? 0 : d; };
  const pend = {stamp: null, base: 0, sent: {}, phone: {}, list: []};
  async function checkPending(force){
    try{
      const probe = await db.from('docs').select('updated_at').eq('collection', 'lessons').order('updated_at', {ascending: false}).limit(1);
      const stamp = probe.data && probe.data[0] ? probe.data[0].updated_at : '';
      if(!force && stamp === pend.stamp && pend.stamp !== null) return;
      pend.stamp = stamp;
      let b = await kvGet('portal_baseline'); if(!b){ b = new Date().toISOString(); await kvSet('portal_baseline', b); }   // first run: only lessons created from now on count as new
      pend.base = Date.parse(b);
      const [a, c] = await Promise.all([db.from('kv').select('key,value').like('key', 'portal_sent:*'), db.from('kv').select('key,value').like('key', 'phone:*')]);
      pend.sent = {}; (a.data || []).forEach(x => pend.sent[x.key.slice(12)] = x.value); pend.phone = {}; (c.data || []).forEach(x => pend.phone[x.key.slice(6)] = x.value);
      const L = await loadLessons(true);
      pend.list = students.filter(x => x.active).map(x => { const since = Math.max(pend.base, Date.parse(pend.sent[x.id] || '') || 0);
        return {s: x, fresh: L.filter(l => (x.keys || [x.slug]).includes(l.key) && toMs(l) > since)}; }).filter(x => x.fresh.length);
      drawPending();
    }catch(e){ console.warn('pending check', e); }
  }
  function sendMsg(s, fresh){
    const portal = PORTAL + '?k=' + s.portal_token, titles = fresh.slice(0, 3).map(l => l.title).filter(Boolean).join(' · ');
    const ar = 'السلام عليكم ' + s.name_ar + ' 🌱\nدرس جديد: ' + titles + '\nكل دروسك وواجباتك في صفحتك:\n' + portal;
    const en = 'Assalamu alaikum ' + (s.name_en || s.name_ar) + ' 🌱\nNew lesson: ' + titles + '\nAll your lessons and homework are on your page:\n' + portal;
    return s.lang === 'ar' ? ar : s.lang === 'both' ? ar + '\n\n' + en : en;
  }
  function drawPending(){
    const n = pend.list.length; $('nSend').hidden = !n; $('nSend').textContent = n;
    $('pend').innerHTML = n ? '<div class="card" style="border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)"><h2>🔔 دروس جديدة — ابعت لينك صفحة الطالب (' + n + ')</h2>' +
      pend.list.map(x => '<div class="item" data-pid="' + x.s.id + '"><div class="row"><b>' + esc(nm(x.s)) + '</b><span class="small muted">' + x.fresh.length + ' درس جديد: ' + esc(x.fresh.slice(0, 2).map(l => l.title).join(' · ')) + '</span></div>' +
        '<div class="row" style="margin-top:8px"><input data-ph="' + x.s.id + '" dir="ltr" inputmode="tel" placeholder="رقم واتساب بكود الدولة (يتحفظ)" value="' + esc(pend.phone[x.s.id] || '') + '" style="max-width:240px">' +
        '<button class="btn wa sm" data-send="' + x.s.id + '">📲 ابعت على واتساب</button><button class="btn ghost sm" data-mark="' + x.s.id + '">✓ اتبعت</button></div></div>').join('') +
      '<p class="small muted">الموقع ما يقدرش يبعت واتساب لوحده: الزر بيفتح واتساب برسالة جاهزة فيها لينك صفحة الطالب، وإنت بتدوس إرسال.</p></div>' : '';
    $('pend').querySelectorAll('[data-ph]').forEach(i => i.onchange = () => { const v = i.value.replace(/[^0-9]/g, ''); pend.phone[i.dataset.ph] = v; kvSet('phone:' + i.dataset.ph, v); });
    $('pend').querySelectorAll('[data-send]').forEach(b => b.onclick = async () => {
      const x = pend.list.find(y => y.s.id === b.dataset.send), ph = (pend.phone[x.s.id] || '').replace(/[^0-9]/g, '');
      window.open('https://wa.me/' + ph + '?text=' + encodeURIComponent(sendMsg(x.s, x.fresh)), '_blank', 'noopener');
      await kvSet('portal_sent:' + x.s.id, new Date().toISOString()); pend.sent[x.s.id] = new Date().toISOString(); checkPending(true); });
    $('pend').querySelectorAll('[data-mark]').forEach(b => b.onclick = async () => { await kvSet('portal_sent:' + b.dataset.mark, new Date().toISOString()); checkPending(true); });
  }

  /* ---------- 📚 lessons library (from the generator's «lessons» records) ---------- */
  const PORTAL = new URL('app/student.html', TQ.site).href;
  let lessonFilter = 'all', planSel = null, allLessons = null;
  const keyOf = id => String(id).slice(11);
  const studentOfKey = k => students.find(s => (s.keys || [s.slug]).includes(k));
  async function loadLessons(force){
    if(allLessons && !force) return allLessons;
    const r = await db.from('docs').select('id,data').eq('collection', 'lessons').order('id', {ascending: false}).limit(2000);
    allLessons = (r.data || []).map(x => Object.assign({id: x.id, key: keyOf(x.id)}, x.data));
    return allLessons;
  }
  function lessonCard(l, showName){
    const A = v => Array.isArray(v) ? v : (v ? [String(v)] : []); const s = studentOfKey(l.key), lines = A(l.summary).length ? A(l.summary) : A(l.headlines);
    return '<div class="card"><div class="row"><b style="font-size:1.1rem">' + esc(l.title || '') + '</b>' + (showName ? '<span class="chip on" style="min-height:28px;padding:0 10px">' + esc(s ? s.name_ar : (l.student || l.key)) + '</span>' : '') +
      '<span class="muted small" style="margin-inline-start:auto">' + esc(l.date || '') + (l.subject ? ' · ' + esc(l.subject) : '') + '</span></div>' +
      (lines.length ? '<ul class="small" style="margin:6px 0">' + lines.slice(0, 5).map(x => '<li dir="auto">' + esc(x) + '</li>').join('') + '</ul>' : '') +
      (l.homework ? '<div class="small muted" dir="auto">📝 ' + esc(l.homework) + '</div>' : '') +
      '<div class="row" style="margin-top:8px">' + (l.url ? '<a class="btn sm" target="_blank" rel="noopener" href="' + esc(l.url) + '">🎓 الدرس</a>' : '') + (l.hw ? '<a class="btn ghost sm" target="_blank" rel="noopener" href="' + esc(l.hw) + '">📝 الواجب</a><button class="btn ghost sm" data-copy="' + esc(l.hw) + '">📋 لينك الواجب</button>' : '') + '</div></div>';
  }
  async function lessonsHtml(keys, max){
    const L = (await loadLessons()).filter(l => keys.includes(l.key)).slice(0, max || 999);
    return '<div class="card"><h2>📚 آخر الدروس</h2>' + (L.length ? '' : '<p class="muted">مفيش دروس متسجلة لسه.</p>') + '</div>' + L.map(l => lessonCard(l, false)).join('');
  }
  async function lessonsView(){
    app.innerHTML = '<div class="card muted">بيحمّل…</div>';
    const L = await loadLessons(true);
    const withL = students.filter(s => L.some(l => (s.keys || [s.slug]).includes(l.key)));
    const sel = students.find(s => s.id === lessonFilter);
    const shown = sel ? L.filter(l => (sel.keys || [sel.slug]).includes(l.key)) : L;
    app.innerHTML = '<h2>📚 مكتبة الدروس <span class="muted small">(' + L.length + ' درس)</span></h2>' +
      '<div class="row" style="margin-bottom:10px"><button class="chip' + (sel ? '' : ' on') + '" data-lf="all">الكل</button>' + withL.map(s => '<button class="chip' + (sel && sel.id === s.id ? ' on' : '') + '" data-lf="' + s.id + '">' + esc(s.name_ar) + '</button>').join('') + '</div>' +
      '<input id="lq" placeholder="🔎 دوّر في الدروس (سورة، قاعدة، كتاب…)" style="margin-bottom:12px"><div id="ll"></div>';
    const draw = () => { const q = $('lq').value.trim().toLowerCase(); const f = q ? shown.filter(l => JSON.stringify(l).toLowerCase().includes(q)) : shown;
      $('ll').innerHTML = f.map(l => lessonCard(l, !sel)).join('') || '<div class="card muted">مفيش نتايج.</div>'; bindLinks(); };
    $('lq').oninput = draw; draw();
    app.querySelectorAll('[data-lf]').forEach(b => b.onclick = () => { lessonFilter = b.dataset.lf; lessonsView(); });
  }

  /* ---------- 🗂️ plans & logs (copied from OneDrive\تدريس\طلابي) ---------- */
  function md(src){
    const inl = t => esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>').replace(/(https?:\/\/[^\s)<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
    const out = []; const lines = String(src || '').split(/\r?\n/); let i = 0;
    while(i < lines.length){
      const l = lines[i];
      if(/^\|/.test(l)){ const rows = []; while(i < lines.length && /^\|/.test(lines[i])){ if(!/^\|[\s:|-]+\|?\s*$/.test(lines[i])) rows.push(lines[i].replace(/^\||\|\s*$/g, '').split('|')); i++; }
        out.push('<table class="mdt">' + rows.map((r, k) => '<tr>' + r.map(c => k ? '<td>' + inl(c.trim()) + '</td>' : '<th>' + inl(c.trim()) + '</th>').join('') + '</tr>').join('') + '</table>'); continue; }
      let m;
      if((m = l.match(/^(#{1,4})\s+(.*)/))) out.push('<h' + (m[1].length + 1) + '>' + inl(m[2]) + '</h' + (m[1].length + 1) + '>');
      else if((m = l.match(/^(\s*)[-*]\s+(.*)/))) out.push('<div class="mdli" style="padding-inline-start:' + (12 + m[1].length * 8) + 'px">• ' + inl(m[2]) + '</div>');
      else if((m = l.match(/^>\s?(.*)/))) out.push('<div class="mdq">' + inl(m[1]) + '</div>');
      else if(l.trim()) out.push('<p>' + inl(l) + '</p>');
      i++;
    }
    return out.join('');
  }
  async function plansView(){
    app.innerHTML = '<div class="card muted">بيحمّل…</div>';
    const r = await db.from('docs').select('id,data,updated_at').eq('collection', 'plans');
    const P = (r.data || []).sort((a, b) => a.data.folder.localeCompare(b.data.folder, 'ar'));
    if(!P.length){ app.innerHTML = '<div class="card muted">مفيش خطط لسه.</div>'; return; }
    const cur = P.find(p => p.id === planSel) || P[0]; planSel = cur.id;
    let mode = plansView.mode || 'plan';
    const d = cur.data, txt = mode === 'plan' ? d.plan : d.log;
    app.innerHTML = '<h2>🗂️ خطط الطلاب وسجل الدروس</h2><div class="row" style="margin-bottom:10px">' + P.map(p => '<button class="chip' + (p.id === cur.id ? ' on' : '') + '" data-p="' + esc(p.id) + '">' + esc(p.data.folder) + '</button>').join('') + '</div>' +
      '<div class="card"><div class="row"><button class="chip' + (mode === 'plan' ? ' on' : '') + '" data-m="plan">📋 الخطة</button><button class="chip' + (mode === 'log' ? ' on' : '') + '" data-m="log">🕘 سجل الدروس</button><button class="btn ghost sm" id="pedit" style="margin-inline-start:auto">✏️ تعديل</button></div>' +
      '<p class="small muted">' + (d.editedOnSite ? '✏️ اتعدّلت هنا ' + day(d.siteEditedAt) + ' — هتتنسخ لـ OneDrive في المزامنة الجاية. ' : '') + 'آخر نسخ من OneDrive: ' + day(d.syncedAt) + (d.lessonFolders && d.lessonFolders.length ? ' · ' + d.lessonFolders.length + ' فولدر درس' : '') + '</p>' +
      '<div id="pbody" class="md">' + md(txt) + '</div></div>';
    app.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { planSel = b.dataset.p; plansView(); });
    app.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { plansView.mode = b.dataset.m; plansView(); });
    $('pedit').onclick = () => {
      $('pbody').innerHTML = '<textarea id="ptxt" style="min-height:60vh;direction:rtl;font-size:.95rem">' + esc(txt || '') + '</textarea><div class="row" style="margin-top:8px"><button class="btn" id="psave">💾 احفظ</button><button class="btn ghost" id="pcancel">إلغاء</button></div>';
      $('pcancel').onclick = plansView;
      $('psave').onclick = async () => {
        const nd = Object.assign({}, d, {[mode]: $('ptxt').value, editedOnSite: true, siteEditedAt: Date.now()});
        const w = await db.from('docs').update({data: nd}).eq('collection', 'plans').eq('id', cur.id);
        if(w.error) return alert(w.error.message); flash('اتحفظ ✓'); plansView();
      };
    };
  }

  /* ---------- 🎮 games & public lessons (the public site's list) ---------- */
  let gamesLoaded = null;
  function gamesView(){
    const draw = () => {
      const card = (g, dir) => '<div class="card" style="margin:0"><div style="font-size:2rem">' + esc(g.ico || '🎮') + '</div><b>' + esc(g.ar) + '</b><div class="small muted" dir="ltr">' + esc(g.en || '') + '</div><div class="small" style="margin:6px 0">' + esc(g.desc || '') + '</div>' +
        (g.file ? '<div class="row"><a class="btn sm" target="_blank" rel="noopener" href="' + TQ.site + dir + esc(g.file) + '">▶ افتح</a><button class="btn ghost sm" data-copy="' + TQ.site + dir + esc(g.file) + '">📋 للطالب</button></div>' : '<span class="muted small">قريبًا</span>') + '</div>';
      const grid = a => '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-bottom:18px">' + a + '</div>';
      app.innerHTML = '<h2>🎮 الألعاب <span class="muted small">(' + (window.GAMES || []).length + ')</span> <a class="small" href="' + TQ.site + '" target="_blank" rel="noopener">الموقع العام ↗</a></h2>' + grid((window.GAMES || []).map(g => card(g, 'games/')).join('')) +
        '<h2>📘 الدروس العامة <span class="muted small">(' + (window.LESSONS || []).length + ')</span></h2>' + grid((window.LESSONS || []).map(g => card(g, 'lessons/')).join(''));
      bindLinks();
    };
    if(window.GAMES) return draw();
    app.innerHTML = '<div class="card muted">بيحمّل…</div>';
    if(!gamesLoaded){ gamesLoaded = document.createElement('script'); gamesLoaded.src = TQ.site + 'games.js?v=' + Date.now(); document.head.appendChild(gamesLoaded); }
    gamesLoaded.addEventListener('load', () => { if(view === 'games') draw(); });
  }

  /* ---------- 📖 Mushaf + recitation corrector ---------- */
  function mushafView(){ app.innerHTML = '<iframe id="genFrame" src="mushaf/" title="المصحف" allow="microphone; clipboard-write; fullscreen"></iframe>'; }

  db.auth.onAuthStateChange((ev) => { if(ev === 'SIGNED_OUT') loginView(); });
  start();
})();
</script>
