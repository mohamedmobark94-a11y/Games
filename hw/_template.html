<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>نموذج واجب تفاعلي · Homework template</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Amiri:wght@400;700&family=Inter:wght@400;600;800&display=swap">
<!--
  Template for an interactive homework page (copy it to hw/YYYY-MM-DD-<topic>.html).
  - No student names in this file: the name comes from the homework link (TQHW.name).
  - It runs inside the student's homework link (app/hw.html); every TQHW.result() call updates what is sent.
  - Language follows the homework page button: TQHW.lang + TQHW.on('lang', …).
  - Do not use 100vh heights: the frame grows to fit the page.
  - Sounds and voice: ../tq-fx.js — TQFX.ok(el) / TQFX.bad(el) on every answer, TQFX.win() at the end.
-->
<style>
:root{--bg:#0B1E2D;--card:#163A57;--card2:#12304A;--ink:#F4EBD6;--muted:#B4C5D3;--line:#2A5675;--gold:#E2B85C;--ok:#2ECC71;--bad:#F1948A;
  --f-ui:"Baloo Bhaijaan 2","Segoe UI",Tahoma,sans-serif;--f-ar:"Amiri","Traditional Arabic",serif;--f-en:"Inter","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 17px/1.6 var(--f-ui);padding:14px}
html[lang=en] body{font-family:var(--f-en)}
h2{margin:0 0 4px;color:var(--gold);font-size:1.25rem}
.hi{color:var(--muted);margin-bottom:10px}
.card{background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px}
.big{font:700 2.6rem/1.5 var(--f-ar);text-align:center;background:#FFFDF7;color:#1f2a27;border-radius:14px;padding:4px 10px;margin:6px 0 10px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.opt{font:inherit;font-weight:700;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:14px;min-height:52px;cursor:pointer}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 22%,var(--card))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 20%,var(--card))}
.bar{height:10px;background:var(--card);border-radius:999px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .3s}
.end{text-align:center;font-size:1.2rem}
</style>
</head>
<body>
<div style="display:flex;align-items:center;gap:8px"><h2 id="t" style="flex:1"></h2><button data-tq-sound style="font-size:1.2rem;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;width:44px;height:44px;cursor:pointer"></button></div>
<div class="hi" id="hi"></div>
<div class="bar"><i id="prog"></i></div>
<div id="game"></div>
<div class="card" id="recCard"><div id="recSay"></div><div id="recBox" style="margin-top:8px"></div></div>

<script src="../app/hwkit.js"></script>
<script src="../tq-fx.js"></script>
<script>
(function(){
  /* ---- content (bilingual) ---- */
  const TXT = {
    title: ['الحركات: فتحة، ضمة، كسرة', 'Harakat: fatha, damma, kasra'],
    hi: ['أهلًا {n}! اختر الحركة الصح لكل حرف.', 'Hi {n}! Choose the right haraka for each letter.'],
    hiNo: ['اختر الحركة الصح لكل حرف.', 'Choose the right haraka for each letter.'],
    end: ['أحسنت! خلّصت النشاط 🌟', 'Well done! Activity finished 🌟'],
    rec: ['🎙️ اقرأ الحروف دي بصوتك: بَ  بُ  بِ', '🎙️ Read these letters aloud: بَ  بُ  بِ'],
    recLabel: ['قراءة بَ بُ بِ', 'Reading بَ بُ بِ']
  };
  const OPTS = [['فتحة', 'fatha'], ['ضمة', 'damma'], ['كسرة', 'kasra']];
  const QS = [{show: 'بَ', a: 0}, {show: 'تُ', a: 1}, {show: 'سِ', a: 2}, {show: 'مَ', a: 0}];

  const L = k => TXT[k][TQHW.lang === 'en' ? 1 : 0];
  let qi = 0, right = 0; const details = [];

  function draw(){
    document.documentElement.lang = TQHW.lang; document.documentElement.dir = TQHW.lang === 'en' ? 'ltr' : 'rtl';
    document.getElementById('t').textContent = L('title');
    document.getElementById('hi').textContent = TQHW.name ? L('hi').replace('{n}', TQHW.name) : L('hiNo');
    document.getElementById('recSay').textContent = L('rec');
    document.getElementById('prog').style.width = (qi / QS.length * 100) + '%';
    const g = document.getElementById('game');
    if(qi >= QS.length){ g.innerHTML = '<div class="card end">' + L('end') + '<div style="margin-top:6px"><b dir="ltr">' + right + ' / ' + QS.length + '</b></div></div>'; return; }
    const q = QS[qi];
    g.innerHTML = '<div class="card"><div class="big">' + q.show + '</div><div class="opts">' +
      OPTS.map((o, j) => '<button class="opt" data-j="' + j + '">' + o[TQHW.lang === 'en' ? 1 : 0] + '</button>').join('') + '</div></div>';
    g.querySelectorAll('[data-j]').forEach(b => b.onclick = () => answer(+b.dataset.j, b));
  }
  function answer(j, b){
    const q = QS[qi], ok = j === q.a;
    b.classList.add(ok ? 'right' : 'wrong'); if(!ok) document.querySelector('[data-j="' + q.a + '"]').classList.add('right');
    document.querySelectorAll('[data-j]').forEach(x => x.disabled = true);
    if(ok) right++;
    if(window.TQFX){ ok ? TQFX.ok(b) : TQFX.bad(b); if(qi + 1 >= QS.length) setTimeout(() => TQFX.win(), 800); }
    details.push({q: q.show, a: OPTS[j][0], ok});
    qi++;
    /* report after every answer: the last report is what gets sent */
    TQHW.result({score: right, max: QS.length, done: qi >= QS.length, details});
    setTimeout(draw, 700);
  }
  TQHW.recordButton(document.getElementById('recBox'), L('recLabel'));
  TQHW.on('lang', draw);
  draw();
})();
</script>
</body>
</html>
