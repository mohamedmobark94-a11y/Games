<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>يومي المسلم · My Muslim day</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Amiri:wght@400;700&family=Inter:wght@400;600;800&display=swap">
<!-- Homework: daily life (Al-Arabiyyah Bayna Yadayk, book 1, lesson 34, speaking drills 1–6). Book pictures. No student names here. -->
<style>
:root{--bg:#0A2233;--card:#123C55;--card2:#0F3148;--ink:#F2F7FA;--muted:#A9C3D3;--line:#24607F;--gold:#F5B942;--teal:#2EC4B6;--blue:#3D8BFD;--orange:#FF8A3D;--ok:#2ECC71;--bad:#FF6B6B;
  --f-ui:"Baloo Bhaijaan 2","Segoe UI",Tahoma,sans-serif;--f-ar:"Amiri","Traditional Arabic",serif;--f-en:"Inter","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 15% 0,#14506F 0,transparent 45%),var(--bg);color:var(--ink);font:500 17px/1.6 var(--f-ui);padding:14px;-webkit-tap-highlight-color:transparent}
html[lang=en] body{font-family:var(--f-en)}
.ar{font-family:var(--f-ar);direction:rtl;unicode-bidi:isolate}
.top{display:flex;align-items:center;gap:12px}
.top h2{flex:1;margin:0;color:var(--gold);font-size:1.35rem;line-height:1.3}
.snd,.lsw{font:inherit;font-weight:800;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;min-width:44px;height:44px;cursor:pointer}
.hi{color:var(--muted);margin:4px 0 8px}
.stations{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.st{flex:1;min-width:84px;text-align:center;background:var(--card2);border:2px solid var(--line);border-radius:12px;padding:4px 6px;font-size:.82rem;color:var(--muted);cursor:pointer}
.st.on{border-color:var(--gold);color:var(--ink);background:var(--card)}
.st.done{border-color:var(--ok);color:var(--ok)}
.bar{height:10px;background:var(--card2);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--gold));transition:width .4s}
.card{background:var(--card2);border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:12px}
.card h3{margin:0 0 6px;color:var(--gold);font-size:1.15rem}
.help{background:#0C2A3D;border:2px dashed var(--teal);border-radius:14px;padding:8px 12px;margin:8px 0;color:#CFF5F1;font-size:.95rem}
.help b{color:var(--gold)}
.formula{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;direction:rtl;margin:10px 0}
.chip{font:700 1.7rem/1.4 var(--f-ar);padding:4px 14px;border-radius:12px;background:#FFFDF7;color:#13303F;border:3px solid transparent;text-align:center}
.chip small{display:block;font:600 .8rem/1.2 var(--f-en);color:#4b6574}
.c1{border-color:var(--orange)}.c2{border-color:var(--blue)}.c3{border-color:var(--teal)}.c4{border-color:var(--gold)}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.vs>div{border-radius:14px;padding:10px;text-align:center;background:var(--card)}
.vs .w{font:700 2.2rem/1.3 var(--f-ar)}
.play{font:inherit;font-weight:800;border:0;border-radius:14px;padding:8px 16px;min-height:48px;cursor:pointer;background:var(--teal);color:#06303A}
.play.big{font-size:1.15rem;padding:10px 22px}
.btn{font:inherit;font-weight:800;border:0;border-radius:14px;padding:8px 20px;min-height:48px;cursor:pointer;background:var(--gold);color:#3A2600}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center;margin-top:10px}
.pics{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:10px}
.pic{border:3px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;cursor:pointer;padding:0;font:inherit;color:#13303F}
.pic img{display:block;width:100%;aspect-ratio:191/112;object-fit:cover}
.pic span{display:block;font:700 1.25rem/1.4 var(--f-ar);padding:2px 4px}
.pic.right{border-color:var(--ok);box-shadow:0 0 0 3px var(--ok)}
.pic.wrong{border-color:var(--bad);opacity:.6}
.scene{display:grid;grid-template-columns:minmax(0,400px) 170px;gap:16px;align-items:center;justify-content:center}
audio[hidden]{display:none!important}
.scene img{width:100%;border-radius:14px;border:3px solid #fff;display:block}
.q{font:700 1.9rem/1.6 var(--f-ar);text-align:center;background:#FFFDF7;color:#13303F;border-radius:14px;padding:6px 10px;margin:8px 0;direction:rtl}
.opts{display:grid;gap:8px;margin-top:8px}
.opt{font:700 1.5rem/1.5 var(--f-ar);direction:rtl;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:14px;min-height:56px;cursor:pointer;padding:4px 10px}
.opt.en{font:700 1.05rem/1.4 var(--f-en);direction:ltr}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 25%,var(--card))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 22%,var(--card))}
.pool,.line{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;direction:rtl;min-height:64px;padding:8px;border-radius:14px}
.line{background:#0C2A3D;border:2px dashed var(--line)}
.pool .chip{cursor:pointer;font-size:1.6rem}
.blank{display:inline-block;min-width:90px;border-bottom:4px solid var(--gold);color:var(--gold)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.two .opt{font-size:2rem}
.recItem{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:center;background:var(--card);border-radius:14px;padding:10px;margin-top:10px}
.recItem img{width:100%;border-radius:10px}
.recItem .hint{font:700 1.3rem/1.5 var(--f-ar);direction:rtl;color:#CFF5F1;opacity:.85}
.recItem .hint.hide{filter:blur(6px);cursor:pointer}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem;margin-top:8px}
.fb{text-align:center;font-weight:800;margin-top:8px;min-height:1.6em}
.sky{position:relative;height:300px;border-radius:16px;overflow:hidden;background:linear-gradient(#0B2A55,#123C55);touch-action:manipulation}
.star{position:absolute;font-size:38px;cursor:pointer;user-select:none;transition:transform .15s}
.end{text-align:center;font-size:1.25rem}
@media (max-width:560px){.scene{grid-template-columns:1fr}.recItem{grid-template-columns:1fr}.chip{font-size:1.4rem}}
.pic img.sq{aspect-ratio:auto}
.ee{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.tag{display:inline-block;font:800 .85rem var(--f-en);background:var(--gold);color:#3A2600;border-radius:999px;padding:0 10px;margin-inline-start:6px}
</style>
<link rel="icon" type="image/svg+xml" href="../assets/brand/emblem.svg">
</head>
<body>
<div class="top">
  <svg width="52" height="52" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="44" fill="#FFFDF7" stroke="#F5B942" stroke-width="8"/><line x1="50" y1="50" x2="50" y2="20" stroke="#0F3148" stroke-width="7" stroke-linecap="round"/><line x1="50" y1="50" x2="72" y2="58" stroke="#2EC4B6" stroke-width="7" stroke-linecap="round"/><circle cx="50" cy="50" r="6" fill="#0F3148"/></svg>
  <h2 id="t"></h2>
  <button class="lsw" id="lsw" hidden></button>
  <button class="snd" data-tq-sound></button>
</div>
<div class="hi" id="hi"></div>
<div class="bar"><i id="prog"></i></div>
<div class="stations" id="stations"></div>
<div id="game"></div>

<script src="../app/hwkit.js"></script>
<script src="../tq-fx.js"></script>
<script>
(function(){
  const IMG = k => '../assets/img/abyy34/' + k + '.jpg';
  /* drill 1: prayers and mosques (book pairs) */
  const M = [
    {k:'fajr',    pr:'الْفَجْرَ',   en:'Fajr',    m:'مَسْجِدِ عُمَرَ',    me:'Umar Mosque'},
    {k:'dhuhr',   pr:'الظُّهْرَ',   en:'Dhuhr',   m:'مَسْجِدِ بِلَالٍ',   me:'Bilal Mosque'},
    {k:'asr',     pr:'الْعَصْرَ',   en:'Asr',     m:'مَسْجِدِ عُثْمَانَ', me:'Uthman Mosque'},
    {k:'maghrib', pr:'الْمَغْرِبَ', en:'Maghrib', m:'مَسْجِدِ عَلِيٍّ',   me:'Ali Mosque'},
    {k:'isha',    pr:'الْعِشَاءَ',  en:'Isha',    m:'مَسْجِدِ عَمَّارٍ',  me:'Ammar Mosque'},
    {k:'jumuah2', pr:'الْجُمُعَةَ', en:'Jumu‘ah', m:'مَسْجِدِ طَارِقٍ',   me:'Tariq Mosque'}
  ];
  const MQ = p => 'أَيْنَ تُصَلِّي ' + p.pr + '؟', MA = p => 'أُصَلِّي ' + p.pr + ' فِي ' + p.m + '.';
  /* drill 2: what is he / she doing? */
  const D = [
    {k:'ahmad',    who:'أَحْمَدُ',  f:0, act:'يَقْرَأُ الْقُرْآنَ',   en:'reads the Qur’an'},
    {k:'girl',     who:'الْبِنْتُ', f:1, act:'تَكْنُسُ الْغُرْفَةَ',  en:'sweeps the room'},
    {k:'man',      who:'الرَّجُلُ', f:0, act:'يُصَلِّي',              en:'prays'},
    {k:'fatimah',  who:'فَاطِمَةُ', f:1, act:'تُشَاهِدُ التِّلْفَازَ', en:'watches TV'},
    {k:'khadijah', who:'خَدِيجَةُ', f:1, act:'تَغْسِلُ الْمَلَابِسَ', en:'washes the clothes'},
    {k:'muhammad', who:'مُحَمَّدٌ', f:0, act:'يَغْسِلُ الصُّحُونَ',   en:'washes the dishes'}
  ];
  const DQ = p => 'مَاذَا ' + (p.f ? 'تَفْعَلُ' : 'يَفْعَلُ') + ' ' + p.who + '؟', DA = p => p.who + ' ' + p.act + '.';
  /* drill 3: early or late */
  const H = [
    {h:4,  n:'الرَّابِعَةَ', e:1}, {h:5, n:'الْخَامِسَةَ', e:1}, {h:7, n:'السَّابِعَةَ', e:0},
    {h:9,  n:'التَّاسِعَةَ', e:2}, {h:10, n:'الْعَاشِرَةَ', e:2}
  ];
  /* drill 4: complete the dialogue */
  const T = [
    {q:'مَتَى تَسْتَيْقِظُ؟',            a:'أَسْتَيْقِظُ عِنْدَ الْفَجْرِ.',     qe:'When do you wake up?'},
    {q:'أَيْنَ تُصَلِّي الْفَجْرَ؟',      a:'أُصَلِّي الْفَجْرَ فِي الْمَسْجِدِ.', qe:'Where do you pray Fajr?'},
    {q:'هَلْ تَنَامُ بَعْدَ الْفَجْرِ؟',  a:'لَا، لَا أَنَامُ بَعْدَ الْفَجْرِ.', qe:'Do you sleep after Fajr?'},
    {q:'مَاذَا تَفْعَلُ فِي الصَّبَاحِ؟', a:'أَقْرَأُ الْقُرْآنَ.',              qe:'What do you do in the morning?'},
    {q:'مَتَى تَذْهَبُ إِلَى الْمَدْرَسَةِ؟', a:'أَذْهَبُ السَّاعَةَ السَّابِعَةَ.', qe:'When do you go to school?'},
    {q:'هَلْ تَذْهَبُ بِالْحَافِلَةِ؟',   a:'لَا، أَذْهَبُ بِالسَّيَّارَةِ.',     qe:'Do you go by bus?'}
  ];
  const shuffle = a => { a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const en = () => TQHW.lang === 'en';
  const L = (ar, e) => en() ? e : ar;
  const ok = el => { if(window.TQFX) TQFX.ok(el); };
  const bad = el => { if(window.TQFX) TQFX.bad(el); };
  const win = () => { if(window.TQFX) TQFX.win(); };
  const clock = (h, size) => { const a = (h % 12) * 30 * Math.PI / 180, s = size || 90;
    return '<svg width="' + s + '" height="' + s + '" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="#fff" stroke="#2EC4B6" stroke-width="6"/>' +
      Array.from({length: 12}, (_, i) => { const b = (i + 1) * 30 * Math.PI / 180; return '<circle cx="' + (50 + Math.sin(b) * 37) + '" cy="' + (50 - Math.cos(b) * 37) + '" r="2.4" fill="#0F3148"/>'; }).join('') +
      '<line x1="50" y1="50" x2="50" y2="16" stroke="#F5B942" stroke-width="5" stroke-linecap="round"/><line x1="50" y1="50" x2="' + (50 + Math.sin(a) * 24) + '" y2="' + (50 - Math.cos(a) * 24) + '" stroke="#0F3148" stroke-width="7" stroke-linecap="round"/><circle cx="50" cy="50" r="5" fill="#0F3148"/></svg>'; };

  const ST = [
    {id:'learn',  ic:'🧭', ar:'افهم',          en:'Learn'},
    {id:'mosque', ic:'🕌', ar:'أين تصلي؟',     en:'Where do you pray?'},
    {id:'doing',  ic:'👀', ar:'ماذا يفعل؟',    en:'What is he doing?'},
    {id:'clock',  ic:'⏰', ar:'مبكرًا أم متأخرًا', en:'Early or late'},
    {id:'talk',   ic:'💬', ar:'أكمل الحوار',   en:'Dialogue'},
    {id:'speak',  ic:'🎙️', ar:'يومي بصوتي',   en:'My day aloud'},
    {id:'stars',  ic:'🌟', ar:'المكافأة',      en:'Reward'}
  ];
  const state = {cur: 0, done: {}, score: 0, max: 0, details: [], rec: 0};
  const SCORED = {mosque: 6, doing: 9, clock: 5, talk: 8};
  state.max = Object.values(SCORED).reduce((a, b) => a + b, 0);
  function report(){ TQHW.result({score: state.score, max: state.max, done: !!state.done.stars, details: state.details}); }
  function mark(q, a, right){ state.details.push({q, a, ok: right}); if(right) state.score++; report(); }
  function finish(id){ state.done[id] = true; drawStations(); report(); }
  function drawStations(){
    const s = document.getElementById('stations');
    s.innerHTML = ST.map((x, i) => '<div class="st' + (i === state.cur ? ' on' : '') + (state.done[x.id] ? ' done' : '') + '" data-s="' + i + '">' + x.ic + ' ' + L(x.ar, x.en) + (state.done[x.id] ? ' ✓' : '') + '</div>').join('');
    s.querySelectorAll('[data-s]').forEach(b => b.onclick = () => go(+b.dataset.s));
    document.getElementById('prog').style.width = (Object.keys(state.done).length / ST.length * 100) + '%';
  }
  function go(i){ state.gen = (state.gen || 0) + 1; state.cur = Math.max(0, Math.min(ST.length - 1, i)); drawStations(); VIEW[ST[state.cur].id](document.getElementById('game')); window.scrollTo({top: 0, behavior: 'smooth'}); }
  const nextBtn = () => '<div class="row"><button class="btn" data-next>' + L('المحطة التالية ⬅', 'Next station ➜') + '</button></div>';
  const bindNext = g => { const b = g.querySelector('[data-next]'); if(b) b.onclick = () => go(state.cur + 1); };
  const meta = (i, n, r) => '<div class="meta"><span>' + (i + 1) + ' / ' + n + '</span><span>⭐ ' + r + '</span></div>';
  const endCard = (g, id, icon, ar, e, right, n) => { finish(id); g.innerHTML = '<div class="card end">' + icon + ' ' + L(ar, e) + ' ' + right + ' / ' + n + nextBtn() + '</div>'; bindNext(g); win(); };
  /* one multiple-choice round helper */
  function mcq(g, o){ // o: {title, help, top, q, opts:[{t,right}], why, onDone(miss)}
    g.innerHTML = '<div class="card"><h3>' + o.title + '</h3>' + (o.help ? '<div class="help">' + o.help + '</div>' : '') + (o.top || '') +
      (o.q ? '<div class="q">' + o.q + '</div>' : '') +
      '<div class="' + (o.two ? 'two' : 'opts') + '">' + o.opts.map((x, j) => '<button class="opt' + (x.cls ? ' ' + x.cls : '') + '" data-o="' + j + '">' + x.t + '</button>').join('') + '</div>' +
      '<div class="fb" data-fb></div>' + (o.meta || '') + '</div>';
    let miss = false, done = false;
    g.querySelectorAll('[data-o]').forEach(b => b.onclick = () => {
      if(done) return;
      if(o.opts[+b.dataset.o].right){ done = true; b.classList.add('right'); ok(b); if(o.after) g.querySelector('[data-fb]').innerHTML = o.after; setTimeout(() => o.onDone(miss), 1300); }
      else { miss = true; b.classList.add('wrong'); bad(b); if(o.why) g.querySelector('[data-fb]').innerHTML = o.why; }
    });
  }

  const VIEW = {
    /* 1 — understand */
    learn(g){
      g.innerHTML = '<div class="card"><h3>' + L('🧭 يومي المسلم: ٣ أسئلة مهمة', '🧭 My Muslim day: 3 important questions') + '</h3>' +
        '<div class="help">' + L('الدرس ٣٤ في كتابك: <b>الحياة اليومية</b>. نسأل عن <b>المكان</b> وعن <b>العمل</b> وعن <b>الوقت</b>.', 'Lesson 34 in your book: <b>Daily life</b>. We ask about a <b>place</b>, an <b>action</b> and a <b>time</b>.') + '</div>' +
        '<div style="text-align:center"><img src="' + IMG('jumuah') + '" alt="" style="max-width:420px;width:100%;border-radius:14px;border:3px solid #fff"></div><div>' +
          '<div class="formula"><div class="chip c1">أَيْنَ<small>where</small></div><div class="chip c2">تُصَلِّي<small>do you pray</small></div><div class="chip c4">الْجُمُعَةَ؟<small>Jumu‘ah</small></div></div>' +
          '<div class="formula"><div class="chip c2">أُصَلِّي<small>I pray</small></div><div class="chip c3">فِي<small>in</small></div><div class="chip c4">الْمَسْجِدِ الْكَبِيرِ<small>the big mosque</small></div></div></div>' +
        '<div class="help">' + L('🔁 اسمع ← كرّر ← اقرأ وحدك: اقرأ السؤال والجواب بصوت عالٍ ٣ مرات.', '🔁 Listen carefully → Repeat after me → Now read alone: read the question and the answer aloud 3 times.') + '</div>' +
        '<h3>' + L('👀 هو أم هي؟', '👀 He or she?') + '</h3>' +
        '<div class="vs"><div style="border:3px solid #3D8BFD"><img src="' + IMG('ahmad') + '" alt="" style="width:100%;border-radius:10px"><div class="w" style="font-size:1.5rem">مَاذَا <b style="color:#3D8BFD">يَ</b>فْعَلُ أَحْمَدُ؟</div>' +
          '<span class="ar" style="font-size:1.3rem">— <b style="color:#3D8BFD">يَ</b>قْرَأُ الْقُرْآنَ</span><div>' + L('👦 هو ← <b>يَـ</b>', '👦 he → <b>يَـ</b> (ya)') + '</div></div>' +
        '<div style="border:3px solid #FF8A3D"><img src="' + IMG('fatimah') + '" alt="" style="width:100%;border-radius:10px"><div class="w" style="font-size:1.5rem">مَاذَا <b style="color:#FF8A3D">تَ</b>فْعَلُ فَاطِمَةُ؟</div>' +
          '<span class="ar" style="font-size:1.3rem">— <b style="color:#FF8A3D">تُ</b>شَاهِدُ التِّلْفَازَ</span><div>' + L('👧 هي ← <b>تَـ</b>', '👧 she → <b>تَـ</b> (ta)') + '</div></div></div>' +
        '<h3 style="margin-top:12px">' + L('⏰ مُبَكِّرًا أم مُتَأَخِّرًا؟', '⏰ Early or late?') + '</h3>' +
        '<div class="ee"><div style="text-align:center;background:var(--card);border-radius:12px;padding:8px">' + clock(5, 90) + '<div class="ar" style="font-size:1.4rem;font-weight:700">أَسْتَيْقِظُ مُبَكِّرًا 🌅</div><small>' + L('أستيقظ بدري', 'I wake up early') + '</small></div>' +
        '<div style="text-align:center;background:var(--card);border-radius:12px;padding:8px">' + clock(10, 90) + '<div class="ar" style="font-size:1.4rem;font-weight:700">أَسْتَيْقِظُ مُتَأَخِّرًا 😴</div><small>' + L('أستيقظ متأخر', 'I wake up late') + '</small></div></div>' +
        nextBtn() + '</div>';
      bindNext(g); finish('learn');
    },

    /* 2 — where do you pray? (book drill 1) */
    mosque(g){
      const rounds = shuffle(M); let i = 0, right = 0; const my = state.gen;
      const draw = () => {
        if(my !== state.gen) return;
        if(i >= rounds.length) return endCard(g, 'mosque', '🕌', 'ما شاء الله! ', 'MashaAllah! ', right, rounds.length);
        const p = rounds[i], choices = shuffle([p].concat(shuffle(M.filter(x => x !== p)).slice(0, 3)));
        g.innerHTML = '<div class="card"><h3>' + L('🕌 اقرأ السؤال واضغط المسجد الصحيح', '🕌 Read the question and tap the right mosque') + '</h3>' +
          '<div class="help">' + L('في كتابك: كل صلاة لها مسجد. ', 'In your book every prayer has a mosque. ') + '<span class="ar">' + M.map(x => x.pr + ' ← ' + x.m).join(' · ') + '</span></div>' +
          '<div class="q">' + MQ(p) + (en() ? '<br><small dir="ltr" style="font:600 .9rem var(--f-en)">Where do you pray ' + p.en + '?</small>' : '') + '</div>' +
          '<div class="pics">' + choices.map(c => '<button class="pic" data-k="' + c.k + '"><img src="' + IMG(c.k) + '" alt=""><span>' + c.m + '</span></button>').join('') + '</div>' +
          '<div class="fb" data-fb></div>' + meta(i, rounds.length, right) + '</div>';
        let miss = false, done = false;
        g.querySelectorAll('[data-k]').forEach(b => b.onclick = () => {
          if(done) return;
          if(b.dataset.k === p.k){ done = true; b.classList.add('right'); ok(b); if(!miss) right++; mark('🕌 ' + MQ(p), MA(p), !miss);
            g.querySelector('[data-fb]').innerHTML = '<span class="ar" style="font-size:1.5rem">— ' + MA(p) + '</span>'; setTimeout(() => { i++; draw(); }, 1700); }
          else { miss = true; b.classList.add('wrong'); bad(b); g.querySelector('[data-fb]').textContent = L('انظر إلى القائمة في المساعدة ⬆', 'Look at the list in the help box ⬆'); }
        });
      };
      draw();
    },

    /* 3 — what is he / she doing? (book drill 2) */
    doing(g){
      const rounds = shuffle(D); let i = 0, right = 0, phase = 0; const my = state.gen;
      const draw = () => {
        if(my !== state.gen) return;
        if(i >= rounds.length){
          // bonus: three he/she questions
          return heShe();
        }
        const p = rounds[i], wrong = shuffle(D.filter(x => x !== p)).slice(0, 2), opts = shuffle([p].concat(wrong));
        mcq(g, {title: L('👀 انظر إلى الصورة: ماذا يفعل؟', '👀 Look at the picture: what is happening?'),
          help: L('اختر الجملة التي تصف الصورة. انتبه: <b>يَـ</b> للولد و<b>تَـ</b> للبنت.', 'Choose the sentence for the picture. Remember: <b>يَـ</b> for a boy/man, <b>تَـ</b> for a girl/woman.'),
          top: '<div style="text-align:center"><img src="' + IMG(p.k) + '" alt="" style="max-width:420px;width:100%;border-radius:14px;border:3px solid #fff"></div>',
          q: DQ(p),
          opts: opts.map(o => ({t: o.act + (en() ? '<small dir="ltr" style="display:block;font:600 .8rem var(--f-en);opacity:.8">' + o.en + '</small>' : ''), right: o === p})),
          after: '<span class="ar" style="font-size:1.4rem">— ' + DA(p) + '</span>',
          why: L('انظر جيدًا: ماذا في يده؟', 'Look closely: what is in the hands?'),
          meta: meta(i, rounds.length, right),
          onDone: miss => { if(!miss) right++; mark('👀 ' + DQ(p), DA(p), !miss); i++; draw(); }});
      };
      const heShe = () => {
        const items = shuffle([{w:'أَحْمَدُ', f:0}, {w:'فَاطِمَةُ', f:1}, {w:'الرَّجُلُ', f:0}, {w:'خَدِيجَةُ', f:1}, {w:'مُحَمَّدٌ', f:0}, {w:'الْبِنْتُ', f:1}]).slice(0, 3);
        let j = 0;
        const d2 = () => {
          if(my !== state.gen) return;
          if(j >= items.length) return endCard(g, 'doing', '👀', 'أنت تعرف هو وهي! ', 'You know he and she! ', right, 9);
          const it = items[j];
          mcq(g, {title: L('👦👧 يَفْعَلُ أم تَفْعَلُ؟', '👦👧 يَفْعَلُ or تَفْعَلُ?'), two: true,
            q: 'مَاذَا <span class="blank">؟؟</span> ' + it.w + '؟',
            opts: [{t: 'يَفْعَلُ 👦', right: !it.f}, {t: 'تَفْعَلُ 👧', right: !!it.f}],
            why: L('هل هو ولد أم بنت؟', 'Is it a boy or a girl?'),
            meta: meta(j, items.length, right),
            onDone: miss => { if(!miss) right++; mark('👦👧 مَاذَا … ' + it.w, it.f ? 'تَفْعَلُ' : 'يَفْعَلُ', !miss); j++; d2(); }});
        };
        d2();
      };
      draw();
    },

    /* 4 — early or late (book drill 3) */
    clock(g){
      const rounds = shuffle(H); let i = 0, right = 0; const my = state.gen;
      const draw = () => {
        if(my !== state.gen) return;
        if(i >= rounds.length) return endCard(g, 'clock', '⏰', 'أحسنت! ', 'Well done! ', right, rounds.length);
        const p = rounds[i], opts = shuffle([p].concat(shuffle(H.filter(x => x !== p)).slice(0, 2)));
        mcq(g, {title: L('⏰ متى تستيقظ؟ انظر إلى الساعة', '⏰ When do you wake up? Look at the clock'),
          help: L('العقرب الصغير يقول الساعة. الجواب: <b>أَسْتَيْقِظُ السَّاعَةَ…</b>', 'The short hand shows the hour. Answer: <b>أَسْتَيْقِظُ السَّاعَةَ…</b> (I wake up at … o’clock)'),
          top: '<div style="text-align:center">' + clock(p.h, 150) + '</div>', q: 'مَتَى تَسْتَيْقِظُ؟',
          opts: opts.map(o => ({t: 'أَسْتَيْقِظُ السَّاعَةَ ' + o.n + '.', right: o === p})),
          why: L('عُدّ الأرقام حتى العقرب الصغير.', 'Count the numbers to the short hand.'), meta: meta(i, rounds.length, right),
          onDone: miss => {
            if(!miss) right++; mark('⏰ مَتَى تَسْتَيْقِظُ؟ (' + p.h + ')', 'أَسْتَيْقِظُ السَّاعَةَ ' + p.n, !miss);
            if(p.e){ // early / late bonus question (not scored)
              mcq(g, {title: L('🌅 مُبَكِّرًا أم مُتَأَخِّرًا؟', '🌅 Early or late?'), two: true, top: '<div style="text-align:center">' + clock(p.h, 120) + '</div>',
                q: 'أَسْتَيْقِظُ السَّاعَةَ ' + p.n + '.', opts: [{t: 'مُبَكِّرًا 🌅', right: p.e === 1}, {t: 'مُتَأَخِّرًا 😴', right: p.e === 2}],
                after: '<span class="ar" style="font-size:1.4rem">— أَسْتَيْقِظُ ' + (p.e === 1 ? 'مُبَكِّرًا' : 'مُتَأَخِّرًا') + '.</span>',
                onDone: () => { i++; draw(); }});
            } else { i++; draw(); }
          }});
      };
      draw();
    },

    /* 5 — complete the dialogue (book drill 4) */
    talk(g){
      const rounds = shuffle(T); let i = 0, right = 0; const my = state.gen;
      const draw = () => {
        if(my !== state.gen) return;
        if(i >= rounds.length) return build();
        const p = rounds[i], opts = shuffle([p].concat(shuffle(T.filter(x => x !== p)).slice(0, 2)));
        mcq(g, {title: L('💬 هذا هو الجواب. ما هو السؤال؟', '💬 This is the answer. What was the question?'),
          help: L('<b>مَتَى</b> ← وقت · <b>أَيْنَ</b> ← مكان · <b>مَاذَا</b> ← عمل · <b>هَلْ</b> ← الجواب نعم أو لا', '<b>مَتَى</b> when → a time · <b>أَيْنَ</b> where → a place · <b>مَاذَا</b> what → an action · <b>هَلْ</b> → the answer is yes or no'),
          q: '<span style="color:#2E7D6B">ط٢: ' + p.a + '</span>',
          opts: opts.map(o => ({t: 'ط١: ' + o.q + (en() ? '<small dir="ltr" style="display:block;font:600 .8rem var(--f-en);opacity:.8">' + o.qe + '</small>' : ''), right: o === p})),
          why: L('اقرأ الجواب مرة أخرى: وقت؟ مكان؟ عمل؟ نعم/لا؟', 'Read the answer again: time? place? action? yes/no?'), meta: meta(i, rounds.length, right),
          onDone: miss => { if(!miss) right++; mark('💬 ' + p.a, p.q, !miss); i++; draw(); }});
      };
      const build = () => {
        const picks = shuffle(T).slice(0, 2); let j = 0;
        const d2 = () => {
          if(my !== state.gen) return;
          if(j >= picks.length) return endCard(g, 'talk', '💬', 'حوار رائع! ', 'Great dialogue! ', right, 8);
          const p = picks[j], words = p.q.replace('؟', '').split(' ').concat(['؟']);
          g.innerHTML = '<div class="card"><h3>' + L('🧩 رتّب كلمات السؤال', '🧩 Put the question words in order') + '</h3>' +
            '<div class="q" style="color:#2E7D6B">ط٢: ' + p.a + '</div>' +
            '<div class="line" data-line></div><div class="pool" data-pool>' + shuffle(words.map((w, k) => [w, k])).map(x => '<div class="chip" data-j="' + x[1] + '">' + x[0] + '</div>').join('') + '</div>' +
            '<div class="fb" data-fb></div>' + meta(j, picks.length, right) + '</div>';
          let next = 0, miss = false;
          g.querySelectorAll('[data-j]').forEach(c => c.onclick = () => {
            if(+c.dataset.j === next){ g.querySelector('[data-line]').appendChild(c); c.onclick = null; c.style.borderColor = 'var(--ok)'; next++;
              if(next === words.length){ ok(c); if(!miss) right++; mark('🧩 ' + p.q, p.q, !miss); setTimeout(() => { j++; d2(); }, 900); } }
            else { miss = true; bad(c); g.querySelector('[data-fb]').textContent = L('ليست هذه. السؤال يبدأ بأداة السؤال.', 'Not this one. The question starts with the question word.'); }
          });
        };
        d2();
      };
      draw();
    },

    /* 6 — my day, in my own voice (book drills 5–6) */
    speak(g){
      const Qs = [
        ['مَتَى تَسْتَيْقِظُ؟', 'أَسْتَيْقِظُ السَّاعَةَ الْخَامِسَةَ.', 'When do you wake up?'],
        ['أَيْنَ تُصَلِّي الْفَجْرَ؟', 'أُصَلِّي الْفَجْرَ فِي الْمَسْجِدِ.', 'Where do you pray Fajr?'],
        ['هَلْ تَنَامُ بَعْدَ الصَّلَاةِ؟', 'لَا، لَا أَنَامُ بَعْدَ الصَّلَاةِ.', 'Do you sleep after the prayer?'],
        ['مَاذَا تَفْعَلُ بَعْدَ الصَّلَاةِ؟', 'أَقْرَأُ الْقُرْآنَ.', 'What do you do after the prayer?'],
        ['أَيْنَ تُصَلِّي الْجُمُعَةَ؟', 'أُصَلِّي الْجُمُعَةَ فِي الْمَسْجِدِ الْكَبِيرِ.', 'Where do you pray Jumu‘ah?']
      ];
      g.innerHTML = '<div class="card"><h3>' + L('🎙️ يومي بصوتي: أجب عن نفسك', '🎙️ My day in my voice: answer about yourself') + '</h3>' +
        '<div class="help">' + L('١) اقرأ السؤال بصوت عالٍ. ٢) قل جوابك <b>أنت</b> (عن يومك الحقيقي). ٣) سجّل. محتاج مساعدة؟ اضغط على السطر المخفي.', '1) Read the question aloud. 2) Say <b>your own</b> answer (about your real day). 3) Record. Need help? Tap the hidden line.') + '</div>' +
        Qs.map((q, j) => '<div class="recItem" style="grid-template-columns:1fr"><div><div class="q" style="margin:0">' + q[0] + (en() ? '<br><small dir="ltr" style="font:600 .85rem var(--f-en)">' + q[2] + '</small>' : '') + '</div>' +
          '<div class="hint hide" data-h>' + L('مثال: ', 'Example: ') + q[1] + '</div><div class="row" style="justify-content:flex-start" data-r="' + j + '"></div></div></div>').join('') +
        '<h3 style="margin-top:14px">' + L('🖼️ صِف الصورة بصوتك', '🖼️ Describe the picture with your voice') + '</h3>' +
        '<div class="recItem"><img src="' + IMG('muhammad') + '" alt=""><div><div class="q" style="margin:0">مَاذَا يَفْعَلُ مُحَمَّدٌ؟</div><div class="hint hide" data-h>مُحَمَّدٌ يَغْسِلُ الصُّحُونَ.</div><div class="row" style="justify-content:flex-start" data-r="pic"></div></div></div>' +
        nextBtn() + '</div>';
      g.querySelectorAll('[data-h]').forEach(h => h.onclick = () => h.classList.remove('hide'));
      Qs.forEach((q, j) => { const b = TQHW.recordButton(g.querySelector('[data-r="' + j + '"]'), '🎙️ ' + q[0]); b.addEventListener('click', () => { if(!state.done.speak){ state.rec++; if(state.rec >= 3) finish('speak'); } }); });
      TQHW.recordButton(g.querySelector('[data-r="pic"]'), '🎙️ مَاذَا يَفْعَلُ مُحَمَّدٌ؟');
      bindNext(g);
    },

    /* 7 — reward */
    stars(g){
      g.innerHTML = '<div class="card"><h3>' + L('🌟 المكافأة: امسك ١٥ نجمة وقمرًا!', '🌟 Reward: catch 15 stars and moons!') + '</h3><div class="sky" data-sky></div><div class="fb" data-fb></div></div>';
      const sky = g.querySelector('[data-sky]'); let got = 0, t;
      const spawn = () => {
        if(got >= 15) return;
        const s = document.createElement('div'); s.className = 'star'; s.textContent = Math.random() < .25 ? '🌙' : '⭐';
        s.style.left = (5 + Math.random() * 85) + '%'; s.style.top = (5 + Math.random() * 75) + '%';
        s.onclick = () => { got++; s.style.transform = 'scale(1.8)'; ok(s); setTimeout(() => s.remove(), 150); g.querySelector('[data-fb]').textContent = '⭐ ' + got + ' / 15';
          if(got >= 15){ clearInterval(t); sky.innerHTML = ''; finish('stars'); win();
            const n = TQHW.name;
            g.querySelector('.card').insertAdjacentHTML('beforeend', '<div class="end" style="margin-top:10px">🏆 ' + L('بارك الله فيك ' + (n || 'يا بطل') + '! الآن تتكلم عن يومك بالعربي: أين تصلي، ماذا تفعل، ومتى. المعلم سيسمع تسجيلاتك ويرد عليك.', 'Barak Allahu feek ' + (n || 'hero') + '! Now you can talk about your day in Arabic: where you pray, what you do and when. Your teacher will listen to your recordings and reply.') +
              '<div style="margin-top:6px"><b dir="ltr">⭐ ' + state.score + ' / ' + state.max + '</b></div></div>'); } };
        sky.appendChild(s); setTimeout(() => s.remove(), 1700);
      };
      t = setInterval(spawn, 550); spawn();
    }
  };

  function frame(){
    document.documentElement.lang = TQHW.lang; document.documentElement.dir = en() ? 'ltr' : 'rtl';
    document.getElementById('t').textContent = L('🕌 يومي المسلم', '🕌 My Muslim day');
    const n = TQHW.name;
    document.getElementById('hi').innerHTML = L('أهلًا ' + (n || '') + '! اليوم تتكلم عن يومك: <b>أَيْنَ</b> تصلي، <b>مَاذَا</b> تفعل، و<b>مَتَى</b> تستيقظ — من الدرس ٣٤ في كتابك.', 'Hi ' + (n || '') + '! Today you talk about your day: <b class="ar">أَيْنَ</b> you pray, <b class="ar">مَاذَا</b> you do and <b class="ar">مَتَى</b> you wake up — from lesson 34 in your book.');
    const lsw = document.getElementById('lsw'); if(!TQHW.embedded){ lsw.hidden = false; lsw.textContent = en() ? 'ع' : 'EN'; lsw.onclick = () => TQHW.setLang(en() ? 'ar' : 'en'); }
  }
  TQHW.on('lang', () => { frame(); go(state.cur); });
  frame(); report(); go(0);
})();
</script>
