<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>خطتي للصلاة · My prayer plan</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Readex+Pro:wght@300;400;500;600&display=swap">
<!-- Weekly prayer tracker as a homework page: the student ticks each prayer for 7 days; the ticks and a short recording
     are sent with the homework (app/hwkit.js). No student names here: the name comes from the homework link. -->
<style>
:root{--ink:#0E2433;--ink-soft:#4C6475;--teal:#126B87;--teal-deep:#0C4E64;--sky:#E4F0F6;--sky-2:#F4F9FB;--card:#FFFFFF;--line:#C9DCE5;
  --sand:#FBF0D3;--sand-ink:#7A5200;--sand-line:#E8D49B;--good:#2C9A63;--gold:#E7A91C;
  --f-en:"Lexend","Segoe UI",system-ui,sans-serif;--f-ar:"Readex Pro","Segoe UI",Tahoma,sans-serif;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,var(--sky) 0%,var(--sky-2) 100%);color:var(--ink);font-family:var(--f-en);padding:16px 14px 28px;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html[lang=ar] body{font-family:var(--f-ar)}
button{font-family:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.wrap{max-width:980px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{width:58px;height:58px;border-radius:16px;background:var(--teal);display:grid;place-items:center;flex:none}
.logo svg{width:34px;height:34px}
.ttl{flex:1;min-width:180px}
h1{margin:0;font:700 clamp(26px,5.4vw,42px)/1.15 inherit;font-family:inherit}
.sub{color:var(--ink-soft);font-size:15px;margin-top:2px}
.week{background:var(--sand);border:2px solid var(--sand-line);color:var(--sand-ink);border-radius:22px;padding:8px 16px;text-align:center;font-weight:600}
.ask{margin:0;text-align:center;font:500 clamp(16px,2.6vw,20px)/1.5 inherit;font-family:inherit}
.ask b{color:var(--teal)}
.hard{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.hbtn{background:var(--card);border:3px solid var(--teal);border-radius:20px;padding:10px 18px;min-width:100px;text-align:center;box-shadow:0 3px 0 var(--line);transition:transform .12s,background .15s}
.hbtn b{display:block;font-size:clamp(17px,3vw,23px);line-height:1.3}
.hbtn span{display:block;font:400 14px/1.4 var(--f-ar);color:var(--ink-soft)}
.hbtn[aria-pressed="true"]{background:var(--teal);border-color:var(--teal-deep);color:#fff;box-shadow:0 3px 0 var(--teal-deep)}
.hbtn[aria-pressed="true"] span{color:#E6F4F9}
.tip{background:var(--card);border:2px dashed var(--teal);border-radius:20px;padding:14px 18px}
.tip h2{margin:0 0 4px;font-size:18px;color:var(--teal)}
.tip p{margin:0;font-size:16px;line-height:1.6}
.panel{background:var(--card);border:3px solid var(--line);border-radius:28px;padding:clamp(12px,3vw,26px)}
.grid{display:grid;grid-template-columns:minmax(70px,auto) repeat(7,minmax(0,1fr));column-gap:clamp(4px,1.4vw,14px);row-gap:clamp(6px,1.2vw,10px);align-items:center}
.dh{text-align:center;font-weight:600;font-size:clamp(11px,2vw,17px);padding-bottom:6px}
.dh.perfect{color:var(--good)}
.pl b{display:block;font-size:clamp(13px,2.4vw,18px)}
.pl span{font:400 clamp(11px,1.8vw,14px)/1.4 var(--f-ar);color:var(--ink-soft)}
.pl.star b::after{content:" ★";color:var(--gold)}
.cell{display:grid;place-items:center}
.box{width:clamp(30px,6.4vw,54px);aspect-ratio:1;border-radius:clamp(9px,1.8vw,15px);border:clamp(2.5px,.5vw,4px) solid var(--teal);background:var(--card);box-shadow:0 0 0 clamp(2px,.5vw,4px) var(--sky);display:grid;place-items:center;padding:0;transition:background .15s,transform .15s}
.box svg{width:62%;height:62%;opacity:0;transform:scale(.4);transition:opacity .15s,transform .2s cubic-bezier(.3,1.6,.5,1)}
.box[aria-checked="true"]{background:var(--teal);border-color:var(--teal-deep)}
.box[aria-checked="true"] svg{opacity:1;transform:scale(1)}
.box:active{transform:scale(.92)}
.hardrow .box{border-color:var(--gold)}
.hardrow .box[aria-checked="true"]{background:var(--gold);border-color:var(--gold)}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:18px;padding-top:14px;border-top:2px solid var(--line)}
.meter{flex:1;min-width:180px}
.meter .t{font-weight:600;margin-bottom:6px}
.track{height:14px;background:var(--sky);border-radius:10px;overflow:hidden;border:2px solid var(--line)}
.fill{height:100%;width:0;background:var(--good);border-radius:8px;transition:width .35s}
.msg{flex-basis:100%;margin:0;font-weight:500;min-height:1.6em}
.reset{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:9px 16px;font-size:14px;color:var(--ink-soft)}
.reset[data-sure="1"]{border-color:var(--gold);color:var(--sand-ink);background:var(--sand)}
.rec{background:var(--card);border:3px solid var(--line);border-radius:24px;padding:14px 18px}
.rec p{margin:0 0 8px;font-weight:500}
.rec button{background:var(--teal);color:#fff;border:0;border-radius:14px;min-height:46px;padding:0 18px;font-weight:700}
.rec audio{width:100%;margin-top:8px}
.foot{margin:0;text-align:center;font-size:14px;color:var(--ink-soft)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<link rel="icon" type="image/svg+xml" href="../assets/brand/emblem.svg">
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none"><rect x="6" y="9" width="36" height="33" rx="6" fill="#E4F0F6"/><rect x="6" y="9" width="36" height="9" rx="4" fill="#9FD0E2"/><path d="M14 6v7M20 6v7M26 6v7M32 6v7M38 6v7" stroke="#fff" stroke-width="3" stroke-linecap="round"/><g fill="#126B87"><rect x="12" y="23" width="5" height="4" rx="1"/><rect x="21" y="23" width="5" height="4" rx="1"/><rect x="30" y="23" width="5" height="4" rx="1"/><rect x="12" y="31" width="5" height="4" rx="1"/><rect x="21" y="31" width="5" height="4" rx="1"/><rect x="30" y="31" width="5" height="4" rx="1"/></g></svg></div>
    <div class="ttl"><h1 id="t"></h1><div class="sub" id="hi"></div></div>
    <div class="week" id="wk"></div>
  </header>
  <p class="ask" id="ask"></p>
  <div class="hard" id="hard" role="group"></div>
  <div class="tip" id="tip" hidden aria-live="polite"></div>
  <section class="panel">
    <div class="grid" id="grid" role="grid"></div>
    <div class="bar">
      <div class="meter"><div class="t" id="count"></div><div class="track"><div class="fill" id="fill"></div></div></div>
      <button class="reset" id="reset" type="button"></button>
      <p class="msg" id="msg" aria-live="polite"></p>
    </div>
  </section>
  <div class="rec"><p id="recSay"></p><div id="recBox"></div></div>
  <p class="foot" id="foot"></p>
</div>
<script src="../app/hwkit.js"></script>
<script src="../tq-fx.js"></script>
<script>
(function(){
  const P = [
    {k: 'fajr', en: 'Fajr', ar: 'الفجر', tip: ['نم بدري، واضبط منبهين، واطلب من حد في البيت يصحّيك.', 'Go to sleep early. Set two alarms. Ask someone at home to wake you.']},
    {k: 'zuhr', en: 'Ẓuhr', ar: 'الظهر', tip: ['اضبط تذكير على الموبايل، وصلِّ أول ما تفضى.', 'Set a phone reminder. Pray as soon as you are free.']},
    {k: 'asr', en: 'ʿAṣr', ar: 'العصر', tip: ['ما تستناش لحد ما الشمس تقرب تغرب. صلِّ أول ما ترجع البيت.', 'Do not wait until the sun gets low. Pray right after you come home.']},
    {k: 'maghrib', en: 'Maghrib', ar: 'المغرب', tip: ['وقتها قصير. صلِّ أول ما تسمع الأذان قبل ما تبدأ أي حاجة.', 'The time is short. Pray when you hear the adhan, before you start something new.']},
    {k: 'isha', en: 'ʿIshāʾ', ar: 'العشاء', tip: ['صلِّ قبل ما تفتح الألعاب أو الفيديوهات بالليل علشان ما تنساش.', 'Pray before you open games or videos at night, so you do not forget.']}
  ];
  const T = {
    title: ['خطتي للصلاة', 'My prayer plan'], hi: ['أهلًا {n}! علّم كل صلاة تصليها الأسبوع ده.', 'Hi {n}! Tick each prayer you pray this week.'], hiNo: ['علّم كل صلاة تصليها الأسبوع ده.', 'Tick each prayer you pray this week.'],
    week: ['الأسبوع ده', 'This week'], ask: ['أنهي صلاة <b>الأصعب</b> عليك؟ اضغط عليها. وبعدين علّم كل صلاة صليتها كل يوم.', 'Which prayer is <b>hardest</b> for you? Tap it. Then tick each prayer you pray every day.'],
    goal: ['هدفي: أصلي {p} كل يوم ★', 'My goal: pray {p} every day ★'], day: ['يوم', 'Day'], count: ['{n} / ٣٥ صلاة', '{n} / 35 prayers'],
    reset: ['ابدأ أسبوع جديد', 'Start a new week'], sure: ['اضغط تاني علشان تمسح كل العلامات', 'Tap again to clear all ticks'],
    m0: ['علّم المربع بعد ما تصلي.', 'Tick a box after you pray.'], m35: ['٣٥ صلاة كاملة! الحمد لله 🌟 سلّم الواجب علشان المعلم يشوف.', 'All 35 prayers! Alhamdulillah 🌟 Send your homework so your teacher can see.'],
    mp: ['{d} يوم كامل بالصلوات الخمس. كمّل!', '{d} perfect day(s): all 5 prayers. Keep going!'], mg: ['بداية حلوة. حاول تصلي الخمس النهارده.', 'Good start. Try to pray all 5 today.'],
    rec: ['🎙️ سجّل في دقيقة: أنهي صلاة أصعب عليك، وإيه خطتك علشان تحافظ عليها؟', '🎙️ Record in one minute: which prayer is hardest for you, and what is your plan to keep it?'],
    recL: ['خطتي للصلاة', 'My prayer plan'],
    foot: ['علاماتك محفوظة على الجهاز ده — افتح نفس اللينك كل يوم، وسلّم الواجب آخر الأسبوع.', 'Your ticks stay on this device — open the same link every day and send your homework at the end of the week.']
  };
  const L = k => T[k][TQHW.lang === 'en' ? 1 : 0];
  const arN = n => TQHW.lang === 'en' ? String(n) : String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
  const $ = id => document.getElementById(id);
  const KEY = 'tq-prayer-plan:' + (new URLSearchParams(location.search).get('name') || TQHW.name || 'me');
  let S = {hard: null, t: {}};
  try{ const v = JSON.parse(localStorage.getItem(KEY) || 'null'); if(v && v.t) S = v; }catch(_){}
  const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(_){} };
  const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  const nm = p => TQHW.lang === 'en' ? p.en : p.ar;

  function report(){
    const n = P.reduce((a, p) => a + [1, 2, 3, 4, 5, 6, 7].filter(d => S.t[p.k + d]).length, 0);
    const hard = P.find(p => p.k === S.hard);
    const details = (hard ? [{q: 'الصلاة الأصعب · Hardest prayer', a: hard.ar + ' · ' + hard.en, ok: true}] : [])
      .concat(P.map(p => { const c = [1, 2, 3, 4, 5, 6, 7].filter(d => S.t[p.k + d]).length; return {q: p.ar + ' · ' + p.en, a: c + ' / 7', ok: c === 7}; }));
    TQHW.result({score: n, max: 35, done: n > 0, details});
    return n;
  }
  function buildHard(){
    $('hard').innerHTML = P.map(p => '<button class="hbtn" type="button" data-k="' + p.k + '" aria-pressed="' + (S.hard === p.k) + '"><b>' + nm(p) + '</b><span lang="ar">' + (TQHW.lang === 'en' ? p.ar : p.en) + '</span></button>').join('');
  }
  $('hard').onclick = e => { const b = e.target.closest('.hbtn'); if(!b) return; S.hard = S.hard === b.dataset.k ? null : b.dataset.k; save(); buildHard(); buildGrid(); showTip(); if(window.TQFX) TQFX.ok(b); };
  function showTip(){
    const p = P.find(x => x.k === S.hard), t = $('tip');
    if(!p){ t.hidden = true; t.innerHTML = ''; return; }
    t.hidden = false; t.innerHTML = '<h2>' + L('goal').replace('{p}', nm(p)) + '</h2><p>' + p.tip[TQHW.lang === 'en' ? 1 : 0] + '</p>';
  }
  function buildGrid(){
    let h = '<div></div>';
    for(let d = 1; d <= 7; d++) h += '<div class="dh" id="dh' + d + '">' + L('day') + ' ' + arN(d) + '</div>';
    P.forEach(p => {
      const hr = S.hard === p.k;
      h += '<div class="pl ' + (hr ? 'star' : '') + '"><b>' + nm(p) + '</b><span>' + (TQHW.lang === 'en' ? p.ar : p.en) + '</span></div>';
      for(let d = 1; d <= 7; d++) h += '<div class="cell ' + (hr ? 'hardrow' : '') + '"><button class="box" type="button" role="checkbox" aria-checked="' + !!S.t[p.k + d] + '" aria-label="' + p.en + ', day ' + d + '" data-id="' + p.k + d + '">' + CHECK + '</button></div>';
    });
    $('grid').innerHTML = h; update();
  }
  function update(){
    for(let d = 1; d <= 7; d++) $('dh' + d).classList.toggle('perfect', P.every(p => S.t[p.k + d]));
    const n = report(), perfect = [1, 2, 3, 4, 5, 6, 7].filter(d => P.every(p => S.t[p.k + d])).length;
    $('count').textContent = L('count').replace('{n}', arN(n)); $('fill').style.width = (n / 35 * 100) + '%';
    $('msg').textContent = n === 0 ? L('m0') : n === 35 ? L('m35') : perfect ? L('mp').replace('{d}', arN(perfect)) : L('mg');
    return n;
  }
  $('grid').addEventListener('click', e => {
    const b = e.target.closest('.box'); if(!b) return; const id = b.dataset.id;
    if(S.t[id]) delete S.t[id]; else S.t[id] = 1;
    b.setAttribute('aria-checked', !!S.t[id]); save();
    const n = update(); if(S.t[id] && window.TQFX) TQFX.ok(b); if(n === 35 && window.TQFX) TQFX.win();
  });
  let sure = false, tm = null;
  $('reset').onclick = () => {
    const r = $('reset');
    if(!sure){ sure = true; r.dataset.sure = '1'; r.textContent = L('sure'); clearTimeout(tm); tm = setTimeout(() => { sure = false; r.dataset.sure = ''; r.textContent = L('reset'); }, 4000); return; }
    sure = false; r.dataset.sure = ''; r.textContent = L('reset'); S = {hard: S.hard, t: {}}; save(); buildGrid();
  };
  function draw(){
    document.documentElement.lang = TQHW.lang; document.documentElement.dir = TQHW.lang === 'en' ? 'ltr' : 'rtl';
    $('t').textContent = L('title'); $('hi').textContent = TQHW.name ? L('hi').replace('{n}', TQHW.name) : L('hiNo');
    $('wk').textContent = L('week'); $('ask').innerHTML = L('ask'); $('reset').textContent = L('reset');
    $('recSay').textContent = L('rec'); $('foot').textContent = L('foot');
    buildHard(); buildGrid(); showTip();
  }
  TQHW.recordButton($('recBox'), L('recL'));
  TQHW.on('lang', draw); draw();
})();
</script>
</body>
</html>
