<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="../tq-i18n.css"><script src="../tq-i18n.js"></script>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><link rel="icon" type="image/svg+xml" href="../assets/brand/emblem.svg"><link rel="apple-touch-icon" href="../assets/brand/apple-touch-icon.png">
</head><body class="tq-i18n">
<title>قطار الجملة</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Noto+Naskh+Arabic:wght@500;700&display=swap">
<style>
/* Layout: a sunny railway — the sentence is a train, each word a wagon whose roof-sign shows its family (▲ name · ● verb · ⋃ particle). Single bright day theme on purpose. */
:root{
  --sky:#D6EEFF; --sky2:#F4FBFF; --card:#FFFFFF; --ink:#1B2A4E; --muted:#58698C; --line:#C7DAEE;
  --name:#2A63DB; --name-bg:#E3ECFF; --verb:#DD3F3A; --verb-bg:#FFE5E2; --harf:#E79A00; --harf-bg:#FFF1CF;
  --grass:#5DB94A; --rail:#7B5A3C; --good:#178A4C; --good-bg:#DDF6E7; --bad:#C93A3A; --bad-bg:#FDE3E3; --gold:#FFC531;
  --f-disp:"Baloo Bhaijaan 2","Noto Naskh Arabic",system-ui,sans-serif;
  --f-ar:"Noto Naskh Arabic","Amiri","Traditional Arabic",serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;background:linear-gradient(var(--sky),var(--sky2) 70%);background-attachment:fixed;color:var(--ink);font-family:var(--f-disp);font-size:18px;line-height:1.6;direction:rtl}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
.en{display:none;font-family:system-ui,sans-serif;direction:ltr;unicode-bidi:isolate;font-size:.78em;color:var(--muted);font-weight:500}
body.show-en .en{display:inline}
body.show-en .en.blk{display:block}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:3px solid var(--line);padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-row{max-width:1100px;margin:0 auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.brand{margin:0;font-size:1.3rem;font-weight:800;line-height:1.2;flex:1 1 180px;min-width:0}
.brand small{display:block;font-size:.72rem;font-weight:500;color:var(--muted)}
.tbtn{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:3px 12px;font-size:.85rem;font-weight:700;min-height:38px}
.tbtn[aria-pressed="true"],.tbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.scores{display:flex;gap:6px;flex-wrap:wrap}
.pchip{border:2px solid var(--line);border-radius:999px;padding:2px 12px;font-weight:800;font-size:.9rem;background:var(--card);font-variant-numeric:tabular-nums}
.pchip.turn{border-color:var(--gold);background:#FFF6D6;box-shadow:0 0 0 3px #FFE9A3}

main{max-width:1100px;margin:0 auto;padding-block:16px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#s0{position:relative}
.panel{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:16px}
h2{margin:0 0 8px;font-size:clamp(1.3rem,3.5vw,1.8rem);line-height:1.3;text-wrap:balance}
h3{margin:0 0 6px;font-size:1.15rem}
p{margin:0 0 10px}

/* ===== hero ===== */
.hero{display:grid;gap:14px;justify-items:center;text-align:center;padding-block:6px 4px}
.hero h1{margin:0;font-size:clamp(2.2rem,8vw,3.6rem);font-weight:800;line-height:1.1;color:var(--ink)}
.hero h1 span{color:var(--verb)}
.hero .lead{max-width:60ch;color:var(--muted);margin:0}

/* ===== train ===== */
.track{position:relative;padding:18px 6px 26px;overflow:hidden}
.track::after{content:"";position:absolute;inset:auto 0 10px 0;height:8px;background:repeating-linear-gradient(90deg,var(--rail) 0 10px,transparent 10px 22px),linear-gradient(var(--rail),var(--rail));background-size:auto,100% 3px;background-position:0 0,0 6px;background-repeat:repeat-x,no-repeat;opacity:.8}
.train{display:flex;flex-wrap:wrap;gap:22px 10px;align-items:flex-end;justify-content:flex-start;transition:transform .9s cubic-bezier(.5,0,.3,1)}
.train.chug{animation:chug .9s ease-in-out}
@keyframes chug{0%{transform:none}35%{transform:translateX(26px)}55%{transform:translateX(18px)}100%{transform:none}}
.loco{position:relative;font-size:4.2rem;line-height:1;transform:scaleX(-1);filter:drop-shadow(0 3px 0 rgba(0,0,0,.12));user-select:none}
.puff{position:absolute;top:-10px;right:46px;width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid var(--line);opacity:0;pointer-events:none}
.train.chug .puff{animation:puff 1s ease-out forwards}
.train.chug .puff:nth-child(2){animation-delay:.2s}.train.chug .puff:nth-child(3){animation-delay:.4s}
@keyframes puff{0%{opacity:.9;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(-30px,-50px) scale(1.8)}}
.car{position:relative;min-width:92px;padding:30px 14px 12px;border-radius:14px 14px 8px 8px;background:var(--card);border:3px solid #B9C9DD;text-align:center;font-family:var(--f-ar);font-size:clamp(1.5rem,4.2vw,2.1rem);font-weight:700;line-height:1.5;transition:background .25s,border-color .25s,transform .2s}
.car::before,.car::after{content:"";position:absolute;bottom:-14px;width:20px;height:20px;border-radius:50%;background:#3B4566;border:4px solid #8D97B5}
.car::before{right:12px}.car::after{left:12px}
.car .sign{position:absolute;top:-20px;left:50%;transform:translateX(-50%);width:40px;height:40px;display:grid;place-items:center;background:var(--card);border:3px solid #B9C9DD;border-radius:12px}
.car .sign svg{width:26px;height:26px}
.car .sub{display:block;font-family:var(--f-disp);font-size:.8rem;font-weight:700;color:var(--muted);line-height:1.2;margin-top:2px}
.car.cur{border-color:var(--gold);box-shadow:0 0 0 5px #FFE9A3;transform:translateY(-6px)}
.car.k-n{background:var(--name-bg);border-color:var(--name)}.car.k-n .sign{border-color:var(--name)}
.car.k-v{background:var(--verb-bg);border-color:var(--verb)}.car.k-v .sign{border-color:var(--verb)}
.car.k-h{background:var(--harf-bg);border-color:var(--harf)}.car.k-h .sign{border-color:var(--harf)}
.car.blank{border-style:dashed;min-width:120px;color:transparent;background:repeating-linear-gradient(135deg,var(--card) 0 10px,var(--sky2) 10px 20px)}
.car.ghost{border-style:dashed;opacity:.8;color:var(--muted);font-size:1.3rem}
.car.added{animation:addin .45s ease}
@keyframes addin{from{transform:translateY(-30px) scale(.8);opacity:0}to{transform:none;opacity:1}}
.car.small{font-size:1.25rem;min-width:70px;padding:24px 10px 8px}

/* ===== kind buttons & cards ===== */
.kinds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kbtn{border:3px solid var(--line);background:var(--card);border-radius:18px;padding:10px 8px;display:grid;justify-items:center;gap:2px;text-align:center;min-height:110px;transition:transform .12s}
.kbtn:hover{transform:translateY(-2px)}
.kbtn svg{width:40px;height:40px}
.kbtn b{font-size:1.35rem;line-height:1.2}
.kbtn small{font-size:.82rem;color:var(--muted);line-height:1.35}
.kbtn.n{border-color:var(--name)}.kbtn.n b{color:var(--name)}
.kbtn.v{border-color:var(--verb)}.kbtn.v b{color:var(--verb)}
.kbtn.h{border-color:var(--harf)}.kbtn.h b{color:var(--harf)}
.who{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.who .card{border:3px solid var(--line);border-radius:20px;padding:14px;background:var(--card);display:grid;gap:6px;align-content:start}
.who .card.n{border-color:var(--name)}.who .card.v{border-color:var(--verb)}.who .card.h{border-color:var(--harf)}
.who .head{display:flex;gap:10px;align-items:center}
.who .head svg{width:46px;height:46px;flex:none}
.who .head b{font-size:1.5rem;line-height:1.1}
.who .card.n b{color:var(--name)}.who .card.v b{color:var(--verb)}.who .card.h b{color:var(--harf)}
.lock{font-size:.9rem;color:var(--muted);border-top:2px dashed var(--line);padding-top:6px}
.lock.open{color:var(--ink);font-family:var(--f-ar);font-size:1.05rem}
.ex{font-family:var(--f-ar);font-size:1.15rem}

.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:700;min-height:44px}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.mode{border:3px solid var(--line);background:var(--card);border-radius:20px;padding:14px;text-align:start;display:grid;gap:4px;min-height:120px;transition:transform .12s,border-color .2s}
.mode:hover{transform:translateY(-3px);border-color:var(--ink)}
.mode b{font-size:1.3rem}
.mode small{color:var(--muted);font-size:.88rem;line-height:1.45}
.mode .age{justify-self:start;font-size:.75rem;font-weight:800;border-radius:999px;padding:0 10px;background:var(--sky);color:var(--ink)}
.book{display:grid;gap:8px}
.bq{font-family:var(--f-ar);font-size:1.12rem;line-height:1.9;background:var(--sky2);border-inline-start:5px solid var(--gold);border-radius:10px;padding:8px 12px;margin:0}
.bq cite{display:block;font-family:var(--f-disp);font-style:normal;font-size:.8rem;color:var(--muted)}
details{border:2px solid var(--line);border-radius:16px;padding:8px 14px;background:var(--card)}
summary{cursor:pointer;font-weight:800}
details ul{margin:6px 0;padding-inline-start:20px}

/* ===== play ===== */
.playtop{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.playtop h2{margin:0;flex:1 1 200px}
.prog{display:flex;gap:4px;flex:1 1 100%}
.prog i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.prog i.done{background:var(--good)}.prog i.on{background:var(--gold)}
.scene{display:grid;gap:12px}
.pic{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;text-align:center}
.pic .emo{font-size:2.6rem;line-height:1}
.ask{font-size:1.25rem;font-weight:800;text-align:center}
.ask small{display:block;font-size:.85rem;color:var(--muted);font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.opt{border:3px solid var(--line);background:var(--card);border-radius:16px;padding:8px 20px;min-height:56px;min-width:72px;font-size:1.4rem;font-weight:800}
.opt.w{font-family:var(--f-ar);font-size:1.6rem;font-weight:700}
.opt.big{font-size:1.3rem;padding:10px 22px;min-width:180px}
.opt.right{background:var(--good-bg);border-color:var(--good);color:var(--good)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(6px)}75%{transform:translateX(-6px)}}
.fb{border-radius:16px;padding:10px 14px;font-weight:700;text-align:center}
.fb.good{background:var(--good-bg);color:var(--good)}
.fb.bad{background:var(--bad-bg);color:var(--bad)}
.fb.info{background:var(--sky2);color:var(--ink);border:2px dashed var(--line)}
.fb .ar{font-family:var(--f-ar)}
.move{display:inline-flex;gap:8px;align-items:center;background:#FFF6D6;border:2px solid var(--gold);border-radius:999px;padding:4px 14px;font-weight:800}
.done-box{display:grid;gap:10px;justify-items:center;text-align:center}
.next{background:var(--ink);color:#fff;border:0;border-radius:16px;padding:10px 28px;font-weight:800;font-size:1.15rem;min-height:52px}
.ghostbtn{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:6px 14px;font-weight:700;min-height:44px}
.starline{font-size:2rem;letter-spacing:4px}
#makeIn{font-family:var(--f-ar);font-size:1.4rem;width:100%;max-width:640px;border:3px solid var(--line);border-radius:14px;padding:8px 12px;background:var(--card);color:var(--ink);direction:rtl}

/* ===== modal & end ===== */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(27,42,78,.45);padding:16px}
.modal .box{background:var(--card);border-radius:24px;border:4px solid var(--gold);max-width:560px;width:100%;padding:18px;display:grid;gap:10px;text-align:center;animation:addin .4s ease}
.modal .box svg{width:64px;height:64px;justify-self:center}
.trophy{font-size:4rem;line-height:1}
.tbl{width:100%;border-collapse:collapse}
.tbl td{border-bottom:2px solid var(--line);padding:6px;text-align:start}
.tbl td.ar{font-family:var(--f-ar);font-size:1.25rem}
.cf{position:fixed;top:-20px;width:11px;height:15px;border-radius:3px;pointer-events:none;z-index:80;animation:cfall linear forwards}
@keyframes cfall{to{transform:translateY(110vh) rotate(720deg)}}
.pop{position:fixed;top:30%;left:50%;transform:translate(-50%,-50%);font-size:2rem;font-weight:800;color:#7A5600;background:var(--card);border:3px solid var(--gold);border-radius:999px;padding:4px 22px;pointer-events:none;z-index:60;animation:pop 1s ease forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}25%{opacity:1;transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%)}}
.tnote{display:none;font-size:.9rem;background:#FFF6D6;border-inline-start:5px solid var(--gold);border-radius:10px;padding:8px 12px}
body.teacher .tnote{display:block}
@media (max-width:560px){.brand small{display:none}.tbtn{min-height:34px;padding:2px 10px}.kinds{gap:6px}.kbtn{min-height:96px;padding:8px 4px}.kbtn small{font-size:.72rem}.car{min-width:74px;padding:28px 10px 10px}.loco{font-size:3.2rem}.opt.big{min-width:140px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* pen tools & whiteboard (from claude/lesson-engine/engine.css) */
.ink-cv{position:absolute;left:0;top:0;width:100%;height:100%;z-index:45;pointer-events:none;touch-action:none}
body.ink-on .ink-cv.cur,body.ink-on #wbBoard .ink-cv{pointer-events:auto;cursor:crosshair}
body.ink-erase .ink-cv{cursor:cell!important}
body.ink-laser .ink-cv{cursor:none!important}
#wbLaser{position:fixed;inset:0;width:100%;height:100%;z-index:66;pointer-events:none}
#wbBoard{position:fixed;inset:0;z-index:60;background-color:#FDFCF8;background-image:linear-gradient(#E6ECEF 1px,transparent 1px),linear-gradient(90deg,#E6ECEF 1px,transparent 1px);background-size:40px 40px}
#wbBoard[hidden]{display:none!important}
#wbBoard .bt{position:absolute;top:calc(18px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);font:700 18px/1 var(--f-disp);color:#86662A;background:#FBF3E1;border:1px solid #EBDDBB;border-radius:20px;padding:8px 16px;z-index:2;pointer-events:none;white-space:nowrap}
#tools{position:fixed;left:calc(10px + env(safe-area-inset-left,0px));top:50%;transform:translateY(-50%);z-index:70;display:flex;flex-direction:column;gap:5px;background:rgba(7,23,33,.95);border:1px solid #C9A35A;border-radius:16px;padding:7px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
#tools button{width:42px;height:42px;border-radius:10px;border:1px solid #24485A;background:#12303F;color:#E8F1F5;display:grid;place-items:center;padding:0;cursor:pointer}
#tools button svg{width:22px;height:22px}
#tools button.on{background:#C9A35A;color:#0B2431;border-color:#C9A35A}
#tools .sw i{width:22px;height:22px;border-radius:50%;display:block;border:2px solid rgba(255,255,255,.6)}
#tools .sw.on{background:#24485A;border-color:#C9A35A}
#tools .sz i{display:block;border-radius:50%;background:#E8F1F5}
#tools .sep{height:1px;background:#2A5266;margin:2px 0}
#tools[hidden]{display:none!important}
@media (max-height:980px){#tools{gap:4px;padding:6px}#tools button{width:34px;height:34px}#tools button svg{width:18px;height:18px}#tools .sw i{width:18px;height:18px}}
@media (max-height:800px){#tools{flex-direction:row;flex-wrap:wrap;top:auto;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:none;max-width:calc(100% - 20px)}#tools .sep{width:1px;height:auto;margin:0 2px}}
#drawB.on{background:#C9A35A!important;color:#0B2431!important;border-color:#C9A35A!important}
</style>

<header class="top"><div class="top-row">
  <h1 class="brand">🚂 قِطَارُ الجُمْلَة <span class="en">The Sentence Train</span><small><span class="ui-ar">محمد مبارك | Mohamed Mubarak · من كتاب «النحو الواضح»</span><span class="ui-en">Mohamed Mubarak · from the book <i>An-Naḥw al-Wāḍiḥ</i> (“The Clear Grammar”)</span></small></h1>
  <div class="scores" id="scores" aria-live="polite"></div>
  <button class="tbtn" id="homeB" hidden><span class="ui-ar">🏠 البداية</span><span class="ui-en">🏠 Start</span></button>
  <button class="tbtn" id="enT" aria-pressed="false">English</button>
  <button class="tbtn" id="tT" aria-pressed="false"><span class="ui-ar">للمعلم</span><span class="ui-en">Teacher notes</span></button>
  <button class="tbtn" id="sndT" aria-pressed="true" title="الصوت" data-en-title="Sound" aria-label="Sound · الصوت">🔊</button>
</div></header>

<main><section id="s0">
  <div id="home"></div>
  <div id="play" hidden></div>
  <div id="end" hidden></div>
</section></main>
<div id="modal" class="modal" hidden></div>

<script>
/* =====================================================================
   قِطَارُ الجُمْلَة — The Sentence Train  (محمد مبارك | Mohamed Mubarak)
   Source: «النحو الواضح في قواعد اللغة العربية» — علي الجارم ومصطفى أمين،
   ج١ (المرحلة الابتدائية): المقدمة، إرشادات التدريس، الجملة المفيدة، أجزاء الجملة،
   تقسيم الكلمة (ص ١٧–٣٠، ترقيم المطبوع كما في الشاملة). التشكيل الكامل من المعلم.
   ---------------------------------------------------------------------
   EDIT HERE — the unified content format:
   SETS = { key:{ ar, en, items:[ {ar:'الجملة بالتشكيل', en, pic, k:'رموز الكلمات', ref} ] } }
     k = one code per word, separated by spaces:
       n = اسم (name) · v = فعل (verb) · h = حرف (particle)
       n:p إنسان · n:a حيوان · n:b نبات · n:t جماد · n:i معنى  (adds the bonus «اسم ماذا؟» question)
   COMPLETE = [ {ar, en, pic, ok:1|0, hidden?:'أَنْتَ', add?:'كلمة تكمّلها', pos?:'before', opts?:[٣ كلمات، الأولى الصحيحة], ref, why?} ]
   BLANKS   = [ {ar:'… _ …', en, pic, need:'n'|'v'|'h', opts:[['كلمة','n'],…] (الأول الصحيح), ref} ]
   FACTORY  = [ {ar:'المهمة', en, pic, shape:['?','n','v','h','n:a'…], ex:'مثال', ref} ]
   ===================================================================== */
const BOOK='«النحو الواضح في قواعد اللغة العربية» — علي الجارم ومصطفى أمين، ج١';
const BOOK_EN='An-Naḥw al-Wāḍiḥ fī Qawāʿid al-Lughah al-ʿArabiyyah (“The Clear Grammar of the Arabic Language”) — ʿAlī al-Jārim and Muṣṭafā Amīn, vol. 1';

const KINDS={
  n:{ar:'اسْم',en:'Noun (a name)',fam:'عائلة الاسم',q:'اسْمُ شَيْءٍ؟',qEn:'Does it NAME something?',hint:'إِنْسَانٌ، حَيَوَانٌ، نَبَاتٌ، جَمَادٌ… أَوْ أَيُّ شَيْءٍ',hintEn:'a person, animal, plant, thing… or anything',

let AC=null,soundOn=true;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d=.15,type='sine',v=.18,when=0,f2){const a=ac();if(!a||!soundOn)return;const t=a.currentTime+when,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.02)}
function noise(d=.08,v=.12,when=0){const a=ac();if(!a||!soundOn)return;const b=a.createBuffer(1,a.sampleRate*d,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=(Math.random()*2-1)*(1-i/x.length);const s=a.createBufferSource(),g=a.createGain(),f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=900;s.buffer=b;g.gain.value=v;s.connect(f).connect(g).connect(a.destination);s.start(a.currentTime+when)}
const sfx={
  good:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.18,'triangle',.2,i*.09)),
  bad:()=>tone(196,.22,'sawtooth',.07),
  pop:()=>tone(660,.08,'sine',.15),
  n:()=>{tone(392,.14,'triangle',.18);tone(587,.2,'triangle',.18,.12)},          // name: "this!" — two steady notes
  v:()=>[0,1,2,3].forEach(i=>tone(300+i*80,.06,'square',.06,i*.06)),              // verb: quick running steps
  h:()=>{tone(880,.08,'sine',.15);tone(1320,.18,'sine',.12,.07)},                  // particle: a small "click-hook"
  chug:()=>{for(let i=0;i<6;i++)noise(.07,.16,i*.14);tone(740,.35,'sine',.1,.85,700);tone(932,.35,'sine',.08,.85,880)},

};

/* ---------- game flow ---------- */
function start(m){
  ac();mode=m;players=PLAYERS[pmode].map(p=>({...p,score:0}));turn=0;misses=[];teacherBonus=0;
  const src=m==='sort'?SETS[setKey].items:m==='full'?COMPLETE:m==='blank'?BLANKS:FACTORY;

  $('#home').hidden=true;$('#play').hidden=false;$('#end').hidden=true;$('#homeB').hidden=false;
  renderScores();item();
}

    <div class="playtop"><h2>${U(M.ar,M.en)}</h2>
      ${players.length>1?`<span class="pchip turn">${U('الدَّوْرُ: ','Turn: ')}${pn(players[turn])}</span>`:''}

/* ===== mode 1: word families (induction) ===== */

  else if(step==='sub'){const w=st.words[st.idx];
    ask=U(`✨ سُؤَالُ المُكَافَأَة: «${esc(w)}» اسْمُ مَاذَا؟`,`✨ Bonus question: “${esc(w)}” is the name of what?`);

      <div class="row" style="justify-content:center">${[...new Set(st.ks.map(x=>x.k))].map(k=>`<span class="move">${sign(k).replace('<svg','<svg style="width:20px;height:20px"')} ${U(KINDS[k].move,KINDS[k].moveEn)}</span>`).join('')}</div>
      <button class="ghostbtn" id="tBonus">${U('🧑‍🏫 قَرَأَهَا مَعَ الحَرَكَات ‎+١','🧑‍🏫 Read it with the movements ‎+1')}</button>
      <small style="color:var(--muted)">${U('📖 '+(it.ref.startsWith('ص')?'من أمثلة الكتاب، ج١ '+it.ref:it.ref),'📖 '+(it.ref.startsWith('ص')?'From the book’s examples, vol. 1, '+pgEn(it.ref):pgEn(it.ref)))}</small>
      ${nextBtn()}</div>`;opts=''}
  frame(`${picHTML(it)}${trainHTML(cars)}<div class="ask">${ask}</div>${opts}<div id="fb"></div>`);
  if(step==='count')$$('.opt[data-n]').forEach(b=>b.onclick=()=>{
    if(+b.dataset.n===st.words.length){b.classList.add('right');sfx.pop();st.step='sort';setTimeout(sortDraw,350)}
    else{b.classList.add('wrong');shake(b);sfx.bad();fb('bad','عُدَّ العَرَبَاتِ بِإِصْبَعِكَ: وَاحِد، اثْنَان… 👆','Count the wagons with your finger: one, two… 👆')}});
  if(step==='sort')$$('.kbtn').forEach(b=>b.onclick=()=>sortPick(b.dataset.k,b));
  if(step==='sub')$$('.opt[data-s]').forEach(b=>b.onclick=()=>{

function sortPick(k,b){

  }
}
function sortAfter(keepFb){

function checkUnlock(){

/* ===== mode 2: complete or not ===== */
function fullItem(){const it=queue[qi];st={it,step:'judge',tries:0,cars:it.ar.split(' ').map(w=>({w,st:'plain'}))};fullDraw()}
function fullDraw(extra=''){

function fullJudge(a,b){
  const it=st.it,right=a===it.ok;
  if(right){b.classList.add('right')}else{b.classList.add('wrong');shake(b);sfx.bad();st.tries++;misses.push({w:it.ar,k:it.ok?'👍':'🤷',sent:it.ok?'مفيدة':'ناقصة'})}

        extra=`<div class="fb info">${U(`🤫 كَلِمَةٌ مُخْتَبِئَة! «${esc(it.ar)}» = «${esc(it.ar)}» + «${it.hidden}» — نَفْهَمُهَا وَلَا نَقُولُهَا.`,`🤫 A hidden word! “${esc(it.en)}” = the verb + “you” — we understand it but don’t say it.`)}</div>

}

 erase:SV('<path d="M20 20H8l-5-5a2 2 0 0 1 0-2.8L12.2 3a2 2 0 0 1 2.8 0l6 6a2 2 0 0 1 0 2.8L13 20"/><path d="M6 11l7 7"/>'),
 laser:SV('<circle cx="12" cy="12" r="3" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/>'),
 undo:SV('<path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/>'),
 clear:SV('<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>'),
 board:SV('<rect x="3" y="4" width="18" height="13" rx="1"/><path d="M8 21l4-4 4 4"/>'),
 close:SV('<path d="M6 6l12 12M18 6L6 18"/>')
};
const COLORS=['#C2453A','#14374A','#2E8B5A','#2F6FB3','#C9A35A','#FFFFFF'];
const SIZES=[2.5,5,9];
const tb=document.createElement('div');tb.id='tools';tb.hidden=true;tb.setAttribute('role','toolbar');tb.setAttribute('aria-label','أدوات الكتابة');
tb.innerHTML=`
 <button data-t="none" title="تحكم في اللعبة (V / Esc)" aria-label="تحكم">${IC.hand}</button>
 <button data-t="pen" title="قلم (P)" aria-label="قلم">${IC.pen}</button>
 <button data-t="hl" title="هايلايتر (H)" aria-label="هايلايتر">${IC.hl}</button>
 <button data-t="erase" title="ممحاة (E)" aria-label="ممحاة">${IC.erase}</button>
 <button data-t="laser" title="مؤشر ليزر (L)" aria-label="مؤشر ليزر">${IC.laser}</button>
 <div class="sep"></div>
 ${COLORS.map(c=>`<button class="sw" data-c="${c}" title="لون" aria-label="لون ${c}"><i style="background:${c}"></i></button>`).join('')}
 <div class="sep"></div>
 ${SIZES.map((s,i)=>`<button class="sz" data-s="${i}" title="سُمك" aria-label="سمك ${i+1}"><i style="width:${6+i*6}px;height:${6+i*6}px"></i></button>`).join('')}
 <div class="sep"></div>
 <button data-a="undo" title="تراجع (Ctrl+Z)" aria-label="تراجع">${IC.undo}</button>
 <button data-a="clear" title="امسح الكتابة" aria-label="مسح">${IC.clear}</button>
 <button data-a="board" title="سبورة بيضاء (W)" aria-label="سبورة بيضاء">${IC.board}</button>
 <button data-a="close" title="إغلاق أدوات الكتابة (D)" aria-label="إغلاق">${IC.close}</button>`;
document.body.appendChild(tb);
const board=document.createElement('div');board.id='wbBoard';board.hidden=true;board.innerHTML='<span class="bt">سبورة بيضاء · Whiteboard</span>';document.body.appendChild(board);
const lz=document.createElement('canvas');lz.id='wbLaser';document.body.appendChild(lz);const lctx=lz.getContext('2d');
let tool='none',color=COLORS[0],sizeI=1,stage=0;
const store={},backup={};
const key=()=>stage+(board.hidden?'':'-wb');
const list=()=>store[key()]||(store[key()]=[]);
function lw(s,pr){return s.t==='hl'?s.w*5:s.w*(0.45+1.1*(pr==null?.5:pr))}
function seg(c,s,i){const p=s.pts,a=p[i-1],b=p[i];const m0=i===1?a:[(p[i-2][0]+a[0])/2,(p[i-2][1]+a[1])/2];const m1=[(a[0]+b[0])/2,(a[1]+b[1])/2];
 c.lineWidth=lw(s,(a[2]+b[2])/2);c.beginPath();c.moveTo(m0[0],m0[1]);c.quadraticCurveTo(a[0],a[1],m1[0],m1[1]);c.stroke()}
function drawStroke(c,s){const p=s.pts;if(!p.length)return;c.save();c.lineCap='round';c.lineJoin='round';c.strokeStyle=s.c;c.fillStyle=s.c;
 if(s.t==='hl'){c.globalAlpha=.35;c.lineWidth=lw(s);c.beginPath();c.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++){const m=[(p[i-1][0]+p[i][0])/2,(p[i-1][1]+p[i][1])/2];c.quadraticCurveTo(p[i-1][0],p[i-1][1],m[0],m[1])}c.lineTo(p[p.length-1][0],p[p.length-1][1]);if(p.length===1)c.lineTo(p[0][0]+.1,p[0][1]);c.stroke()}
 else{if(p.length===1){c.beginPath();c.arc(p[0][0],p[0][1],lw(s,p[0][2])/2,0,7);c.fill()}else for(let i=1;i<p.length;i++)seg(c,s,i)}
 c.restore()}
const cvs={};
function makeCanvas(host,k){
 const cv=document.createElement('canvas');cv.className='ink-cv';host.appendChild(cv);
 const o={cv,ctx:cv.getContext('2d'),w:0,h:0,k};
 o.fit=()=>{const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;o.w=r.width;o.h=r.height;cv.width=Math.max(1,Math.round(r.width*d));cv.height=Math.max(1,Math.round(r.height*d));o.ctx.setTransform(d,0,0,d,0,0);o.redraw()};
 o.redraw=extra=>{o.ctx.clearRect(0,0,o.w,o.h);(store[o.k()]||[]).forEach(s=>drawStroke(o.ctx,s));if(extra)drawStroke(o.ctx,extra)};
 bind(o);return o;
}
function stageCanvas(i){
 if(cvs[i])return cvs[i];const sec=document.getElementById('s'+i);if(!sec)return null;
 const o=makeCanvas(sec,()=>String(i));new ResizeObserver(()=>o.fit()).observe(sec);return cvs[i]=o;
}
const bcv=makeCanvas(board,()=>stage+'-wb');
const active=()=>board.hidden?stageCanvas(stage):bcv;
function redraw(){const a=active();if(a)a.redraw()}
let cur=null,erasing=false,trail=[];
function bind(o){
 const cv=o.cv;
 const pos=e=>{const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top,e.pointerType==='pen'?(e.pressure||.5):.5]};
 const eraseAt=(x,y)=>{const L=store[o.k()]||[],r=14;let ch=false;for(let i=L.length-1;i>=0;i--){if(L[i].pts.some(p=>Math.hypot(p[0]-x,p[1]-y)<r+lw(L[i],p[2])/2)){L.splice(i,1);ch=true}}if(ch)o.redraw()};
 cv.addEventListener('pointerdown',e=>{if(tool==='none')return;e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}const p=pos(e);
  erasing=tool==='erase'||e.button===5||!!(e.buttons&32);
  if(tool==='laser'){trail=[[e.clientX,e.clientY,performance.now()]];return}
  if(erasing){eraseAt(p[0],p[1]);return}
  cur={t:tool,c:color,w:SIZES[sizeI],pts:[p]};if(tool==='pen')drawStroke(o.ctx,cur)});
 cv.addEventListener('pointermove',e=>{if(tool==='none')return;const ce=e.getCoalescedEvents?e.getCoalescedEvents():[];const evs=ce.length?ce:[e];
  if(tool==='laser'){trail.push([e.clientX,e.clientY,performance.now()]);return}
  if(!e.buttons)return;
  for(const ev of evs){const p=pos(ev);if(erasing){eraseAt(p[0],p[1]);continue}if(!cur)continue;const l=cur.pts[cur.pts.length-1];if(Math.hypot(p[0]-l[0],p[1]-l[1])<1.2)continue;cur.pts.push(p);
   if(cur.t==='pen'){o.ctx.save();o.ctx.lineCap='round';o.ctx.strokeStyle=cur.c;seg(o.ctx,cur,cur.pts.length-1);o.ctx.restore()}}
  if(cur&&cur.t==='hl')o.redraw(cur)});
 const up=()=>{if(cur){(store[o.k()]||(store[o.k()]=[])).push(cur);cur=null;o.redraw()}erasing=false};
 cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
 cv.addEventListener('pointerleave',()=>{if(tool==='laser')trail.push(null)});
 cv.addEventListener('contextmenu',e=>{if(tool!=='none')e.preventDefault()});
}
function fitLaser(){const d=window.devicePixelRatio||1;lz.width=innerWidth*d;lz.height=innerHeight*d;lctx.setTransform(d,0,0,d,0,0)}
fitLaser();
(function loop(){const now=performance.now();lctx.clearRect(0,0,innerWidth,innerHeight);
 if(tool==='laser'){trail=trail.filter(p=>p&&now-p[2]<450);for(let i=1;i<trail.length;i++){const a=trail[i-1],b=trail[i],k=1-(now-b[2])/450;lctx.strokeStyle=`rgba(255,40,40,${.7*k})`;lctx.lineWidth=8*k+2;lctx.lineCap='round';lctx.beginPath();lctx.moveTo(a[0],a[1]);lctx.lineTo(b[0],b[1]);lctx.stroke()}
  const t=trail[trail.length-1];if(t){lctx.fillStyle='rgba(255,40,40,.25)';lctx.beginPath();lctx.arc(t[0],t[1],16,0,7);lctx.fill();lctx.fillStyle='#FF2A2A';lctx.beginPath();lctx.arc(t[0],t[1],7,0,7);lctx.fill()}}
 requestAnimationFrame(loop)})();
function markCurrent(){Object.entries(cvs).forEach(([i,o])=>o.cv.classList.toggle('cur',+i===stage))}
function setTool(t){tool=t;if(t!=='laser')trail=[];
 document.body.classList.toggle('ink-on',t!=='none');document.body.classList.toggle('ink-erase',t==='erase');document.body.classList.toggle('ink-laser',t==='laser');
 if(t!=='none'){const a=stageCanvas(stage);if(a&&!a.w)a.fit()}markCurrent();
 tb.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===t))}
function setColor(c){color=c;tb.querySelectorAll('.sw').forEach(b=>b.classList.toggle('on',b.dataset.c===c));if(tool==='none'||tool==='erase'||tool==='laser')setTool('pen')}
function setSize(i){sizeI=i;tb.querySelectorAll('.sz').forEach(b=>b.classList.toggle('on',+b.dataset.s===i))}
function openTools(open){tb.hidden=!open;if(open){if(tool==='none')setTool('pen')}else{setTool('none');if(!board.hidden)toggleBoard()}if(dbtn)dbtn.classList.toggle('on',open)}
function toggleBoard(){board.hidden=!board.hidden;tb.querySelector('[data-a="board"]').classList.toggle('on',!board.hidden);if(!board.hidden){bcv.fit();if(tool==='none')setTool('pen')}redraw()}
function undo(){const L=list();if(L.length)L.pop();else if(backup[key()]){store[key()]=backup[key()];delete backup[key()]}redraw()}
function clearAll(){const L=list();if(!L.length)return;backup[key()]=L.slice();store[key()]=[];redraw()}
tb.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.t)setTool(b.dataset.t);else if(b.dataset.c)setColor(b.dataset.c);else if(b.dataset.s)setSize(+b.dataset.s);
 else if(b.dataset.a==='undo')undo();else if(b.dataset.a==='clear')clearAll();else if(b.dataset.a==='board')toggleBoard();else if(b.dataset.a==='close')openTools(false)});
let dbtn=null;
document.addEventListener('lesson:stage',e=>{
 if(!dbtn){const row=document.querySelector('.top-row');if(row){dbtn=document.createElement('button');dbtn.id='drawB';dbtn.className='tbtn';dbtn.innerHTML='✏️ قلم / سبورة';dbtn.title='أدوات الكتابة (D)';
  dbtn.onclick=()=>openTools(tb.hidden);row.appendChild(dbtn)}}
 stage=e.detail;
 if(!board.hidden){board.hidden=true;tb.querySelector('[data-a="board"]').classList.remove('on')}
 if(store[String(stage)]||tool!=='none'){const o=stageCanvas(stage);if(o)requestAnimationFrame(()=>o.fit())}
 markCurrent();
});
window.addEventListener('resize',()=>{fitLaser();if(!board.hidden)bcv.fit()});
setColor(COLORS[0]);setTool('none');setSize(1);
document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;const k=e.key.toLowerCase();
 if((e.ctrlKey||e.metaKey)&&k==='z'){if(!tb.hidden){e.preventDefault();undo()}return}
 if(e.ctrlKey||e.metaKey||e.altKey)return;
 if(k==='d'){openTools(tb.hidden);return}
 if(tb.hidden&&!['p','h','w','l'].includes(k))return;
 if(k==='p'){openTools(true);setTool('pen')}else if(k==='h'){openTools(true);setTool('hl')}else if(k==='e'&&!tb.hidden)setTool('erase')
 else if(k==='l'){openTools(true);setTool('laser')}else if(k==='v'||k==='escape')setTool('none');else if(k==='w'){openTools(true);toggleBoard()}});
})();
</script>
