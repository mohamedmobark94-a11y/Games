<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="../tq-i18n.css"><script src="../tq-i18n.js"></script>

</head><body class="tq-i18n">
<title>افتح الصندوق</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Amiri:wght@400;700&display=swap">
<style>
/* Layout: a toy shelf — a grid of numbered gift boxes on a soft mint field; tapping one opens a big card in the middle. Team scores sit above the shelf. Single bright theme on purpose (kids, screen-share). */
:root{
  color-scheme:light;
  --bg:#E3F7EE;      /* mint field */
  --bg2:#C9EFDD;
  --ink:#1E2445;
  --muted:#56608A;
  --card:#FFFFFF;
  --line:#BCE3D1;
  --sun:#FFC531;
  --berry:#F2557A;
  --sea:#2F7DE1;
  --leaf:#1FAE6E;
  --grape:#8B5CF6;
  --orange:#FF8A3D;
  --teamA:#2F7DE1;
  --teamB:#F2557A;
  --f-ui:"Baloo Bhaijaan 2","Segoe UI",Tahoma,sans-serif;
  --f-ar:"Amiri","Traditional Arabic","Noto Naskh Arabic",serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);background-image:radial-gradient(circle at 10% 85%,var(--bg2) 0 80px,transparent 81px),radial-gradient(circle at 92% 12%,var(--bg2) 0 70px,transparent 71px);color:var(--ink);font-family:var(--f-ui);direction:rtl;font-size:18px;line-height:1.5}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:10px 24px;display:flex;flex-direction:column;gap:12px}
.top-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.brand{flex:1 1 220px;margin:0;font-size:1.5rem;font-weight:800;line-height:1.2}
.brand small{display:block;font-size:.8rem;font-weight:500;color:var(--muted)}
.tbtn{font:inherit;font-size:.9rem;font-weight:700;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 14px;cursor:pointer;min-height:40px}
.tbtn[aria-pressed="true"],.tbtn.on{background:var(--sea);border-color:var(--sea);color:#fff}
.en{display:none;direction:ltr;unicode-bidi:isolate;font-family:system-ui,sans-serif;font-size:.78em;color:var(--muted);font-weight:500}
body.show-en .en{display:inline}
body.show-en .en.blk{display:block}
button:focus-visible,select:focus-visible{outline:4px solid var(--sun);outline-offset:3px}

/* controls */
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--card);border-radius:18px;padding:8px 12px;border:2px solid var(--line)}
.bar label{font-weight:700;font-size:.95rem;display:flex;align-items:center;gap:6px}
.bar select{font:inherit;font-size:.95rem;border:2px solid var(--line);border-radius:12px;padding:2px 8px;background:var(--bg);color:var(--ink);min-height:40px}
.bar .grow{flex:1}

/* scores */
.teams{display:flex;gap:10px;flex-wrap:wrap}
.team{flex:1 1 200px;display:flex;align-items:center;gap:10px;background:var(--card);border:3px solid var(--line);border-radius:20px;padding:6px 14px;transition:transform .2s,border-color .2s}
.team .nm{font-weight:800;font-size:1.15rem;color:var(--tc)}
.team .pts{margin-inline-start:auto;font-weight:800;font-size:1.8rem;font-variant-numeric:tabular-nums;color:var(--tc)}
.team .turn{font-size:.8rem;font-weight:700;background:var(--tc);color:#fff;border-radius:999px;padding:0 10px;visibility:hidden}
.team.now{border-color:var(--tc);transform:scale(1.03)}
.team.now .turn{visibility:visible}

/* shelf */
#s0{position:relative;background:var(--card);border-radius:28px;border:3px solid var(--line);padding:18px}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:16px}
.box{position:relative;aspect-ratio:1/1;max-width:100%;border:0;background:none;padding:0;cursor:pointer;font:inherit;--bc:var(--sea)}
.box .body{position:absolute;inset:26% 6% 0 6%;background:var(--bc);border-radius:10px 10px 16px 16px;box-shadow:inset 0 -8px 0 rgba(0,0,0,.12)}
.box .lid{position:absolute;inset:12% 0 auto 0;height:22%;background:var(--bc);filter:brightness(1.12);border-radius:10px;box-shadow:0 4px 0 rgba(0,0,0,.12);transition:transform .45s cubic-bezier(.3,1.5,.6,1)}
.box .rib{position:absolute;left:50%;top:12%;bottom:0;width:14%;transform:translateX(-50%);background:rgba(255,255,255,.75);border-radius:3px}
.box .bow{position:absolute;left:50%;top:0;transform:translateX(-50%);font-size:1.6rem;line-height:1;transition:transform .45s}
.box .num{position:absolute;inset:44% 0 0 0;display:grid;place-items:center;font-weight:800;font-size:clamp(1.6rem,4vw,2.4rem);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.18);z-index:1}
.box:hover .lid{transform:translateY(-6px) rotate(-3deg)}
.box.opened{cursor:default}
.box.opened .lid{transform:translate(-30%,-40%) rotate(-28deg);opacity:.0}
.box.opened .bow{transform:translate(-50%,-30px);opacity:0}
.box.opened .body{filter:grayscale(.75) brightness(1.15);opacity:.45}
.box.opened .num{font-size:clamp(1.8rem,5vw,2.8rem)}
.box.shake{animation:wig .5s}
@keyframes wig{20%{transform:rotate(-8deg)}40%{transform:rotate(8deg)}60%{transform:rotate(-5deg)}80%{transform:rotate(4deg)}}

/* card overlay */
#cardWrap{position:fixed;inset:0;z-index:50;background:rgba(30,36,69,.55);display:grid;place-items:center;padding:16px}
#cardWrap[hidden]{display:none!important}
.card{position:relative;background:var(--card);border-radius:28px;width:min(640px,100%);max-height:calc(100% - 20px);overflow:auto;padding:20px 20px 18px;text-align:center;border:5px solid var(--cc,var(--sea));animation:pop .45s cubic-bezier(.3,1.5,.6,1);display:flex;flex-direction:column;gap:10px;align-items:center}
@keyframes pop{from{transform:scale(.3) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}
.card .tag{font-weight:800;font-size:.95rem;color:#fff;background:var(--cc,var(--sea));border-radius:999px;padding:2px 14px}
.card .pic{font-size:clamp(5rem,18vw,8rem);line-height:1.1}
.card .ar{font-family:var(--f-ar);font-weight:700;font-size:clamp(2.6rem,9vw,4rem);line-height:1.5}
.card .q{font-weight:800;font-size:1.3rem}
.card .hid{visibility:hidden}
.card .note{font-size:.9rem;color:var(--muted);max-width:46ch}
.card .hadith{font-family:var(--f-ar);font-size:1.5rem;line-height:1.9;background:var(--bg);border-radius:16px;padding:8px 14px}
.card .hadith small{display:block;font-family:var(--f-ui);font-size:.8rem;color:var(--muted)}
.choices{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.ch{font:inherit;min-width:110px;min-height:96px;border-radius:22px;border:3px solid var(--line);background:var(--bg);cursor:pointer;display:grid;place-items:center;padding:6px 12px;transition:transform .1s}
.ch:hover{transform:translateY(-3px);border-color:var(--sea)}
.ch.pic{font-size:3.2rem;line-height:1}
.ch.let{font-family:var(--f-ar);font-weight:700;font-size:3rem;line-height:1}
.ch.right{background:#DDF6E9;border-color:var(--leaf)}
.ch.bad{animation:shake .35s;opacity:.4}
@keyframes shake{25%{transform:translateX(6px)}75%{transform:translateX(-6px)}}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.big-btn{font:inherit;font-weight:800;font-size:1.15rem;border:0;border-radius:18px;padding:8px 22px;min-height:56px;cursor:pointer;color:#fff;background:var(--sea);box-shadow:0 5px 0 #1E5AAE;transition:transform .08s}
.big-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #1E5AAE}
.big-btn.green{background:var(--leaf);box-shadow:0 5px 0 #13824F}
.big-btn.red{background:var(--berry);box-shadow:0 5px 0 #B93558}
.big-btn.ghost{background:var(--card);color:var(--ink);border:3px solid var(--line);box-shadow:0 5px 0 var(--line)}

/* end */
.endmsg{text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;padding:20px 0}
.endmsg .trophy{font-size:5rem;line-height:1}
.endmsg h2{margin:0;font-size:2rem}

/* celebration */
.cf{position:fixed;top:-20px;width:12px;height:16px;border-radius:3px;pointer-events:none;z-index:80;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.starpop{position:fixed;top:22%;left:50%;transform:translate(-50%,-50%);font-weight:800;font-size:2rem;background:var(--card);border:4px solid var(--sun);border-radius:999px;padding:4px 24px;z-index:81;pointer-events:none;white-space:nowrap;animation:sp 1.1s ease forwards}
@keyframes sp{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}25%{opacity:1;transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-90%)}}

/* pen tools (from lesson-engine/engine.css) */
.ink-cv{position:absolute;left:0;top:0;width:100%;height:100%;z-index:45;pointer-events:none;touch-action:none}
body.ink-on .ink-cv.cur,body.ink-on #wbBoard .ink-cv{pointer-events:auto;cursor:crosshair}
body.ink-erase .ink-cv{cursor:cell!important}
body.ink-laser .ink-cv{cursor:none!important}
#wbLaser{position:fixed;inset:0;width:100%;height:100%;z-index:66;pointer-events:none}
#wbBoard{position:fixed;inset:0;z-index:60;background-color:#FDFCF8;background-image:linear-gradient(#E6ECEF 1px,transparent 1px),linear-gradient(90deg,#E6ECEF 1px,transparent 1px);background-size:40px 40px}
#wbBoard[hidden]{display:none!important}
#wbBoard .bt{position:absolute;top:calc(18px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);font:700 18px/1 var(--f-ui);color:#86662A;background:#FBF3E1;border:1px solid #EBDDBB;border-radius:20px;padding:8px 16px;z-index:2;pointer-events:none;white-space:nowrap}
#tools{position:fixed;left:10px;top:50%;transform:translateY(-50%);z-index:70;display:flex;flex-direction:column;gap:5px;background:rgba(7,23,33,.95);border:1px solid #C9A35A;border-radius:16px;padding:7px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
#tools button{width:42px;height:42px;border-radius:10px;border:1px solid #24485A;background:#12303F;color:#E8F1F5;display:grid;place-items:center;padding:0;cursor:pointer}
#tools button svg{width:22px;height:22px}
#tools button.on{background:#C9A35A;color:#0B2431;border-color:#C9A35A}
#tools .sw i{width:22px;height:22px;border-radius:50%;display:block;border:2px solid rgba(255,255,255,.6)}
#tools .sw.on{background:#24485A;border-color:#C9A35A}
#tools .sz i{display:block;border-radius:50%;background:#E8F1F5}
#tools .sep{height:1px;background:#2A5266;margin:2px 0}
#tools[hidden]{display:none!important}
@media (max-height:980px){#tools{gap:4px;padding:6px}#tools button{width:34px;height:34px}#tools button svg{width:18px;height:18px}#tools .sw i{width:18px;height:18px}}
@media (max-height:800px){#tools{flex-direction:row;flex-wrap:wrap;top:auto;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:none;max-width:calc(100% - 20px)}#tools .sep{width:1px;height:auto;margin:0 2px}}
#drawB.on{background:#C9A35A!important;color:#0B2431!important;border-color:#C9A35A!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:520px){.shelf{grid-template-columns:repeat(3,1fr);gap:10px}.ch{min-width:84px;min-height:80px}.team{flex-basis:140px}}
</style>

<div class="wrap">
  <header class="top-row">
    <h1 class="brand">افْتَحِ الصُّنْدُوق! <span class="en">Open the Box</span><small><span class="ui-ar">محمد مبارك · Mohamed Mubarak — اختر رقمًا… وافتح المفاجأة</span><span class="ui-en">Mohamed Mubarak — pick a number… and open the surprise</span></small></h1>
    <button class="tbtn" id="enB" aria-pressed="false">English</button>
    <button class="tbtn" id="sndB" aria-pressed="true"><span class="ui-ar">🔊 صوت</span><span class="ui-en">🔊 Sound</span></button>
  </header>

  <div class="bar">
    <label for="setSel"><span class="ui-ar">الدرس:</span><span class="ui-en">Lesson:</span></label><select id="setSel"></select>
    <label for="teamSel"><span class="ui-ar">اللاعبون:</span><span class="ui-en">Players:</span></label>
    <select id="teamSel"><option value="1" data-en="One student ⭐">طالب واحد ⭐</option><option value="2" selected data-en="Two teams 🔵🔴">فريقان 🔵🔴</option><option value="tv" data-en="Student vs. teacher">الطالب ضد المعلم</option></select>
    <label for="nSel"><span class="ui-ar">الصناديق:</span><span class="ui-en">Boxes:</span></label>
    <select id="nSel"><option>6</option><option>9</option><option selected>12</option><option>16</option></select>
    <span class="grow"></span>
    <button class="tbtn" id="newB"><span class="ui-ar">↻ لعبة جديدة</span><span class="ui-en">↻ New game</span></button>
  </div>

  <div class="teams" id="teams"></div>
  <section id="s0"><div class="shelf" id="shelf"></div></section>
</div>

<div id="cardWrap" hidden><div class="card" id="card" role="dialog" aria-modal="true" aria-label="Box card · بطاقة الصندوق"></div></div>

<script>
/* ============================================================
   ✏️ المحتوى — عدّل هنا فقط  (EDIT CONTENT HERE)
   نفس صيغة البيانات تصلح لأي لعبة قادمة (تطابق، بطاقات، عجلة…):
   كل عنصر = { ar: الكلمة بالتشكيل, en: المعنى, pic: إيموجي/صورة }
   لإضافة درس جديد: انسخ مجموعة وغيّر الاسم والعناصر (٤ عناصر على الأقل).
   ============================================================ */
const SETS = {
  home:    {ar:'بَيْتِي', en:'My home', items:[
    {ar:'بَاب',en:'door',pic:'🚪'},{ar:'سَرِير',en:'bed',pic:'🛏️'},{ar:'كُرْسِيّ',en:'chair',pic:'🪑'},{ar:'مِفْتَاح',en:'key',pic:'🔑'},
    {ar:'سَاعَة',en:'clock',pic:'⏰'},{ar:'مِصْبَاح',en:'lamp',pic:'💡'},{ar:'كِتَاب',en:'book',pic:'📖'},{ar:'قَلَم',en:'pen',pic:'✏️'}]},
  food:    {ar:'طَعَامِي', en:'My food', items:[
    {ar:'خُبْز',en:'bread',pic:'🍞'},{ar:'مَاء',en:'water',pic:'💧'},{ar:'تُفَّاح',en:'apple',pic:'🍎'},{ar:'مَوْز',en:'banana',pic:'🍌'},
    {ar:'حَلِيب',en:'milk',pic:'🥛'},{ar:'عِنَب',en:'grapes',pic:'🍇'},{ar:'جُبْن',en:'cheese',pic:'🧀'},{ar:'بَيْض',en:'eggs',pic:'🥚'}]},
  family:  {ar:'عَائِلَتِي', en:'My family', items:[
    {ar:'أُمّ',en:'mother',pic:'👩'},{ar:'أَب',en:'father',pic:'👨'},{ar:'أَخ',en:'brother',pic:'👦'},{ar:'أُخْت',en:'sister',pic:'👧'},
    {ar:'جَدّ',en:'grandfather',pic:'👴'},{ar:'جَدَّة',en:'grandmother',pic:'👵'},{ar:'طِفْل',en:'baby',pic:'👶'},{ar:'بَيْت',en:'house',pic:'🏠'}]},
  animals: {ar:'حَيَوَانَات', en:'Animals', items:[
    {ar:'قِطّ',en:'cat',pic:'🐈'},{ar:'أَسَد',en:'lion',pic:'🦁'},{ar:'فِيل',en:'elephant',pic:'🐘'},{ar:'جَمَل',en:'camel',pic:'🐫'},
    {ar:'سَمَكَة',en:'fish',pic:'🐟'},{ar:'بَقَرَة',en:'cow',pic:'🐄'},{ar:'حِصَان',en:'horse',pic:'🐎'},{ar:'نَحْلَة',en:'bee',pic:'🐝'}]},
};
/* صناديق مفاجأة تُخلط مع الكلمات (اتركها فارغة [] لإلغائها) */
const SPECIALS = [
  {type:'bonus', pts:2, ar:'نَجْمَتَانِ هَدِيَّة!', en:'Gift: +2 stars!', pic:'🎁'},
  {type:'move',  pts:1, ar:'قِفْ وَاقْفِزْ ٣ مَرَّات!', en:'Stand up and jump 3 times!', pic:'🤸'},
  {type:'adab',  pts:1, q:'قَبْلَ الأَكْلِ نَقُولُ…؟', qEn:'Before eating we say…?', a:'بِسْمِ اللهِ', aEn:'Bismillah (In the name of Allah)', pic:'🍽️',
     hadith:'«يَا غُلَامُ، سَمِّ اللهَ، وَكُلْ بِيَمِينِكَ، وَكُلْ مِمَّا يَلِيكَ»', ref:'صحيح البخاري ٥٣٧٦، صحيح مسلم ٢٠٢٢', refEn:'"Young boy, say Bismillah, eat with your right hand, and eat from what is in front of you." (Bukhari 5376, Muslim 2022)'},
  {type:'adab',  pts:1, q:'إِذَا لَقِيتَ صَدِيقَكَ تَقُولُ…؟', qEn:'When you meet your friend you say…?', a:'السَّلَامُ عَلَيْكُمْ', aEn:'Assalamu alaykum', pic:'🤝'},
];
const PRAISE = ['أَحْسَنْت!','مَا شَاءَ الله!','بَارَكَ اللهُ فِيك!','مُمْتَاز!'];
const PRAISE_EN = ['Well done!','Masha Allah!','Barak Allahu feek!','Excellent!'];
const BOX_COLORS = ['#2F7DE1','#F2557A','#FFB020','#1FAE6E','#8B5CF6','#FF8A3D'];
/* ============================================================ */

const $=s=>document.querySelector(s);
const {U}=TQI;
const ar=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const firstLetter=w=>{const c=w.replace(/[ً-ْٰ]/g,'')[0];return /[أإآ]/.test(c)?'ا':c};
const ALL_LETTERS='ابتثجحخدذرزسشصضطظعغفقكلمنهوي'.split('');

/* ---------- sound ---------- */
let AC=null, soundOn=true;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d=.15,type='sine',v=.18,when=0){const a=ac();if(!a||!soundOn)return;const t=a.currentTime+when,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.02)}
const sfx={open:()=>{tone(392,.1,'triangle',.18);tone(587,.12,'triangle',.18,.08);tone(784,.2,'triangle',.18,.16)},
  good:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.18,'triangle',.2,i*.09)),bad:()=>tone(196,.22,'sawtooth',.08),pop:()=>tone(660,.08,'sine',.15),
  win:()=>[523,659,784,659,784,1047].forEach((f,i)=>tone(f,.22,'triangle',.2,i*.13))};

function confetti(n=46){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  for(let i=0;i<n;i++){const c=document.createElement('i');c.className='cf';c.style.left=Math.random()*100+'vw';c.style.background=pick(BOX_COLORS);c.style.animationDuration=(1.4+Math.random()*1.4)+'s';c.style.animationDelay=(Math.random()*.3)+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),3200)}}
function praise(pts){const k=Math.floor(Math.random()*PRAISE.length);const p=document.createElement('div');p.className='starpop';p.innerHTML=`★ +${U(ar(pts),pts)} ${U(PRAISE[k],PRAISE_EN[k])}`;document.body.appendChild(p);setTimeout(()=>p.remove(),1150)}

/* ---------- state ---------- */
let teams=[], turn=0, boxes=[], openedCount=0, curBox=null, scored=false;
function teamDefs(){const v=$('#teamSel').value;
  if(v==='1')return [{nm:'⭐ نُجُومِي',en:'⭐ My stars',c:'var(--sun)'}];
  if(v==='tv')return [{nm:'🧒 الطَّالِب',en:'🧒 Student',c:'var(--teamA)'},{nm:'👨‍🏫 المُعَلِّم',en:'👨‍🏫 Teacher',c:'var(--teamB)'}];
  return [{nm:'🔵 الفَرِيقُ الأَزْرَق',en:'🔵 Blue team',c:'var(--teamA)'},{nm:'🔴 الفَرِيقُ الأَحْمَر',en:'🔴 Red team',c:'var(--teamB)'}]}
function renderTeams(){

function makeCards(n){

}

  }else if(b.type==='pick'){

  }else if(b.type==='letter'){
    const f=firstLetter(it.ar);const opts=shuffle([f,...shuffle(ALL_LETTERS.filter(x=>x!==f)).slice(0,2)]);
    h+=`<div class="pic" aria-hidden="true">${it.pic}</div><div class="ar hid" id="ansW">${it.ar} <span class="en">${it.en}</span></div>
      <div class="q">بِأَيِّ حَرْفٍ تَبْدَأ؟ <span class="en">Which letter does it start with?</span></div>
      <div class="choices">${opts.map(o=>`<button class="ch let" data-ok="${o===f}">${o}</button>`).join('')}</div>`;
  }else if(b.type==='bonus'){

  }else if(b.type==='move'){
    h+=`<div class="pic" aria-hidden="true">${b.pic}</div><div class="ar" style="font-size:clamp(2rem,7vw,3rem)">${b.ar}</div><div class="en blk">${b.en}</div>`+judge;
  }else if(b.type==='adab'){
    h+=`<div class="pic" aria-hidden="true">${b.pic}</div><div class="q" style="font-family:var(--f-ar);font-size:1.8rem">${b.q} <span class="en">${b.qEn}</span></div>
      <div class="ar hid" id="ansW" style="font-size:clamp(2rem,7vw,3rem)">${b.a} <span class="en">${b.aEn}</span></div>
      ${b.hadith?`<div class="hadith hid" id="ansH">${b.hadith}<small>${b.ref}</small><small class="en blk">${b.refEn}</small></div>`:''}
      <div class="row"><button class="big-btn ghost" id="revB">${U('👀 أَظْهِرِ الجَوَاب','👀 Show the answer')}</button></div>`+judge;
  }
  h+=`<div class="row"><button class="big-btn" id="closeB">التَّالِي ← <span class="en" style="color:#fff">Next</span></button></div>`;
  cardEl.innerHTML=h;wrapEl.hidden=false;
  const rev=()=>{['#ansW','#ansH'].forEach(s=>{const e=cardEl.querySelector(s);if(e)e.classList.remove('hid')});sfx.pop()};
  const rb=cardEl.querySelector('#revB');if(rb)rb.onclick=rev;
  const ok=cardEl.querySelector('#okB');if(ok)ok.onclick=()=>{rev();award(b.pts)};
  const no=cardEl.querySelector('#noB');if(no)no.onclick=()=>{rev();sfx.bad();lockJudge()};
  let tries=0;
  cardEl.querySelectorAll('.ch').forEach(x=>x.onclick=()=>{
    if(scored||x.classList.contains('bad'))return;
    if(x.dataset.ok==='true'){x.classList.add('right');rev();if(tries===0)award(b.pts);else{sfx.pop();scored=true}}
    else{tries++;x.classList.add('bad');sfx.bad();if(tries>=2){cardEl.querySelector('.ch[data-ok="true"]').classList.add('right');rev();scored=true}}
  });
  cardEl.querySelector('#closeB').onclick=closeCard;
  setTimeout(()=>{const cb=cardEl.querySelector('#closeB');if(cb)cb.focus({preventScroll:true})},50);
}
function lockJudge(){scored=true;const j=cardEl.querySelector('#judge');if(j)j.remove()}

function closeCard(){
  if(wrapEl.hidden)return;wrapEl.hidden=true;cardEl.innerHTML='';
  if(curBox!==null){openedCount++;curBox=null;turn=(turn+1)%teams.length;renderTeams()}
  if(openedCount&&openedCount===boxes.length)endGame();

  const max=Math.max(...teams.map(t=>t.pts));const win=teams.filter(t=>t.pts===max);
  const msg=teams.length===1?`جَمَعْتَ ${ar(max)} نُجُوم!`:win.length>1?'تَعَادُل! كُلُّكُمْ أَبْطَال':`فَازَ ${win[0].nm}!`;
  const msgEn=teams.length===1?`You collected ${max} stars!`:win.length>1?"It's a tie! You are all heroes":`${win[0].en} wins!`;
  $('#shelf').insertAdjacentHTML('afterend',`<div class="endmsg" id="endM"><div class="trophy" aria-hidden="true">🏆</div><h2>${U(msg,msgEn)}</h2><button class="big-btn green" id="againB">${U('↻ العب مرة أخرى','↻ Play again')}</button></div>`);
  $('#againB').onclick=()=>{$('#endM').remove();newGame()};
  sfx.win();confetti(90);
}

 if(s.t==='hl'){c.globalAlpha=.35;c.lineWidth=lw(s);c.beginPath();c.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++){const m=[(p[i-1][0]+p[i][0])/2,(p[i-1][1]+p[i][1])/2];c.quadraticCurveTo(p[i-1][0],p[i-1][1],m[0],m[1])}c.lineTo(p[p.length-1][0],p[p.length-1][1]);if(p.length===1)c.lineTo(p[0][0]+.1,p[0][1]);c.stroke()}

setColor(COLORS[0]);setTool('none');setSize(1);

document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;const k=e.key.toLowerCase();
 if((e.ctrlKey||e.metaKey)&&k==='z'){if(!tb.hidden){e.preventDefault();undo()}return}
 if(e.ctrlKey||e.metaKey||e.altKey)return;
 if(k==='d'){openTools(tb.hidden);return}
 if(tb.hidden&&!['p','h','w','l'].includes(k))return;
 if(k==='p'){openTools(true);setTool('pen')}else if(k==='h'){openTools(true);setTool('hl')}else if(k==='e'&&!tb.hidden)setTool('erase')
 else if(k==='l'){openTools(true);setTool('laser')}else if(k==='v'||k==='escape')setTool('none');else if(k==='w'){openTools(true);toggleBoard()}});
})();

document.dispatchEvent(new CustomEvent('lesson:stage',{detail:0}));
</script>
