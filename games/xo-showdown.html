<style>

.cell .mk{stroke-dasharray:120;stroke-dashoffset:120;animation:draw .35s ease forwards}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.tcol{--tc:var(--sky)}.ocol{--tc:var(--pink)}
.opts{display:grid;gap:10px}
.mbox .tag{align-self:center;background:var(--tc,var(--gold));color:#0E1F2E;font-weight:800;border-radius:999px;padding:0 14px}

function pickQuestion(){

  if(t==='letters'){const L=LET[Math.floor(Math.random()*LET.length)];const others=shuffle(LET.filter(x=>x!==L)).slice(0,2);const opts=shuffle([L,...others]);

function say(ar,en){$('#msg').innerHTML=U(ar,en)}
function newRound(){board=Array(9).fill(null);over=false;busy=false;turn=starter;$('#again').hidden=true;drawTeams();drawBoard();say(turn==='X'?'دَوْرُ الأَزْرَقِ ❌':'دَوْرُ الوَرْدِيِّ ⭕',turn==='X'?'Blue team’s turn ❌':'Pink team’s turn ⭕');if($('#oppSel').value==='ai'){say(turn==='X'?'دَوْرُكَ ❌':'دَوْرُ الكُمْبِيُوتَر ⭕',turn==='X'?'Your turn ❌':'Computer’s turn ⭕')}if(turn==='O'&&$('#oppSel').value==='ai')setTimeout(aiMove,700)}
function winner(b){for(const l of LINES){if(b[l[0]]&&b[l[0]]===b[l[1]]&&b[l[0]]===b[l[2]])return {p:b[l[0]],l}}return null}
function place(i,p){board[i]=p;sfx.tap();const w=winner(board);
  if(w){over=true;score[w.p]++;drawBoard(w.l);drawTeams();const ai=$('#oppSel').value==='ai';say(ai?(w.p==='X'?'🎉 فُزْتَ!':'🤖 فَازَ الكُمْبِيُوتَر!'):(w.p==='X'?'🎉 فَازَ الفَرِيقُ الأَزْرَق!':'🎉 فَازَ الفَرِيقُ الوَرْدِيّ!'),ai?(w.p==='X'?'🎉 You win!':'🤖 The computer wins!'):(w.p==='X'?'🎉 Blue team wins!':'🎉 Pink team wins!'));if(w.p==='X'||$('#oppSel').value!=='ai'){confetti();sfx.win()}else sfx.bad();finish();return}
  if(board.every(Boolean)){over=true;score.D++;drawBoard();drawTeams();say('🤝 تَعَادُل! أَحْسَنْتُمْ','🤝 A draw! Well played');finish();return}
  turn=p==='X'?'O':'X';drawBoard();drawTeams();
  const ai=$('#oppSel').value==='ai';say(turn==='X'?(ai?'دَوْرُكَ ❌':'دَوْرُ الأَزْرَقِ ❌'):(ai?'دَوْرُ الكُمْبِيُوتَر ⭕':'دَوْرُ الوَرْدِيِّ ⭕'),turn==='X'?(ai?'Your turn ❌':'Blue team’s turn ❌'):(ai?'Computer’s turn ⭕':'Pink team’s turn ⭕'));
  if(ai&&turn==='O')setTimeout(aiMove,700);
}
function finish(){starter=starter==='X'?'O':'X';$('#again').hidden=false}
/* computer: easy = random with a block; hard = unbeatable minimax */
function minimax(b,p,me){const w=winner(b);if(w)return w.p===me?10:-10;if(b.every(Boolean))return 0;let best=p===me?-99:99;
  for(let i=0;i<9;i++)if(!b[i]){b[i]=p;const s=minimax(b,p==='X'?'O':'X',me);b[i]=null;best=p===me?Math.max(best,s):Math.min(best,s)}return best}
function bestMove(){let best=-99,mv=[];for(let i=0;i<9;i++)if(!board[i]){board[i]='O';const s=minimax(board,'X','O');board[i]=null;if(s>best){best=s;mv=[i]}else if(s===best)mv.push(i)}return mv[Math.floor(Math.random()*mv.length)]}
function easyMove(){const e=[];board.forEach((v,i)=>{if(!v)e.push(i)});for(const l of LINES){const c=l.map(i=>board[i]);if(c.filter(x=>x==='O').length===2&&c.includes(null))return l[c.indexOf(null)]}for(const l of LINES){const c=l.map(i=>board[i]);if(c.filter(x=>x==='X').length===2&&c.includes(null)&&Math.random()<.7)return l[c.indexOf(null)]}return e[Math.floor(Math.random()*e.length)]}
function aiMove(){if(over)return;const quiz=$('#modeSel').value==='quiz',hard=$('#lvlSel').value==='hard';
  if(quiz&&Math.random()>(hard?.85:.6)){say('🤖 الكُمْبِيُوتَر أَخْطَأَ فِي السُّؤَالِ! دَوْرُكَ ❌','🤖 The computer got the question wrong! Your turn ❌');sfx.bad();turn='X';drawTeams();return}
  place(hard?bestMove():easyMove(),'O')}
function askQuestion(i){busy=true;drawBoard();const Q=pickQuestion(),p=turn;
  const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div class="mbox" style="--tc:${p==='X'?'var(--sky)':'var(--pink)'}"><span class="tag">${p==='X'?'❌':'⭕'} ${U(...names()[p])}</span><div class="q">${U(Q.q.ar,Q.q.en)}</div><div class="opts">${Q.o.map((o,k)=>`<button class="opt" data-k="${k}">${U(o.ar,o.en)}</button>`).join('')}</div></div>`;
  document.body.appendChild(m);let done=false;
  m.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(done)return;done=true;const ok=+b.dataset.k===Q.a;b.classList.add(ok?'right':'wrong');m.querySelectorAll('.opt')[Q.a].classList.add('right');ok?sfx.ok():sfx.bad();
    setTimeout(()=>{m.remove();busy=false;if(ok){place(i,p)}else{const ai=$('#oppSel').value==='ai';turn=p==='X'?'O':'X';drawBoard();drawTeams();say('✗ إِجَابَةٌ خَاطِئَة، يَنْتَقِلُ الدَّوْر','✗ Wrong answer — the turn passes');if(ai&&turn==='O')setTimeout(aiMove,900)}},900)})}
$('#board').onclick=e=>{const c=e.target.closest('.cell');if(!c||over||busy)return;const i=+c.dataset.i;if(board[i])return;if($('#oppSel').value==='ai'&&turn==='O')return;
  if($('#modeSel').value==='quiz')askQuestion(i);else place(i,turn)};
$('#again').onclick=newRound;$('#newB').onclick=()=>{score={X:0,O:0,D:0};starter='X';newRound()};
$('#oppSel').onchange=()=>{$('#lvlWrap').hidden=$('#oppSel').value!=='ai';score={X:0,O:0,D:0};starter='X';newRound()};
$('#modeSel').onchange=newRound;
$('#sndB').onclick=()=>{soundOn=!soundOn;$('#sndB').innerHTML=soundOn?U('🔊 صوت','🔊 Sound'):U('🔇 بدون صوت','🔇 Muted');$('#sndB').setAttribute('aria-pressed',soundOn)};
TQI.relabel();newRound();

</script>
