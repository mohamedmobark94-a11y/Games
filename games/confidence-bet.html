<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="../tq-i18n.css"><script src="../tq-i18n.js"></script>
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body class="tq-i18n">
<title>رهان الثقة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Amiri:wght@400;700&display=swap">
<style>
/* Layout: a "game show" desk for teens — navy stage, gold coins. Scoreboard on top, one big question card in the middle:
   choose answer → bet 1/2/3 coins on how sure you are → lock in → proof card + discussion question.
   Single dark theme on purpose (teen look, screen-share). */
:root{
  color-scheme:dark;
  --bg:#0E1F2E; --bg2:#13293C; --card:#173450; --card2:#1D4062;
  --ink:#F3F6FA; --muted:#A9BBCC; --line:#2B5274;
  --gold:#F2C14E; --gold2:#C99A2E; --teal:#2EC4B6; --coral:#FF6B6B; --sky:#4DA8FF; --lime:#7BD88F; --violet:#A98BFF;
  --teamA:#4DA8FF; --teamB:#FF8A5B;
  --f-ui:"Baloo Bhaijaan 2","Segoe UI",Tahoma,sans-serif;
  --f-ar:"Amiri","Traditional Arabic","Noto Naskh Arabic",serif;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);background-image:radial-gradient(ellipse at 50% -10%,#1F4A70 0,transparent 60%);color:var(--ink);font-family:var(--f-ui);direction:rtl;font-size:18px;line-height:1.5}
.wrap{max-width:1000px;margin:0 auto;padding-inline:16px;padding-block:10px 28px;display:flex;flex-direction:column;gap:12px}
.top-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.brand{flex:1 1 240px;margin:0;font-size:1.55rem;font-weight:800;line-height:1.2}
.brand b{color:var(--gold)}
.brand small{display:block;font-size:.8rem;font-weight:500;color:var(--muted)}
.tbtn{font:inherit;font-size:.9rem;font-weight:700;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 14px;cursor:pointer;min-height:40px}
.tbtn[aria-pressed="true"],.tbtn.on{background:var(--gold);border-color:var(--gold);color:#1B1B1B}
.tbtn:disabled{opacity:.4;cursor:not-allowed}
.en{display:none;direction:ltr;unicode-bidi:isolate;font-family:system-ui,sans-serif;font-size:.8em;color:var(--muted);font-weight:500}
body.show-en .en{display:inline}
body.show-en .en.blk{display:block}
button:focus-visible,select:focus-visible{outline:4px solid var(--gold);outline-offset:3px}

.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--bg2);border-radius:18px;padding:8px 12px;border:2px solid var(--line)}
.bar label{font-weight:700;font-size:.95rem}
.bar select{font:inherit;font-size:.95rem;border:2px solid var(--line);border-radius:12px;padding:2px 8px;background:var(--card);color:var(--ink);min-height:40px;max-width:100%}
.bar .grow{flex:1}

/* scoreboard */
.teams{display:flex;gap:10px;flex-wrap:wrap}
.team{flex:1 1 200px;display:flex;align-items:center;gap:10px;background:var(--card);border:3px solid var(--line);border-radius:20px;padding:6px 14px;transition:transform .2s,border-color .2s}
.team .nm{font-weight:800;font-size:1.1rem;color:var(--tc)}
.team .coins{margin-inline-start:auto;font-weight:800;font-size:1.8rem;font-variant-numeric:tabular-nums;color:var(--gold);display:flex;align-items:center;gap:4px}
.team .turn{font-size:.8rem;font-weight:700;background:var(--tc);color:#0E1F2E;border-radius:999px;padding:0 10px;visibility:hidden}
.team.now{border-color:var(--tc);transform:scale(1.03)}
.team.now .turn{visibility:visible}
.team .coins.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.35)}}
.prog{display:flex;justify-content:space-between;align-items:center;font-weight:700;color:var(--muted);font-size:.95rem;gap:8px;flex-wrap:wrap}
.prog .track{flex:1 1 200px;height:10px;background:var(--bg2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.prog .track i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--gold));width:0;transition:width .4s}

/* question stage */
#s0{position:relative;background:var(--card);border-radius:26px;border:3px solid var(--line);padding:18px;min-height:420px}
#qa{display:flex;flex-direction:column;gap:14px}
.qhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tag{font-weight:800;font-size:.9rem;border-radius:999px;padding:2px 14px;background:var(--tg,var(--teal));color:#0E1F2E}
.tag.again{background:var(--violet)}
.q{font-family:var(--f-ar);font-weight:700;font-size:clamp(1.5rem,4.2vw,2.1rem);line-height:1.7;margin:0}
.q .pic{font-family:var(--f-ui);margin-inline-end:6px}
.q .en{font-family:system-ui,sans-serif;font-size:.55em;font-weight:500;line-height:1.4;display:none;margin-top:4px}
body.show-en .q .en{display:block}
.opts{display:grid;gap:10px}
.opt{font:inherit;text-align:start;display:flex;gap:12px;align-items:center;min-height:62px;padding:8px 14px;border-radius:18px;border:3px solid var(--line);background:var(--bg2);color:var(--ink);cursor:pointer;transition:transform .1s,border-color .15s,background .15s}
.opt .k{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:800;background:var(--card2);color:var(--gold)}
.opt .t{font-family:var(--f-ar);font-size:1.35rem;font-weight:700;line-height:1.6}
.opt .t .en{font-family:system-ui,sans-serif;font-size:.65em;display:none}
body.show-en .opt .t .en{display:block}
.opt:hover:not(:disabled){transform:translateX(-4px);border-color:var(--sky)}
.opt.sel{border-color:var(--gold);background:#2A3E2E;background:color-mix(in srgb,var(--gold) 16%,var(--bg2))}
.opt.right{border-color:var(--lime);background:color-mix(in srgb,var(--lime) 22%,var(--bg2))}
.opt.wrong{border-color:var(--coral);background:color-mix(in srgb,var(--coral) 20%,var(--bg2))}
.opt.gone{opacity:.25;text-decoration:line-through;pointer-events:none}
.opt:disabled{cursor:default}
.opt.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(6px)}75%{transform:translateX(-6px)}}

/* power-ups + bet */
.panel{display:flex;flex-wrap:wrap;gap:12px;align-items:stretch;justify-content:space-between}
.box{background:var(--bg2);border:2px dashed var(--line);border-radius:18px;padding:8px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;flex:1 1 280px}
.box h3{margin:0;font-size:.95rem;width:100%;color:var(--muted)}
.pu,.bet{font:inherit;font-weight:800;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);padding:4px 12px;min-height:48px;cursor:pointer;display:flex;align-items:center;gap:6px}
.pu small,.bet small{font-weight:600;color:var(--gold);font-size:.85rem}
.pu.on{border-color:var(--violet);background:color-mix(in srgb,var(--violet) 25%,var(--card))}
.pu:disabled,.bet:disabled{opacity:.35;cursor:not-allowed}
.bet{flex:1 1 90px;flex-direction:column;gap:0;justify-content:center;min-height:64px}
.bet .c{font-size:1.4rem;line-height:1.1}
.bet.sel{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 22%,var(--card));transform:translateY(-2px)}
.hint{font-family:var(--f-ar);font-size:1.15rem;background:color-mix(in srgb,var(--violet) 18%,var(--bg2));border-radius:14px;padding:6px 12px;border:1px solid var(--violet)}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.big-btn{font:inherit;font-weight:800;font-size:1.15rem;border:0;border-radius:18px;padding:8px 24px;min-height:56px;cursor:pointer;color:#0E1F2E;background:var(--gold);box-shadow:0 5px 0 var(--gold2);transition:transform .08s}
.big-btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--gold2)}
.big-btn:disabled{opacity:.35;cursor:not-allowed}
.big-btn.teal{background:var(--teal);box-shadow:0 5px 0 #1B8F85}
.big-btn.ghost{background:var(--card2);color:var(--ink);box-shadow:0 5px 0 var(--line)}

/* result */
.result{display:flex;flex-direction:column;gap:10px;animation:pop .4s cubic-bezier(.3,1.5,.6,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
.verdict{font-weight:800;font-size:1.4rem;text-align:center}
.verdict.good{color:var(--lime)} .verdict.bad{color:var(--coral)}
.proof{font-family:var(--f-ar);font-size:1.55rem;line-height:1.9;background:var(--bg2);border-inline-start:6px solid var(--gold);border-radius:14px;padding:8px 16px}
.proof small{display:block;font-family:var(--f-ui);font-size:.85rem;color:var(--gold)}
.proof .en{font-size:.6em;line-height:1.5}
.talk{background:color-mix(in srgb,var(--teal) 15%,var(--bg2));border:2px solid var(--teal);border-radius:14px;padding:8px 14px;font-weight:700}
.talk b{color:var(--teal)}

/* end */
.endmsg{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.endmsg .trophy{font-size:4.5rem;line-height:1}
.endmsg h2{margin:0;font-size:2rem;color:var(--gold)}
table.cal{border-collapse:collapse;width:min(560px,100%);font-size:1rem}
table.cal th,table.cal td{border:1px solid var(--line);padding:6px 8px;text-align:center}
table.cal th{background:var(--bg2);color:var(--muted)}

.cf{position:fixed;top:-20px;width:11px;height:15px;border-radius:3px;pointer-events:none;z-index:80;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.starpop{position:fixed;top:22%;left:50%;transform:translate(-50%,-50%);font-weight:800;font-size:1.8rem;background:var(--card);color:var(--gold);border:4px solid var(--gold);border-radius:999px;padding:4px 24px;z-index:81;pointer-events:none;white-space:nowrap;animation:sp 1.2s ease forwards}
@keyframes sp{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}25%{opacity:1;transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-90%)}}

/* English mode: Latin face for English text, Arabic content keeps its own face */
body.show-en .q,body.show-en .opt .t,body.show-en .hint,body.show-en .talk{font-family:var(--f-ui)}
body.show-en .opt:hover:not(:disabled){transform:translateX(4px)}
body.show-en .proof .qar{display:block}
body.show-en .proof .tr{font-size:.62em;color:var(--ink);opacity:.85}
/* pen tools (from lesson-engine/engine.css) */
.ink-cv{position:absolute;left:0;top:0;width:100%;height:100%;z-index:45;pointer-events:none;touch-action:none}
body.ink-on .ink-cv.cur,body.ink-on #wbBoard .ink-cv{pointer-events:auto;cursor:crosshair}
body.ink-erase .ink-cv{cursor:cell!important}
body.ink-laser .ink-cv{cursor:none!important}
#wbLaser{position:fixed;inset:0;width:100%;height:100%;z-index:66;pointer-events:none}
#wbBoard{position:fixed;inset:0;z-index:60;background-color:#FDFCF8;background-image:linear-gradient(#E6ECEF 1px,transparent 1px),linear-gradient(90deg,#E6ECEF 1px,transparent 1px);background-size:40px 40px}
#wbBoard[hidden]{display:none!important}
#wbBoard .bt{position:absolute;top:calc(18px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);font:700 18px/1 var(--f-ui);color:#86662A;background:#FBF3E1;border:1px solid #EBDDBB;border-radius:20px;padding:8px 16px;z-index:2;pointer-events:none;white-space:nowrap}
#tools{position:fixed;left:10px;top:50%;transform:translateY(-50%);z-index:70;display:flex;flex-direction:column;gap:5px;background:rgba(7,23,33,.95);border:1px solid #C9A35A;border-radius:16px;padding:7px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
#tools button{width:42px;height:42px;border-radius:10px;border:1px solid #24485A;background:#12303F;color:#E8F1F5;display:grid;place-items:center;padding:0;cursor:pointer}
#tools button svg{width:22px;height:22px}
#tools button.on{background:#C9A35A;color:#0B2431;border-color:#C9A35A}
#tools .sw i{width:22px;height:22px;border-radius:50%;display:block;border:2px solid rgba(255,255,255,.6)}
#tools .sw.on{background:#24485A;border-color:#C9A35A}
#tools .sz i{display:block;border-radius:50%;background:#E8F1F5}
#tools .sep{height:1px;background:#2A5266;margin:2px 0}
#tools[hidden]{display:none!important}
@media (max-height:980px){#tools{gap:4px;padding:6px}#tools button{width:34px;height:34px}#tools button svg{width:18px;height:18px}#tools .sw i{width:18px;height:18px}}
@media (max-height:800px){#tools{flex-direction:row;flex-wrap:wrap;top:auto;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:none;max-width:calc(100% - 20px)}#tools .sep{width:1px;height:auto;margin:0 2px}}
#drawB.on{background:#C9A35A!important;color:#0B2431!important;border-color:#C9A35A!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:520px){#s0{padding:12px}.opt .t{font-size:1.15rem}.team{flex-basis:140px}.team .coins{font-size:1.4rem}}
</style>

<div class="wrap">
  <header class="top-row">
    <h1 class="brand"><span class="ui-ar">رِهَانُ <b>الثِّقَة</b></span><span class="ui-en">Confidence <b>Bet</b></span> 🪙<small><span class="ui-ar">ترتيل القرآن — اختر الجواب… ثم راهن على ثقتك</span><span class="ui-en">Tarteel Al-Quran — pick an answer… then bet on how sure you are</span></small></h1>
    <button class="tbtn" id="enB" aria-pressed="false">English</button>
    <button class="tbtn" id="sndB" aria-pressed="true"><span class="ui-ar">🔊 صوت</span><span class="ui-en">🔊 Sound</span></button>
  </header>

  <div class="bar">
    <label for="setSel" data-en="Lesson:">الدرس:</label><select id="setSel"></select>
    <label for="teamSel" data-en="Players:">اللاعبون:</label>
    <select id="teamSel"><option value="1" data-en="One student">طالب واحد</option><option value="2" selected data-en="Two teams">فريقان</option><option value="tv" data-en="Student vs. teacher">الطالب ضد المعلم</option></select>
    <label for="nSel" data-en="Questions:">الأسئلة:</label>
    <select id="nSel"><option>6</option><option selected>8</option><option>10</option><option>12</option></select>
    <span class="grow"></span>
    <button class="tbtn" id="newB" data-en="↻ New game">↻ لعبة جديدة</button>
  </div>

  <div class="teams" id="teams"></div>
  <div class="prog"><span id="progT"></span><span class="track"><i id="progI"></i></span><span id="queueT"></span></div>
  <section id="s0"><div id="qa" aria-live="polite"></div></section>
</div>

<script>
/* ============================================================
   ✏️ المحتوى — عدّل هنا فقط  (EDIT CONTENT HERE)

   (أ) QUIZ = أسئلة مواقف بثلاثة اختيارات. كل سؤال:
     { pic, q, qEn, opts:[٣ اختيارات], optsEn:[...], a: رقم الصحيح (0 = الأول),
       topic, topicEn (اسم الموضوع — يُستعمل في وضع «أين الدليل؟»),
       proof (الآية/الحديث بالتشكيل), ref (المصدر), proofEn (الترجمة),
       talk, talkEn (سؤال نقاش بعد الإجابة) }
     ✦ كل مجموعة QUIZ تعطيك لعبتين تلقائيًا: «الموقف» و«أين الدليل؟».

   (ب) SETS = نفس «صيغة المحتوى الموحّدة» لكل ألعابنا:
     { ar:'اسم الدرس', en:'Lesson', items:[ {ar:'الكلمة بالتشكيل', en:'meaning', pic:'إيموجي'} ] }
     ✦ أي مجموعة كلمات من «افتح الصندوق» تُلصق هنا كما هي فتصير أسئلة معاني.
   ============================================================ */
const QUIZ = {
  teen: {ar:'مَوَاقِفُ الشَّبَاب', en:'Teen life choices', items:[
    {pic:'📝', q:'صَدِيقُكَ يَطْلُبُ أَنْ يَنْقُلَ إِجَابَاتِكَ فِي الاِمْتِحَان. مَاذَا تَفْعَل؟', qEn:'Your friend wants to copy your answers in the exam. What do you do?',
     opts:['أَرْفُضُ بِلُطْف، وَأَعْرِضُ أَنْ أُذَاكِرَ مَعَهُ بَعْدَ ذَلِك','أُعْطِيهِ الإِجَابَاتِ لِأَنَّهُ صَدِيقِي','أَتَجَاهَلُهُ ثُمَّ أَحْكِي لِلْجَمِيعِ عَنْه'],
     optsEn:['Say no kindly, and offer to study with him later','Give him the answers — he is my friend','Ignore him, then tell everyone about it'], a:0,
     topic:'الغِشّ', topicEn:'Cheating',
     proof:'«مَنْ غَشَّنَا فَلَيْسَ مِنَّا»', ref:'صحيح مسلم (١٠١)', proofEn:'"Whoever cheats us is not one of us." (Muslim 101)',
     talk:'كَيْفَ تَرْفُضُ وَتَبْقَى صَدِيقَه؟', talkEn:'How can you say no and still stay friends?'},
    {pic:'🎮', q:'أَنْتَ تَلْعَبُ عَلَى الجِهَاز، وَأُمُّكَ تُنَادِيكَ لِتُسَاعِدَهَا.', qEn:'You are gaming and your mother calls you to help her.',
     opts:['أُوقِفُ اللُّعْبَةَ وَأَذْهَبُ إِلَيْهَا فَوْرًا','أَقُولُ: «دَقِيقَة!» وَأُكْمِلُ سَاعَة','أَتَأَفَّفُ بِصَوْتٍ عَالٍ ثُمَّ أَذْهَب'],
     optsEn:['Pause the game and go to her right away','Say "one minute!" and keep playing for an hour','Sigh loudly, then go'], a:0,
     topic:'بِرُّ الوَالِدَيْن', topicEn:'Kindness to parents',
     proof:'﴿وَبِالْوَالِدَيْنِ إِحْسَانًا … فَلَا تَقُلْ لَهُمَا أُفٍّ وَلَا تَنْهَرْهُمَا﴾', ref:'سورة الإسراء: ٢٣', proofEn:'"…and be good to parents… do not say to them even \'uff\', and do not shout at them." (Al-Isra 17:23)',
     talk:'مَا الفَرْقُ بَيْنَ «أُفّ» وَالتَّأَفُّفِ بِالوَجْهِ؟', talkEn:'Is a bored face or eye-roll also like saying "uff"?'},
    {pic:'💬', q:'فِي مَجْمُوعَةِ الدَّرْدَشَة، أَصْحَابُكَ يَتَكَلَّمُونَ عَنْ زَمِيلٍ غَائِبٍ بِسُوء.', qEn:'In the group chat, your friends say bad things about a classmate who is not there.',
     opts:['أُغَيِّرُ المَوْضُوعَ أَوْ أُدَافِعُ عَنْه','أُرْسِلُ «😂» فَقَط، لَمْ أَقُلْ شَيْئًا','أُضِيفُ قِصَّةً أُخْرَى عَنْه'],
     optsEn:['Change the topic or defend him','Just send "😂" — I didn\'t say anything','Add another story about him'], a:0,
     topic:'الغِيبَة', topicEn:'Backbiting',
     proof:'﴿وَلَا يَغْتَبْ بَعْضُكُمْ بَعْضًا﴾', ref:'سورة الحجرات: ١٢', proofEn:'"…and do not backbite one another." (Al-Hujurat 49:12)',
     talk:'هَلِ الضَّحِكُ عَلَى الغِيبَةِ مُشَارَكَةٌ فِيهَا؟ لِمَاذَا؟', talkEn:'Is laughing at backbiting a way of joining in? Why?'},
    {pic:'⏰', q:'نِمْتَ وَلَمْ تَسْتَيْقِظْ لِصَلَاةِ الفَجْرِ إِلَّا بَعْدَ طُلُوعِ الشَّمْس.', qEn:'You overslept and woke up after sunrise — Fajr time is over.',

const $=s=>document.querySelector(s);
const ar=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

/* reference line: 'سورة الإسراء: ٢٣' → Al-Isra 17:23 ; 'صحيح مسلم (١٠١)' → Sahih Muslim 101 */
const refE=r=>/^سورة /.test(r)?TQI.ref(r.replace(/^سورة /,'')):r.replace('صحيح البخاري','Sahih al-Bukhari').replace('صحيح مسلم','Sahih Muslim').replace('سنن الترمذي','Sunan at-Tirmidhi').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace('،',',').replace(/\s*\(([\d]+)\)/g,' $1');
const noRef=e=>String(e||'').replace(/\s*\([^()]*\)\s*$/,'');

/* ---------- sound ---------- */
let AC=null, soundOn=true;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d=.15,type='sine',v=.18,when=0){const a=ac();if(!a||!soundOn)return;const t=a.currentTime+when,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.02)}
const sfx={coin:()=>{tone(988,.08,'square',.08);tone(1319,.18,'square',.08,.07)},lock:()=>{tone(220,.08,'square',.1);tone(330,.1,'square',.1,.08)},
  good:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.18,'triangle',.2,i*.09)),bad:()=>{tone(220,.2,'sawtooth',.08);tone(165,.3,'sawtooth',.08,.15)},pop:()=>tone(660,.08,'sine',.15),
  win:()=>[523,659,784,659,784,1047].forEach((f,i)=>tone(f,.22,'triangle',.2,i*.13))};
function confetti(n=40){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const cols=['#F2C14E','#2EC4B6','#4DA8FF','#FF6B6B','#A98BFF'];
  for(let i=0;i<n;i++){const c=document.createElement('i');c.className='cf';c.style.left=Math.random()*100+'vw';c.style.background=cols[i%cols.length];c.style.animationDuration=(1.4+Math.random()*1.4)+'s';c.style.animationDelay=(Math.random()*.3)+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),3200)}}
function pop(html){const p=document.createElement('div');p.className='starpop';p.innerHTML=html;document.body.appendChild(p);setTimeout(()=>p.remove(),1250)}

/* ---------- question builders (one content → several game types) ---------- */
function situationQs(set){return set.items.map((it,i)=>({id:'s'+i,kind:'sit',pic:it.pic,q:it.q,qEn:it.qEn,
  opts:it.opts.map((t,k)=>({t,en:(it.optsEn||[])[k]||'',ok:k===it.a})),proof:it.proof,ref:it.ref,refEn:refE(it.ref),proofEn:it.proofEn,talk:it.talk,talkEn:it.talkEn,hint:it.topic,hintEn:it.topicEn}))}
function proofQs(set){const its=set.items;return its.map((it,i)=>{const others=shuffle(its.filter(x=>x!==it)).slice(0,2);
  return {id:'p'+i,kind:'proof',pic:'📜',q:`<span class="qar">${it.proof}</span><small style="display:block;font-size:.6em">هَذَا الدَّلِيلُ عَنْ أَيِّ مَوْضُوع؟</small>`,qEn:`<span class="qar">${it.proof}</span>${tr(noRef(it.proofEn))}<small style="display:block;font-size:.6em">Which topic does this proof belong to?</small>`,
    opts:[it,...others].map(x=>({t:x.topic,en:x.topicEn||'',ok:x===it})),proof:it.proof,ref:it.ref,refEn:refE(it.ref),proofEn:it.proofEn,talk:it.talk,talkEn:it.talkEn,hint:it.ref,hintEn:refE(it.ref)}})}
function wordQs(set){const its=set.items;return its.map((it,i)=>{const others=shuffle(its.filter(x=>x!==it)).slice(0,2);const rev=i%2===1;
  return rev
    ? {id:'w'+i,kind:'word',pic:it.pic,q:`أَيُّ كَلِمَةٍ مَعْنَاهَا: <span dir="ltr">“${it.en}”</span>؟`,qEn:`Which word means “${it.en}”?`,opts:[it,...others].map(x=>({t:x.ar,en:'',ok:x===it})),
       proof:`${it.ar} = <span dir="ltr">${it.en}</span>`,ref:set.ar,refEn:set.en,proofEn:'',talk:'اسْتَعْمِلِ الكَلِمَةَ فِي جُمْلَةٍ قَصِيرَة.',talkEn:'Use the word in a short sentence.',hint:it.pic,hintEn:''}
    : {id:'w'+i,kind:'word',pic:it.pic,q:`مَا مَعْنَى «${it.ar}»؟`,qEn:`What does “<span class="qar">${it.ar}</span>” mean?`,opts:[it,...others].map(x=>({t:`<span dir="ltr">${x.en}</span>`,en:'',ok:x===it})),
       proof:`${it.ar} = <span dir="ltr">${it.en}</span>`,ref:set.ar,refEn:set.en,proofEn:'',talk:'اسْتَعْمِلِ الكَلِمَةَ فِي جُمْلَةٍ قَصِيرَة.',talkEn:'Use the word in a short sentence.',hint:it.pic,hintEn:''}})}
const MODES=[];

function teamDefs(){const v=$('#teamSel').value;
  if(v==='1')return [{nm:'🪙 رَصِيدِي',en:'🪙 My coins',c:'var(--gold)'}];
  if(v==='tv')return [{nm:'🧑‍🎓 الطَّالِب',en:'🧑‍🎓 Student',c:'var(--teamA)'},{nm:'👨‍🏫 المُعَلِّم',en:'👨‍🏫 Teacher',c:'var(--teamB)'}];
  return [{nm:'🔵 الفَرِيقُ الأَزْرَق',en:'🔵 Blue team',c:'var(--teamA)'},{nm:'🟠 الفَرِيقُ البُرْتُقَالِيّ',en:'🟠 Orange team',c:'var(--teamB)'}]}
function renderTeams(bumpI){
  $('#teams').innerHTML=teams.map((t,i)=>`<div class="team ${i===turn?'now':''}" style="--tc:${t.c}"><span class="nm">${U(t.nm,t.en)}</span><span class="turn">${U('دَوْرُك','Your turn')}</span><span class="coins ${i===bumpI?'bump':''}">🪙 ${nb(t.coins)}</span></div>`).join('');
}
function renderProg(){$('#progT').innerHTML=U(`السُّؤَال ${ar(Math.min(asked+1,total))} مِنْ ${ar(total)}`,`Question ${Math.min(asked+1,total)} of ${total}`);$('#progI').style.width=(asked/total*100)+'%';
  const r=queue.filter(q=>q.again).length;$('#queueT').innerHTML=r?U(`🔁 ${ar(r)} سُؤَال سَيَرْجِع`,`🔁 ${r} to come back`):''}
function newGame(){
  const mode=MODES.find(m=>m.k===$('#setSel').value)||MODES[0];
  const all=shuffle(mode.build());
  total=Math.min(+$('#nSel').value,all.length);
  queue=all.slice(0,total).map(q=>({...q,opts:shuffle(q.opts)}));
  teams=teamDefs().map(t=>({...t,coins:START_COINS,log:[]}));turn=0;asked=0;
  renderTeams();showQ();
}

   </div>
   <div class="row"><button class="big-btn" id="lockB" disabled>${U('🔒 ثَبِّتِ الإِجَابَة','🔒 Lock in my answer')}</button></div>`;
  stage.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(locked)return;ac();sel=+b.dataset.i;stage.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',x===b));sfx.pop();upd()});
  stage.querySelectorAll('.bet').forEach(b=>b.onclick=()=>{if(locked)return;ac();bet=+b.dataset.b;stage.querySelectorAll('.bet').forEach(x=>x.classList.toggle('sel',x===b));sfx.coin();upd()});
  stage.querySelectorAll('.pu').forEach(b=>b.onclick=()=>buy(b.dataset.p,b));
  $('#lockB').onclick=lockIn;
  upd();
  document.dispatchEvent(new CustomEvent('lesson:stage',{detail:0}));
}
function upd(){
  const t=teams[turn];
  stage.querySelectorAll('.bet').forEach(b=>{const n=+b.dataset.b;b.disabled=locked||(n>1&&n>t.coins)});   // bet 1 is always allowed, even with 0 coins
  stage.querySelectorAll('.pu').forEach(b=>{const p=POWERUPS.find(x=>x.id===b.dataset.p);b.disabled=locked||used[p.id]||t.coins<p.cost;b.classList.toggle('on',!!used[p.id])});
  if(bet>1&&bet>t.coins){bet=0;stage.querySelectorAll('.bet').forEach(x=>x.classList.remove('sel'))}
  $('#lockB').disabled=locked||sel<0||!bet;
}
function buy(id,btn){
  const t=teams[turn],p=POWERUPS.find(x=>x.id===id);if(locked||used[id]||t.coins<p.cost)return;ac();
  t.coins-=p.cost;used[id]=true;sfx.coin();renderTeams(turn);
  if(id==='cut'){const wrong=cur.opts.map((o,i)=>i).filter(i=>!cur.opts[i].ok);const k=wrong[Math.floor(Math.random()*wrong.length)];
    const el=stage.querySelector(`.opt[data-i="${k}"]`);el.classList.add('gone');el.classList.remove('sel');if(sel===k)sel=-1}
  if(id==='hint'){$('#hintBox').innerHTML=`<div class="hint">💡 ${cur.hintEn?U(cur.hint,cur.hintEn):cur.hint}</div>`}
  if(id==='x2'){pop('✖️'+U('٢ الرِّبْحُ مُضَاعَف!','2 — your winnings are doubled!'))}
  upd();
}
function lockIn(){
  if(locked||sel<0||!bet)return;locked=true;sfx.lock();
  const t=teams[turn],ok=cur.opts[sel].ok,gain=ok?bet*(used.x2?2:1):-bet;
  t.coins=Math.max(0,t.coins+gain);t.log.push({bet,ok});asked++;
  stage.querySelectorAll('.opt').forEach((b,i)=>{b.disabled=true;if(cur.opts[i].ok)b.classList.add('right');else if(i===sel){b.classList.add('wrong','shake')}});
  if(!ok&&!cur.again){const back={...cur,again:true,opts:shuffle(cur.opts)};queue.splice(Math.min(RETRY_GAP-1,queue.length),0,back);total=Math.min(total+1,asked+queue.length)}
  upd();
  setTimeout(()=>{
    if(ok){sfx.good();confetti();const k=Math.floor(Math.random()*PRAISE.length);pop(`🪙 +${nb(gain)} ${U(PRAISE[k],PRAISE_EN[k])}`)}else{sfx.bad();pop(`🪙 −${nb(bet)}`)}
    renderTeams(turn);renderProg();
    $('#panel').remove();$('#lockB').parentElement.remove();$('#hintBox').innerHTML='';
    stage.insertAdjacentHTML('beforeend',`<div class="result">
      <div class="verdict ${ok?'good':'bad'}">${ok?U(`✓ صَحِيح! رَبِحْتَ ${ar(gain)} 🪙`,`✓ Correct! You won ${gain} 🪙`):U(`✗ لَيْسَتْ هَذِهِ — خَسِرْتَ ${ar(bet)} 🪙 ${cur.again?'':'(سَيَرْجِعُ السُّؤَالُ لَاحِقًا 🔁)'}`,`✗ Not this one — you lost ${bet} 🪙${cur.again?'':' (this question will come back later 🔁)'}`)}</div>
      <div class="proof">📖 <span class="qar">${cur.proof}</span>${cur.proofEn?tr(noRef(cur.proofEn)):''}<small>${U(cur.ref,cur.refEn||cur.ref)}</small></div>
      <div class="talk"><b>${U('💬 نِقَاش:','💬 Discuss:')}</b> ${U(cur.talk,cur.talkEn)}</div>
      <div class="row"><button class="big-btn teal" id="nextB">${U('التَّالِي ←','Next →')}</button></div></div>`);
    $('#nextB').onclick=()=>{turn=(turn+1)%teams.length;renderTeams();showQ()};
    $('#nextB').focus({preventScroll:true});
  },550);
}

/* ---------- end + confidence report ---------- */
function endGame(){
  renderProg();$('#progI').style.width='100%';$('#progT').innerHTML=U('انْتَهَتِ الجَوْلَة!','Round complete!');
  const max=Math.max(...teams.map(t=>t.coins)),win=teams.filter(t=>t.coins===max);
  const msg=teams.length===1?`رَصِيدُكَ النِّهَائِيّ: ${ar(max)} 🪙`:win.length>1?'تَعَادُل! أَحْسَنْتُمْ جَمِيعًا':`فَازَ ${win[0].nm}!`;
  const msgEn=teams.length===1?`Final balance: ${max} 🪙`:win.length>1?"It's a tie! Well done, everyone":`${win[0].en} wins!`;
  const rows=BETS.map(b=>`<tr><td>🪙 ${nb(b.n)} — ${U(b.ar,b.en)}</td>${teams.map(t=>{const L=t.log.filter(x=>x.bet===b.n),r=L.filter(x=>x.ok).length;return `<td>${L.length?U(`${ar(r)} / ${ar(L.length)}`,`${r} / ${L.length}`):'—'}</td>`}).join('')}</tr>`).join('');
  stage.innerHTML=`<div class="endmsg"><div class="trophy" aria-hidden="true">🏆</div><h2>${U(msg,msgEn)}</h2>
    <h3 style="margin:6px 0 0">${U('🎯 تَقْرِيرُ الثِّقَة: هَلْ كُنْتَ وَاثِقًا فِي المَكَانِ الصَّحِيح؟','🎯 Confidence report: were you sure about the right answers? (correct / bets at each level)')}</h3>
    <table class="cal"><tr><th>${U('الرَّهَان','Bet')}</th>${teams.map(t=>`<th>${U(t.nm,t.en)}</th>`).join('')}</tr>${rows}</table>
    <p style="color:var(--muted);max-width:52ch;margin:0">${U('إِذَا أَخْطَأْتَ وَأَنْتَ «مُتَأَكِّدٌ ١٠٠٪» فَهَذَا أَهَمُّ شَيْءٍ نُرَاجِعُهُ الحِصَّةَ القَادِمَة.','Wrong answers you were “100% sure” about are the most important thing to review in the next lesson.')}</p>
    <button class="big-btn teal" id="againB">${U('↻ العَبْ مَرَّةً أُخْرَى','↻ Play again')}</button></div>`;
  $('#againB').onclick=newGame;sfx.win();confetti(90);
  document.dispatchEvent(new CustomEvent('lesson:stage',{detail:0}));
}

/* ---------- setup ---------- */
$('#setSel').innerHTML=MODES.map(m=>`<option value="${m.k}" data-ar="${m.ar}" data-en="${m.en}">${m.ar}</option>`).join('');TQI.relabel();
['#setSel','#teamSel','#nSel'].forEach(s=>$(s).onchange=newGame);
$('#newB').onclick=newGame;
$('#enB').onclick=()=>{const on=document.body.classList.toggle('show-en');$('#enB').setAttribute('aria-pressed',on)};
TQI.auto();
$('#sndB').onclick=()=>{soundOn=!soundOn;$('#sndB').innerHTML=soundOn?U('🔊 صوت','🔊 Sound'):U('🔇 بدون صوت','🔇 Muted');$('#sndB').setAttribute('aria-pressed',soundOn)};
document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||document.body.classList.contains('ink-on'))return;
  if(e.key==='Enter'){const n=$('#nextB')||(!$('#lockB')?.disabled&&$('#lockB'));if(n){e.preventDefault();n.click()}}});
newGame();
</script>
<script>
(function(){
// Pen tools + whiteboard, ported from the "عينك أمانة" deck to the scrolling lesson pages.
// Ink lives inside each station (scrolls with the text); the whiteboard is a full-screen grid board.
const SV=p=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const IC={
 hand:SV('<path d="M7 11V5a1.5 1.5 0 0 1 3 0v5M10 10V3.5a1.5 1.5 0 0 1 3 0V10M13 10V4.5a1.5 1.5 0 0 1 3 0V12M16 9.5a1.5 1.5 0 0 1 3 0V15a7 7 0 0 1-7 7h-1a6 6 0 0 1-5-3l-2.5-4.5a1.5 1.5 0 0 1 2.6-1.5L7 15"/>'),
 pen:SV('<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>'),
 hl:SV('<path d="M9 11l-6 6v3h9l3-3"/><path d="M22 12l-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/>'),
 erase:SV('<path d="M20 20H8l-5-5a2 2 0 0 1 0-2.8L12.2 3a2 2 0 0 1 2.8 0l6 6a2 2 0 0 1 0 2.8L13 20"/><path d="M6 11l7 7"/>'),
 laser:SV('<circle cx="12" cy="12" r="3" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/>'),
 undo:SV('<path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/>'),
 clear:SV('<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>'),
 board:SV('<rect x="3" y="4" width="18" height="13" rx="1"/><path d="M8 21l4-4 4 4"/>'),
 close:SV('<path d="M6 6l12 12M18 6L6 18"/>')
};
const COLORS=['#C2453A','#14374A','#2E8B5A','#2F6FB3','#C9A35A','#FFFFFF'];
const SIZES=[2.5,5,9];

// toolbar
const tb=document.createElement('div');tb.id='tools';tb.hidden=true;tb.setAttribute('role','toolbar');tb.setAttribute('aria-label','أدوات الكتابة');
tb.innerHTML=`
 <button data-t="none" title="تحكم في الدرس (V / Esc)" aria-label="تحكم في الدرس">${IC.hand}</button>
 <button data-t="pen" title="قلم (P)" aria-label="قلم">${IC.pen}</button>
 <button data-t="hl" title="هايلايتر لتظليل الكلمات (H)" aria-label="هايلايتر">${IC.hl}</button>
 <button data-t="erase" title="ممحاة (E)" aria-label="ممحاة">${IC.erase}</button>
 <button data-t="laser" title="مؤشر ليزر (L)" aria-label="مؤشر ليزر">${IC.laser}</button>
 <div class="sep"></div>
 ${COLORS.map(c=>`<button class="sw" data-c="${c}" title="لون" aria-label="لون ${c}"><i style="background:${c}"></i></button>`).join('')}
 <div class="sep"></div>
 ${SIZES.map((s,i)=>`<button class="sz" data-s="${i}" title="سُمك" aria-label="سمك ${i+1}"><i style="width:${6+i*6}px;height:${6+i*6}px"></i></button>`).join('')}
 <div class="sep"></div>
 <button data-a="undo" title="تراجع (Ctrl+Z)" aria-label="تراجع">${IC.undo}</button>
 <button data-a="clear" title="امسح كتابة هذه المحطة" aria-label="مسح">${IC.clear}</button>
 <button data-a="board" title="سبورة بيضاء (W)" aria-label="سبورة بيضاء">${IC.board}</button>
 <button data-a="close" title="إغلاق أدوات الكتابة (D)" aria-label="إغلاق">${IC.close}</button>`;
document.body.appendChild(tb);

// whiteboard overlay + laser layer
const board=document.createElement('div');board.id='wbBoard';board.hidden=true;board.innerHTML='<span class="bt">سبورة بيضاء · Whiteboard</span>';document.body.appendChild(board);
const lz=document.createElement('canvas');lz.id='wbLaser';document.body.appendChild(lz);const lctx=lz.getContext('2d');

let tool='none',color=COLORS[0],sizeI=1,stage=0;
const store={},backup={};
const key=()=>stage+(board.hidden?'':'-wb');
const list=()=>store[key()]||(store[key()]=[]);

function lw(s,pr){return s.t==='hl'?s.w*5:s.w*(0.45+1.1*(pr==null?.5:pr))}
function seg(c,s,i){const p=s.pts,a=p[i-1],b=p[i];const m0=i===1?a:[(p[i-2][0]+a[0])/2,(p[i-2][1]+a[1])/2];const m1=[(a[0]+b[0])/2,(a[1]+b[1])/2];
 c.lineWidth=lw(s,(a[2]+b[2])/2);c.beginPath();c.moveTo(m0[0],m0[1]);c.quadraticCurveTo(a[0],a[1],m1[0],m1[1]);c.stroke()}
function drawStroke(c,s){const p=s.pts;if(!p.length)return;c.save();c.lineCap='round';c.lineJoin='round';c.strokeStyle=s.c;c.fillStyle=s.c;
 if(s.t==='hl'){c.globalAlpha=.35;c.lineWidth=lw(s);c.beginPath();c.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++){const m=[(p[i-1][0]+p[i][0])/2,(p[i-1][1]+p[i][1])/2];c.quadraticCurveTo(p[i-1][0],p[i-1][1],m[0],m[1])}c.lineTo(p[p.length-1][0],p[p.length-1][1]);if(p.length===1)c.lineTo(p[0][0]+.1,p[0][1]);c.stroke()}
 else{if(p.length===1){c.beginPath();c.arc(p[0][0],p[0][1],lw(s,p[0][2])/2,0,7);c.fill()}else for(let i=1;i<p.length;i++)seg(c,s,i)}
 c.restore()}

// canvases: one per station + one on the board
const cvs={};
function makeCanvas(host,k){
 const cv=document.createElement('canvas');cv.className='ink-cv';host.appendChild(cv);
 const o={cv,ctx:cv.getContext('2d'),w:0,h:0,k};
 o.fit=()=>{const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;o.w=r.width;o.h=r.height;cv.width=Math.max(1,Math.round(r.width*d));cv.height=Math.max(1,Math.round(r.height*d));o.ctx.setTransform(d,0,0,d,0,0);o.redraw()};
 o.redraw=extra=>{o.ctx.clearRect(0,0,o.w,o.h);(store[o.k()]||[]).forEach(s=>drawStroke(o.ctx,s));if(extra)drawStroke(o.ctx,extra)};
 bind(o);return o;
}
function stageCanvas(i){
 if(cvs[i])return cvs[i];const sec=document.getElementById('s'+i);if(!sec)return null;
 const o=makeCanvas(sec,()=>String(i));new ResizeObserver(()=>o.fit()).observe(sec);return cvs[i]=o;
}
const bcv=makeCanvas(board,()=>stage+'-wb');
const active=()=>board.hidden?stageCanvas(stage):bcv;
function redraw(){const a=active();if(a)a.redraw()}

let cur=null,erasing=false,trail=[];
function bind(o){
 const cv=o.cv;
 const pos=e=>{const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top,e.pointerType==='pen'?(e.pressure||.5):.5]};
 const eraseAt=(x,y)=>{const L=store[o.k()]||[],r=14;let ch=false;for(let i=L.length-1;i>=0;i--){if(L[i].pts.some(p=>Math.hypot(p[0]-x,p[1]-y)<r+lw(L[i],p[2])/2)){L.splice(i,1);ch=true}}if(ch)o.redraw()};
 cv.addEventListener('pointerdown',e=>{if(tool==='none')return;e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}const p=pos(e);
  erasing=tool==='erase'||e.button===5||!!(e.buttons&32);
  if(tool==='laser'){trail=[[e.clientX,e.clientY,performance.now()]];return}
  if(erasing){eraseAt(p[0],p[1]);return}
  cur={t:tool,c:color,w:SIZES[sizeI],pts:[p]};if(tool==='pen')drawStroke(o.ctx,cur)});
 cv.addEventListener('pointermove',e=>{if(tool==='none')return;const ce=e.getCoalescedEvents?e.getCoalescedEvents():[];const evs=ce.length?ce:[e];
  if(tool==='laser'){trail.push([e.clientX,e.clientY,performance.now()]);return}
  if(!e.buttons)return;
  for(const ev of evs){const p=pos(ev);if(erasing){eraseAt(p[0],p[1]);continue}if(!cur)continue;const l=cur.pts[cur.pts.length-1];if(Math.hypot(p[0]-l[0],p[1]-l[1])<1.2)continue;cur.pts.push(p);
   if(cur.t==='pen'){o.ctx.save();o.ctx.lineCap='round';o.ctx.strokeStyle=cur.c;seg(o.ctx,cur,cur.pts.length-1);o.ctx.restore()}}
  if(cur&&cur.t==='hl')o.redraw(cur)});
 const up=()=>{if(cur){(store[o.k()]||(store[o.k()]=[])).push(cur);cur=null;o.redraw()}erasing=false};
 cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
 cv.addEventListener('pointerleave',()=>{if(tool==='laser')trail.push(null)});
 cv.addEventListener('contextmenu',e=>{if(tool!=='none')e.preventDefault()});
}

function fitLaser(){const d=window.devicePixelRatio||1;lz.width=innerWidth*d;lz.height=innerHeight*d;lctx.setTransform(d,0,0,d,0,0)}
fitLaser();
(function loop(){const now=performance.now();lctx.clearRect(0,0,innerWidth,innerHeight);
 if(tool==='laser'){trail=trail.filter(p=>p&&now-p[2]<450);for(let i=1;i<trail.length;i++){const a=trail[i-1],b=trail[i],k=1-(now-b[2])/450;lctx.strokeStyle=`rgba(255,40,40,${.7*k})`;lctx.lineWidth=8*k+2;lctx.lineCap='round';lctx.beginPath();lctx.moveTo(a[0],a[1]);lctx.lineTo(b[0],b[1]);lctx.stroke()}
  const t=trail[trail.length-1];if(t){lctx.fillStyle='rgba(255,40,40,.25)';lctx.beginPath();lctx.arc(t[0],t[1],16,0,7);lctx.fill();lctx.fillStyle='#FF2A2A';lctx.beginPath();lctx.arc(t[0],t[1],7,0,7);lctx.fill()}}
 requestAnimationFrame(loop)})();

function markCurrent(){Object.entries(cvs).forEach(([i,o])=>o.cv.classList.toggle('cur',+i===stage))}
function setTool(t){tool=t;if(t!=='laser')trail=[];
 document.body.classList.toggle('ink-on',t!=='none');document.body.classList.toggle('ink-erase',t==='erase');document.body.classList.toggle('ink-laser',t==='laser');
 if(t!=='none'){const a=stageCanvas(stage);if(a&&!a.w)a.fit()}markCurrent();
 tb.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===t))}
function setColor(c){color=c;tb.querySelectorAll('.sw').forEach(b=>b.classList.toggle('on',b.dataset.c===c));if(tool==='none'||tool==='erase'||tool==='laser')setTool('pen')}
function setSize(i){sizeI=i;tb.querySelectorAll('.sz').forEach(b=>b.classList.toggle('on',+b.dataset.s===i))}
function openTools(open){tb.hidden=!open;if(open){if(tool==='none')setTool('pen')}else{setTool('none');if(!board.hidden)toggleBoard()}if(dbtn)dbtn.classList.toggle('on',open)}
function toggleBoard(){board.hidden=!board.hidden;tb.querySelector('[data-a="board"]').classList.toggle('on',!board.hidden);if(!board.hidden){bcv.fit();if(tool==='none')setTool('pen')}redraw()}
function undo(){const L=list();if(L.length)L.pop();else if(backup[key()]){store[key()]=backup[key()];delete backup[key()]}redraw()}
function clearAll(){const L=list();if(!L.length)return;backup[key()]=L.slice();store[key()]=[];redraw()}
tb.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.t)setTool(b.dataset.t);else if(b.dataset.c)setColor(b.dataset.c);else if(b.dataset.s)setSize(+b.dataset.s);
 else if(b.dataset.a==='undo')undo();else if(b.dataset.a==='clear')clearAll();else if(b.dataset.a==='board')toggleBoard();else if(b.dataset.a==='close')openTools(false)});

let dbtn=null;
document.addEventListener('lesson:stage',e=>{
 if(!dbtn){const row=document.querySelector('.top-row');if(row){dbtn=document.createElement('button');dbtn.id='drawB';dbtn.className='tbtn';dbtn.innerHTML='✏️ قلم / سبورة';dbtn.title='أدوات الكتابة (D)';
  dbtn.onclick=()=>openTools(tb.hidden);row.appendChild(dbtn)}}
 stage=e.detail;
 if(!board.hidden){board.hidden=true;tb.querySelector('[data-a="board"]').classList.remove('on')}
 if(store[String(stage)]||tool!=='none'){const o=stageCanvas(stage);if(o)requestAnimationFrame(()=>o.fit())}
 markCurrent();
});
window.addEventListener('resize',()=>{fitLaser();if(!board.hidden)bcv.fit()});
setColor(COLORS[0]);setTool('none');setSize(1);

document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;const k=e.key.toLowerCase();
 if((e.ctrlKey||e.metaKey)&&k==='z'){if(!tb.hidden){e.preventDefault();undo()}return}
 if(e.ctrlKey||e.metaKey||e.altKey)return;
 if(k==='d'){openTools(tb.hidden);return}
 if(tb.hidden&&!['p','h','w','l'].includes(k))return;
 if(k==='p'){openTools(true);setTool('pen')}else if(k==='h'){openTools(true);setTool('hl')}else if(k==='e'&&!tb.hidden)setTool('erase')
 else if(k==='l'){openTools(true);setTool('laser')}else if(k==='v'||k==='escape')setTool('none');else if(k==='w'){openTools(true);toggleBoard()}});
})();

document.dispatchEvent(new CustomEvent('lesson:stage',{detail:0}));
</script>
