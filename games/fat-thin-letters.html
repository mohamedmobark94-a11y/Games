<!doctype html><html lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>السمين والنحيف</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Amiri:wght@400;700&display=swap">
<style>
/* Bright kids theme (one light theme on purpose: screen-share + touch). 🐡 puffy = heavy (orange) · 🐭 skinny = light (blue) */
:root{
  color-scheme:light;
  --bg:#FFF8EC; --bg2:#FFEFD2; --card:#FFFFFF; --ink:#2A2140; --muted:#6F6585; --line:#F1DDB8;
  --gold:#F2B705; --gold2:#B07F00; --good:#22A45D; --bad:#E63946; --blue:#3A86FF;
  --teamA:#3A86FF; --teamB:#EF476F;
  --fat:#E36414; --fat-bg:#FFE8D2; --thin:#2F6FD6; --thin-bg:#E3EEFF;
  --f-ui:"Baloo Bhaijaan 2","Segoe UI",Tahoma,sans-serif;
  --f-ar:"Amiri","Traditional Arabic","Noto Naskh Arabic",serif;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg) radial-gradient(circle at 90% 0,#FFE3B3 0,transparent 40%) no-repeat;color:var(--ink);font-family:var(--f-ui);direction:rtl;font-size:18px;line-height:1.5}
.wrap{max-width:1150px;margin:0 auto;padding-inline:16px;padding-block:10px 28px;display:flex;flex-direction:column;gap:12px}
.top-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.brand{flex:1 1 260px;margin:0;font-size:1.6rem;font-weight:800;line-height:1.2}
.brand .f{color:var(--fat)} .brand .t{color:var(--thin)}
.brand small{display:block;font-size:.8rem;font-weight:500;color:var(--muted)}
.tbtn{font:inherit;font-size:.9rem;font-weight:700;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 14px;cursor:pointer;min-height:40px}
.tbtn[aria-pressed="true"],.tbtn.on{background:var(--gold);border-color:var(--gold);color:#2A2140}
.en{display:none;direction:ltr;unicode-bidi:isolate;font-family:system-ui,sans-serif;font-size:.8em;color:var(--muted);font-weight:500}
body.show-en .en{display:inline}
body.show-en .en.blk{display:block}
button:focus-visible,select:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--card);border-radius:18px;padding:8px 12px;border:2px solid var(--line)}
.bar label{font-weight:700;font-size:.95rem}
.bar select{font:inherit;font-size:.95rem;border:2px solid var(--line);border-radius:12px;padding:2px 8px;background:var(--bg);color:var(--ink);min-height:40px;max-width:100%}
.bar .grow{flex:1}
.modes{display:flex;gap:8px;flex-wrap:wrap}
.mode{font:inherit;font-weight:800;font-size:1rem;border:3px solid var(--line);background:var(--card);color:var(--ink);border-radius:18px;padding:4px 14px;cursor:pointer;min-height:48px;flex:1 1 200px}
.mode[aria-pressed="true"]{border-color:var(--fat);background:var(--fat-bg)}
.teams{display:flex;gap:10px;flex-wrap:wrap}
.team{flex:1 1 200px;display:flex;align-items:center;gap:10px;background:var(--card);border:3px solid var(--line);border-radius:20px;padding:6px 14px;transition:transform .2s,border-color .2s}
.team .nm{font-weight:800;font-size:1.1rem;color:var(--tc)}
.team .pts{margin-inline-start:auto;font-weight:800;font-size:1.7rem;color:var(--gold2);font-variant-numeric:tabular-nums}
.team .turn{font-size:.8rem;font-weight:700;background:var(--tc);color:#fff;border-radius:999px;padding:0 10px;visibility:hidden}
.team.now{border-color:var(--tc);transform:scale(1.02)}
.team.now .turn{visibility:visible}

#s0{position:relative;overflow:hidden;border:3px solid var(--line);border-radius:26px;padding:14px;min-height:460px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;background:linear-gradient(#FFFDF7,#FFF4E0)}
#s0 > *:not(.ink-cv){position:relative;z-index:2}
.prog{font-weight:700;color:var(--muted);font-size:.95rem;align-self:stretch;display:flex;justify-content:space-between;gap:8px}
.q{font-weight:800;font-size:1.2rem}
.tip{font-size:.95rem;color:var(--muted);max-width:66ch}
.book{font-size:.82rem;color:var(--muted);text-align:center}

/* intro posters */
.posters{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;align-self:stretch}
.poster{border-radius:20px;padding:8px 12px;border:3px solid var(--cc);background:var(--cb);color:var(--ink);display:flex;flex-direction:column;gap:2px;align-items:center}
.poster.fat{--cc:var(--fat);--cb:var(--fat-bg)} .poster.thin{--cc:var(--thin);--cb:var(--thin-bg)}
.poster .big{font-size:3.4rem;line-height:1.1}
.poster .h{font-weight:800;color:var(--cc);font-size:1.25rem}
.poster .ls{font-family:var(--f-ar);font-size:1.7rem;font-weight:700;letter-spacing:.1em;line-height:1.6}
.poster .bq{font-family:var(--f-ar);font-size:1.1rem}
.poster .pose{font-size:.92rem}

/* word card */
.wcard{background:#fff;color:var(--ink);border:4px solid var(--gold);border-radius:26px;box-shadow:0 8px 0 #E7C66B;padding:6px 30px 10px;animation:pop .35s;max-width:100%;position:relative}
.wcard .w{font-family:var(--f-ar);font-weight:700;font-size:clamp(3rem,10vw,5.6rem);line-height:1.5;direction:rtl;white-space:nowrap}
.wcard .w.long{font-size:clamp(2.2rem,7.5vw,4.2rem);white-space:normal}
.wcard .meta{font-size:.9rem;color:var(--muted)}
.stopb{position:absolute;top:-14px;inset-inline-end:14px;background:var(--bad);color:#fff;border-radius:999px;padding:0 12px;font-weight:800;font-size:.95rem}
.tg{color:#2E8B5A;transition:color .5s,text-shadow .5s}
.tg.fat{color:var(--fat);text-shadow:0 0 16px #FFB774}
.tg.thin{color:var(--thin)}
.look{font-size:.95rem;background:var(--bg2);color:var(--ink);border-radius:14px;padding:2px 12px;max-width:66ch}

.choices{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-self:stretch}
.ch{font:inherit;flex:1 1 220px;max-width:360px;border:4px solid var(--cc);background:var(--cb);color:var(--ink);border-radius:24px;padding:8px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;box-shadow:0 6px 0 var(--cc);min-height:120px}
.ch .emo{font-size:3rem;line-height:1.1}
.ch .nm{font-weight:800;font-size:1.3rem;color:var(--cc)}
.ch .ds{font-size:.9rem}
.ch.fat{--cc:var(--fat);--cb:var(--fat-bg)}
.ch.thin{--cc:var(--thin);--cb:var(--thin-bg)}
.ch:active{transform:translateY(3px);box-shadow:0 3px 0 var(--cc)}
.ch.bad{animation:shake .4s;opacity:.45}
.ch.right{outline:5px solid var(--good);outline-offset:3px}
.ch.right .emo{animation:jump .5s 3}
.ch:disabled{cursor:default}

/* mouth meter */
.mouth{align-self:stretch;display:flex;align-items:center;gap:12px;justify-content:center;flex-wrap:wrap}
.mouth .who{font-size:3rem;line-height:1;transition:transform .6s cubic-bezier(.3,1.6,.5,1)}
.mouth.fat .who{transform:scale(1.55)} .mouth.thin .who{transform:scale(.8)}
.meter{width:min(320px,70vw);height:26px;border-radius:999px;background:#EEE6D6;overflow:hidden;border:2px solid var(--line)}
.meter i{display:block;height:100%;width:0;border-radius:999px;transition:width .9s ease}
.mouth.fat .meter i{width:100%;background:linear-gradient(90deg,#FFB774,var(--fat))}
.mouth.thin .meter i{width:22%;background:var(--thin)}
.mouth .lbl{font-weight:800}

.info{align-self:stretch;text-align:start;background:var(--bg2);color:var(--ink);border-inline-start:8px solid var(--hc,var(--gold));border-radius:16px;padding:8px 14px;animation:pop .35s}
.info .t{font-weight:800}
.info .kid{font-size:1.05rem}
.info .bq{font-family:var(--f-ar);font-size:1.25rem;line-height:1.8}
.info small{display:block;color:var(--gold2);font-weight:700}
.tpr{align-self:stretch;background:#fff;color:var(--ink);border:3px dashed var(--hc);border-radius:16px;padding:6px 12px;font-weight:700;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.tpr .emo{font-size:2.2rem}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.big-btn{font:inherit;font-weight:800;font-size:1.1rem;border:0;border-radius:16px;padding:6px 22px;min-height:52px;cursor:pointer;color:#fff;background:var(--blue);box-shadow:0 5px 0 #1F5FC4}
.big-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #1F5FC4}
.big-btn.green{background:var(--good);box-shadow:0 5px 0 #157A42}
.big-btn.red{background:var(--bad);box-shadow:0 5px 0 #A3222D}
.big-btn.orange{background:var(--fat);box-shadow:0 5px 0 #A84A0E}
.big-btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:0 5px 0 var(--line)}
.big-btn .en{color:inherit;opacity:.85}

/* memory */
.grid{display:grid;gap:10px;align-self:stretch;grid-template-columns:repeat(var(--cols,4),1fr);max-width:820px;margin-inline:auto;width:100%}
.card{font:inherit;aspect-ratio:3/3.4;border:0;border-radius:18px;cursor:pointer;perspective:800px;background:transparent;padding:0;position:relative}
.card .in{position:absolute;inset:0;transition:transform .45s;transform-style:preserve-3d}
.card.up .in,.card.done .in{transform:rotateY(180deg)}
.card .fc,.card .bk{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center}
.card .bk{background:repeating-linear-gradient(45deg,#FFC94D 0 14px,#FFB703 14px 28px);border:4px solid #fff;box-shadow:0 5px 0 #E0A100;font-size:2.2rem;color:#fff;font-weight:800}
.card .fc{transform:rotateY(180deg);background:#fff;border:4px solid var(--gold);box-shadow:0 5px 0 #E7C66B}
.card .fc .p{font-size:clamp(1.8rem,6vw,2.8rem);line-height:1.1}
.card .fc .wd{font-family:var(--f-ar);font-weight:700;font-size:clamp(1.5rem,5vw,2.4rem);line-height:1.4}
.card .fc .me{font-size:.75rem;color:var(--muted)}
.card.done .fc{border-color:var(--good);opacity:.55}
.card.nope .fc{animation:shake .4s}
.pairbox{align-self:stretch;display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;animation:pop .35s}
.pairbox .side{border-radius:20px;padding:6px 10px;border:3px solid var(--cc);background:var(--cb)}
.pairbox .side.fat{--cc:var(--fat);--cb:var(--fat-bg)} .pairbox .side.thin{--cc:var(--thin);--cb:var(--thin-bg)}
.pairbox .wd{font-family:var(--f-ar);font-weight:700;font-size:clamp(2.2rem,7vw,3.6rem);line-height:1.4}
.pairbox .vs{font-size:2rem}
.pairbox .side .tag{font-weight:800;color:var(--cc)}

/* balloons */
.ladder{display:flex;gap:10px;align-items:flex-end;justify-content:center;align-self:stretch;min-height:190px;flex-wrap:wrap}
.slot{width:110px;height:180px;border:3px dashed var(--line);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:4px;position:relative}
.slot .rk{font-size:.8rem;font-weight:800;color:var(--muted)}
.bal{--s:1;width:calc(46px + 18px*var(--s));height:calc(56px + 20px*var(--s));border-radius:50% 50% 48% 48%;background:radial-gradient(circle at 35% 30%,#FFD9B8,var(--fat) 70%);display:grid;place-items:center;color:#fff;font-family:var(--f-ar);font-weight:700;font-size:calc(1.1rem + .25rem*var(--s));position:relative;margin-bottom:14px;animation:pop .4s}
.bal::after{content:"";position:absolute;bottom:-14px;left:50%;width:2px;height:14px;background:#B9A88A}
.pick{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.pk{font:inherit;font-family:var(--f-ar);font-weight:700;font-size:2.2rem;min-width:96px;min-height:80px;border-radius:20px;border:4px solid var(--fat);background:#fff;color:var(--ink);cursor:pointer;box-shadow:0 5px 0 var(--fat)}
.pk.used{visibility:hidden}
.pk.bad{animation:shake .4s}

.endmsg{display:flex;flex-direction:column;gap:8px;align-items:center;align-self:stretch}
.endmsg .trophy{font-size:4.5rem;line-height:1}
.endmsg h2{margin:0;font-size:1.9rem;color:var(--gold2)}
.miss{font-family:var(--f-ar);font-size:1.8rem;line-height:1.7}

@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{25%{transform:translateX(7px)}75%{transform:translateX(-7px)}}
@keyframes jump{50%{transform:translateY(-16px) scale(1.1)}}
.cf{position:fixed;top:-20px;width:11px;height:15px;border-radius:3px;pointer-events:none;z-index:80;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.starpop{position:fixed;top:22%;left:50%;transform:translate(-50%,-50%);font-weight:800;font-size:1.8rem;background:var(--card);color:var(--ink);border:4px solid var(--gold);border-radius:999px;padding:4px 24px;z-index:81;pointer-events:none;white-space:nowrap;animation:sp 1.2s ease forwards}
@keyframes sp{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}25%{opacity:1;transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-90%)}}

/* pen tools (from lesson-engine/engine.css) */
.ink-cv{position:absolute;left:0;top:0;width:100%;height:100%;z-index:45!important;pointer-events:none;touch-action:none}
body.ink-on .ink-cv.cur,body.ink-on #wbBoard .ink-cv{pointer-events:auto;cursor:crosshair}
body.ink-erase .ink-cv{cursor:cell!important}
body.ink-laser .ink-cv{cursor:none!important}
#wbLaser{position:fixed;inset:0;width:100%;height:100%;z-index:66;pointer-events:none}
#wbBoard{position:fixed;inset:0;z-index:60;background-color:#FDFCF8;background-image:linear-gradient(#E6ECEF 1px,transparent 1px),linear-gradient(90deg,#E6ECEF 1px,transparent 1px);background-size:40px 40px}
#wbBoard[hidden]{display:none!important}
#wbBoard .bt{position:absolute;top:calc(18px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);font:700 18px/1 var(--f-ui);color:#86662A;background:#FBF3E1;border:1px solid #EBDDBB;border-radius:20px;padding:8px 16px;z-index:2;pointer-events:none;white-space:nowrap}
#tools{position:fixed;left:10px;top:50%;transform:translateY(-50%);z-index:70;display:flex;flex-direction:column;gap:5px;background:rgba(7,23,33,.95);border:1px solid #C9A35A;border-radius:16px;padding:7px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
#tools button{width:42px;height:42px;border-radius:10px;border:1px solid #24485A;background:#12303F;color:#E8F1F5;display:grid;place-items:center;padding:0;cursor:pointer}
#tools button svg{width:22px;height:22px}
#tools button.on{background:#C9A35A;color:#0B2431;border-color:#C9A35A}
#tools .sw i{width:22px;height:22px;border-radius:50%;display:block;border:2px solid rgba(255,255,255,.6)}
#tools .sw.on{background:#24485A;border-color:#C9A35A}
#tools .sz i{display:block;border-radius:50%;background:#E8F1F5}
#tools .sep{height:1px;background:#2A5266;margin:2px 0}
#tools[hidden]{display:none!important}
@media (max-height:980px){#tools{gap:4px;padding:6px}#tools button{width:34px;height:34px}#tools button svg{width:18px;height:18px}#tools .sw i{width:18px;height:18px}}
@media (max-height:800px){#tools{flex-direction:row;flex-wrap:wrap;top:auto;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:none;max-width:calc(100% - 20px)}#tools .sep{width:1px;height:auto;margin:0 2px}}
#drawB.on{background:#C9A35A!important;color:#0B2431!important;border-color:#C9A35A!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:640px){#s0{padding:10px}.ch{min-height:96px;flex-basis:140px}.ch .emo{font-size:2.3rem}.ch .ds{font-size:.8rem}.wcard{padding:4px 14px 8px}.brand{font-size:1.3rem}.grid{gap:6px}.ladder{flex-wrap:nowrap;gap:4px}.slot{width:19%;height:132px;padding:2px}.slot .rk{font-size:.7rem}.bal{width:calc(24px + 8px*var(--s));height:calc(30px + 9px*var(--s));font-size:calc(.85rem + .12rem*var(--s))}.pk{min-width:70px;font-size:1.8rem}.pairbox{grid-template-columns:1fr}.pairbox .vs{display:none}}
</style>

<div class="wrap">
  <header class="top-row">
    <h1 class="brand"><span class="f">السَّمِينُ</span> وَ<span class="t">النَّحِيف</span> 🐡🐭 <span class="en">Puffy &amp; Skinny Letters</span><small><span class="ui-ar">ترتيل القرآن · Tarteel Al-Quran — التفخيم والترقيق من «الوجيز في علم التجويد»</span><span class="ui-en">Tarteel Al-Quran — heavy (tafkhīm) and light (tarqīq) letters, from <i>Al-Wajiz fi ‘Ilm at-Tajwid</i></span></small></h1>
    <button class="tbtn" id="enB" aria-pressed="false">English</button>
    <button class="tbtn" id="sndB" aria-pressed="true"><span class="ui-ar">🔊 صوت</span><span class="ui-en">🔊 Sound</span></button>
  </header>
  <div class="modes" role="group" aria-label="Game · اللعبة">
    <button class="mode" data-m="sort" aria-pressed="true"><span class="ui-ar">🐡🐭 سَمِينٌ أَمْ نَحِيف؟</span><span class="ui-en">🐡🐭 Puffy or skinny?</span></button>
    <button class="mode" data-m="memo" aria-pressed="false"><span class="ui-ar">🃏 تَوْأَمُ الذَّاكِرَة</span><span class="ui-en">🃏 Twin memory</span></button>
    <button class="mode" data-m="ball" aria-pressed="false"><span class="ui-ar">🎈 بَالُونَاتُ السِّمْنَة</span><span class="ui-en">🎈 Balloon levels</span></button>
  </div>
  <div class="bar">
    <label for="setSel" id="setLbl"><span class="ui-ar">الدرس:</span><span class="ui-en">Lesson:</span></label>
    <select id="setSel"></select>
    <label for="teamSel"><span class="ui-ar">اللاعبون:</span><span class="ui-en">Players:</span></label>
    <select id="teamSel"><option value="1" data-en="One student">طالب واحد</option><option value="2" data-en="Two teams">فريقان</option><option value="tv" selected data-en="Student vs. teacher">الطالب ضد المعلم</option></select>
    <span class="grow"></span>
    <button class="tbtn" id="newB"><span class="ui-ar">↻ جولة جديدة</span><span class="ui-en">↻ New round</span></button>
  </div>
  <div class="teams" id="teams"></div>
  <section id="s0" aria-live="polite"></section>
  <div class="book" id="bookLine"></div>
</div>
<script>
/* ============================================================
   ✏️ المحتوى — عدّل هنا فقط  (EDIT CONTENT HERE)
   SETS («صيغة الكلمة المعلَّمة»): { key:{ ar, en, round, look, stop?, items:[ {t:'الكَلِمَةُ والحرفُ المقصود بين [ ]', ref:'السورة: الآية', pic, en, k?:'fat'|'thin', why?:'مفتاح من WHY', note?} ] } }
     • بدون k و why: الحكم يُحسب تلقائيًا — حرف من «خص ضغط قظ» = سَمِين 🐡، غيره = نَحِيف 🐭.
     • للراء واللام (لفظ الجلالة) والألف والغنة: اكتب k و why بنفسك.
     • stop:1 على المجموعة = «قِفْ على الكلمة» (أحكام الوقف على الراء).
   PAIRS (لعبة الذاكرة): أزواج «توأم» تختلف بحرف نحيف/سمين: {thin:{t,pic,en}, fat:{t,pic,en}}
   BALLOON_LETTERS و LEVELS: مراتب التفخيم الخمس (لعبة البالونات).
   لتستعمل اللعبة مع سورة الطالب: انسخ مجموعة heavy وضع كلمات من سورته (الحرف بين [ ]).
   ============================================================ */

  ra_istila:{kid:'فَخّ! بَعْدَ الرَّاءِ حَرْفٌ سَمِين مِنْ «خُصَّ ضَغْطٍ قِظْ» ← سَمِينَة 🐡',kidEn:'Trap! A heavy letter comes right after the Rā → puffy.',

/* split '[x]' → pre · target · post */
function parse(t){const a=t.indexOf('['),b=t.indexOf(']');return a<0?{pre:t,tg:'',post:''}:{pre:t.slice(0,a),tg:t.slice(a+1,b),post:t.slice(b+1)}}
function ruleOf(it){const tg=baseOf(parse(it.t).tg)[0];
  if(it.k)return {k:it.k,why:it.why||(it.k==='fat'?'istila':'istifal'),itbaq:ITBAQ.includes(tg)};
  const fat=HEAVY.includes(tg);return {k:fat?'fat':'thin',why:fat?'istila':'istifal',itbaq:ITBAQ.includes(tg)}}
/* ZWJ keeps Arabic letters joined across the coloured <span> */
function wordHTML(t,state){const p=parse(t),J='‍';
  const joins=s=>{const b=baseOf(s);const c=b[b.length-1];return !!c&&!' اأإآٱدذرزوةء'.includes(c)};
  const a1=joins(p.pre)?J:'',a2=(p.post&&!/^\s/.test(p.post)&&joins(p.tg))?J:'';
  const cls=state==='fat'?'tg fat':state==='thin'?'tg thin':'tg';
  return `${p.pre}${a1}<span class="${cls}">${a1}${p.tg}${a2}</span>${a2}${p.post}`}

let AC=null,soundOn=true;

function tone(f,d=.15,type='sine',v=.18,when=0,f2){const a=ac();if(!a||!soundOn)return;const t=a.currentTime+when,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.02)}

}
function stageCanvas(i){
 if(cvs[i])return cvs[i];const sec=document.getElementById('s'+i);if(!sec)return null;
 const o=makeCanvas(sec,()=>String(i));new ResizeObserver(()=>o.fit()).observe(sec);return cvs[i]=o;
}
const bcv=makeCanvas(board,()=>stage+'-wb');
const active=()=>board.hidden?stageCanvas(stage):bcv;
function redraw(){const a=active();if(a)a.redraw()}

let cur=null,erasing=false,trail=[];
function bind(o){
 const cv=o.cv;
 const pos=e=>{const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top,e.pointerType==='pen'?(e.pressure||.5):.5]};
 const eraseAt=(x,y)=>{const L=store[o.k()]||[],r=14;let ch=false;for(let i=L.length-1;i>=0;i--){if(L[i].pts.some(p=>Math.hypot(p[0]-x,p[1]-y)<r+lw(L[i],p[2])/2)){L.splice(i,1);ch=true}}if(ch)o.redraw()};
 cv.addEventListener('pointerdown',e=>{if(tool==='none')return;e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}const p=pos(e);
  erasing=tool==='erase'||e.button===5||!!(e.buttons&32);
  if(tool==='laser'){trail=[[e.clientX,e.clientY,performance.now()]];return}
  if(erasing){eraseAt(p[0],p[1]);return}
  cur={t:tool,c:color,w:SIZES[sizeI],pts:[p]};if(tool==='pen')drawStroke(o.ctx,cur)});
 cv.addEventListener('pointermove',e=>{if(tool==='none')return;const ce=e.getCoalescedEvents?e.getCoalescedEvents():[];const evs=ce.length?ce:[e];
  if(tool==='laser'){trail.push([e.clientX,e.clientY,performance.now()]);return}
  if(!e.buttons)return;
  for(const ev of evs){const p=pos(ev);if(erasing){eraseAt(p[0],p[1]);continue}if(!cur)continue;const l=cur.pts[cur.pts.length-1];if(Math.hypot(p[0]-l[0],p[1]-l[1])<1.2)continue;cur.pts.push(p);
   if(cur.t==='pen'){o.ctx.save();o.ctx.lineCap='round';o.ctx.strokeStyle=cur.c;seg(o.ctx,cur,cur.pts.length-1);o.ctx.restore()}}
  if(cur&&cur.t==='hl')o.redraw(cur)});
 const up=()=>{if(cur){(store[o.k()]||(store[o.k()]=[])).push(cur);cur=null;o.redraw()}erasing=false};
 cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
 cv.addEventListener('pointerleave',()=>{if(tool==='laser')trail.push(null)});
 cv.addEventListener('contextmenu',e=>{if(tool!=='none')e.preventDefault()});
}

function fitLaser(){const d=window.devicePixelRatio||1;lz.width=innerWidth*d;lz.height=innerHeight*d;lctx.setTransform(d,0,0,d,0,0)}
fitLaser();
(function loop(){const now=performance.now();lctx.clearRect(0,0,innerWidth,innerHeight);
 if(tool==='laser'){trail=trail.filter(p=>p&&now-p[2]<450);for(let i=1;i<trail.length;i++){const a=trail[i-1],b=trail[i],k=1-(now-b[2])/450;lctx.strokeStyle=`rgba(255,40,40,${.7*k})`;lctx.lineWidth=8*k+2;lctx.lineCap='round';lctx.beginPath();lctx.moveTo(a[0],a[1]);lctx.lineTo(b[0],b[1]);lctx.stroke()}
  const t=trail[trail.length-1];if(t){lctx.fillStyle='rgba(255,40,40,.25)';lctx.beginPath();lctx.arc(t[0],t[1],16,0,7);lctx.fill();lctx.fillStyle='#FF2A2A';lctx.beginPath();lctx.arc(t[0],t[1],7,0,7);lctx.fill()}}
 requestAnimationFrame(loop)})();

function markCurrent(){Object.entries(cvs).forEach(([i,o])=>o.cv.classList.toggle('cur',+i===stage))}
function setTool(t){tool=t;if(t!=='laser')trail=[];
 document.body.classList.toggle('ink-on',t!=='none');document.body.classList.toggle('ink-erase',t==='erase');document.body.classList.toggle('ink-laser',t==='laser');
 if(t!=='none'){const a=stageCanvas(stage);if(a&&!a.w)a.fit()}markCurrent();
 tb.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===t))}
function setColor(c){color=c;tb.querySelectorAll('.sw').forEach(b=>b.classList.toggle('on',b.dataset.c===c));if(tool==='none'||tool==='erase'||tool==='laser')setTool('pen')}
function setSize(i){sizeI=i;tb.querySelectorAll('.sz').forEach(b=>b.classList.toggle('on',+b.dataset.s===i))}
function openTools(open){tb.hidden=!open;if(open){if(tool==='none')setTool('pen')}else{setTool('none');if(!board.hidden)toggleBoard()}if(dbtn)dbtn.classList.toggle('on',open)}
function toggleBoard(){board.hidden=!board.hidden;tb.querySelector('[data-a="board"]').classList.toggle('on',!board.hidden);if(!board.hidden){bcv.fit();if(tool==='none')setTool('pen')}redraw()}
function undo(){const L=list();if(L.length)L.pop();else if(backup[key()]){store[key()]=backup[key()];delete backup[key()]}redraw()}
function clearAll(){const L=list();if(!L.length)return;backup[key()]=L.slice();store[key()]=[];redraw()}
tb.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.t)setTool(b.dataset.t);else if(b.dataset.c)setColor(b.dataset.c);else if(b.dataset.s)setSize(+b.dataset.s);
 else if(b.dataset.a==='undo')undo();else if(b.dataset.a==='clear')clearAll();else if(b.dataset.a==='board')toggleBoard();else if(b.dataset.a==='close')openTools(false)});

let dbtn=null;
document.addEventListener('lesson:stage',e=>{
 if(!dbtn){const row=document.querySelector('.top-row');if(row){dbtn=document.createElement('button');dbtn.id='drawB';dbtn.className='tbtn';dbtn.innerHTML='✏️ قلم / سبورة';dbtn.title='أدوات الكتابة (D)';
  dbtn.onclick=()=>openTools(tb.hidden);row.appendChild(dbtn)}}
 stage=e.detail;
 if(!board.hidden){board.hidden=true;tb.querySelector('[data-a="board"]').classList.remove('on')}
 if(store[String(stage)]||tool!=='none'){const o=stageCanvas(stage);if(o)requestAnimationFrame(()=>o.fit())}
 markCurrent();
});
window.addEventListener('resize',()=>{fitLaser();if(!board.hidden)bcv.fit()});
setColor(COLORS[0]);setTool('none');setSize(1);

document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;const k=e.key.toLowerCase();
 if((e.ctrlKey||e.metaKey)&&k==='z'){if(!tb.hidden){e.preventDefault();undo()}return}
 if(e.ctrlKey||e.metaKey||e.altKey)return;
 if(k==='d'){openTools(tb.hidden);return}
 if(tb.hidden&&!['p','h','w','l'].includes(k))return;
 if(k==='p'){openTools(true);setTool('pen')}else if(k==='h'){openTools(true);setTool('hl')}else if(k==='e'&&!tb.hidden)setTool('erase')
 else if(k==='l'){openTools(true);setTool('laser')}else if(k==='v'||k==='escape')setTool('none');else if(k==='w'){openTools(true);toggleBoard()}});
})();

document.dispatchEvent(new CustomEvent('lesson:stage',{detail:0}));
</script>
