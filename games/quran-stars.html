<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!doctype html><html lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نجوم القرآن</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Amiri:wght@400;700&display=swap">
<style>
/* Kids "night sky" theme (one theme on purpose: screen-share + touch). Stars = words of the āyah. */
:root{
  color-scheme:light;
  --bg:#FFF8EC; --card:#FFFFFF; --ink:#2A2140; --muted:#6F6585; --line:#F1DDB8;
  --gold:#F2B705; --gold2:#B07F00; --good:#22A45D; --bad:#E63946; --blue:#3A86FF;
  --teamA:#3A86FF; --teamB:#EF476F;
  --sky1:#1B1F4B; --sky2:#3B2C7A; --star:#FFD84D; --star2:#FFF3B0;
  --f-ui:"Baloo Bhaijaan 2","Segoe UI",Tahoma,sans-serif;
  --f-ar:"Amiri","Traditional Arabic","Noto Naskh Arabic",serif;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg) radial-gradient(circle at 90% 0,#FFE3B3 0,transparent 40%) no-repeat;color:var(--ink);font-family:var(--f-ui);direction:rtl;font-size:18px;line-height:1.5}
.wrap{max-width:1150px;margin:0 auto;padding-inline:16px;padding-block:10px 28px;display:flex;flex-direction:column;gap:12px}
.top-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.brand{flex:1 1 260px;margin:0;font-size:1.6rem;font-weight:800;line-height:1.2;color:var(--sky2)}
.brand small{display:block;font-size:.8rem;font-weight:500;color:var(--muted)}
.tbtn{font:inherit;font-size:.9rem;font-weight:700;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 14px;cursor:pointer;min-height:40px}
.tbtn[aria-pressed="true"],.tbtn.on{background:var(--gold);border-color:var(--gold);color:#2A2140}
.en{display:none;direction:ltr;unicode-bidi:isolate;font-family:system-ui,sans-serif;font-size:.8em;opacity:.8;font-weight:500}
body.show-en .en{display:inline}
body.show-en .en.blk{display:block}
button:focus-visible,select:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--card);border-radius:18px;padding:8px 12px;border:2px solid var(--line)}
.bar label{font-weight:700;font-size:.95rem}
.bar select{font:inherit;font-size:.95rem;border:2px solid var(--line);border-radius:12px;padding:2px 8px;background:var(--bg);color:var(--ink);min-height:40px;max-width:100%}
.bar .grow{flex:1}
.modes{display:flex;gap:8px;flex-wrap:wrap}
.mode{font:inherit;font-weight:800;font-size:1rem;border:3px solid var(--line);background:var(--card);color:var(--ink);border-radius:18px;padding:4px 14px;cursor:pointer;min-height:48px;flex:1 1 200px}
.mode[aria-pressed="true"]{border-color:var(--sky2);background:#ECE6FF}
.teams{display:flex;gap:10px;flex-wrap:wrap}
.team{flex:1 1 200px;display:flex;align-items:center;gap:10px;background:var(--card);border:3px solid var(--line);border-radius:20px;padding:6px 14px;transition:transform .2s,border-color .2s}
.team .nm{font-weight:800;font-size:1.1rem;color:var(--tc)}
.team .pts{margin-inline-start:auto;font-weight:800;font-size:1.7rem;color:var(--gold2);font-variant-numeric:tabular-nums}
.team .turn{font-size:.8rem;font-weight:700;background:var(--tc);color:#fff;border-radius:999px;padding:0 10px;visibility:hidden}
.team.now{border-color:var(--tc);transform:scale(1.02)}
.team.now .turn{visibility:visible}

/* the sky (station) */
#s0{position:relative;overflow:hidden;border:3px solid #2C2766;border-radius:26px;padding:14px;min-height:480px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;color:#fff;
  background:radial-gradient(1.5px 1.5px at 12% 18%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 72% 12%,#fff 50%,transparent 51%),radial-gradient(2px 2px at 40% 70%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 88% 55%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 25% 88%,#fff 50%,transparent 51%),radial-gradient(2px 2px at 60% 40%,#fffbe0 50%,transparent 51%),linear-gradient(170deg,var(--sky1),var(--sky2) 70%,#5B3A8F)}
#s0 > *:not(.ink-cv){position:relative;z-index:2}
#s0 .en{color:#E8E2FF}
.prog{font-weight:700;color:#CFC6FF;font-size:.95rem;align-self:stretch;display:flex;justify-content:space-between;gap:8px}
.q{font-weight:800;font-size:1.2rem}
.tip{font-size:.95rem;color:#E8E2FF;max-width:70ch}
.book{font-size:.82rem;color:var(--muted);text-align:center}

/* intro: meet the Quran's names */
.badges{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-self:stretch}
.bdg{font:inherit;color:var(--ink);background:#fff;border:4px solid var(--bc);border-radius:20px;padding:6px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;box-shadow:0 5px 0 var(--bc)}
.bdg .emo{font-size:2.6rem;line-height:1.1}
.bdg .nm{font-family:var(--f-ar);font-weight:700;font-size:1.6rem;color:var(--bc);line-height:1.3}
.bdg .mv{font-size:.82rem}
.bdg.got{animation:jump .5s}
.card{align-self:stretch;text-align:start;background:#fff;color:var(--ink);border-inline-start:8px solid var(--hc,var(--gold));border-radius:16px;padding:8px 14px;animation:pop .35s}
.card .t{font-weight:800}
.card .bq{font-family:var(--f-ar);font-size:1.25rem;line-height:1.8}
.card .hd{font-family:var(--f-ar);font-size:1.45rem;line-height:1.8;color:#5B3A8F;font-weight:700}
.card small{display:block;color:var(--gold2);font-weight:700}
.card .en{color:var(--muted)}
details.card summary{cursor:pointer;font-weight:800}

/* āyah strip (the "constellation line") */
.meaning{font-size:1.05rem;background:rgba(255,255,255,.12);border-radius:14px;padding:2px 14px}
.meaning .p{font-size:2rem;vertical-align:middle}
.strip{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;direction:rtl;background:rgba(255,255,255,.08);border:2px dashed rgba(255,255,255,.35);border-radius:22px;padding:10px;align-self:stretch;min-height:96px}
.slot,.wd{font-family:var(--f-ar);font-weight:700;font-size:clamp(1.8rem,5.5vw,3rem);line-height:1.5;border-radius:16px;padding:0 12px;min-width:64px}
.slot{border:2px dashed rgba(255,255,255,.45);color:transparent;min-height:1.6em}
.slot.f{border:2px solid var(--star);color:var(--star2);background:rgba(255,216,77,.12);animation:pop .35s;text-shadow:0 0 14px rgba(255,216,77,.7)}
.slot.next{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.25)}
.ref{font-size:.9rem;color:#CFC6FF}
/* floating word-stars */
.sky{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-self:stretch;padding:8px 0 4px}
.st{font:inherit;font-family:var(--f-ar);font-weight:700;font-size:clamp(1.6rem,5vw,2.6rem);line-height:1.4;color:#3A2A00;cursor:pointer;border:0;padding:8px 22px 10px;min-height:68px;border-radius:999px;
  background:radial-gradient(circle at 30% 25%,#FFFBE0,var(--star) 60%,#F2A900);box-shadow:0 0 18px rgba(255,216,77,.75),0 5px 0 #C98A00;animation:bob 3s ease-in-out infinite;animation-delay:var(--d,0s)}
.st::before{content:"⭐";font-size:.6em;margin-inline-end:6px;vertical-align:middle}
.st:active{transform:translateY(3px)}
.st.bad{animation:shake .4s;filter:saturate(.3)}
.st.gone{visibility:hidden}
/* hide mode */
.wd{color:var(--star2);text-shadow:0 0 12px rgba(255,216,77,.6);background:transparent;border:2px solid transparent;font:inherit;font-family:var(--f-ar);font-weight:700;cursor:default}
.wd.hid{color:transparent;text-shadow:none;background:radial-gradient(circle,#6F63C9,#4A3E9E);border-color:#8F84E6;cursor:pointer;position:relative}
.wd.hid::after{content:"☁️";color:#fff;position:absolute;inset:0;display:grid;place-items:center;font-size:.8em}
.wd.peek{color:#fff;background:#6F63C9}
.wd.peek::after{content:none}
.wd.vanish{animation:vanish .6s}
.counter{display:flex;gap:6px;justify-content:center;font-size:2rem}
.counter span{opacity:.25;transition:opacity .3s,transform .3s}
.counter span.on{opacity:1;transform:scale(1.2)}
/* badge reveal + TPR */
.reveal{align-self:stretch;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center;background:#fff;color:var(--ink);border:4px solid var(--bc,var(--gold));border-radius:22px;padding:8px 14px;animation:pop .4s}
.reveal .emo{font-size:3.4rem;line-height:1;animation:jump .6s 2}
.reveal .nm{font-family:var(--f-ar);font-weight:700;font-size:2rem;color:var(--bc)}
.reveal .mv{font-weight:700}
.reveal .en{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.big-btn{font:inherit;font-weight:800;font-size:1.1rem;border:0;border-radius:16px;padding:6px 22px;min-height:52px;cursor:pointer;color:#fff;background:var(--blue);box-shadow:0 5px 0 #1F5FC4}
.big-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #1F5FC4}
.big-btn.green{background:var(--good);box-shadow:0 5px 0 #157A42}
.big-btn.gold{background:var(--gold);color:#2A2140;box-shadow:0 5px 0 #B07F00}
.big-btn.ghost{background:rgba(255,255,255,.14);color:#fff;border:2px solid rgba(255,255,255,.4);box-shadow:none}
.big-btn .en{color:inherit;opacity:.85}
.big-btn:disabled{opacity:.45;cursor:default}
.crown{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.crown span{background:#fff;color:var(--ink);border:3px solid var(--bc);border-radius:999px;padding:0 12px;font-family:var(--f-ar);font-weight:700;font-size:1.3rem}
.endmsg{display:flex;flex-direction:column;gap:10px;align-items:center;align-self:stretch}
.endmsg .trophy{font-size:4.5rem;line-height:1}
.endmsg h2{margin:0;font-size:1.9rem;color:var(--star)}
.miss{font-family:var(--f-ar);font-size:1.5rem;line-height:1.7}

@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{25%{transform:translateX(7px)}75%{transform:translateX(-7px)}}
@keyframes jump{50%{transform:translateY(-14px) scale(1.1)}}
@keyframes bob{50%{transform:translateY(-8px) rotate(-2deg)}}
@keyframes vanish{0%{transform:scale(1)}40%{transform:scale(1.25);filter:brightness(2)}100%{transform:scale(1)}}
.cf{position:fixed;top:-20px;width:11px;height:15px;border-radius:3px;pointer-events:none;z-index:80;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.starpop{position:fixed;top:22%;left:50%;transform:translate(-50%,-50%);font-weight:800;font-size:1.8rem;background:var(--card);color:var(--ink);border:4px solid var(--gold);border-radius:999px;padding:4px 24px;z-index:81;pointer-events:none;white-space:nowrap;animation:sp 1.2s ease forwards}
@keyframes sp{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}25%{opacity:1;transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-90%)}}

/* pen tools (from lesson-engine/engine.css) */
.ink-cv{position:absolute;left:0;top:0;width:100%;height:100%;z-index:45!important;pointer-events:none;touch-action:none}
body.ink-on .ink-cv.cur,body.ink-on #wbBoard .ink-cv{pointer-events:auto;cursor:crosshair}
body.ink-erase .ink-cv{cursor:cell!important}
body.ink-laser .ink-cv{cursor:none!important}
#wbLaser{position:fixed;inset:0;width:100%;height:100%;z-index:66;pointer-events:none}
#wbBoard{position:fixed;inset:0;z-index:60;background-color:#FDFCF8;background-image:linear-gradient(#E6ECEF 1px,transparent 1px),linear-gradient(90deg,#E6ECEF 1px,transparent 1px);background-size:40px 40px}
#wbBoard[hidden]{display:none!important}
#wbBoard .bt{position:absolute;top:calc(18px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);font:700 18px/1 var(--f-ui);color:#86662A;background:#FBF3E1;border:1px solid #EBDDBB;border-radius:20px;padding:8px 16px;z-index:2;pointer-events:none;white-space:nowrap}
#tools{position:fixed;left:10px;top:50%;transform:translateY(-50%);z-index:70;display:flex;flex-direction:column;gap:5px;background:rgba(7,23,33,.95);border:1px solid #C9A35A;border-radius:16px;padding:7px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
#tools button{width:42px;height:42px;border-radius:10px;border:1px solid #24485A;background:#12303F;color:#E8F1F5;display:grid;place-items:center;padding:0;cursor:pointer}
#tools button svg{width:22px;height:22px}
#tools button.on{background:#C9A35A;color:#0B2431;border-color:#C9A35A}
#tools .sw i{width:22px;height:22px;border-radius:50%;display:block;border:2px solid rgba(255,255,255,.6)}
#tools .sw.on{background:#24485A;border-color:#C9A35A}
#tools .sz i{display:block;border-radius:50%;background:#E8F1F5}
#tools .sep{height:1px;background:#2A5266;margin:2px 0}
#tools[hidden]{display:none!important}
@media (max-height:980px){#tools{gap:4px;padding:6px}#tools button{width:34px;height:34px}#tools button svg{width:18px;height:18px}#tools .sw i{width:18px;height:18px}}
@media (max-height:800px){#tools{flex-direction:row;flex-wrap:wrap;top:auto;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:none;max-width:calc(100% - 20px)}#tools .sep{width:1px;height:auto;margin:0 2px}}
#drawB.on{background:#C9A35A!important;color:#0B2431!important;border-color:#C9A35A!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:640px){#s0{padding:10px}.brand{font-size:1.3rem}.st{padding:6px 14px 8px;min-height:56px}.sky{gap:10px}.slot,.wd{padding:0 8px;min-width:44px}.badges{grid-template-columns:repeat(2,1fr)}}
</style>
</head><body>
<div class="wrap">
  <header class="top-row">
    <h1 class="brand">⭐ نُجُومُ القُرْآن <span class="en">Quran Stars</span><small>ترتيل القرآن · Tarteel Al-Quran — من كتاب «كيف تحفظ القرآن الكريم»</small></h1>
    <button class="tbtn" id="enB" aria-pressed="false">English</button>
    <button class="tbtn" id="sndB" aria-pressed="true">🔊 صوت</button>
  </header>
  <div class="modes" role="group" aria-label="اللعبة">
    <button class="mode" data-m="build" aria-pressed="true">🌟 رَتِّبِ النُّجُوم <span class="en">Build the āyah</span></button>
    <button class="mode" data-m="hide" aria-pressed="false">☁️ النُّجُومُ تَخْتَفِي <span class="en">Vanishing stars</span></button>
  </div>
  <div class="bar">
    <label for="setSel">الدرس:</label>
    <select id="setSel"></select>
    <label for="teamSel">اللاعبون:</label>
    <select id="teamSel"><option value="1">طالب واحد</option><option value="2">فريقان</option><option value="tv" selected>الطالب ضد المعلم</option></select>
    <span class="grow"></span>
    <button class="tbtn" id="newB">↻ جولة جديدة</button>
  </div>
  <div class="teams" id="teams"></div>
  <section id="s0" aria-live="polite"></section>
  <div class="book" id="bookLine"></div>
</div>
<script>
/* ============================================================
   ✏️ المحتوى — عدّل هنا فقط  (EDIT CONTENT HERE)
   SETS (الصيغة الموحّدة + «آية بالكلمات»):
     { key:{ ar, en, seq?:1, items:[ {ar:'نَصُّ الآيةِ بِمَسَافَاتٍ بَيْنَ الكَلِمَات', en:'المعنى', pic:'إيموجي', ref:'السورة: الآية', badge?:'مفتاح من BADGES'} ] } }
     • كل كلمة = نجمة. لتجعل كلمتين نجمةً واحدة (للصغار جدًّا) اكتب بينهما + بدل المسافة: 'قُلْ+هُوَ'.
     • seq:1 = الآيات بالترتيب (لسورة يحفظها الطالب) + «التحدي الكبير» في الآخر: السورة كلها غيبًا.
     • لتضيف سورة الطالب: انسخ مجموعة ikhlas وغيّر الآيات.
   BADGES: «أوصاف القرآن» — اسم + إيموجي + حركة جسم (TPR) + نص الكتاب.
   REPEAT: كم مرة يقرأ الطالب الآية بعد ترتيبها. HIDE_ORDER: 'end' (تختفي من الآخر) أو 'random'.
   ============================================================ */
const BOOK = {ar:'كيف تحفظ القرآن الكريم — د. عبد الرب نواب الدين', ref:'المقدمة + التمهيد «نبذة من فضائل القرآن الكريم»، ص ٢٠–٢٥ (ترقيم الطبعة المطبوعة)'};
const BADGES = {
  majid:{ar:'مَجِيد',en:'Glorious',emo:'👑',c:'#E0A100',move:'ضَعْ يَدَيْكَ فَوْقَ رَأْسِكَ مِثْلَ التَّاج 👑',moveEn:'Put your hands on your head like a crown',
    bq:'ولقد وصف كتابه بأوصاف الجلال والكمال',pg:'٢٠'},
  hakim:{ar:'حَكِيم',en:'Wise',emo:'🦉',c:'#2F6FD6',move:'أَشِرْ إِلَى رَأْسِكَ بِإِصْبَعِك: «أُفَكِّر!» 🤔',moveEn:'Point to your head: "I think!"',
    bq:'ولقد وصف كتابه بأوصاف الجلال والكمال',pg:'٢٠'},
  karim:{ar:'كَرِيم',en:'Noble & generous',emo:'🎁',c:'#EF476F',move:'افْتَحْ يَدَيْكَ كَأَنَّكَ تُعْطِي هَدِيَّة 🤲',moveEn:'Open your hands as if giving a gift',
    bq:'ولقد وصف كتابه بأوصاف الجلال والكمال',pg:'٢٠–٢١'},
  mubin:{ar:'مُبِين',en:'Clear',emo:'💡',c:'#22A45D',move:'افْتَحْ يَدَيْكَ مِثْلَ كِتَابٍ مَفْتُوح وَقُلْ: «وَاضِح!» 📖',moveEn:'Open your hands like a book and say "clear!"',
    bq:'ولقد وصف كتابه بأوصاف الجلال والكمال',pg:'٢٠–٢١'},
  ajab:{ar:'عَجَب',en:'Wonderful',emo:'🤩',c:'#8E5CF7',move:'ضَعْ يَدَيْكَ عَلَى خَدَّيْك: «وَاااو!» 😮',moveEn:'Hands on your cheeks: "Wow!"',
    bq:'وقال حكاية عن الجن ﴿إِنَّا سَمِعْنَا قُرْآنًا عَجَبًا﴾',pg:'٢١'},
  yusr:{ar:'مُيَسَّر',en:'Made easy to remember',emo:'👍',c:'#E36414',move:'ارْفَعْ إِبْهَامَيْك: «سَهْل! أَقْدِرُ أَحْفَظُه!» 👍👍',moveEn:'Two thumbs up: "Easy! I can memorise it!"',
    bq:'ومن خصائص القرآن الكريم أنه ميسر في تلاوته وحفظه وتدبره',pg:'٢٥'},
  mahfuz:{ar:'مَحْفُوظ',en:'Protected by Allah',emo:'🛡️',c:'#14374A',move:'ضُمَّ يَدَيْكَ عَلَى صَدْرِكَ مِثْلَ كَنْزٍ غَالٍ 💎',moveEn:'Hug your chest like a precious treasure',
    bq:'تكفل الله ـ سبحانه ـ بحفظه من التحريف والتبديل دون سائر الكتب السماوية',pg:'٢٠'},
};
const SETS = {
  sifat:{ar:'① أَوْصَافُ القُرْآن — آيَاتٌ مِنَ الكِتَاب (٤–٨ سنين)',en:'What the Quran is like — āyāt from the book (age 4–8)',items:[
    {ar:'ق وَالْقُرْآنِ الْمَجِيدِ',en:'Qāf. By the Glorious Quran.',pic:'👑',ref:'ق: ١',badge:'majid'},
    {ar:'يس وَالْقُرْآنِ الْحَكِيمِ',en:'Yā-Sīn. By the Wise Quran.',pic:'🦉',ref:'يس: ١–٢',badge:'hakim'},
    {ar:'إِنَّهُ لَقُرْآنٌ كَرِيمٌ',en:'It is surely a noble Quran.',pic:'🎁',ref:'الواقعة: ٧٧',badge:'karim'},

    kid:'رَجُلٌ قَرَأَ سُورَةَ الكَهْف، وَحِصَانُهُ مَرْبُوطٌ بِجَانِبِه 🐴. جَاءَتْ سَحَابَةٌ ☁️ وَاقْتَرَبَتْ… وَاقْتَرَبَتْ… وَالحِصَانُ يَتَحَرَّك! فِي الصَّبَاح سَأَلَ النَّبِيَّ ﷺ فَقَالَ: «تِلْكَ السَّكِينَةُ تَنَزَّلَتْ بِالْقُرْآنِ» ✨',

    pg:'٢٣',src:'متفق عليه عن البراء بن عازب رضي الله عنه (البخاري ومسلم، والتخريج في حاشية الكتاب)'},

const REPEAT = 3;            // اقرأ الآية ٣ مرات بعد ترتيبها
const HIDE_ORDER = 'end';    // 'end' = تختفي الكلمات من آخر الآية · 'random' = عشوائيًّا
const PEEK_MS = 1600;        // مدة «النظرة» عند الضغط على سحابة
const PRAISE=['أَحْسَنْت!','مَا شَاءَ الله!','بَارَكَ اللهُ فِيك!','مُمْتَاز!'], PRAISE_EN=['Well done!','Masha Allah!','Barak Allahu feek!','Excellent!'];
/* ============================================================ */

const $=s=>document.querySelector(s);
const ar=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const words=t=>t.trim().split(/\s+/).map(w=>w.replace(/\+/g,' '));
const plain=t=>t.replace(/\+/g,' ');

/* ---------- sound (Web Audio, starts after a tap) ---------- */
let AC=null,soundOn=true;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d=.15,type='sine',v=.18,when=0,f2){const a=ac();if(!a||!soundOn)return;const t=a.currentTime+when,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.02)}
const PENT=[523,587,659,784,880,1047,1175,1319,1568,1760];
const sfx={
  twinkle:i=>{const f=PENT[i%PENT.length];tone(f,.3,'sine',.16);tone(f*2,.2,'triangle',.05,.05)},
  bad:()=>tone(196,.22,'sawtooth',.08),
  vanish:()=>tone(1200,.45,'sine',.1,0,300),
  peek:()=>tone(990,.12,'sine',.1),
  badge:()=>[784,988,1175,1568].forEach((f,i)=>tone(f,.35,'triangle',.16,i*.08)),
  rep:i=>tone(PENT[2+i*2],.25,'triangle',.18),
  win:()=>[523,659,784,659,784,1047].forEach((f,i)=>tone(f,.22,'triangle',.2,i*.13)),
  good:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.18,'triangle',.2,i*.09))};
function confetti(n=40){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const cols=['#FFD84D','#FFF3B0','#3A86FF','#22A45D','#8E5CF7','#EF476F'];
  for(let i=0;i<n;i++){const c=document.createElement('i');c.className='cf';c.style.left=Math.random()*100+'vw';c.style.background=cols[i%cols.length];c.style.animationDuration=(1.4+Math.random()*1.4)+'s';c.style.animationDelay=(Math.random()*.3)+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),3200)}}
function praise(p){const k=Math.floor(Math.random()*PRAISE.length),e=document.createElement('div');e.className='starpop';e.innerHTML=`★ +${ar(p)} ${PRAISE[k]} <span class="en">${PRAISE_EN[k]}</span>`;document.body.appendChild(e);setTimeout(()=>e.remove(),1250)}

/* ---------- state ---------- */
const S0=$('#s0');
let mode='build',teams=[],turn=0,missed=[],gotBadges=[],setK='sifat';
function teamDefs(){const v=$('#teamSel').value;
  if(v==='1')return [{nm:'⭐ نُجُومِي',en:'My stars',c:'var(--gold2)'}];
  if(v==='tv')return [{nm:'🧑‍🎓 الطَّالِب',en:'Student',c:'var(--teamA)'},{nm:'👨‍🏫 المُعَلِّم',en:'Teacher',c:'var(--teamB)'}];
  return [{nm:'🔵 الفَرِيقُ الأَزْرَق',en:'Blue team',c:'var(--teamA)'},{nm:'🔴 الفَرِيقُ الأَحْمَر',en:'Red team',c:'var(--teamB)'}]}
function renderTeams(){$('#teams').innerHTML=teams.map((t,i)=>`<div class="team ${i===turn?'now':''}" style="--tc:${t.c}"><span class="nm">${t.nm} <span class="en">${t.en}</span></span><span class="turn">دَوْرُك</span><span class="pts">★ ${ar(t.pts)}</span></div>`).join('')}
function award(p){teams[turn].pts+=p;renderTeams();sfx.good();praise(p);confetti()}
function nextTurn(){turn=(turn+1)%teams.length;renderTeams()}
function stage(){document.dispatchEvent(new CustomEvent('lesson:stage',{detail:0}))}
function cite(pg){return `${BOOK.ar}، ص ${pg}`}
function bookCard(t,bq,pg,kid,kidEn,hc,who){return `<div class="card" style="--hc:${hc||'var(--gold)'}"><div class="t">${t}</div>${kid?`<div>${kid}${kidEn?`<span class="en blk">${kidEn}</span>`:''}</div>`:''}<div class="bq">«${bq}»</div><small>${who?who+' — ':''}${cite(pg)}</small></div>`}
function hadithCard(){const h=SPECIALS.hadith;return `<div class="card" style="--hc:#8E5CF7"><div class="t">${h.t}</div><div class="hd">${h.hd}</div><span class="en blk">${h.en}</span><small>${h.src}</small></div>`}
function storyCard(open){const s=SPECIALS.story;return `<details class="card" style="--hc:#3A86FF" ${open?'open':''}><summary>${s.t} <span class="en">Story</span></summary><div>${s.kid}<span class="en blk">${s.kidEn}</span></div><div class="bq">«${s.bq}»</div><small>${s.src} — ${cite(s.pg)}</small></details>`}

$('#setSel').innerHTML=Object.entries(SETS).map(([k,g])=>`<option value="${k}">${g.ar}</option>`).join('');
$('#bookLine').textContent=`📚 المصدر: ${BOOK.ar}، ${BOOK.ref}. الآيات من القرآن الكريم (رواية حفص) بمواضعها، وآيات «أوصاف القرآن» كلها من أمثلة الكتاب نفسه.`;

function newGame(){teams=teamDefs().map(t=>({...t,pts:0}));turn=0;missed=[];gotBadges=[];setK=$('#setSel').value;renderTeams();intro()}

/* ================= intro: meet the Quran ================= */
function intro(){const g=SETS[setK];const hasB=g.items.some(i=>i.badge);
  S0.innerHTML=`<div class="q">🌙 القُرْآنُ مِثْلُ سَمَاءٍ مَلِيئَةٍ بِالنُّجُوم، وَكُلُّ كَلِمَةٍ نَجْمَة ⭐ <span class="en blk">The Quran is like a sky full of stars: every word is a star!</span></div>
    ${hasB?`<div class="tip">🎵 قَابِلْ أَوْصَافَ القُرْآن! اضْغَطْ عَلَى كُلِّ وَصْف، وَاعْمَلْ حَرَكَتَهُ مَعَ المُعَلِّم <span class="en blk">Meet what the Quran is like: tap each one and do its move.</span></div>
    <div class="badges">${Object.entries(BADGES).map(([k,b])=>`<button class="bdg" data-b="${k}" style="--bc:${b.c}"><span class="emo">${b.emo}</span><span class="nm">${b.ar}</span><span class="en">${b.en}</span><span class="mv">${b.move}</span></button>`).join('')}</div>`:''}
    ${bookCard(SPECIALS.tikrar.t,SPECIALS.tikrar.bq,SPECIALS.tikrar.pg,SPECIALS.tikrar.kid,SPECIALS.tikrar.kidEn,'#E36414')}
    ${mode==='build'?`<div class="tip">🌟 <b>رَتِّبِ النُّجُوم:</b> اسْمَعِ الآيَةَ مِنَ المُعَلِّم ← اضْغَطِ النُّجُومَ بِالتَّرْتِيب ← اقْرَأْهَا ${ar(REPEAT)} مَرَّات ← اعْمَلْ حَرَكَةَ الوَصْف <span class="en blk">Listen → tap the stars in order → read it ${REPEAT} times → do the move</span></div>`
     :`<div class="tip">☁️ <b>النُّجُومُ تَخْتَفِي:</b> اقْرَأِ الآيَة ← تَخْتَفِي نَجْمَة خَلْفَ سَحَابَة ← اقْرَأْهَا مَرَّةً أُخْرَى… حَتَّى تَقْرَأَهَا كُلَّهَا غَيْبًا! (اضْغَطْ عَلَى السَّحَابَةِ لِتَنْظُرَ قَلِيلًا 👀) <span class="en blk">Read it → one star hides behind a cloud → read again… until you say it all from memory! Tap a cloud to peek.</span></div>`}
    <div class="row"><button class="big-btn green" id="goB">ابْدَأْ: ${g.ar.split(' (')[0].split(' — ')[0]} ▶ <span class="en">Start</span></button></div>
    ${storyCard(false)}`;
  S0.querySelectorAll('.bdg').forEach(b=>b.onclick=()=>{ac();sfx.badge();b.classList.remove('got');void b.offsetWidth;b.classList.add('got')});
  $('#goB').onclick=()=>{ac();queue=g.seq?g.items.slice():shuffle(g.items);done=0;goal=queue.length;mode==='build'?buildShow():hideShow()};
  stage()}

/* ================= ① رتّب النجوم ================= */
let queue=[],done=0,goal=0;
function head(it){return `<div class="prog"><span>الآيَة ${ar(done+1)} مِنْ ${ar(goal)}</span><span>${teams[turn].nm}</span></div>
  <div class="meaning"><span class="p">${it.pic||'⭐'}</span> ${it.en?`<span class="en">${it.en}</span>`:''} <span class="ref">(${it.ref})</span></div>`}
function buildShow(){if(!queue.length){end();return}
  const it=queue.shift(),ws=words(it.ar);let next=0,errs=0;
  S0.innerHTML=`${head(it)}
    <div class="tip">👂 المُعَلِّمُ يَقْرَأُ الآيَةَ مَرَّة، ثُمَّ اضْغَطِ النُّجُومَ بِالتَّرْتِيب ← (مِنَ اليَمِين) <span class="en blk">The teacher reads it once; then tap the stars in order (right to left).</span></div>
    <div class="strip" id="strip">${ws.map((w,i)=>`<span class="slot ${i===0?'next':''}" data-i="${i}">${w}</span>`).join('')}</div>
    <div class="sky">${shuffle(ws.map((w,i)=>({w,i}))).map((o,k)=>`<button class="st" data-w="${o.w}" style="--d:${(k*.37)%2}s">${o.w}</button>`).join('')}</div>
    <div class="row"><button class="big-btn ghost" id="hintB">💡 أَوَّلُ كَلِمَةٍ نَاقِصَة <span class="en">Hint</span></button></div>
    <div id="after"></div>`;
  const slots=[...S0.querySelectorAll('.slot')];
  S0.querySelectorAll('.st').forEach(b=>b.onclick=()=>{ac();if(next>=ws.length)return;
    if(b.dataset.w===ws[next]){b.classList.add('gone');slots[next].classList.remove('next');slots[next].classList.add('f');sfx.twinkle(next);next++;
      if(next<ws.length)slots[next].classList.add('next');else complete()}
    else{errs++;b.classList.remove('bad');void b.offsetWidth;b.classList.add('bad');sfx.bad()}});
  $('#hintB').onclick=()=>{ac();const b=[...S0.querySelectorAll('.st:not(.gone)')].find(x=>x.dataset.w===ws[next]);if(b){errs++;b.style.outline='5px solid #fff';sfx.peek();setTimeout(()=>b.style.outline='',900)}};
  function complete(){$('#hintB').disabled=true;if(errs)missed.push(it.ref);
    setTimeout(()=>award(errs?1:2),300);
    $('#after').innerHTML=`<div class="tip">🔁 الآنَ اقْرَأِ الآيَةَ ${ar(REPEAT)} مَرَّات — المُعَلِّمُ يَضْغَطُ نَجْمَةً بَعْدَ كُلِّ قِرَاءَة <span class="en blk">Now read it ${REPEAT} times; the teacher taps a star after each one.</span></div>
      <div class="counter" id="cnt">${Array.from({length:REPEAT},()=>'<span>⭐</span>').join('')}</div>
      <div class="row"><button class="big-btn gold" id="repB">✓ قَرَأَهَا (١)</button></div><div id="after2"></div>`;
    let r=0;$('#repB').onclick=()=>{ac();const c=$('#cnt').children;c[r].classList.add('on');sfx.rep(r);r++;
      if(r<REPEAT){$('#repB').textContent=`✓ قَرَأَهَا (${ar(r+1)})`;return}
      $('#repB').remove();afterAyah(it,$('#after2'))};
    $('#after').scrollIntoView({behavior:'smooth',block:'nearest'})}
  stage()}

function afterAyah(it,host,hideMode){const b=it.badge&&BADGES[it.badge];
  if(b&&!gotBadges.includes(it.badge))gotBadges.push(it.badge);
  if(b)sfx.badge();
  host.innerHTML=`${b?`<div class="reveal" style="--bc:${b.c}"><span class="emo">${b.emo}</span><div><div class="nm">القُرْآنُ ${b.ar}!</div><span class="en">The Quran is ${b.en}!</span><div class="mv">🤸 ${b.move}<span class="en blk">${b.moveEn}</span></div></div>
      <button class="big-btn green" id="bonusB">✓ عَمِلَ الحَرَكَة (+١)</button></div>
      ${bookCard('📚 مِنَ الكِتَاب',b.bq,b.pg,null,null,b.c,it.badge==='yusr'?null:null)}${it.badge==='yusr'?bookCard(SPECIALS.yusr.t,SPECIALS.yusr.bq,SPECIALS.yusr.pg,null,null,'#E36414',SPECIALS.yusr.who):''}`:''}
    <div class="row">${hideMode?'':`<button class="big-btn ghost" id="hideNow">☁️ الآنَ غَيْبًا! <span class="en">Now from memory</span></button>`}<button class="big-btn" id="nextB">${queue.length?'الآيَةُ التَّالِيَة ←':'🏆 النِّهَايَة'} <span class="en">Next</span></button></div>`;
  const bb=$('#bonusB');if(bb)bb.onclick=()=>{bb.remove();award(1)};
  const hn=$('#hideNow');if(hn)hn.onclick=()=>{queue.unshift(it);done=done;mode='hide';document.querySelectorAll('.mode').forEach(x=>x.setAttribute('aria-pressed',x.dataset.m==='hide'));hideShow()};
  $('#nextB').onclick=()=>{done++;nextTurn();mode==='build'?buildShow():hideShow()};$('#nextB').focus({preventScroll:true});
  host.scrollIntoView({behavior:'smooth',block:'nearest'})}

/* ================= ② النجوم تختفي (vanishing cues) ================= */
function hideOrder(n){const idx=[...Array(n).keys()];return HIDE_ORDER==='random'?shuffle(idx):idx.reverse()}
function hideShow(){if(!queue.length){end();return}
  const it=queue.shift(),ws=words(it.ar),order=hideOrder(ws.length);let h=0,peeks=0;
  S0.innerHTML=`${head(it)}
    <div class="tip">🗣️ اقْرَأِ الآيَةَ بِصَوْتٍ عَالٍ، ثُمَّ يَضْغَطُ المُعَلِّمُ «✓ قَرَأَهَا» فَتَخْتَفِي نَجْمَة ☁️ <span class="en blk">Read it aloud; then the teacher taps ✓ and one star hides.</span></div>

<script>

function drawStroke(c,s){const p=s.pts;if(!p.length)return;c.save();c.lineCap='round';c.lineJoin='round';c.strokeStyle=s.c;c.fillStyle=s.c;
 if(s.t==='hl'){c.globalAlpha=.35;c.lineWidth=lw(s);c.beginPath();c.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++){const m=[(p[i-1][0]+p[i][0])/2,(p[i-1][1]+p[i][1])/2];c.quadraticCurveTo(p[i-1][0],p[i-1][1],m[0],m[1])}c.lineTo(p[p.length-1][0],p[p.length-1][1]);if(p.length===1)c.lineTo(p[0][0]+.1,p[0][1]);c.stroke()}
 else{if(p.length===1){c.beginPath();c.arc(p[0][0],p[0][1],lw(s,p[0][2])/2,0,7);c.fill()}else for(let i=1;i<p.length;i++)seg(c,s,i)}

const cvs={};

 o.fit=()=>{const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;o.w=r.width;o.h=r.height;cv.width=Math.max(1,Math.round(r.width*d));cv.height=Math.max(1,Math.round(r.height*d));o.ctx.setTransform(d,0,0,d,0,0);o.redraw()};

}

(function loop(){const now=performance.now();lctx.clearRect(0,0,innerWidth,innerHeight);
