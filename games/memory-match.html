<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="../tq-i18n.css"><script src="../tq-i18n.js"></script>
<title>لعبة الذاكرة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Amiri:wght@400;700&display=swap">
<style>
:root{color-scheme:dark;--bg:#0E1F2E;--bg2:#13293C;--card:#173450;--card2:#1D4062;--ink:#F3F6FA;--muted:#A9BBCC;--line:#2B5274;--gold:#F2C14E;--gold2:#C99A2E;--teal:#2EC4B6;--coral:#FF6B6B;--sky:#4DA8FF;--lime:#7BD88F;--violet:#A98BFF;--pink:#FF8FB1;
  --f-ui:"Baloo Bhaijaan 2","Segoe UI",Tahoma,sans-serif;--f-ar:"Amiri","Traditional Arabic",serif}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);background-image:radial-gradient(ellipse at 50% -10%,#1F4A70 0,transparent 60%);color:var(--ink);font-family:var(--f-ui);font-size:18px;line-height:1.5;direction:rtl}
.wrap{max-width:980px;margin:0 auto;padding:12px 16px 40px;display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-size:1.6rem;font-weight:800;line-height:1.2}h1 small{display:block;font-size:.8rem;font-weight:500;color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--bg2);border:2px solid var(--line);border-radius:18px;padding:8px 12px}
.bar label{font-weight:700;font-size:.95rem}
select,.tbtn,.big{font:inherit;color:var(--ink)}
select{border:2px solid var(--line);border-radius:12px;padding:2px 8px;background:var(--card);min-height:40px;max-width:100%}
.tbtn{font-weight:700;font-size:.92rem;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:4px 14px;cursor:pointer;min-height:40px}
.tbtn[aria-pressed=true],.tbtn.on{background:var(--gold);border-color:var(--gold);color:#1B1B1B}
.big{font-weight:800;font-size:1.1rem;border:0;border-radius:16px;padding:8px 22px;min-height:52px;cursor:pointer;color:#0E1F2E;background:var(--gold);box-shadow:0 5px 0 var(--gold2)}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 var(--gold2)}
.big.teal{background:var(--teal);box-shadow:0 5px 0 #1B8F85}
button:focus-visible,select:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
.teams{display:flex;gap:10px;flex-wrap:wrap}
.team{flex:1 1 180px;display:flex;align-items:center;gap:10px;background:var(--card);border:3px solid var(--line);border-radius:20px;padding:6px 14px;transition:transform .2s,border-color .2s}
.team .nm{font-weight:800;color:var(--tc)}.team .sc{margin-inline-start:auto;font-weight:800;font-size:1.8rem;color:var(--gold);font-variant-numeric:tabular-nums}
.team.now{border-color:var(--tc);transform:scale(1.03)}
.stage{background:var(--card);border:3px solid var(--line);border-radius:26px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:14px;min-height:300px}
.msg{font-weight:800;font-size:1.25rem;text-align:center;min-height:1.6em}
.cf{position:fixed;top:-20px;width:11px;height:15px;border-radius:3px;pointer-events:none;z-index:80;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.modal{position:fixed;inset:0;background:rgba(5,14,22,.78);display:grid;place-items:center;z-index:70;padding:16px}
.mbox{background:var(--card);border:3px solid var(--gold);border-radius:24px;padding:18px;max-width:560px;width:100%;display:flex;flex-direction:column;gap:12px;animation:pop .3s cubic-bezier(.3,1.5,.6,1)}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
.mbox .q{font-weight:800;font-size:1.3rem;text-align:center}
.mbox .q .ar,.opt .ar{font-family:var(--f-ar);font-size:1.5em;font-weight:700}
.opt{font:inherit;font-weight:700;font-size:1.15rem;color:var(--ink);text-align:start;border:3px solid var(--line);background:var(--bg2);border-radius:16px;padding:10px 14px;min-height:54px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--sky)}.opt.right{border-color:var(--lime);background:color-mix(in srgb,var(--lime) 22%,var(--bg2))}.opt.wrong{border-color:var(--coral);background:color-mix(in srgb,var(--coral) 20%,var(--bg2))}
body.show-en .qar{font-family:var(--f-ar)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:min(560px,94vw);direction:ltr}
.card{perspective:700px;aspect-ratio:1/1.05;border:0;background:none;padding:0;cursor:pointer;font:inherit}
.card .in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .45s}
.card.open .in,.card.done .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;display:grid;place-items:center;border:3px solid var(--line)}
.front{background:linear-gradient(145deg,var(--card2),var(--card));color:var(--gold);font-size:2rem}
.back{transform:rotateY(180deg);background:#FDF8EA;color:#14374A;font-size:clamp(1.3rem,5.5vw,2.2rem);font-family:var(--f-ar);font-weight:700;text-align:center;line-height:1.2;padding:4px;direction:rtl}
.back.emo{font-size:clamp(2rem,9vw,3.4rem)}
.card.done .back{border-color:var(--lime);background:#E6F7EA}
.card.shake .in{animation:sh .35s}
@keyframes sh{25%{transform:rotateY(180deg) translateX(6px)}75%{transform:rotateY(180deg) translateX(-6px)}}
.gloss{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--lime);color:#0E3A1A;font-weight:800;border-radius:999px;padding:6px 20px;z-index:60;animation:pop .3s}
.tcol{--tc:var(--sky)}

</style><link rel="icon" type="image/svg+xml" href="../assets/brand/emblem.svg"><link rel="apple-touch-icon" href="../assets/brand/apple-touch-icon.png">
</head><body class="tq-i18n">
<div class="wrap">
<header style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">
  <h1 style="flex:1 1 240px"><span class="ui-ar">لُعْبَةُ الذَّاكِرَة</span><span class="ui-en">Memory Match</span> 🧠<small><span class="ui-ar">اقلب بطاقتين: كلمة عربية وصورتها. من يجمع أزواجًا أكثر يفوز!</span><span class="ui-en">Flip two cards: an Arabic word and its picture. Whoever collects the most pairs wins!</span></small></h1>
  <button class="tbtn" id="sndB" aria-pressed="true"><span class="ui-ar">🔊 صوت</span><span class="ui-en">🔊 Sound</span></button>
</header>
<div class="bar">
  <label for="plSel" data-en="Players:">اللاعبون:</label>
  <select id="plSel"><option value="1" data-en="One student">طالب واحد</option><option value="2" selected data-en="Two teams">فريقان</option></select>
  <label for="szSel" data-en="Size:">الحجم:</label>
  <select id="szSel"><option value="6" data-en="Small (6 pairs)">صغير (٦ أزواج)</option><option value="8" selected data-en="Medium (8 pairs)">متوسط (٨ أزواج)</option></select>
  <button class="tbtn" id="newB" data-en="↻ New game">↻ لعبة جديدة</button>
</div>
<div class="teams" id="teams"></div>
<section class="stage"><div class="msg" id="msg" aria-live="polite"></div><div class="grid" id="grid"></div>
<button class="big teal" id="again" hidden><span class="ui-ar">العب مرة أخرى ↻</span><span class="ui-en">Play again ↻</span></button></section>
</div>
<script>
const $=s=>document.querySelector(s),{U}=TQI;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let AC=null,soundOn=true;
function tone(f,d=.12,type='sine',v=.15,when=0){if(!soundOn)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const t=AC.currentTime+when,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
const sfx={tap:()=>tone(520,.06),ok:()=>[659,880].forEach((f,i)=>tone(f,.14,'triangle',.18,i*.09)),bad:()=>{tone(220,.18,'sawtooth',.08);tone(165,.25,'sawtooth',.08,.12)},win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.2,'triangle',.2,i*.11))};
function confetti(n=60){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const cols=['#F2C14E','#2EC4B6','#4DA8FF','#FF6B6B','#A98BFF'];for(let i=0;i<n;i++){const c=document.createElement('i');c.className='cf';c.style.left=Math.random()*100+'vw';c.style.background=cols[i%cols.length];c.style.animationDuration=(1.4+Math.random()*1.4)+'s';c.style.animationDelay=Math.random()*.3+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),3300)}}

const WORDS=[['كِتَاب','Book','📖'],['قَمَر','Moon','🌙'],['شَمْس','Sun','☀️'],['بَيْت','House','🏠'],['قَلَم','Pen','✏️'],['سَمَكَة','Fish','🐟'],['تُفَّاحَة','Apple','🍎'],['نَجْمَة','Star','⭐'],['مَاء','Water','💧'],['وَرْدَة','Rose','🌹'],['قِطَّة','Cat','🐱'],['سَيَّارَة','Car','🚗'],['مَسْجِد','Mosque','🕌'],['شَجَرَة','Tree','🌳'],['بَاب','Door','🚪'],['كُرَة','Ball','⚽']];
const num=n=>document.body.classList.contains('show-en')?n:String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
let cards,open,lock,turn,sc,moves,found,pairs;
const names=()=>$('#plSel').value==='2'?[['🔵 الفَرِيقُ الأَزْرَق','🔵 Blue team'],['🌸 الفَرِيقُ الوَرْدِيّ','🌸 Pink team']]:[['⭐ نِقَاطِي','⭐ My pairs']];
function drawTeams(){const n=names();$('#teams').innerHTML=n.map((t,i)=>`<div class="team ${i===turn&&found<pairs?'now':''}" style="--tc:${i?'var(--pink)':'var(--sky)'}"><span class="nm">${U(...t)}</span><span class="sc">${sc[i]}</span></div>`).join('')+(n.length===1?`<div class="team" style="--tc:var(--muted)"><span class="nm">👆 ${U('المُحَاوَلَات','Moves')}</span><span class="sc">${moves}</span></div>`:'')}
function newGame(){pairs=+$('#szSel').value;const pick=shuffle(WORDS).slice(0,pairs);
  cards=shuffle(pick.flatMap((w,i)=>[{id:i,t:'w',w},{id:i,t:'e',w}]));open=[];lock=false;turn=0;sc=names().map(()=>0);moves=0;found=0;$('#again').hidden=true;
  $('#grid').style.gridTemplateColumns='repeat(4,1fr)';
  $('#grid').innerHTML=cards.map((c,k)=>`<button class="card" data-k="${k}" aria-label="card ${k+1}"><div class="in"><div class="face front">✦</div><div class="face back ${c.t==='e'?'emo':''}">${c.t==='w'?c.w[0]:c.w[2]}</div></div></button>`).join('');
  drawTeams();$('#msg').innerHTML=U('اقلب بطاقتين','Flip two cards')}
function gloss(w){const g=document.createElement('div');g.className='gloss';g.innerHTML=`${w[2]} ${w[0]} = ${U(w[1],w[1])}`;document.body.appendChild(g);setTimeout(()=>g.remove(),1500)}
$('#grid').onclick=e=>{const b=e.target.closest('.card');if(!b||lock)return;const k=+b.dataset.k;if(b.classList.contains('open')||b.classList.contains('done'))return;
  b.classList.add('open');sfx.tap();open.push(k);if(open.length<2)return;
  moves++;lock=true;const [a,c]=open.map(i=>cards[i]),els=open.map(i=>$('#grid').children[i]);
  if(a.id===c.id&&a.t!==c.t){setTimeout(()=>{els.forEach(x=>{x.classList.remove('open');x.classList.add('done')});sfx.ok();sc[turn]++;found++;gloss(a.w);open=[];lock=false;drawTeams();
    if(found===pairs){const n=names();let msgAr,msgEn;if(n.length===1){msgAr=`🎉 أَنْهَيْتَ اللُّعْبَةَ فِي ${num(moves)} مُحَاوَلَةً!`;msgEn=`🎉 You finished in ${moves} moves!`}else if(sc[0]===sc[1]){msgAr='🤝 تَعَادُل! أَحْسَنْتُمْ';msgEn='🤝 A draw! Well played'}else{const w=sc[0]>sc[1]?0:1;msgAr=`🎉 فَازَ ${n[w][0]}!`;msgEn=`🎉 ${n[w][1]} wins!`}
      $('#msg').innerHTML=U(msgAr,msgEn);confetti();sfx.win();$('#again').hidden=false}else $('#msg').innerHTML=U('أَحْسَنْتَ! العَبْ مَرَّةً أُخْرَى','Great! Go again')},500)}
  else{els.forEach(x=>x.classList.add('shake'));sfx.bad();setTimeout(()=>{els.forEach(x=>x.classList.remove('open','shake'));open=[];lock=false;if(sc.length>1){turn=1-turn;drawTeams()}else drawTeams()},900)}};
$('#again').onclick=newGame;$('#newB').onclick=newGame;$('#plSel').onchange=newGame;$('#szSel').onchange=newGame;
$('#sndB').onclick=()=>{soundOn=!soundOn;$('#sndB').innerHTML=soundOn?U('🔊 صوت','🔊 Sound'):U('🔇 بدون صوت','🔇 Muted');$('#sndB').setAttribute('aria-pressed',soundOn)};
TQI.relabel();newGame();

</script>
<!--tq-nav--><script src="../tq-nav.js"></script>
</body></html>
